domain: LLM
subcategory: MM
questions:

  - id: LLM-MM-001
    type: calc
    difficulty: 1
    frequency: 3
    points: [ViT与图像分块]
    tags: [ViT, patch, 位置编码插值]
    question: |
      ViT-B/16 把 224×224 的 RGB 图像切成 16×16 的 patch，每个 patch 展平后经线性层映射为 768 维向量，序列开头再加一个 [CLS] token。
      (1) 共有多少个 patch？序列长度是多少？
      (2) 每个 patch 展平后是多少维？这个线性层（含偏置）有多少参数？
      (3) 微调时把输入分辨率提高到 384×384、patch 大小不变，序列长度变为多少？自注意力打分矩阵的元素数约为原来的多少倍？
    answer: '(1) 196 个 patch，序列长度 197；(2) 768 维，590,592 个参数；(3) 577，约 8.6 倍'
    explanation: |
      **(1)** 每边 $224/16=14$ 个 patch，共 $14\times14=196$ 个，加上 [CLS] 为 **197**。

      **(2)** 每个 patch 展平为 $16\times16\times3=768$ 维；线性层参数 $768\times768+768=590{,}592$。

      **(3)** 每边 $384/16=24$，共 $576$ 个 patch，序列长度 **577**。打分矩阵是序列长度的平方：$(577/197)^2\approx8.6$ 倍。

      **要点**：
      - patch 大小固定时，token 数与图像面积（像素数）成正比，注意力计算量与面积的平方成正比，提高分辨率代价很高；
      - ViT 的可学习位置编码是按 $14\times14$ 的网格训练的，换成 $24\times24$ 后，要把位置编码当作二维网格做插值（ViT 论文的做法）才能继续使用；
      - 多模态模型中常见的 CLIP ViT-L/14-336 每边 $336/14=24$，正好 576 个 patch。LLaVA-1.5 取这些 patch 特征（不含 [CLS]），所以一张图对应 576 个视觉 token。
    source: 'An Image is Worth 16x16 Words（ViT）arXiv:2010.11929'

  - id: LLM-MM-002
    type: code_fill
    difficulty: 2
    frequency: 2
    points: [ViT与图像分块]
    tags: [patchify, PyTorch, 手撕]
    question: |
      补全 ViT 的 patch 切分函数：输入 `(B, C, H, W)`，输出 `(B, N, p*p*C)`。要求 patch 按行优先排列，每个 patch 内部按（行, 列, 通道）的顺序展平；只用 `reshape` 与 `permute`，不写循环。
    code: |
      import torch

      def patchify(x: torch.Tensor, p: int) -> torch.Tensor:
          B, C, H, W = x.shape
          x = x.reshape(B, C, H // p, p, W // p, p)
          x = x.permute(____)                      # -> (B, H/p, W/p, p, p, C)
          return x.reshape(B, ____, p * p * C)
    answer: ['0, 2, 4, 3, 5, 1', '(H // p) * (W // p)']
    test: |
      torch.manual_seed(0)
      x = torch.randn(2, 3, 8, 12)
      out = patchify(x, 4)
      assert out.shape == (2, 6, 48)
      # 1) 与逐个 patch 手工展平对拍：行优先，patch 内按 (行, 列, 通道)
      for b in range(2):
          for i in range(2):
              for j in range(3):
                  ref = x[b, :, i * 4:(i + 1) * 4, j * 4:(j + 1) * 4].permute(1, 2, 0).reshape(-1)
                  assert torch.equal(out[b, i * 3 + j], ref)
      # 2) 与「卷积核大小 = 步长 = p」的 Conv2d 等价（ViT 的 patch embedding 常这样实现）
      conv = torch.nn.Conv2d(3, 5, kernel_size=4, stride=4)
      y_conv = conv(x).flatten(2).transpose(1, 2)              # (B, N, 5)
      W = conv.weight.permute(0, 2, 3, 1).reshape(5, -1)       # 按 (行, 列, 通道) 展平卷积核
      y_lin = patchify(x, 4) @ W.t() + conv.bias
      assert torch.allclose(y_conv, y_lin, atol=1e-5)
    explanation: |
      **答案**：`x.permute(0, 2, 4, 3, 5, 1)` 与 `(H // p) * (W // p)`。

      第一次 `reshape` 后各维依次是 `(B, C, H/p, p, W/p, p)`，下标为 0～5。目标顺序是「batch、patch 行号、patch 列号、patch 内行、patch 内列、通道」，即 `(0, 2, 4, 3, 5, 1)`；最后把前两个网格维合并成 $N=(H/p)(W/p)$，把后三维合并成 $p\cdot p\cdot C$。

      **要点**：
      - 不能直接 `x.reshape(B, N, -1)`：内存中的元素顺序不对，会把不同 patch 的像素混在一起。必须先 `permute` 调整维度顺序，`reshape` 会在需要时自动复制成连续内存。
      - 「patch 切分 + 共享线性层」与「卷积核大小 = 步长 = $p$ 的 Conv2d」完全等价，测试验证了这一点，实际代码多用 `nn.Conv2d` 实现 patch embedding。
      - Qwen2-VL 等模型对视频还会在时间维再切一次（每 2 帧一组），原理相同。

  - id: LLM-MM-003
    type: judge
    difficulty: 2
    frequency: 2
    points: [ViT与图像分块, 视觉编码器]
    tags: [ViT, 归纳偏置]
    question: |
      ViT 论文发现：在 ImageNet-1k 这种中等规模的数据上从头训练时，ViT 不如同等规模的 ResNet；只有在 ImageNet-21k、JFT-300M 等更大的数据集上预训练后，ViT 才达到或超过最好的卷积网络。论文把原因归结为 ViT 缺少 CNN 那样的局部性、平移等变性等归纳偏置。
    answer: true
    explanation: |
      **正确**。ViT 只在切 patch 和位置编码插值时用到了图像的二维结构，其余部分都要从数据中学习空间关系；CNN 的卷积天然具有局部性与平移等变性，小数据下更占优势。论文的原话大意是「大规模训练胜过归纳偏置」：数据从 1.3M 张图增加到 14M、300M 张时，ViT 逐渐反超。

      这一结论影响了多模态模型的设计：视觉编码器几乎都使用在海量数据上预训练过的 ViT（如在数亿图文对上训练的 CLIP、SigLIP），而不是从头训练。后来的 DeiT 用更强的数据增强、正则化和蒸馏，让 ViT 仅用 ImageNet-1k 也能训练得很好，说明「数据不够」可以部分用训练技巧弥补。
    source: 'An Image is Worth 16x16 Words（ViT）arXiv:2010.11929'

  - id: LLM-MM-004
    type: coding
    difficulty: 2
    frequency: 3
    points: [CLIP对比学习]
    tags: [CLIP, InfoNCE, 手撕]
    question: |
      用 PyTorch 实现 CLIP 的对比损失：

      ```python
      def clip_loss(img_emb, txt_emb, logit_scale): ...
      ```

      - `img_emb`、`txt_emb`：形状 `(N, D)`，未归一化；第 $i$ 张图与第 $i$ 条文本是正例，batch 内其余组合都是负例；
      - `logit_scale`：标量张量，表示缩放系数的对数（实际缩放系数为 `exp(logit_scale)`），缩放系数上限截断为 100；
      - 先做 L2 归一化，计算 $N\times N$ 的相似度矩阵，返回「图→文」与「文→图」两个方向交叉熵损失的平均值；结果需能对 `logit_scale` 反向传播。
    answer: |
      import torch
      import torch.nn.functional as F

      def clip_loss(img_emb, txt_emb, logit_scale):
          img = F.normalize(img_emb, dim=-1)
          txt = F.normalize(txt_emb, dim=-1)
          scale = logit_scale.exp().clamp(max=100.0)          # 缩放系数不超过 100
          logits = scale * img @ txt.t()                       # (N, N)，第 i 行：第 i 张图对所有文本
          labels = torch.arange(img.shape[0], device=img.device)
          return (F.cross_entropy(logits, labels) + F.cross_entropy(logits.t(), labels)) / 2
    test: |
      import math
      torch.manual_seed(0)
      N, D = 6, 8
      img, txt = torch.randn(N, D), torch.randn(N, D)
      ls = torch.tensor(math.log(1 / 0.07))

      # 1) 与逐行、逐列手算的结果一致
      i_n, t_n = img / img.norm(dim=1, keepdim=True), txt / txt.norm(dim=1, keepdim=True)
      S = ls.exp() * i_n @ t_n.t()
      li = -torch.stack([S[k].log_softmax(0)[k] for k in range(N)]).mean()
      lt = -torch.stack([S[:, k].log_softmax(0)[k] for k in range(N)]).mean()
      assert torch.allclose(clip_loss(img, txt, ls), (li + lt) / 2, atol=1e-6)

      # 2) 先做 L2 归一化：嵌入整体放大或缩小不改变损失
      assert torch.allclose(clip_loss(3 * img, 0.5 * txt, ls), clip_loss(img, txt, ls), atol=1e-6)

      # 3) 对称：交换图像与文本，损失不变
      assert torch.allclose(clip_loss(txt, img, ls), clip_loss(img, txt, ls), atol=1e-6)

      # 4) 缩放系数被截断在 100
      big = clip_loss(img, txt, torch.tensor(math.log(1000.0)))
      assert torch.allclose(big, clip_loss(img, txt, torch.tensor(math.log(100.0))), atol=1e-5)

      # 5) 完全对齐且缩放较大时损失接近 0；logit_scale 能收到梯度
      e = torch.eye(4)
      ls2 = torch.tensor(math.log(50.0), requires_grad=True)
      assert clip_loss(e, e, ls2).item() < 1e-6
      clip_loss(img, txt, ls2).backward()
      assert ls2.grad is not None and torch.isfinite(ls2.grad)
    explanation: |
      **思路**：
      1. L2 归一化后，点积就是余弦相似度；
      2. 乘以可学习的缩放系数（即温度的倒数，CLIP 初始化为 $1/0.07$，上限 100），得到 $N\times N$ 的 logits；
      3. 第 $i$ 行是「第 $i$ 张图对 $N$ 条文本」的打分，正确答案在对角线上，所以标签是 `arange(N)`；对行做交叉熵是图→文，对列（转置后的行）做交叉熵是文→图，两者取平均。

      **要点**：
      - 负例来自同一 batch，batch 越大负例越多，CLIP 训练用的 batch 为 32768；
      - 学温度的对数而不是温度本身，保证缩放系数始终为正、优化更平稳；截断上限是为了防止训练不稳定；
      - 大规模分布式训练时，需要把各卡的嵌入汇总（all-gather）后再算相似度矩阵，否则负例只来自本卡。

      **易错点**：忘了归一化；只算一个方向的损失；标签写成全 1 或 one-hot 矩阵；直接把 `logit_scale` 当作缩放系数使用而不取指数。
    source: 'Learning Transferable Visual Models From Natural Language Supervision（CLIP）arXiv:2103.00020'

  - id: LLM-MM-005
    type: single
    difficulty: 1
    frequency: 3
    points: [CLIP对比学习]
    tags: [CLIP, 零样本分类, 提示模板]
    question: |
      用 CLIP 做零样本图像分类（例如 ImageNet 的 1000 类），标准做法是：
    options:
      A: '先用每类少量标注样本微调图像编码器，再接一个 1000 类的线性分类头预测类别'
      B: '把类别名填入提示模板后用文本编码器编码，取与图像向量余弦相似度最高的类别'
      C: '把图像向量输入文本编码器，让它逐词生成类别名称，再与 1000 个标签做字符串匹配'
      D: '用每类若干张图像的平均图像向量作类原型，新图像取余弦相似度最高的原型类别'
    answer: B
    explanation: |
      **结论**：CLIP 把分类变成了「图文检索」：各类别的文本向量相当于一个零样本线性分类器的权重。

      做法是：对每个类别名构造提示（如「a photo of a dog.」），用文本编码器得到向量并归一化，这些向量只需计算一次就可以缓存；对新图像，计算它的图像向量与所有类别向量的余弦相似度，取最大者（或做 Softmax 得到概率）。

      论文中的数字：最好的 CLIP 模型在 ImageNet 上的零样本准确率为 76.2%，与原始的有监督 ResNet-50 相当，却没有用到它的 128 万张标注训练图；用「A photo of a {label}.」模板比直接用类别名提升约 1.3 个百分点，再对 80 个不同模板的文本向量做集成，又提升约 3.5 个百分点。

      - A 错：零样本就是不用任务标注数据；用少量样本训练分类头属于少样本或线性探测。
      - C 错：CLIP 的文本编码器只负责编码，不能生成文本。
      - D 错：用图像算类原型需要每类的标注图像，属于少样本方法；CLIP 零样本分类器的「权重」来自类别名的文本向量。

      局限：细粒度类别（车型、花卉品种）、计数、抽象任务上较弱，对分布外数据（如手写数字）的泛化也不理想。
    source: 'CLIP arXiv:2103.00020'

  - id: LLM-MM-006
    type: multiple
    difficulty: 1
    frequency: 2
    points: [CLIP对比学习]
    tags: [CLIP, 对比学习, 温度]
    question: |
      关于 CLIP 的训练，下列说法**正确**的有：
    options:
      A: '论文的对比实验发现，对比学习目标比「生成图片对应的完整文字描述」的目标效率高得多'
      B: '在约 4 亿图文对上以 32768 的 batch 训练，批内其他样本的文本或图像充当负例'
      C: '损失只算「图像找文本」一个方向的交叉熵，因为文本侧的负例分布与图像侧相同'
      D: '温度是人工设定的固定超参数（取 0.07），整个训练过程中保持不变，不随梯度更新'
      E: '图像编码器与文本编码器共享同一套 Transformer 参数，只是输入的嵌入层不同'
    answer: [A, B]
    explanation: |
      **结论**：A、B 正确。

      - A 对：论文对比了三种目标：用 Transformer 语言模型预测完整描述，比预测描述中的词袋慢约 3 倍；对比学习又比词袋预测高效约 4 倍。原因在于对比目标只要求「找出哪段文字与这张图配对」，比逐词还原描述容易得多。
      - B 对：数据集规模约 4 亿对；超大 batch 让每个样本有 32767 个批内负例。
      - C 错：损失是对称的，图→文和文→图两个方向的交叉熵取平均。
      - D 错：CLIP 的温度是**可学习**参数：以对数形式参数化，初始化为 0.07（对应 logit 缩放系数约 14.3），训练中直接优化，并把缩放系数截断在 100 以内以避免训练不稳定。把温度固定为 0.07 是 MoCo 等早期对比学习方法的做法。
      - E 错：两个编码器是独立的，图像侧是 ResNet 或 ViT，文本侧是 Transformer。

      CLIP 的价值在于把视觉特征与语言对齐，这使它成为后来多模态大模型最常用的视觉编码器之一，也是 Stable Diffusion 等文生图模型常用的文本编码器之一。
    source: 'CLIP arXiv:2103.00020'

  - id: LLM-MM-007
    type: judge
    difficulty: 2
    frequency: 2
    points: [CLIP对比学习]
    tags: [SigLIP, sigmoid损失]
    question: |
      SigLIP 把 CLIP 的 softmax 对比损失换成逐对的 sigmoid 损失：每个图文对独立判断是否匹配，不需要在整个 batch 上做归一化。因此它在较小的 batch 下也能取得好效果；论文还发现，batch 增大到约 32K 之后，继续增大的收益迅速变小。
    answer: true
    explanation: |
      **正确**。

      - **CLIP**：每一行（或每一列）的 Softmax 需要该行所有负例的分数做归一化，必须得到完整的 $N\times N$ 相似度矩阵；分布式训练时要汇总所有卡上的嵌入，显存和通信开销随 batch 增大。
      - **SigLIP**：对矩阵中的每个元素做二分类：对角线是正例（标签 1），其余是负例（标签 0），损失为逐元素的 sigmoid 交叉熵，再引入可学习的温度和偏置（偏置用来应对正负例数量极不均衡）。每个元素的损失互相独立，可以分块计算，不需要全局归一化。

      论文结果：batch 较小时，sigmoid 损失明显好于 softmax 损失；batch 尝试到上百万，收益很快饱和，约 32K 已经足够。SigLIP 系列编码器因此被许多多模态模型采用，例如 Gemma 3 使用约 4 亿参数的 SigLIP 编码器，OpenVLA 把 SigLIP 与 DINOv2 的特征融合使用。
    source: 'Sigmoid Loss for Language Image Pre-Training（SigLIP）arXiv:2303.15343'

  - id: LLM-MM-008
    type: single
    difficulty: 2
    frequency: 2
    points: [视觉编码器]
    tags: [CLIP, SigLIP, DINOv2]
    question: |
      多模态大模型（如 LLaVA、Qwen-VL、InternVL）普遍用 CLIP / SigLIP 这类图文对比预训练的 ViT 作为视觉编码器，而较少直接使用在 ImageNet 上做有监督分类预训练的模型。最主要的原因是：
    options:
      A: 'CLIP 类 ViT 的参数量普遍比 ImageNet 分类模型小一个量级，能显著降低视觉侧开销'
      B: 'ImageNet 分类模型的位置编码固定为 224×224，无法通过插值或微调提高分辨率'
      C: 'CLIP 类编码器对空间位置、计数等细粒度信息更敏感，更适合定位类任务'
      D: '图文对比训练让视觉特征与开放词汇的语言语义对齐，更容易映射到语言模型的输入空间'
    answer: D
    explanation: |
      **结论**：选编码器的核心标准是「视觉特征是否已经贴近语言语义」。

      ImageNet 分类只教会模型区分 1000 个类别，特征集中在这些类别的判别信息上；CLIP、SigLIP 在数亿图文对上训练，学到的特征与开放词汇的语言描述对齐，连接器只需做一个相对简单的映射，语言模型就能「读懂」。

      对比学习的弱点是偏重全局语义，对物体位置、空间关系、计数等细粒度信息较弱。因此有些模型把 SigLIP 与 DINOv2 这类自监督视觉特征拼接使用，例如 OpenVLA 的视觉编码器就融合了两者，以兼顾语义与空间细节。

      - A 错：参数量取决于具体模型，CLIP ViT-L 与 ImageNet 上的大模型规模相当，大小不是选择的原因。
      - B 错：任何 ViT 或 CNN 都可以通过插值位置编码、微调来提高分辨率。
      - C 错：恰好相反，对比学习偏重全局语义，对物体位置、空间关系、计数等细粒度信息较弱，所以才有模型再融合 DINOv2 等自监督特征。
    source: 'CLIP arXiv:2103.00020；OpenVLA arXiv:2406.09246'

  - id: LLM-MM-009
    type: multiple
    difficulty: 2
    frequency: 2
    points: [视觉编码器]
    tags: [LLaVA, Qwen2-VL, InternViT]
    question: |
      关于多模态大模型中的视觉编码器，下列说法**正确**的有：
    options:
      A: 'InternVL 系列使用了约 60 亿参数的 InternViT-6B 作为视觉编码器'
      B: '视觉编码器输出的 patch 特征维度与语言模型的隐藏维度天然一致，可以直接作为语言模型的输入，不需要连接器'
      C: 'Qwen2-VL 等模型会在部分训练阶段解冻视觉编码器，让它与语言模型一起更新'
      D: 'Qwen2-VL 去掉了 ViT 原有的绝对位置编码，改用 2D-RoPE，使编码器能直接处理不同分辨率和宽高比的图像'
      E: 'LLaVA 使用 CLIP ViT 倒数第二层输出的 patch 网格特征，而不是最后一层或只用 [CLS] 向量'
    answer: [A, C, D, E]
    explanation: |
      **结论**：A、C、D、E 正确。

      - A 对：InternVL 用约 60 亿参数的 InternViT-6B，并在 1.5 版本中配合 448×448 的动态切块与像素重排。
      - B 错：视觉特征与语言模型的维度和语义空间都不同，需要线性层、MLP 或 Q-Former 等连接器来映射。
      - C 对：视觉编码器并非必须一直冻结。Qwen2-VL 在第二阶段解冻全部参数，InternVL 1.5 在微调阶段训练整个模型。解冻通常配合较小的学习率，以免破坏预训练特征，同时提升 OCR 等细粒度能力。
      - D 对：绝对位置编码绑定了固定的网格大小；2D-RoPE 按 patch 的行列坐标编码位置，配合「原生动态分辨率」，不同尺寸的图像不必缩放到统一大小。
      - E 对：LLaVA 论文比较了最后一层之前和之后的网格特征，倒数第二层的效果略好；最后一层更偏向对比学习目标所需的全局语义，倒数第二层保留了更多局部细节。只用 [CLS] 会把整张图压成一个向量，细节损失太大。
    source: 'LLaVA arXiv:2304.08485；Qwen2-VL arXiv:2409.12191；InternVL 1.5 arXiv:2404.16821'

  - id: LLM-MM-010
    type: short
    difficulty: 3
    frequency: 3
    points: [模态连接器]
    tags: [MLP投影, Q-Former, Perceiver Resampler, 交叉注意力]
    question: |
      视觉编码器与语言模型之间的「模态连接器」有哪些主流方案？请比较线性 / MLP 投影、Q-Former、Perceiver Resampler，以及 Flamingo 式交叉注意力注入，在视觉 token 数、信息保留、训练成本与效果上的差异；并说明为什么近年开源模型多采用「MLP 投影 + 结构化的 token 压缩」。
    answer: |
      1. **线性 / MLP 投影**（LLaVA 用线性层，LLaVA-1.5 改为两层 MLP）：逐个 patch 映射到语言模型的嵌入空间，视觉 token 数等于 patch 数（336 分辨率的 ViT-L/14 为 576 个）；保留全部空间信息，结构简单、收敛快、数据效率高；代价是 token 多，占用上下文与计算。
      2. **Q-Former**（BLIP-2、InstructBLIP）：32 个可学习的查询向量通过交叉注意力从图像特征中提取信息，输出固定的 32 个 token；token 少、推理省，但形成信息瓶颈，OCR、细粒度定位等任务吃亏；还需要专门的第一阶段表示学习（图文对比、匹配、生成三个目标）。
      3. **Perceiver Resampler**（Flamingo，思路相近的还有 Qwen-VL 的单层交叉注意力适配器）：固定数量的可学习潜向量交叉注意力读取视觉特征，把数量可变的输入（如多帧视频）压成固定个数的 token（Flamingo 为 64 个）；与 Q-Former 一样存在压缩损失。
      4. **交叉注意力注入**（Flamingo 的门控交叉注意力层、Llama 3.2 Vision）：视觉信息通过新插入的交叉注意力层读取，不占用语言模型的上下文；用初始化为 0 的 tanh 门控保证训练初期不破坏原语言模型；代价是新增大量参数和层，结构更复杂，与现有推理框架的兼容性较差。
      5. **为什么趋势是「MLP + 结构化压缩」**：
         - LLaVA-1.5 等工作证明简单的 MLP 投影效果好、数据效率高；
         - 学习式查询压缩会丢失文字、表格等细节，而文档、OCR、图表能力越来越重要；
         - 改用不丢信息或少丢信息的结构化压缩，如 2×2 合并（Qwen2-VL）、像素重排（InternVL），再配合动态分辨率，在 token 数与细节之间取得更好的平衡；
         - 结构简单，便于扩大数据规模，也便于复用语言模型的推理基础设施。
    rubric:
      - '准确描述四类连接器的做法（4 分）'
      - '比较 token 数、信息保留、训练成本等取舍（3 分）'
      - '解释 MLP + 结构化压缩成为主流的原因（3 分）'
    explanation: |
      **常见失分点**：说 Q-Former 的 token 数随图像分辨率变化（它是固定的）；认为 MLP 投影会压缩 token（它是逐个 patch 映射）；把 LLaVA 说成交叉注意力结构；只罗列名称，不讲各自对 OCR 与细粒度任务的影响。

  - id: LLM-MM-011
    type: single
    difficulty: 2
    frequency: 2
    points: [模态连接器]
    tags: [BLIP-2, Q-Former]
    question: |
      BLIP-2 用 Q-Former 连接冻结的图像编码器与冻结的语言模型。关于 Q-Former，下列说法正确的是：
    options:
      A: '用 32 个可学习查询经交叉注意力从图像特征中提取信息，输出固定 32 个向量，投影后作软提示'
      B: '它把每个图像 patch 都一一投影成语言模型的 token，因此视觉 token 数等于 patch 数'
      C: '它从第一阶段起就接上语言模型端到端训练，只用语言建模损失，不需要图文对比等目标'
      D: '第二阶段解冻整个大语言模型，与 Q-Former 一起用语言建模损失端到端更新'
    answer: A
    explanation: |
      **结论**：Q-Former 是一个「用少量查询向量从图像中抽取与文本相关信息」的瓶颈模块。

      - 结构：约 1.88 亿参数，由 BERT-base 初始化；32 个查询向量之间做自注意力，并每隔一层通过交叉注意力读取冻结图像编码器的特征；输出固定为 32×768（远小于 ViT-L/14 的 257×1024 特征）。
      - 两阶段预训练：第一阶段只连接冻结的图像编码器，联合优化图文对比（ITC）、图文匹配（ITM）和基于图像的文本生成（ITG）三个目标，让查询学会提取与文本相关的视觉信息；第二阶段把输出经全连接层投影后作为软提示，接到冻结的语言模型前面，用语言建模损失训练。
      - 效果：论文报告 BLIP-2 在零样本 VQAv2 上比 Flamingo-80B 高 8.7 个百分点，可训练参数少 54 倍。

      - B 错：这是 LLaVA 式的逐 patch 投影，视觉 token 数随 patch 数增长。
      - C 错：第一阶段不接语言模型，只用 ITC、ITM、ITG 做表示学习。
      - D 错：语言模型始终冻结，这正是 BLIP-2「训练成本低」的来源。

      代价：32 个 token 的瓶颈对 OCR、小物体等细节不友好，这也是后来的模型多改用 MLP 投影加动态分辨率的原因之一。
    source: 'BLIP-2 arXiv:2301.12597'

  - id: LLM-MM-012
    type: fill
    difficulty: 2
    frequency: 1
    points: [模态连接器]
    tags: [Flamingo, Perceiver Resampler, 门控交叉注意力]
    question: |
      Flamingo 用 Perceiver Resampler 把数量可变的视觉特征（一张图或多帧视频）压缩成固定的 ____ 个视觉 token，再通过插入在冻结语言模型层之间的门控交叉注意力层读取。门控的形式为 $\tanh(\alpha)$，可学习标量 $\alpha$ 初始化为 ____，使训练开始时整个模型的输出与原语言模型完全一致。
    answer: ['64', ['0', '零']]
    explanation: |
      - **64**：Perceiver Resampler 用 64 个可学习的潜向量做交叉注意力，无论输入是一张图还是 30 帧视频，输出都是 64 个 token，后续交叉注意力的开销与输入大小无关。
      - **0**：新层的输出乘以 $\tanh(\alpha)$ 后再加回残差流，$\alpha=0$ 时 $\tanh(0)=0$，新层的作用为零，模型等同于原来的语言模型；训练中门控逐渐打开，视觉信息被逐步引入。论文的消融显示，去掉这种门控会导致训练不稳定、效果下降。

      这体现了一个通用技巧：往预训练模型中加入新模块时，让新模块在初始化时是「恒等映射」或「零贡献」，避免一开始就用随机输出破坏已经学好的表示。LoRA 把 $B$ 矩阵初始化为 0、DiT 的 adaLN-Zero 也是同样的思路。
    source: 'Flamingo: a Visual Language Model for Few-Shot Learning arXiv:2204.14198'

  - id: LLM-MM-013
    type: single
    difficulty: 1
    frequency: 3
    points: [LLaVA架构, 多模态预训练与指令微调]
    tags: [LLaVA, 两阶段训练]
    question: |
      关于 LLaVA（2023）的两阶段训练，下列说法正确的是：
    options:
      A: '第一阶段视觉编码器、投影层和语言模型一起训练，第二阶段只微调投影层'
      B: '两个阶段都只训练语言模型，投影层在第一阶段之前用图文对比损失单独训练好'
      C: '第一阶段只训练投影层；第二阶段仍冻结视觉编码器，投影层与语言模型一起训练'
      D: '第二阶段的指令数据由人工逐条撰写，约 15.8 万条，覆盖对话、详细描述和复杂推理'
    answer: C
    explanation: |
      **结论**：先「对齐」，再「教会听指令」。

      - **第一阶段：特征对齐预训练**。从 CC3M 中筛选出约 59.5 万个图文对，转成「请简要描述这张图」式的单轮对话；冻结 CLIP ViT-L/14 与语言模型（Vicuna），只训练把视觉特征映射到词嵌入空间的投影矩阵。
      - **第二阶段：端到端视觉指令微调**。使用约 15.8 万条指令数据（对话、详细描述、复杂推理三类）；视觉编码器继续冻结，投影层与语言模型一起训练。
      - **数据来源**：指令数据由只能读文本的 GPT-4 生成：把图像的描述文字与物体框坐标作为文本输入，让它写出多样的问答，再人工设计少量示例引导风格。

      - A 错：视觉编码器两个阶段都冻结；第二阶段训练的是投影层和语言模型，不只是投影层。
      - B 错：投影层恰恰是第一阶段唯一训练的模块，用的是语言建模损失，不是图文对比损失。
      - D 错：数量与类别没错，但数据由 GPT-4 生成；LLaVA 的一大贡献正是用 GPT-4 低成本地合成视觉指令数据。

      LLaVA-1.5 沿用这一流程：第一阶段约 55.8 万条数据，第二阶段约 66.5 万条（加入了学术 VQA 数据与纯文本对话），在单台 8 卡 A100 上约 1 天训完。
    source: 'Visual Instruction Tuning（LLaVA）arXiv:2304.08485；LLaVA-1.5 arXiv:2310.03744'

  - id: LLM-MM-014
    type: multiple
    difficulty: 2
    frequency: 2
    points: [LLaVA架构]
    tags: [LLaVA-1.5, MLP投影, 回答格式提示]
    question: |
      LLaVA-1.5 相对初版 LLaVA 做了几处简单改进，在 11 个基准上取得了当时最好的结果。下列属于这些改进或相关事实的有：
    options:
      A: '加入学术 VQA 数据，并在短答案题后附加格式提示（要求用单个词或短语作答）'
      B: '训练数据扩充到超过 1 亿条图文对，需要上千张 GPU 训练数周，规模远超初版'
      C: '连接器由单个线性投影层换成带 GELU 的两层 MLP，视觉到语言的映射能力更强'
      D: '视觉编码器换成输入分辨率为 336 的 CLIP ViT-L/14，一张图对应 576 个视觉 token'
      E: '引入 Q-Former，把每张图的视觉 token 从 576 个压缩到 32 个，以降低语言模型的计算量'
    answer: [A, C, D]
    explanation: |
      **结论**：A、C、D 正确。

      - A 对：VQAv2 等学术数据集的答案很短。如果直接混入，模型可能在日常对话中也只答一两个词；加上「Answer the question using a single word or phrase.」这类格式提示，模型就能按指令决定答长还是答短，缓解短答案数据与长回答风格之间的冲突。
      - B 错：最终 13B 模型只用了约 120 万条公开数据，在单台 8 卡 A100 上约 1 天完成训练，这正是它影响力大的原因之一。
      - C 对：论文称这种全连接的连接器「出乎意料地强大且数据高效」，MLP 比线性层效果更好。
      - D 对：$336/14=24$，$24\times24=576$。分辨率提高对 OCR 和细节问答帮助明显。
      - E 错：LLaVA-1.5 坚持「MLP 投影 + 全部 patch」的路线，并没有引入 Q-Former。

      LLaVA-1.5 的启示：好的基线不一定复杂，数据配方（任务覆盖、格式提示）与分辨率往往比连接器结构更重要。
    source: 'Improved Baselines with Visual Instruction Tuning（LLaVA-1.5）arXiv:2310.03744'

  - id: LLM-MM-015
    type: calc
    difficulty: 2
    frequency: 3
    points: [视觉token数量与压缩]
    tags: [Qwen2-VL, InternVL, 动态分辨率, LLaVA-1.5]
    question: |
      比较三种处理图像分辨率的方式下，进入语言模型的视觉 token 数：
      (1) Qwen2-VL：ViT 的 patch 为 14×14，之后用 MLP 把相邻的 2×2 个 token 合并为 1 个；图像按原生分辨率处理（宽高调整为 28 的倍数）。一张 224×224 的图对应多少个视觉 token？加上视觉起止两个特殊 token 共多少个？一张 1120×840 的图对应多少个视觉 token？
      (2) LLaVA-1.5：CLIP ViT-L/14，输入固定缩放到 336×336，每个 patch 对应 1 个 token。任意图像都对应多少个视觉 token？
      (3) InternVL 1.5：图像按宽高比切成若干 448×448 的块，另加一张 448×448 的缩略图；每块经 ViT（patch 14）后用像素重排把 token 数降为 1/4。一张 800×1300 的图被缩放为 896×1344（切成 2×3 块），共对应多少个视觉 token？
    answer: '(1) 64 个，加特殊 token 共 66 个；1200 个；(2) 576 个；(3) 7 × 256 = 1792 个'
    explanation: |
      **(1) Qwen2-VL**：合并后每个视觉 token 对应 $28\times28$ 像素。
      - $224\times224$：$(224/28)^2=8\times8=64$ 个，加上起止 token 共 **66** 个，与 Qwen2-VL 论文给出的例子一致；
      - $1120\times840$：$(1120/28)\times(840/28)=40\times30=$ **1200** 个。token 数与像素数成正比，大图更清晰也更贵。

      **(2) LLaVA-1.5**：$(336/14)^2=24^2=$ **576** 个，与原图大小无关；大图被压缩到 336×336，小字容易看不清，小图被放大后也不会更省 token。

      **(3) InternVL 1.5**：每块 $(448/14)^2=1024$ 个 patch，像素重排后为 $1024/4=256$ 个；2×3 共 6 块，加 1 张缩略图共 7 块，$7\times256=$ **1792** 个。论文中训练时最多 12 块（加缩略图共 3328 个 token），测试时可外推到 40 块。

      **对比**：固定分辨率简单、token 数可控，但细节损失大、宽高比失真；原生动态分辨率保真度最高，token 数随面积增长，需要设置像素上限；切块方案介于两者之间，用缩略图补充全局信息。实际部署时都要对单张图和整个请求的视觉 token 数设置预算。
    source: 'Qwen2-VL arXiv:2409.12191；LLaVA-1.5 arXiv:2310.03744；InternVL 1.5 arXiv:2404.16821'

  - id: LLM-MM-016
    type: single
    difficulty: 2
    frequency: 2
    points: [视觉token数量与压缩]
    tags: [像素重排, InternVL]
    question: |
      InternVL 等模型在 ViT 与 MLP 投影之间加入「像素重排（pixel shuffle）」，把视觉 token 数降为原来的 1/4。关于这一操作，下列说法正确的是：
    options:
      A: '它按 ViT 最后一层的注意力分数保留最重要的 1/4 token，其余 3/4 直接丢弃'
      B: '把相邻 2×2 个 token 在通道维拼成 1 个（通道数变为 4 倍），这一步本身不丢弃信息'
      C: '它先把图像下采样到原来面积的 1/4 再送入 ViT，所以 ViT 的计算量也降为 1/4'
      D: '它等价于 Q-Former：用可学习的查询向量通过交叉注意力提取固定数量的 token'
    answer: B
    explanation: |
      **结论**：像素重排就是「空间换通道」（space-to-depth）：$H\times W\times C\to\frac H2\times\frac W2\times4C$。

      以 448×448 的切块为例：ViT 输出 $32\times32=1024$ 个 token；重排后变成 $16\times16=256$ 个 token，每个 token 的维度是原来的 4 倍，由后续 MLP 投影到语言模型的隐藏维度。重排本身只是改变排列，信息量不变；真正的压缩发生在 MLP 把 $4C$ 维映射到较低维度的时候，而且这一映射是可学习的，比直接平均池化保留的细节更多。Qwen2-VL 用 MLP 合并相邻 2×2 个 token，思路相同。

      - A 错：这是按注意力分数剪枝的思路（如 FastV），会真正丢弃信息；像素重排只是重组排列，不丢弃任何 token 的内容。
      - C 错：重排发生在 ViT **之后**，ViT 本身的计算量不变；省下的是语言模型侧的序列长度、注意力计算与 KV Cache。
      - D 错：Q-Former 用学习式查询做交叉注意力，输出数量固定；像素重排是固定规则的空间重组，输出数量与输入成固定比例。

  - id: LLM-MM-017
    type: multiple
    difficulty: 2
    frequency: 2
    points: [视觉token数量与压缩]
    source: 'Chen 等, An Image is Worth 1/2 Tokens After Layer 2（FastV）, arXiv:2403.06764；Qwen2-VL 技术报告, arXiv:2409.12191'
    tags: [token压缩, FastV, 动态分辨率]
    question: |
      关于降低多模态大模型视觉 token 开销的方法，下列说法**正确**的有：
    options:
      A: 'FastV 观察到深层对视觉 token 的注意力很低，于是在浅层之后按注意力排序剪掉一部分视觉 token；论文报告 LLaVA-1.5-13B 的 FLOPs 可降低约 45%，效果基本不变'
      B: '对相邻 token 做 2×2 合并或平均池化，可以把 token 数降为 1/4，但对小字、细节丰富的图像可能损失信息'
      C: 'Q-Former、Perceiver Resampler 这类固定数量查询的连接器，输出的视觉 token 数与输入图像的分辨率成正比'
      D: '动态分辨率（按原图宽高比切块，或按原生分辨率编码）总是比固定分辨率更省 token'
      E: '视觉 token 一旦进入语言模型，就像文本 token 一样占用 KV Cache 与注意力计算，所以视觉 token 数直接影响首字延迟和显存'
    answer: [A, B, E]
    explanation: |
      **结论**：A、B、E 正确。

      - A 对：FastV 无需训练，属于推理时剪枝；它说明视觉 token 存在大量冗余，但剪枝比例过高时，文档、OCR 等细节任务会受影响。
      - B 对：合并与池化是最直接的压缩，代价是空间分辨率下降。
      - C 错：这类连接器的输出数量固定（如 Q-Former 32 个、Flamingo 64 个），与分辨率无关。
      - D 错：动态分辨率追求的是保真：大图会产生更多 token（如 Qwen2-VL 中 1120×840 的图有 1200 个 token，固定 336 分辨率只有 576 个），只有小图才比固定分辨率省。
      - E 对：视觉 token 和文本 token 在语言模型中没有区别，都参与 Prefill 计算、写入 KV Cache；一张高分辨率大图可能有上千个 token，往往比用户的文字提问长得多。

      常见的组合策略：按任务设置像素上限，先用低分辨率看全局，再对关键区域放大（裁剪后高分辨率编码）；多轮对话中缓存图像部分的 KV，避免重复计算。
  - id: LLM-MM-018
    type: scenario
    difficulty: 3
    frequency: 2
    points: [视觉token数量与压缩, 文档与OCR理解]
    tags: [文档问答, 动态分辨率, 首字延迟]
    question: |
      团队用一个支持原生动态分辨率的开源视觉语言模型（类似 Qwen2-VL：每 28×28 像素对应 1 个视觉 token）做「合同扫描件问答」。扫描件为 A4、300 dpi（约 2480×3508 像素），每份合同 10～20 页，用户一次上传整份合同后提问。上线后发现：首字延迟经常超过 20 秒，显存频繁 OOM；页脚的小字仍然常被认错。请分析原因，并给出优化方案。
    answer: |
      **1. 估算与定位**
      - 每页约 $(2480/28)\times(3508/28)\approx88\times125\approx1.1$ 万个视觉 token；20 页约 22 万个，远超常见的上下文长度，Prefill 计算量和 KV Cache 都会爆炸。首字延迟与 OOM 的主因是「整份合同以原生分辨率全量输入」。
      - 小字认错：一种可能是服务端设置了像素上限，把页面整体缩小，小字因此模糊；另一种是即使保留原生分辨率，页脚小字在整页中只占极少的 token，模型的注意力也难以聚焦。

      **2. 优化方案**
      - **先检索再阅读**：对每页做 OCR 文本，或用视觉检索模型（如 ColPali 这类基于页面图像的检索）建索引；提问时只把最相关的 2～4 页送入模型，而不是整份合同。
      - **分辨率分级**：用较低分辨率看整页版面，再对相关区域（条款、表格、页脚）裁剪后以高分辨率编码，小字区域甚至可以放大后再编码。
      - **文本与图像混合**：纯文字页优先用 OCR 文本输入，文本 token 比视觉 token 便宜得多；只有表格、印章、签名、版面关系等需要「看」的部分才送图像。
      - **设置预算**：为单页和单个请求设置像素与视觉 token 的上限，超出时降级处理或分批处理。
      - **推理侧**：同一份合同的多轮提问复用前缀 KV Cache；使用分块 Prefill，避免长 Prefill 阻塞其他请求；必要时对视觉 token 做合并或剪枝。

      **3. 验证**：构建一套带小字、表格、手写批注的测试合同，分别统计关键信息抽取准确率、首字延迟 P50 / P95 与显存峰值；比较「整份输入」「检索后输入」「检索 + 局部放大」三种方案。
    rubric:
      - '用每页 token 数估算出视觉 token 爆炸是延迟与 OOM 的主因（3 分）'
      - '解释小字识别差与缩放或注意力分散的关系（2 分）'
      - '给出页面检索、分辨率分级 / 局部放大、OCR 混合、预算控制等方案（3 分）'
      - '提到 KV 复用或分块 Prefill，并给出验证指标（2 分）'
    explanation: |
      **常见失分点**：只建议「换更大的显卡」或「换更强的模型」；不做 token 估算；认为把分辨率一律调低就能同时解决延迟和小字问题（两者恰好矛盾，需要「全局低分辨率 + 局部高分辨率」）；忽略 OCR 文本这一便宜而可靠的信息来源。

  - id: LLM-MM-019
    type: calc
    difficulty: 3
    frequency: 2
    points: [多图与视频理解, 视觉token数量与压缩]
    tags: [视频理解, Qwen2-VL, 帧采样]
    question: |
      Qwen2-VL 处理视频时：每秒采样 2 帧；用时间深度为 2 的 3D 卷积，把相邻 2 帧合成一组；每组再按图像的方式处理（patch 14，相邻 2×2 合并），即每组中每 28×28 像素对应 1 个视觉 token；单个视频的视觉 token 总数上限为 16384，超出时通过降低每帧分辨率来满足。
      (1) 一段 60 秒的视频，帧分辨率为 448×448，共采样多少帧？对应多少个视觉 token？是否超出上限？
      (2) 一段 5 分钟的视频，同样每秒 2 帧，为不超过上限，每组最多能分到多少个视觉 token？大约相当于多大的帧分辨率（按正方形、28 的倍数估算）？
    answer: '(1) 120 帧，60 组 × 256 = 15360 个 token，未超出；(2) 300 组，每组最多约 54 个 token，约 7×7 个 token、即 196×196 像素左右'
    explanation: |
      **(1)** $60\times2=120$ 帧，每 2 帧一组共 60 组；每组 $(448/28)^2=16\times16=256$ 个 token，合计 $60\times256=$ **15360**，在 16384 之内。

      **(2)** $300\times2=600$ 帧，即 300 组；每组最多 $16384/300\approx54.6$ 个 token。取不超过它的最大正方形网格 $7\times7=49$，对应约 $7\times28=196$ 像素见方。也就是说，5 分钟的视频每帧只能用很低的分辨率。

      **启示**：
      - 视频的 token 预算 ≈ 时长 × 采样帧率 ÷ 时间合并倍数 × 每帧 token 数，长视频必须在「帧率」和「每帧分辨率」之间取舍：降帧率会漏掉短暂事件，降分辨率会看不清细节；
      - 常见的改进：根据内容动态调整帧率，先粗看再对关键片段精看；把视觉 token 压缩得更狠；或者先检索出与问题相关的片段，再只把这些片段送入模型；
      - 3D 卷积在时间维合并相邻帧，利用了相邻帧高度相似这一冗余，在不明显损失信息的前提下把 token 数减半。
    source: 'Qwen2-VL arXiv:2409.12191'

  - id: LLM-MM-020
    type: single
    difficulty: 2
    frequency: 2
    points: [多图与视频理解]
    tags: [视频理解, M-RoPE, 时间定位]
    question: |
      关于多模态大模型的视频理解，下列说法正确的是：
    options:
      A: '把各帧当作独立的图片依次输入即可，模型能从帧的先后顺序推断出相邻帧的真实时间间隔'
      B: '均匀稀疏采样少量帧（如 8 帧）就足以回答关于短暂事件的问题，因为相邻帧高度冗余'
      C: '视频帧的视觉 token 在送入语言模型前会被汇聚成一个向量，不占用文本上下文，长度不受限制'
      D: 'Qwen2-VL 的 M-RoPE 把位置拆成时间、高、宽三个分量，同一帧内的 token 共享时间位置'
    answer: D
    explanation: |
      **结论**：视频理解要同时处理「空间」与「时间」两个维度，位置编码与采样策略都需要专门设计。

      - **M-RoPE**（多模态旋转位置编码）：对文本 token，三个分量取相同的位置号，等价于普通的一维 RoPE；对图像，时间分量不变，高、宽分量按 token 的行列坐标取值；对视频，时间分量逐帧递增。这样模型能分清「同一帧的不同位置」和「不同帧的同一位置」。
      - **绝对时间对齐**：如果帧率不固定，相邻帧的位置间隔就不能代表真实时间。Qwen2.5-VL 让时间位置对应真实时间，模型因而能回答「第几秒发生了什么」这类问题。

      - A 错：独立输入的帧之间缺少明确的时间信息，模型无从知道两帧之间隔了 0.5 秒还是 10 秒，通常需要时间位置编码或显式的时间戳文本。
      - B 错：相邻帧冗余不代表事件不会落在采样间隔里，稀疏采样很容易漏掉只持续零点几秒的动作，回答「发生了几次」「先后顺序」一类问题时尤其吃亏。
      - C 错：视频帧的视觉 token 与文本 token 一样占用上下文，长视频正是因此需要降帧率、降分辨率或做检索。

      （多模态位置编码的详细设计属于位置编码专题，此处只要求理解其作用。）
    source: 'Qwen2-VL arXiv:2409.12191；Qwen2.5-VL arXiv:2502.13923'

  - id: LLM-MM-021
    type: multiple
    difficulty: 1
    frequency: 1
    points: [多图与视频理解, 多模态预训练与指令微调]
    tags: [多图理解, 图文交错数据, Flamingo]
    question: |
      关于多图输入与图文交错数据，下列说法**正确**的有：
    options:
      A: '只用单图指令数据训练，模型也能把单图理解自然迁移到跨图比较、时序推理等多图任务'
      B: 'Flamingo 中每个文本 token 经交叉注意力只直接读取它之前最近的一张图像'
      C: '多图问答常给每张图加编号或专门的分隔标记，帮模型把图与文本中的指代对应起来'
      D: 'Flamingo 在网页图文交错数据上训练，因而能在提示中靠几组图文示例完成新任务'
      E: '多张图的视觉 token 会累加到同一个上下文中，图片一多就会迅速挤占上下文长度与显存'
    answer: [B, C, D, E]
    explanation: |
      **结论**：B、C、D、E 正确。

      - A 错：跨图比较、时序推理等能力需要专门的多图训练数据和指令数据，仅有单图数据时，模型往往只会孤立地描述每张图。
      - B 对：Flamingo 用逐图掩码限制交叉注意力：某个文本 token 只能直接看到它前面最近一张图像的视觉 token，对更早图像的依赖通过语言模型的自注意力间接传递。这样模型能处理任意张数的图像，训练时每条序列最多 5 张图，评测时可以用到 32 个少样本示例。
      - C 对：「第二张图里的人和第一张图里的是同一个人吗」这类问题，要求模型能定位每张图；编号或分隔标记为指代提供了锚点。
      - D 对：Flamingo 的训练数据包括从网页抓取、保留图文原始交错顺序的数据集，模型学会了在一段序列中处理多张图与其上下文，从而支持多模态的少样本提示：在提示中给出几组「图像—答案」示例，就能完成新任务。
      - E 对：例如每张图 576 个 token 时，10 张图就是 5760 个 token；动态分辨率下更多，需要为多图请求设置总预算。

      另外，图文交错数据不只用于评测：MMC4、OBELICS 等交错数据集被广泛用于多模态预训练，帮助模型理解图文混排的长文档，并提升上下文学习能力。
    source: 'Flamingo arXiv:2204.14198'

  - id: LLM-MM-022
    type: short
    difficulty: 2
    frequency: 3
    points: [多模态预训练与指令微调]
    tags: [训练阶段, 视觉指令微调]
    question: |
      以「视觉编码器 + 连接器 + 语言模型」结构的多模态大模型（如 LLaVA、Qwen2-VL、InternVL）为例，典型的训练流程分哪几个阶段？每个阶段训练哪些模块、使用什么数据、解决什么问题？
    answer: |
      1. **阶段一：模态对齐（连接器预训练）**
         - 训练：只训练连接器，冻结视觉编码器与语言模型（LLaVA 的做法）；也有模型在这一阶段单独训练视觉编码器（如 Qwen2-VL 第一阶段只训练 ViT）。
         - 数据：大量图文描述对（如 LLaVA-1.5 的约 55.8 万条）。
         - 目的：用很低的成本把视觉特征映射进语言模型的输入空间，避免随机初始化的连接器产生的噪声梯度破坏两个预训练模型。
      2. **阶段二：多模态预训练（较大的模型通常有）**
         - 训练：解冻视觉编码器，常常也解冻语言模型（如 Qwen2-VL 第二阶段解冻全部参数）。
         - 数据：规模更大、类型更丰富：图文交错网页、OCR 与文档、图表、定位（框坐标）、视频等，并混入纯文本数据以免语言能力退化。
         - 目的：提升感知能力（看清文字、细节、空间关系），注入视觉知识。
      3. **阶段三：视觉指令微调（SFT）**
         - 训练：语言模型与连接器，视觉编码器常冻结或用较小的学习率（Qwen2-VL 第三阶段冻结 ViT，只训练语言模型）。
         - 数据：多轮视觉对话、带格式提示的 VQA、文档问答、推理、多图与视频指令，加上纯文本指令数据。
         - 目的：学会遵循指令、按要求的格式作答、进行多轮交互。
      4. **阶段四（可选）：偏好对齐与强化学习**：用偏好数据（如针对幻觉的细粒度人工反馈）做 DPO 或 RLHF，减少幻觉；用可验证的奖励做强化学习，提升视觉推理能力。
      5. **贯穿始终的要点**：数据质量（如对网页图片的描述重新生成更详细准确的版本）、分辨率逐步提高、多模态与纯文本数据的配比、各阶段的学习率与冻结策略。
    rubric:
      - '说清对齐阶段只训练连接器（或单独训练 ViT）的原因（3 分）'
      - '说明多模态预训练阶段的解冻策略与数据类型（2 分）'
      - '说明指令微调阶段的数据与目标（3 分）'
      - '提到偏好对齐 / 强化学习或纯文本数据混合等要点（2 分）'
    explanation: |
      **常见失分点**：说「第一阶段就训练全部参数」；不知道指令数据可以由语言模型合成（LLaVA 用纯文本的 GPT-4 生成）；忽略纯文本数据的混入，导致语言能力退化；把所有模型的阶段划分说成完全一致（不同模型的冻结策略不同，回答时可以举出具体模型的做法）。
    source: 'LLaVA arXiv:2304.08485；Qwen2-VL arXiv:2409.12191；InternVL 1.5 arXiv:2404.16821'

  - id: LLM-MM-023
    type: single
    difficulty: 1
    frequency: 2
    points: [多模态预训练与指令微调, LLaVA架构]
    tags: [模态对齐, 冻结]
    question: |
      训练视觉语言模型时，第一阶段通常冻结视觉编码器和语言模型，只训练连接器。这样做的主要原因是：
    options:
      A: '连接器随机初始化、输出近乎噪声，先单独训练它能避免噪声梯度破坏两个预训练好的模型'
      B: '冻结的模型不必计算参数梯度、保存优化器状态，这一做法主要是为了让训练后的模型推理更快'
      C: '冻结两个大模型是为了让连接器学到与具体模型无关的通用映射，换语言模型时可直接复用'
      D: '连接器在三者中参数最多、收敛最慢，所以要单独留出第一阶段先把它训好'
    answer: A
    explanation: |
      **结论**：先让「翻译官」（连接器）学会把视觉特征翻译成语言模型能读懂的输入，再让整个系统一起学习复杂任务。

      训练初期连接器的输出是随机的，如果此时同时更新语言模型，反向传播的梯度会把语言模型往「适应噪声」的方向推，损害它原有的语言能力；同时更新视觉编码器，也可能破坏它预训练好的表示。只训练连接器时，可训练参数很少（一个线性层或两层 MLP），用大量简单的图文描述对就能快速收敛，计算成本低。

      - B 错：冻结确实省去了这两部分的梯度与优化器状态，但目的在训练稳定性与成本，与训练后的推理速度无关。
      - C 错：连接器学的是从特定视觉编码器到特定语言模型输入空间的映射，换了语言模型就要重新训练；冻结是为了保护两个预训练模型，而不是追求通用性。
      - D 错：连接器恰恰是三者中最小的部分，也正因为小才适合先单独训练。
    source: 'LLaVA arXiv:2304.08485'

  - id: LLM-MM-024
    type: judge
    difficulty: 1
    frequency: 2
    points: [多模态预训练与指令微调]
    tags: [灾难性遗忘, 纯文本数据]
    question: |
      多模态训练如果只使用图文数据，常会导致语言模型原有的纯文本能力（如知识问答、代码、数学）下降，所以主流做法会在多模态预训练和指令微调中混入一定比例的纯文本数据。
    answer: true
    explanation: |
      **正确**。语言模型参与多模态训练时，参数被大量图文数据更新，数据分布与原预训练差异很大，容易出现灾难性遗忘。常见对策：
      - **混入纯文本数据**：LLaVA-1.5 的指令数据中就包含约 4 万条 ShareGPT 纯文本对话；DeepSeek-VL 的实验发现，只用多模态数据训练会明显遗忘语言能力，因此在训练中保留了相当比例的纯文本数据，并从以文本为主逐步增加图文数据的比例。
      - **控制更新幅度**：较小的学习率，必要时冻结部分模块或只训练连接器与少量层。
      - **评测**：每个阶段同时评测多模态基准与纯文本基准，及时发现退化。

      这一问题与领域 SFT 中的遗忘是同一类问题，处理思路也一致：回放原分布的数据，并控制训练强度。
    source: 'LLaVA-1.5 arXiv:2310.03744；DeepSeek-VL arXiv:2403.05525'

  - id: LLM-MM-025
    type: single
    difficulty: 2
    frequency: 2
    points: [文档与OCR理解]
    tags: [OCR, 文档理解, OCR-free]
    question: |
      让大模型理解扫描版合同、发票、图表等文档，主要有「OCR 流水线 + 文本大模型」与「端到端多模态模型（不依赖外部 OCR）」两条路线。下列说法正确的是：
    options:
      A: '端到端模型能靠语言先验补全文字，224×224 的输入就足以读清 A4 页面上的正文'
      B: 'OCR 的错误只影响个别字符，语言模型能凭上下文纠正，对版面和表格理解几乎没有影响'
      C: '流水线便宜可控，但会丢失版面与图表信息；端到端能利用版面，但视觉 token 开销大'
      D: '两条路线互相排斥：OCR 文本与页面图像同时输入会产生冲突，模型无法结合使用'
    answer: C
    explanation: |
      **结论**：两条路线各有所长，实践中常常结合使用。

      - **OCR 流水线**：检测与识别技术成熟，可以单独优化与评测；输出纯文本，送入语言模型的 token 少、成本低；但表格结构、阅读顺序、勾选框、印章、图表中的数据关系容易丢失，识别错误会直接变成下游的「事实错误」。
      - **端到端模型**（如早期的 Donut、Pix2Struct，以及现在的多模态大模型）：直接「看」页面，可以利用版面和视觉信息；但小字需要足够的分辨率，导致视觉 token 很多，也会出现把相似字符认错的幻觉。

      - A 错：A4 页面缩到 224×224 后，正文文字只有几个像素高，根本无法辨认，语言先验也补不出看不见的内容；这正是文档模型普遍采用高分辨率、切块或原生分辨率的原因。
      - B 错：OCR 的阅读顺序错误、表格单元格错位，会直接破坏对结构的理解，语言模型无从纠正；数字、专名识别错了也很难凭上下文改对。
      - D 错：常见的结合方式是把 OCR 文本作为额外输入与页面图像一起送入多模态模型，或先用 OCR 定位文字区域，再对这些区域高分辨率编码。

      评测上，DocVQA 等文档问答基准常用 ANLS（基于归一化编辑距离的相似度）计分，允许答案有少量字符差异。

  - id: LLM-MM-026
    type: judge
    difficulty: 3
    frequency: 1
    points: [文档与OCR理解, 视觉token数量与压缩]
    tags: [DeepSeek-OCR, 光学压缩]
    question: |
      DeepSeek-OCR（2025 年 10 月）探索「上下文光学压缩」：把文本渲染成图像，用少量视觉 token 表示大量文本。论文报告，当文本 token 数不超过视觉 token 数的 10 倍时，OCR 解码精度约为 97%；压缩比达到 20 倍时，精度降到约 60%。
    answer: true
    explanation: |
      **正确**。DeepSeek-OCR 由视觉编码器 DeepEncoder 与一个 3B 规模的 MoE 解码器（每次激活约 5.7 亿参数）组成，研究「一页文字最少需要多少个视觉 token」：
      - 压缩比（文本 token 数 / 视觉 token 数）小于 10 倍时，解码精度约 97%；
      - 压缩比约 20 倍时，精度降到约 60%；
      - 在 OmniDocBench 上，它只用 100 个视觉 token 就超过了每页使用 256 个 token 的 GOT-OCR2.0；用不到 800 个视觉 token，就超过了平均每页用 6000 多个 token 的 MinerU2.0。

      作者据此提出一个设想：把久远的对话历史渲染成图像、以较低分辨率保存，相当于用「光学压缩」实现一种随时间逐渐模糊的记忆。这仍是初步探索，但说明了一个反直觉的事实：对排版规整的文字，视觉 token 的信息密度可以高于文本 token。
    source: 'DeepSeek-OCR: Contexts Optical Compression arXiv:2510.18234'

  - id: LLM-MM-027
    type: single
    difficulty: 1
    frequency: 2
    points: [语音大模型]
    tags: [级联式, 端到端, GPT-4o]
    question: |
      语音助手有两种架构：级联式（语音识别 ASR → 文本大模型 → 语音合成 TTS）与端到端语音大模型（如 GPT-4o 的语音模式）。下列关于二者区别的说法，正确的是：
    options:
      A: '端到端模型内部仍会先生成一段隐藏的文字转写再理解，因此本质上与级联式相同'
      B: '级联式只把转写文字交给大模型，语气、情绪、背景声等副语言信息在 ASR 环节就丢失了'
      C: '级联式各模块都可以流式运行且模型更小，整体延迟通常低于端到端模型'
      D: '级联式要求 ASR、大模型、TTS 使用同一种语言，切换语言需要整体替换三个模块'
    answer: B
    explanation: |
      **结论**：级联式的根本局限是「中间只有文字」。

      OpenAI 在发布 GPT-4o（2024 年 5 月）时说明：此前的语音模式由三个模型串联而成，主模型只能看到文字，无法直接感知语气、多个说话人或背景噪声，也无法输出笑声、歌声或表达情绪；平均延迟约 2.8 秒（GPT-3.5）和 5.4 秒（GPT-4）。GPT-4o 端到端处理文本、视觉和音频，语音响应最快约 232 毫秒，平均约 320 毫秒，接近人类对话中的反应时间。

      - A 错：端到端模型直接以音频（如编解码器 token 或连续特征）作为输入和输出，不经过显式的文字转写。
      - C 错：级联式的延迟是各模块延迟之和，再加上每个模块都要等待上游的完整结果，通常更高；流式 ASR、流式 TTS 可以缓解，但难以完全消除。
      - D 错：多语言 ASR、TTS 和大模型都很成熟，级联式完全可以支持多语言。

      级联式的优势也很明显：模块可以单独替换与优化，中间文本便于审计、记录和接入工具调用，可控性强。因此实际产品中级联式与端到端（或「思考—说话」分离的混合式）都在使用。
    source: 'Hello GPT-4o（OpenAI, 2024-05-13）'

  - id: LLM-MM-028
    type: calc
    difficulty: 2
    frequency: 2
    points: [语音大模型]
    tags: [音频tokenizer, RVQ, EnCodec, Mimi]
    question: |
      神经音频编解码器（audio tokenizer）用残差向量量化（RVQ）把语音变成离散 token：每一帧依次用多个码本量化，每个码本输出一个 token。
      - EnCodec（24 kHz 模型）每秒 75 帧，每个码本 1024 个码字；
      - Mimi（Moshi 使用）每秒 12.5 帧，8 个码本，码率约 1.1 kbps。

      (1) EnCodec 在 6 kbps 档位需要几个码本？若把所有码本的 token 依次展平成一条序列，每秒有多少个 token？
      (2) Mimi 每个码本有多少个码字？每秒有多少个 token？
      (3) 1 分钟语音分别对应多少个音频 token？这对语音大模型的设计意味着什么？
    answer: '(1) 8 个码本，每秒 600 个 token；(2) 2048 个码字，每秒 100 个 token；(3) EnCodec 36000 个，Mimi 6000 个；帧率与码本数直接决定序列长度，需要低帧率编解码器与分层建模'
    explanation: |
      **(1)** 1024 个码字即每个 token 10 bit；每个码本每秒贡献 $75\times10=750$ bps；$6000/750=$ **8** 个码本。展平后每秒 $75\times8=$ **600** 个 token。

      **(2)** $1100/(12.5\times8)=11$ bit，即 $2^{11}=$ **2048** 个码字；每秒 $12.5\times8=$ **100** 个 token。

      **(3)** 60 秒：EnCodec 为 $600\times60=36000$ 个，Mimi 为 $100\times60=6000$ 个。作为对照，1 分钟语音转写成文字通常只有一两百个文本 token。

      **设计含义**：
      - 音频 token 序列长度由「帧率 × 码本数」决定。帧率太高、码本太多，会让语言模型的上下文与生成步数暴增，所以新一代编解码器追求低帧率；
      - 码本之间是「由粗到细」的残差关系，不必全部当作独立时间步来生成：常见做法是按帧建模，帧内再由一个小模型依次生成各个码本（如 Moshi 的「时间 Transformer + 深度 Transformer」结构），或用错位的方式并行生成多个码本；
      - 还可以把第一个码本训练成偏向语义的 token（Mimi 用 WavLM 的表示做蒸馏），其余码本负责音色等声学细节，让语言模型更容易理解和生成内容。
    source: 'High Fidelity Neural Audio Compression（EnCodec）arXiv:2210.13438；Moshi arXiv:2410.00037'

  - id: LLM-MM-029
    type: fill
    difficulty: 1
    frequency: 1
    points: [语音大模型]
    tags: [Whisper, log-Mel]
    question: |
      Whisper 把音频切成 30 秒一段，计算 80 维的 log-Mel 频谱，帧移为 10 ms，因此每段有 ____ 帧；编码器前端是两层卷积，其中第二层的步长为 2，所以编码器输出的序列长度为 ____。
    answer: ['3000', '1500']
    explanation: |
      - **3000**：$30\ \text{s}/10\ \text{ms}=3000$ 帧（窗长 25 ms），不足 30 秒的音频会补齐到 30 秒；
      - **1500**：第二层卷积步长为 2，序列长度减半为 1500，每个位置约对应 20 ms 的音频。

      **背景**：Whisper 是编码器—解码器结构，在约 68 万小时的弱监督多语言数据上训练；解码器用特殊 token 指定语言、任务（转写或翻译）以及是否输出时间戳，一个模型完成多种任务。large-v3 改用 128 维 Mel 频谱。

      **对语音大模型的意义**：许多「语音编码器 + 大语言模型」的方案直接复用 Whisper 的编码器，再接适配器把特征映射到语言模型的输入空间。由于 1500 个位置对 30 秒音频来说仍然很长，适配器通常还会进一步下采样（如池化或拼接相邻帧），以控制送进语言模型的 token 数。
    source: 'Robust Speech Recognition via Large-Scale Weak Supervision（Whisper）arXiv:2212.04356'

  - id: LLM-MM-030
    type: design
    difficulty: 3
    frequency: 2
    points: [语音大模型]
    tags: [实时语音, 延迟预算, 打断, 工具调用]
    question: |
      请设计一个电话场景的实时语音客服 Agent：用户说话、模型用语音回答。要求：从用户说完到听到回复的首包延迟 P50 < 800 ms；支持用户随时打断（barge-in）；能调用订单查询等内部工具。请给出架构选择（级联 / 端到端 / 混合）、延迟预算的分解、打断与轮次管理、工具调用期间的交互设计，以及评测指标与风险。
    answer: |
      **1. 架构选择**
      - 推荐**流式级联**（流式 ASR → 支持工具调用的大模型 → 流式 TTS），或「端到端语音模型负责寒暄，文本链路负责工具与业务」的混合方案。
      - 理由：客服场景需要可靠的工具调用、可审计的文本记录、可控的话术与合规；级联方案模块成熟、便于替换和调优。端到端方案的延迟和语气表现更好，但控制与评测更难，可在体验要求高的环节引入。

      **2. 延迟预算（示例，合计约 700～800 ms）**
      - 端点检测（判断用户说完）：静音阈值约 200～300 ms，可用语义端点检测缩短，避免截断用户；
      - ASR 最终结果：流式识别边听边出部分结果，说完后约 100 ms 给出最终文本；
      - 大模型首 token：200～300 ms（精简系统提示、前缀缓存、为首句使用小而快的模型）；
      - TTS 首包音频：约 100～150 ms（按句或按短语流式合成）；
      - 网络与电话链路：约 50～100 ms。
      - 优化手段：用 ASR 的部分结果提前启动大模型推理（结果变化时取消重来）；大模型按句输出，立即送入 TTS。

      **3. 打断与轮次管理**
      - 全双工音频流，回声消除后持续做语音活动检测；检测到用户开口时立即停止 TTS 播放并取消正在进行的生成。
      - 只把**实际已经播放**的那部分回复写入对话历史，避免模型以为用户听到了没播放的内容。
      - 区分「嗯」「对」这类附和与真正的打断（时长、能量、语义），避免频繁误停。

      **4. 工具调用期间的体验**
      - 先播报「我帮您查一下」之类的短句，避免冷场；工具并行调用并设置超时；
      - 失败时给出明确的降级话术；涉及金额、地址、手机号的关键信息需要复述确认。

      **5. 评测指标与风险**
      - 指标：分阶段的延迟 P50 / P95；ASR 的词错率，尤其是数字、人名、地址的准确率；任务完成率；打断响应时间与误打断率；端点误判率；转人工率与满意度。
      - 方法：用真实通话录音离线回放，配合线上灰度。
      - 风险：数字识别错误导致业务错误；工具结果被模型错误转述；隐私与录音告知；大模型故障时要有转人工的兜底。
    rubric:
      - '给出架构选择并说明与工具调用、可控性的关系（2 分）'
      - '给出合理的分阶段延迟预算与优化手段（3 分）'
      - '说明打断检测、取消生成与历史截断（2 分）'
      - '说明工具调用期间的交互设计（1 分）'
      - '给出评测指标与主要风险（2 分）'
    explanation: |
      **常见失分点**：只给「用端到端模型」一句话，没有延迟分解；忽略端点检测这一常被低估的大头；打断后仍把整段未播放的回复写入历史，导致后续对话错乱；没有考虑数字、地址等关键信息的确认与转人工兜底。

  - id: LLM-MM-031
    type: single
    difficulty: 2
    frequency: 2
    points: [理解与生成统一]
    tags: [Chameleon, Janus, Transfusion, Emu3]
    question: |
      下列关于「多模态理解与生成统一」模型的描述，与对应模型相符的是：
    options:
      A: 'Janus：理解与生成共用同一个 VQ 视觉编码器，让两类任务共享表示、减少参数量'
      B: 'Transfusion：图像先经 VQ 量化成离散 token，再与文本一起做下一个 token 预测'
      C: 'Emu3：文本用下一个 token 预测，图像与视频则由外接的扩散模型生成，二者分开训练'
      D: 'Chameleon：图像量化成离散 token 后与文本混合，统一做下一个 token 预测'
    answer: D
    explanation: |
      **结论**：统一模型目前有几条代表性路线。

      - **离散 token 自回归**：Chameleon（Meta, 2024）把图像量化为离散 token，与文本 token 放在同一序列里，用同一个 Transformer、同一个下一个 token 预测目标训练，可以生成图文交错的内容；Emu3（2024）同样只用下一个 token 预测来训练图像、视频和文本。
      - **自回归 + 扩散混合**：Transfusion（Meta, 2024）在同一个 Transformer 中，对文本使用语言模型损失、对图像使用扩散损失，图像保持连续表示，避免了离散化的信息损失。
      - **解耦视觉编码**：Janus（DeepSeek, 2024）认为理解与生成需要的视觉信息粒度不同，于是为理解（偏语义的编码器）和生成（VQ tokenizer）分别设计编码路径，但仍由同一个 Transformer 处理。

      - A 错：恰好说反了 Janus 的核心思想，它为理解与生成分别设计视觉编码路径。
      - B 错：Transfusion 的关键正是让图像保持连续表示并使用扩散损失，不做离散量化。
      - C 错：Emu3 的文本、图像、视频都用下一个 token 预测，不依赖扩散模型。
    source: 'Chameleon arXiv:2405.09818；Transfusion arXiv:2408.11039；Emu3 arXiv:2409.18869；Janus arXiv:2410.13848'

  - id: LLM-MM-032
    type: judge
    difficulty: 2
    frequency: 1
    points: [理解与生成统一]
    tags: [Janus, 视觉编码]
    question: |
      DeepSeek 的 Janus 认为，多模态理解与图像生成可以共享同一种视觉表示，因此让两个任务共用同一个视觉编码器，使两种能力相互促进。
    answer: false
    explanation: |
      **错误**。Janus 的出发点恰恰相反：此前的统一模型（如 Chameleon）用同一个视觉编码器同时服务理解与生成，而两者需要的信息粒度不同：
      - **理解**需要高层语义（物体是什么、场景在说什么），与语言对齐的语义编码器更合适；
      - **生成**需要能还原像素细节的低层表示，适合可重建的 VQ tokenizer。

      共用一个编码器会让两种需求相互冲突，尤其会损害理解能力。Janus 因此把视觉编码**解耦**为两条路径：理解用语义编码器，生成用 VQ tokenizer，两者的输出再交给**同一个** Transformer 处理。后续的 Janus-Pro 扩大了数据与模型规模，进一步提升了两方面的效果。
    source: 'Janus: Decoupling Visual Encoding for Unified Multimodal Understanding and Generation arXiv:2410.13848'

  - id: LLM-MM-033
    type: short
    difficulty: 3
    frequency: 2
    points: [理解与生成统一]
    tags: [统一模型, VQ, 扩散]
    question: |
      为什么「一个模型同时做好多模态理解与图像生成」很难？请从视觉表示、训练目标、生成方式三个角度分析，并说明以下技术路线各自如何取舍：离散 token 自回归、自回归 + 扩散混合、解耦视觉编码器、语言模型 + 外接扩散解码器。
    answer: |
      1. **视觉表示的冲突**：理解需要与语言对齐的高层语义特征（如 CLIP、SigLIP 的特征），它们对像素细节不敏感、难以还原成图像；生成需要能高保真重建的低层表示（VQ 或 VAE 的潜变量），它们语义性弱。单一的视觉 tokenizer 很难两头兼顾。
      2. **训练目标的冲突**：离散 token 上的交叉熵与连续空间的扩散去噪目标形式不同、尺度不同，多任务训练时要平衡数据配比与损失权重；生成质量与理解准确率之间常有此消彼长。
      3. **生成方式的代价**：自回归逐个生成一张图的上千个 token 速度慢，且离散化本身有信息损失，限制了画质；扩散模型可以并行地迭代去噪，但需要多步采样，也不天然适配语言模型的下一个 token 预测框架。
      4. **各路线的取舍**：
         - **离散 token 自回归**（Chameleon、Emu3）：目标统一、结构最简单，天然支持图文交错的输入与输出；代价是 tokenizer 的信息损失、生成慢、训练稳定性挑战。
         - **自回归 + 扩散混合**（Transfusion）：文本用语言模型损失，图像保持连续表示、用扩散损失，画质更好；训练与推理流程更复杂。
         - **解耦视觉编码器**（Janus）：理解与生成各用最合适的视觉表示，缓解表示冲突；组件更多，统一程度打了折扣。
         - **语言模型 + 外接扩散解码器**：语言模型输出条件向量或查询，交给强大的预训练扩散模型生成；能复用成熟的扩散模型，见效快；但两部分是「拼接」的，端到端一致性（如多轮编辑时保持细节）较难保证。
      5. **结论**：目前还没有公认的最优方案。评价统一模型时，要同时看理解基准与生成基准，并关注图文交错生成、多轮图像编辑等真正需要统一的任务。
    rubric:
      - '从视觉表示角度说明语义特征与可重建特征的冲突（3 分）'
      - '说明训练目标与生成方式上的困难（2 分）'
      - '准确描述至少三条技术路线及其取舍（4 分）'
      - '给出合理的评价视角或结论（1 分）'
    explanation: |
      **常见失分点**：只说「理解和生成任务不同」，讲不出视觉表示层面的冲突；把 Janus 说成共享编码器；认为离散 token 自回归没有信息损失；不知道「语言模型 + 外接扩散」与「原生统一」的区别。

  - id: LLM-MM-034
    type: calc
    difficulty: 2
    frequency: 1
    points: [多模态幻觉]
    tags: [CHAIR, 物体幻觉]
    question: |
      用 CHAIR 指标评估模型 A 的图像描述中的物体幻觉（下表列出每张图真实存在的物体，以及描述中提到的物体）：

      | 图像 | 真实物体 | 模型 A 提到的物体 |
      |---|---|---|
      | 1 | 人、狗、飞盘 | 人、狗、飞盘 |
      | 2 | 猫、沙发 | 猫、沙发、遥控器 |
      | 3 | 汽车、道路、树 | 汽车、道路 |
      | 4 | 桌子、杯子 | 桌子、杯子、笔记本电脑、手机 |

      (1) 物体级指标 $\mathrm{CHAIR}_i$ = 幻觉物体数 / 提到的物体总数，是多少？
      (2) 描述级指标 $\mathrm{CHAIR}_s$ = 含幻觉的描述数 / 描述总数，是多少？
      (3) 模型 B 的描述更短，只分别提到「人、狗」「猫」「汽车」「桌子」。它的两个 CHAIR 指标是多少？这说明了什么？
    answer: '(1) 3/12 = 25%；(2) 2/4 = 50%；(3) 两项都是 0，但只覆盖了 5/10 = 50% 的真实物体（模型 A 覆盖 9/10），CHAIR 需要与召回或覆盖率一起看'
    explanation: |
      **(1)** 模型 A 共提到 $3+3+2+4=12$ 个物体，其中遥控器、笔记本电脑、手机这 3 个不存在，$\mathrm{CHAIR}_i=3/12=$ **25%**。

      **(2)** 图 2、图 4 的描述含有幻觉，$\mathrm{CHAIR}_s=2/4=$ **50%**。

      **(3)** 模型 B 提到的 5 个物体都真实存在，两项指标都是 0；但真实物体共 $3+2+3+2=10$ 个，它只提到 5 个，覆盖率 50%；模型 A 提到了其中 9 个，覆盖率 90%。

      **结论**：CHAIR 只惩罚「说了不存在的东西」，不惩罚「漏说」，模型只要写得短、写得保守就能获得低分。评估时要与召回 / 覆盖率、描述的信息量一起看，或者配合 POPE 这类是非问答的评测。此外 CHAIR 依赖物体词表和同义词映射（如「人」「男人」「行人」），只覆盖物体是否存在，不覆盖属性、数量、关系类的幻觉。
    source: 'Object Hallucination in Image Captioning（Rohrbach 等, 2018）'

  - id: LLM-MM-035
    type: single
    difficulty: 2
    frequency: 2
    points: [多模态幻觉]
    tags: [POPE, 物体幻觉, 共现偏差]
    question: |
      POPE 用「图中有没有 X？」这类是 / 否问题评估物体幻觉，负样本（图中不存在的物体）有随机、热门、对抗三种采样方式。通常哪种设置下模型的幻觉最严重，原因是什么？
    options:
      A: '对抗设置：负样本选自常与图中物体共现的物体，模型易被共现统计带偏而答「有」'
      B: '随机设置：负样本与图像内容毫无关联，模型缺少可供排除的线索，最难做出判断'
      C: '热门设置：负样本选自数据集中最常见的物体，模型偏爱回答高频物体，幻觉最严重'
      D: '三种设置难度相近：问题都是是 / 否形式、正负样本各半，只是负样本的来源不同'
    answer: A
    explanation: |
      **结论**：对抗设置最难，它直接利用了物体共现带来的偏差。

      - **随机**：从全部物体中随机挑选图中没有的物体，往往与图像内容无关（如在厨房图中问「有没有长颈鹿」），最容易答对；
      - **热门**：挑选数据集中**最常见**的物体，测试模型是否偏向回答高频物体；
      - **对抗**：挑选与图中真实物体**共现最频繁**、但图中实际没有的物体（如图中有餐桌，就问「有没有叉子」），模型凭「常识联想」最容易说「有」。

      POPE 的问题正负各半，除了准确率、精确率、召回率、F1，还会报告模型回答「是」的比例。很多模型偏向回答「是」，这本身就是一种幻觉倾向。

      - B 错：随机负样本往往与图像内容无关，模型最容易排除，是最容易的设置。
      - C 错：热门设置确实考查模型偏向高频物体的倾向，但通常比对抗设置容易；对抗设置还叠加了共现偏差，幻觉最严重。
      - D 错：问题形式相同，负样本的选择方式决定了难度。

      局限：POPE 只评估「物体是否存在」，不覆盖属性、数量、空间关系等幻觉，结果也会受到提问措辞的影响。
    source: 'Evaluating Object Hallucination in Large Vision-Language Models（POPE）arXiv:2305.10355'

  - id: LLM-MM-036
    type: multiple
    difficulty: 2
    frequency: 3
    points: [多模态幻觉]
    tags: [幻觉成因, VCD, 语言先验]
    question: |
      关于多模态大模型的幻觉成因与缓解方法，下列说法**正确**的有：
    options:
      A: 'VCD（视觉对比解码）对比原始图像与加噪失真图像下的输出分布，优先保留在失真图像下依然高概率的 token，因为它们更稳健'
      B: '只要把温度设为 0、使用贪心解码，就能彻底消除多模态幻觉'
      C: 'VCD 这类对比解码方法必须重新训练模型才能使用'
      D: '视觉编码器分辨率不足或视觉 token 压缩过度，会让小物体、小字看不清，从而增加幻觉'
      E: '语言模型的先验过强时，模型会依据文本上下文和常见的物体共现「脑补」出图中并不存在的内容'
    answer: [D, E]
    explanation: |
      **结论**：D、E 正确。

      - A 错：方向说反了。VCD 的思路是：如果某个 token 在图像被破坏后依然高概率，说明它主要来自语言先验而非视觉证据，于是在解码时把它**压下去**（按 $(1+\alpha)\,\mathrm{logit}(y\mid v)-\alpha\,\mathrm{logit}(y\mid v')$ 组合原始图像 $v$ 与失真图像 $v'$ 下的输出，放大二者的差异），而不是优先保留。
      - B 错：贪心解码只是去掉采样的随机性，模型「确信」的错误内容照样会输出；幻觉的根源在模型本身。
      - C 错：VCD 无需训练，在推理时用同一个模型对两种输入各做一次前向即可，代价是推理计算量大约翻倍。
      - D 对：模型看不清就容易「猜」，提高分辨率、动态切块、局部放大都能缓解。
      - E 对：这是最主要的成因之一。例如图中有餐桌，模型就容易说出「刀叉」；描述写得越长，后半段越依赖语言先验。

      其他成因与方法：训练数据中的图像描述本身就有错误或过度描述，模型会学到这种习惯，因此要清洗或重新生成描述数据；用细粒度的人类反馈或偏好数据做对齐（如 RLHF-V、DPO）；让模型输出定位框、引用图像区域作为证据；在指令数据中加入「图中没有 X」这类否定样本，教会模型说「没有」。
    source: 'Mitigating Object Hallucinations in Large Vision-Language Models through Visual Contrastive Decoding（VCD）arXiv:2311.16922'

  - id: LLM-MM-037
    type: code_output
    difficulty: 2
    frequency: 2
    points: [扩散生成]
    tags: [DDPM, 前向加噪]
    question: |
      DDPM 的前向加噪过程有闭式解：$x_t=\sqrt{\bar\alpha_t}\,x_0+\sqrt{1-\bar\alpha_t}\,\epsilon$，其中 $\alpha_t=1-\beta_t$，$\bar\alpha_t=\prod_{s\le t}\alpha_s$。下面的代码用一个只有 4 步、噪声很大的玩具调度计算 $\bar\alpha_t$ 与 $x_t$。输出是什么？
    code: |
      import numpy as np

      betas = np.array([0.1, 0.2, 0.3, 0.4])
      alphas = 1 - betas
      abar = np.cumprod(alphas)
      x0, eps = 2.0, 1.0
      for t in (1, 4):
          a = abar[t - 1]
          xt = np.sqrt(a) * x0 + np.sqrt(1 - a) * eps
          print(t, round(float(a), 4), round(float(xt), 4))
    answer: |
      1 0.9 2.2136
      4 0.3024 1.935
    explanation: |
      **计算**：$\alpha=[0.9,\,0.8,\,0.7,\,0.6]$，累乘得 $\bar\alpha=[0.9,\,0.72,\,0.504,\,0.3024]$。
      - $t=1$：$\sqrt{0.9}\times2+\sqrt{0.1}\times1\approx1.8974+0.3162=2.2136$；
      - $t=4$：$\sqrt{0.3024}\times2+\sqrt{0.6976}\times1\approx1.0998+0.8352=1.9350$，打印为 `1.935`。

      **要点**：
      - 闭式解让训练时可以**直接**采样任意时间步的 $x_t$，不必一步步加噪：随机取 $t$ 和噪声 $\epsilon$，算出 $x_t$，让网络预测 $\epsilon$。
      - $\bar\alpha_t$ 随 $t$ 单调减小：原图信号的系数 $\sqrt{\bar\alpha_t}$ 越来越小，噪声的系数越来越大；$t$ 足够大时 $x_t$ 接近标准高斯分布，这就是生成时的起点。
      - 真实的 DDPM 用 $T=1000$ 步，$\beta$ 从 $10^{-4}$ 线性增加到 $0.02$；本题为了手算方便，用了极端的 4 步调度。
    source: 'Denoising Diffusion Probabilistic Models（DDPM）arXiv:2006.11239'

  - id: LLM-MM-038
    type: single
    difficulty: 1
    frequency: 2
    points: [扩散生成]
    tags: [DDPM, 去噪训练]
    question: |
      DDPM 的训练过程是：
    options:
      A: '每一步都从纯噪声开始，跑完完整的 1000 步去噪，再把结果与真实图像比较计算损失'
      B: '训练一个判别器区分真实图像与去噪结果，去噪网络与判别器交替更新、相互对抗'
      C: '随机采样时间步 t 和噪声 ε，按闭式公式得到 x_t，让网络预测所加的噪声，用均方误差训练'
      D: '用编码器把图像压缩成离散 token，再按噪声水平从粗到细自回归地预测下一个 token'
    answer: C
    explanation: |
      **结论**：DDPM 训练的是一个「噪声预测器」，每个训练样本只需做一次前向计算。

      论文最终使用的简化损失为
      $$L_{\text{simple}}=\mathbb{E}_{t,x_0,\epsilon}\big\|\epsilon-\epsilon_\theta(\sqrt{\bar\alpha_t}x_0+\sqrt{1-\bar\alpha_t}\epsilon,\ t)\big\|^2$$
      **生成**时才需要迭代：从 $x_T\sim\mathcal N(0,I)$ 出发，每一步用预测的噪声把 $x_t$ 去噪成 $x_{t-1}$，重复 $T$ 步得到图像。

      - A 错：混淆了训练与采样。训练时随机抽一个时间步计算损失即可，不需要跑完整条采样链。
      - B 错：这是 GAN 的训练方式。
      - D 错：这是 VQ 加自回归（如 DALL·E 第一代、Chameleon）的路线。

      后续改进：DDIM 用确定性采样把步数降到几十步；潜空间扩散在 VAE 的低维潜空间中做去噪，大幅省计算；无分类器引导增强文本条件的作用；DiT 用 Transformer 替代 U-Net；流匹配（flow matching）用更直的路径进一步减少采样步数。
    source: 'DDPM arXiv:2006.11239'

  - id: LLM-MM-039
    type: calc
    difficulty: 2
    frequency: 2
    points: [扩散生成]
    tags: [潜空间扩散, DiT, patch]
    question: |
      Stable Diffusion 一类的潜空间扩散模型先用 VAE 把图像在空间上下采样 8 倍、压缩为 4 通道的潜变量，再在潜空间中去噪；DiT 把潜变量切成 $p\times p$ 的 patch 作为 Transformer 的 token。
      (1) 512×512×3 的图像对应的潜变量形状是多少？元素数是原图的几分之一？
      (2) DiT 取 $p=2$ 时，token 数是多少？
      (3) 改为生成 1024×1024 的图像（其他设置不变），token 数变为多少？自注意力的计算量约变为原来的多少倍？
    answer: '(1) 64×64×4，约为原图元素数的 1/48；(2) 1024 个 token；(3) 4096 个 token，注意力计算量约为原来的 16 倍'
    explanation: |
      **(1)** $512/8=64$，潜变量为 $64\times64\times4=16384$ 个元素；原图 $512\times512\times3=786432$ 个元素，比值为 **1/48**。在这样小的空间里去噪，比直接在像素上去噪省得多，这正是潜空间扩散的出发点。

      **(2)** $(64/2)^2=32\times32=$ **1024** 个 token。

      **(3)** 潜变量 $128\times128\times4$，token 数 $(128/2)^2=$ **4096**；自注意力计算量与 token 数的平方成正比，$(4096/1024)^2=$ **16** 倍。

      **要点**：
      - DiT 论文发现，生成质量（FID）与模型的计算量（Gflops）强相关：加深加宽模型或减小 patch（token 更多）都能提升质量，这一缩放规律与语言模型类似；在 ImageNet 256×256 上，DiT-XL/2 的 FID 为 2.27。
      - 视频生成把时间维也切成 patch（时空 patch），token 数随时长和分辨率迅速增长，这是视频扩散模型计算成本极高的原因。
    source: 'High-Resolution Image Synthesis with Latent Diffusion Models arXiv:2112.10752；Scalable Diffusion Models with Transformers（DiT）arXiv:2212.09748'

  - id: LLM-MM-040
    type: multiple
    difficulty: 2
    frequency: 2
    points: [扩散生成]
    tags: [CFG, DDIM, DiT, 潜空间扩散]
    question: |
      关于扩散模型的关键技术，下列说法**正确**的有：
    options:
      A: 'DiT 用 Transformer 替代 U-Net 作去噪网络，论文发现 Gflops 越大，FID 通常越好'
      B: '无分类器引导把有条件与无条件的噪声预测外推组合，引导系数越大越贴合提示、多样性越低'
      C: '潜空间扩散在 VAE 的低维潜空间中去噪，比直接在像素空间去噪节省大量计算'
      D: '扩散模型一次前向传播就能从纯噪声得到最终图像，因此生成速度天然快于自回归模型'
      E: 'DDIM 必须使用与训练时相同的 1000 步，只是把每步的随机采样换成了确定性更新'
    answer: [A, B, C]
    explanation: |
      **结论**：A、B、C 正确。

      - A 对：DiT 证明扩散模型的去噪网络同样可以「换成 Transformer，然后放大」。
      - B 对：同一个网络同时学有条件和无条件两种预测（训练时随机把文本条件换成空），推理时按 $\tilde\epsilon=\epsilon_\theta(x_t,\varnothing)+s\,[\epsilon_\theta(x_t,c)-\epsilon_\theta(x_t,\varnothing)]$ 沿「有条件减无条件」的方向外推（$s>1$）；引导系数越大，越贴合提示，多样性越低，过大时画面会失真。代价是每步要做两次前向（或把两者拼成一个 batch）。
      - C 对：在 8 倍下采样的潜空间中，元素数只有像素空间的几十分之一，高分辨率文生图因此变得可行。
      - D 错：扩散模型要迭代多步去噪，每一步都是一次完整的前向传播；它的优势是每步并行处理所有位置，而不是一步完成。减少步数（更好的采样器、蒸馏、流匹配）是提速的主要方向。
      - E 错：DDIM 的意义正在于用远少于训练步数的采样步数（如几十步）生成图像，而且可以做到确定性采样。
    source: 'Classifier-Free Diffusion Guidance arXiv:2207.12598；DDIM arXiv:2010.02502；LDM arXiv:2112.10752；DiT arXiv:2212.09748'

  - id: LLM-MM-041
    type: single
    difficulty: 2
    frequency: 2
    points: [VLA与具身]
    tags: [RT-2, OpenVLA, 动作token]
    question: |
      RT-2、OpenVLA 等视觉—语言—动作（VLA）模型直接复用视觉语言模型来输出机器人动作。它们表示动作的方式是：
    options:
      A: '在语言模型之外单独训练一个强化学习策略网络，语言模型只负责输出分步的自然语言计划'
      B: '每个动作维度均匀离散成 256 个区间并各用一个 token 表示，按下一个 token 预测生成'
      C: '在语言模型末端接一个回归头，直接输出各关节力矩的连续值，并以均方误差作为训练损失'
      D: '让语言模型生成调用运动规划库的 Python 代码，再由执行器逐行运行这些代码来完成动作'
    answer: B
    explanation: |
      **结论**：「动作即 token」是第一代 VLA 的核心思路，把机器人控制变成了「生成一串数字 token」。

      - **RT-2**（2023）：把每个连续动作维度均匀分成 256 个区间，预留 256 个 token 表示这些区间，一条完整的机器人指令就是几个整数组成的短串；用机器人数据与网络图文数据联合微调视觉语言模型，让网络上学到的语义知识迁移到操作中。55B 的模型只能以 1～3 Hz 运行，5B 的模型约 5 Hz。
      - **OpenVLA**（2024）：7B 参数，Llama 2 加上融合了 DINOv2 与 SigLIP 特征的视觉编码器，在约 97 万条真实机器人演示上训练；在 29 个任务上比 55B 的 RT-2-X 绝对成功率高 16.5%，参数却少 7 倍。

      - A 错：这是「大模型做规划 + 传统策略执行」的分层方案。
      - C 错：这是连续动作回归，常见于专门的策略网络；π0 等新一代 VLA 则用流匹配生成连续动作，都不是 RT-2、OpenVLA 的做法。
      - D 错：这是「代码即策略」（Code as Policies）的思路。

      离散化的问题：精度受区间数限制；逐个 token 生成动作慢，难以满足高频控制的需求。这推动了动作分块、连续动作专家等后续设计。
    source: 'RT-2 arXiv:2307.15818；OpenVLA arXiv:2406.09246'

  - id: LLM-MM-042
    type: short
    difficulty: 3
    frequency: 2
    points: [VLA与具身]
    tags: [VLA, 动作分块, 双系统, π0, Helix]
    question: |
      机器人的精细操作通常需要几十到几百 Hz 的控制频率，而数十亿参数的 VLA 模型一次推理往往需要上百毫秒。请说明这一「低频推理、高频控制」的矛盾，以及业界的几种解决思路（至少三种），并分析各自的取舍。
    answer: |
      1. **矛盾**：
         - 大模型推理慢：RT-2 中 55B 模型约 1～3 Hz，5B 模型约 5 Hz；逐个 token 生成动作更慢；
         - 灵巧操作需要 50 Hz 甚至更高的闭环控制，否则动作卡顿，也无法对接触、滑动等变化及时修正。
      2. **思路一：动作分块（action chunking）**
         - 做法：每次推理输出未来一段动作序列，执行完一部分再重新推理。π0 一次输出 50 步动作，在 50 Hz 的平台上每执行 25 步重新推理一次。
         - 优点：摊薄推理开销，动作更平滑。
         - 代价：分块内部是开环执行，对突发变化的反应变慢。
      3. **思路二：连续动作专家 + 流匹配或扩散**
         - 做法：π0 在约 30 亿参数的 PaliGemma 上接一个约 3 亿参数的动作专家，用流匹配直接生成连续的动作块，推理时只需约 10 步积分。
         - 优点：比逐 token 解码快，能表达连续、多峰的动作分布。
         - 代价：结构与训练更复杂，需要大量机器人数据（π0 使用了约 1 万小时）。
      4. **思路三：快慢双系统**
         - 做法：Figure 的 Helix 中，约 7B 的视觉语言模型（系统 2）以 7～9 Hz 理解场景与指令，输出隐向量；约 8000 万参数的视觉运动策略（系统 1）以 200 Hz 输出连续控制。
         - 优点：语义推理与反应式控制解耦，各自运行在合适的频率上。
         - 代价：两个系统之间的接口（隐向量）需要联合训练；慢系统的信息总是略有滞后。
      5. **其他手段**：
         - 异步推理：执行当前动作块的同时计算下一块；
         - 量化、蒸馏与端侧加速，提高本体上的推理频率；
         - 让大模型输出路点或子目标，由传统控制器（阻抗控制等）高频跟踪。
      6. **总体权衡**：语义理解与泛化能力（大模型、低频）和反应速度与精度（小模型或控制器、高频）之间的分工与接口设计。
    rubric:
      - '说清低频推理与高频控制的矛盾，并给出量级（2 分）'
      - '说明动作分块及其开环代价（2 分）'
      - '说明连续动作专家（流匹配 / 扩散）的做法与取舍（2 分）'
      - '说明快慢双系统的做法与取舍（2 分）'
      - '提到异步推理、路点 + 控制器等其他手段或总体权衡（2 分）'
    explanation: |
      **常见失分点**：只说「把模型做小」；不知道动作分块的开环代价；把双系统说成两个模型轮流运行（实际是并行运行在不同频率上）；对具体数字张冠李戴。各家系统的数字以官方论文或博客为准，回答时说清出处即可。
    source: 'π0 arXiv:2410.24164；Figure Helix 博客（figure.ai/news/helix）；RT-2 arXiv:2307.15818'
