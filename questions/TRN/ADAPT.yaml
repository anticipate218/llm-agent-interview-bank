  - id: TRN-ADAPT-021
    type: single
    difficulty: 2
    frequency: 3
    points: [推理能力蒸馏]
    tags: [DeepSeek-R1]
    question: |
      DeepSeek-R1 论文用 R1 生成的约 80 万条样本（含推理与非推理数据）对 Qwen、Llama 系列的较小稠密模型直接做 SFT（即蒸馏），并与「直接对 Qwen-32B-Base 做大规模强化学习」进行了对比。论文得出的结论是：
