domain: ALN
subcategory: REASON
questions:

  - id: ALN-REASON-001
    type: single
    difficulty: 1
    frequency: 3
    points: [推理模型特点]
    tags: [o1, DeepSeek-R1]
    question: |
      与普通的对话模型相比，OpenAI o1、DeepSeek-R1 这类「推理模型」最核心的特点是：
    options:
      A: '在 Transformer 之外增加了专门的符号推理模块，数学和逻辑运算交给它执行，再把结果写回上下文'
      B: '回答前先生成长思维链，经大规模 RL 学会反思与回溯，能用更多推理 token 换取更好的效果'
      C: '主要依靠更大的预训练语料和参数量获得推理能力，推理时生成的 token 数和计算量与普通模型相当'
      D: '回答前会在内部调用搜索引擎和代码解释器，先验证每个中间结果，再给出最终答案'
    answer: B
    explanation: |
      **结论**：推理模型的关键不在架构，而在「先想再答」的训练方式与推理方式：用大规模 RL（常配合可验证奖励）训练出长思维链，推理时花更多 token 思考。OpenAI 发布 o1（2024 年 9 月）时展示，性能随训练时的 RL 算力和测试时的思考长度都能平稳提升；DeepSeek-R1（2025 年 1 月）公开了用 GRPO + 规则奖励训练这类模型的方法。

      - A 错：架构仍是标准的大语言模型，DeepSeek-R1 就基于 DeepSeek-V3。
      - C 错：推理时要生成大量思考 token，计算量明显高于普通模型，这正是「测试时计算扩展」的含义。
      - D 错：调用工具不是推理模型的定义性特征。R1 不调用工具；o3、o4-mini 等后来的模型能在思考过程中使用工具，但那是额外的能力。
    source: 'OpenAI 博客 https://openai.com/index/learning-to-reason-with-llms/ （2024-09-12）；DeepSeek-R1 论文 arXiv:2501.12948'

  - id: ALN-REASON-002
    type: multiple
    difficulty: 2
    frequency: 2
    points: [推理模型特点, 长思维链]
    question: |
      关于推理模型的长思维链（long CoT），下列说法**正确**的有：
    options:
      A: '对简单问题，长思维链也可能「过度思考」，消耗大量 token 却几乎不提升准确率'
      B: '思维链里写出的推理步骤，一定如实反映了模型得出答案的真实依据'
      C: '思维链中常出现自我验证、发现错误后回溯、换一种方法重算等行为'
      D: '长思维链只能靠人工撰写大量示范数据做 SFT 获得，RL 无法让模型自发产生这类行为'
      E: '思考 token 通常不展示给用户，因此不按输出 token 计费，只会增加响应延迟'
    answer: [A, C]
    explanation: |
      **结论**：A、C 正确。

      - A 对：过度思考是推理模型的典型问题之一，需要长度控制或思考预算。
      - B 错：思维链的忠实性（faithfulness）是公开问题。Anthropic 2025 年的研究发现，推理模型经常用到提示中的线索，却不在思维链里提及。思维链可以帮助监控，但不能当作可靠的解释。
      - C 对：这是长思维链与普通 CoT 提示最明显的区别。普通 CoT 往往是一条直线式的推导；推理模型会试探、检查、推翻重来。
      - D 错：DeepSeek-R1-Zero 只用规则奖励做 RL，没有任何 SFT，长思维链和反思行为就随训练自然出现了。
      - E 错：思考 token 要逐个生成，成本和延迟都与思考长度大致成正比。即使思考内容不展示给用户（如 OpenAI 的推理模型通过 API 不返回原始思考），这些 token 仍占用上下文，并按输出 token 计费。
    source: 'DeepSeek-R1 论文 arXiv:2501.12948；Anthropic 研究 https://www.anthropic.com/research/reasoning-models-dont-say-think （2025-04）'

  - id: ALN-REASON-003
    type: judge
    difficulty: 1
    frequency: 2
    points: [长思维链]
    question: |
      对推理模型而言，同一道题的思维链写得越长，答案就越可能正确，所以应尽量让模型多想。
    answer: false
    explanation: |
      **错误**。思考长度与正确率不是单调关系：
      - 不少分析观察到，同一模型在同一题上，错误回答往往比正确回答更长：模型卡住、反复绕圈，或在已经算对之后又自我怀疑、改错；
      - 训练目标本身也会制造「错误回答变长」：GRPO 原版按长度平均的 loss 让长的错误回答受罚更轻（Dr. GRPO 指出的长度偏差）；
      - 简单题上多想只增加成本，不提升准确率（过度思考）。

      测试时扩展说的是「在平均意义上，给模型更多思考预算，整体准确率随之提升」，而不是「单条回答越长越好」。实践中应按难度分配预算，并同时报告准确率和 token 消耗。
    source: 'Dr. GRPO 论文 arXiv:2503.20783'

  - id: ALN-REASON-004
    type: single
    difficulty: 2
    frequency: 2
    points: [长思维链]
    tags: [aha moment]
    question: |
      DeepSeek-R1 论文报告，R1-Zero 在纯 RL 训练中出现了「顿悟时刻」（aha moment）：模型在思维链里停下来重新审视并修正之前的解法。对这一现象，下列理解最恰当的是：
    options:
      A: '这证明 RL 凭空创造了新能力：基座模型在 RL 之前不会出现自我反思，是 RL 让它学会的'
      B: '这说明模型已经真正理解了数学：它能发现自己的错误并修正，此后基本不会再犯推理错误'
      C: '这是格式奖励直接鼓励的结果：格式奖励要求思考过程中出现反思语句，模型为拿分而学会停下来检查'
      D: '这是行为层面的观察：在规则奖励下，RL 放大并稳定了基座中已有的、有助于答对的反思行为'
    answer: D
    explanation: |
      **结论**：「顿悟时刻」是对行为的观察，不宜过度解读。RL 只奖励答对，凡是能提高正确率的行为（包括回头检查）都会被强化，于是这类行为变得更频繁、更稳定。

      - A 错：Dr. GRPO 论文（Liu 等, 2025）发现，包括 DeepSeek-V3-Base 在内的一些基座模型在 RL 之前就会出现自我反思的表达，RL 更多是放大而不是凭空创造。
      - B 错：模型仍会犯错；反思也可能流于形式，写了「Wait」却并未纠错。
      - C 错：R1-Zero 的格式奖励只要求把思考过程放在规定的标签内，并不要求写反思语句。
    source: 'DeepSeek-R1 论文 arXiv:2501.12948；Understanding R1-Zero-Like Training, arXiv:2503.20783'

  - id: ALN-REASON-005
    type: single
    difficulty: 2
    frequency: 3
    points: [R1-Zero与R1]
    question: |
      DeepSeek-R1-Zero 直接在 DeepSeek-V3-Base 上用 GRPO 做强化学习，奖励只包含两项规则：答案是否正确、思考过程是否放在规定的标签内，没有使用神经奖励模型。论文给出的主要理由是：
    options:
      A: '神经奖励模型在大规模 RL 中容易被钻空子（奖励黑客），且需要反复重训，增加资源消耗'
      B: '神经奖励模型对 LaTeX 公式和长推理文本的打分不可靠，判断不了数学答案的对错'
      C: 'GRPO 的组内归一化要求奖励是离散的 0/1，连续打分的神经奖励模型无法直接接入训练'
      D: '规则奖励能对推理过程逐步打分，比只看结果的奖励模型提供更密集的信号，训练更快'
    answer: A
    explanation: |
      **结论**：规则奖励客观、便宜、难以被讨好，适合长时间、大规模的 RL；神经奖励模型（无论结果奖励还是过程奖励）在策略跑远后会失真并被钻空子，跟上策略分布又需要不断重训。

      - B 错：奖励模型本身就是语言模型，可以处理公式；它的问题是会被钻空子、要随策略重训，而不是看不懂公式。
      - C 错：GRPO 只需要每个回答的标量奖励，组内归一化对连续奖励同样适用，奖励来自规则还是模型都可以，DeepSeekMath 中的 GRPO 就用了奖励模型。
      - D 错：方向反了。R1-Zero 的规则奖励只看最终答案和格式，是稀疏的结果奖励，并不逐步评价推理过程。
    source: 'DeepSeek-R1 论文 arXiv:2501.12948'

  - id: ALN-REASON-006
    type: short
    difficulty: 2
    frequency: 3
    points: [R1-Zero与R1, 多阶段训练]
    question: |
      DeepSeek-R1-Zero 与 DeepSeek-R1 的训练方式有什么区别？R1-Zero 暴露了哪些问题？R1 为什么要先做冷启动 SFT？
    answer: |
      1. **R1-Zero**：直接在 DeepSeek-V3-Base 上做 GRPO，不做任何 SFT；奖励只有两项规则（答案正确性、思考过程是否放在规定标签内）；训练模板只规定「先思考、再作答」的结构。AIME 2024 的 pass@1 从 15.6% 升到 71.0%，多数投票达到 86.7%；回答长度自然增长，出现反思、换方法重算等行为。
      2. **R1-Zero 的问题**：可读性差、中英文混杂，不适合直接给用户使用；从基座直接 RL，训练初期不稳定。
      3. **R1 的四个阶段**：① 冷启动 SFT：数千条格式规范、可读的长思维链；② 面向推理的 RL：规则奖励 + 语言一致性奖励；③ 拒绝采样 + SFT：用 RL 模型采样、只留答对且可读的推理数据（约 60 万条），再加约 20 万条写作、问答等通用数据，回到 V3-Base 重新 SFT；④ 全场景 RL：推理题用规则奖励，通用对话用奖励模型对齐有用性与无害性。
      4. **为什么要冷启动**：定下可读的输出格式（思考过程 + 总结）；给 RL 一个更好的起点，避开从基座直接 RL 的不稳定初期，收敛更快；把人类对「好的推理」的先验注入模型。论文报告这样训练的效果优于 R1-Zero。
      5. **最终结果**：R1 在推理基准上达到与 OpenAI-o1-1217 相当的水平，同时兼顾通用能力和可读性。
    rubric:
      - '说清 R1-Zero 的设定：基座直接 RL、两项规则奖励、无 SFT（2 分）'
      - '说出 R1-Zero 的效果与问题：可读性差、语言混杂（2 分）'
      - '按顺序说出 R1 的四个阶段及各自作用（3 分）'
      - '解释冷启动的目的（3 分）'
    explanation: |
      **常见失分点**：把 R1 说成「纯 RL 训练」（那是 R1-Zero）；不知道 R1 有两轮 SFT、两轮 RL；说冷启动是为了「教会推理能力」（主要是格式、可读性和稳定起步）；不知道最后一轮 RL 用到了奖励模型。
    source: 'DeepSeek-R1 论文 arXiv:2501.12948'

  - id: ALN-REASON-007
    type: single
    difficulty: 1
    frequency: 3
    points: [多阶段训练]
    question: |
      DeepSeek-R1 的训练流程按先后顺序排列，正确的是：
    options:
      A: '推理 RL → 冷启动 SFT → 全场景 RL → 拒绝采样 + SFT'
      B: '拒绝采样 + SFT → 冷启动 SFT → 推理 RL → 全场景 RL'
      C: '冷启动 SFT → 推理 RL → 拒绝采样 + SFT → 全场景 RL'
      D: '冷启动 SFT → 全场景 RL → 推理 RL → 拒绝采样 + SFT'
    answer: C
    explanation: |
      **结论**：两轮 SFT 与两轮 RL 交替进行。

      1. **冷启动 SFT**：数千条可读的长思维链，定格式、稳起步；
      2. **推理 RL**：GRPO + 规则奖励，并加语言一致性奖励，主要提升数学、代码、逻辑推理；
      3. **拒绝采样 + SFT**：用上一阶段的模型多次采样，只留答对、可读的推理数据，加上写作、问答等通用数据（共约 80 万条），回到 V3-Base 重新 SFT；
      4. **全场景 RL**：推理题继续用规则奖励，通用对话用奖励模型对齐有用性与无害性。

      其余选项都打乱了「先定格式 → 再强化推理 → 把 RL 成果沉淀为 SFT 数据并扩展到通用能力 → 最后全场景对齐」这一逻辑。
    source: 'DeepSeek-R1 论文 arXiv:2501.12948'

  - id: ALN-REASON-008
    type: multiple
    difficulty: 3
    frequency: 2
    points: [多阶段训练, R1-Zero与R1]
    question: |
      关于 DeepSeek-R1 多阶段训练的细节，下列说法**正确**的有：
    options:
      A: '同一批约 80 万条数据还被用来对 Qwen、Llama 系列小模型做 SFT，得到蒸馏版模型'
      B: '推理 RL 阶段加入了语言一致性奖励（思维链中目标语言词的比例），消融实验显示它同时提升了准确率和可读性'
      C: '最后的全场景 RL 只使用规则奖励，没有使用任何奖励模型'
      D: '拒绝采样得到的数据用于继续微调推理 RL 阶段的检查点，而不是回到基座模型重新训练'
      E: '拒绝采样阶段收集了约 60 万条推理数据和约 20 万条非推理数据，共约 80 万条'
    answer: [A, E]
    explanation: |
      **结论**：A、E 正确。

      - A 对：蒸馏模型只做了 SFT，没有再做 RL。
      - B 错：消融实验显示，语言一致性奖励会让准确率**略有下降**；论文认为它更符合人类偏好、可读性更好，于是明确选择牺牲一点准确率换取可读性。
      - C 错：通用数据用奖励模型对齐：有用性只评最终总结，无害性则评整个回答（含思考过程）。
      - D 错：论文用这约 80 万条数据对 DeepSeek-V3-Base 微调两个 epoch，之后再在这个模型上做全场景 RL。
      - E 对：推理数据来自 RL 模型的拒绝采样，非推理数据包括写作、事实问答、自我认知、翻译等。
    source: 'DeepSeek-R1 论文 arXiv:2501.12948'

  - id: ALN-REASON-009
    type: judge
    difficulty: 1
    frequency: 2
    points: [冷启动数据]
    question: |
      DeepSeek-R1 的冷启动阶段使用了数百万条长思维链数据，目的是在 RL 之前就把全部推理能力教给模型，RL 阶段只负责微调输出格式。
    answer: false
    explanation: |
      **错误**。冷启动数据只有**数千条**，作用是定下可读的输出格式、给 RL 一个稳定的起点，而不是教会全部推理能力。推理能力的主要提升来自之后的大规模 RL；RL 收敛后再用拒绝采样把成果沉淀为约 80 万条 SFT 数据。

      Agent 训练中同样如此：冷启动 SFT 的首要目的是把格式和基础成功率拉到 RL 能起步的区间，数据重质不重量；SFT 训得太久，输出分布过尖、熵太低，RL 阶段反而难以探索。
    source: 'DeepSeek-R1 论文 arXiv:2501.12948'

  - id: ALN-REASON-010
    type: single
    difficulty: 2
    frequency: 2
    points: [冷启动数据]
    question: |
      为一个推理模型准备冷启动 SFT 数据时，下列做法最合理的是：
    options:
      A: '尽量多收集长思维链数据，质量可以放宽：数量越多，RL 的起点越高，错误留给 RL 去纠正'
      B: '收集少量高质量、格式统一的长思维链，过滤语言混杂、难以阅读的样本，必要时人工改写'
      C: '只收集简短直接的答案，避免模型在 RL 之前养成长思考的习惯，把推理长度留给 RL 去探索'
      D: '直接拿 R1-Zero 这类纯 RL 模型的输出做冷启动：它们已经过规则奖励的检验，可以不做筛选'
    answer: B
    explanation: |
      **结论**：冷启动数据重质不重量，核心是格式统一、可读、答案正确。

      DeepSeek-R1 收集冷启动数据的方式包括：用带长思维链示例的少样本提示生成、提示模型写出带反思与验证的详细解答、收集 R1-Zero 的输出并整理成可读格式，再由人工后处理；并规定输出格式为「推理过程 + 总结」，过滤掉语言混杂、难以阅读的样本。

      - A 错：低质量数据会把错误格式、错误推理一起教给模型，RL 还要花力气纠正。
      - C 错：冷启动的目的之一正是给出长思维链的范式，让 RL 在此基础上强化。
      - D 错：规则奖励只检查最终答案和格式，不管可读性；RL 后模型的输出里有错误答案、语言混杂、冗长重复等问题，不筛选就做 SFT 会把这些问题固化。
    source: 'DeepSeek-R1 论文 arXiv:2501.12948'

  - id: ALN-REASON-011
    type: single
    difficulty: 2
    frequency: 3
    points: [推理蒸馏]
    question: |
      DeepSeek-R1 论文用 R1 生成的约 80 万条数据，直接对 Qwen、Llama 系列小模型做 SFT。关于这部分实验，下列说法正确的是：
    options:
      A: '蒸馏模型的效果明显不如在同尺寸基座上直接做大规模 RL，因为 SFT 只是模仿、学不到探索'
      B: '蒸馏只对 70B 以上的模型有效：更小的模型容量不足，学不会长思维链，提升有限'
      C: '蒸馏时同时用教师模型的 logits 做 KL 对齐，这是论文取得这些效果的关键'
      D: '蒸馏明显优于在同尺寸基座上直接做大规模 RL，小模型宜优先蒸馏强推理模型'
    answer: D
    explanation: |
      **结论**：论文做了对照实验：在 Qwen-32B-Base 上做一万多步大规模 RL 得到的 DeepSeek-R1-Zero-Qwen-32B，效果只与 QwQ-32B-Preview 相当；而用 R1 数据直接 SFT 的 DeepSeek-R1-Distill-Qwen-32B 明显更好。

      - A 错：结论正好相反。
      - B 错：论文发布了 1.5B 到 70B 的多个蒸馏模型，小模型同样大幅提升。
      - C 错：这里的蒸馏就是在教师生成的文本上做普通 SFT（序列级蒸馏），不需要教师的 logits。

      论文据此得出两点：把更强的模型蒸馏到小模型效果很好，小模型靠大规模 RL 不仅算力开销巨大，效果还可能不及蒸馏；要突破能力边界，仍需要更强的基座和更大规模的 RL。论文同时指出，蒸馏模型若再做 RL 还有提升空间，但他们只发布了 SFT 版本。
    source: 'DeepSeek-R1 论文 arXiv:2501.12948（蒸馏与 RL 对照）'

  - id: ALN-REASON-012
    type: judge
    difficulty: 2
    frequency: 2
    points: [推理蒸馏]
    question: |
      DeepSeek-R1 论文中的蒸馏模型（如 DeepSeek-R1-Distill-Qwen-32B）在 SFT 之后又进行了强化学习阶段，才达到论文报告的效果。
    answer: false
    explanation: |
      **错误**。论文明确说明，蒸馏模型只做了 SFT，没有加入 RL 阶段；作者认为加入 RL 还能进一步提升，但把这一步留给社区，主要是为了展示「蒸馏本身」的效果。

      这也是「先蒸馏、再 RL」这一常见路线的出发点：蒸馏让小模型具备基本的长思维链能力和较高的初始成功率，之后的 RL 才有足够的信号去进一步提升。
