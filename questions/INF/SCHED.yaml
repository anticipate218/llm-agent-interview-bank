domain: INF
subcategory: SCHED
questions:

  - id: INF-SCHED-001
    type: single
    difficulty: 1
    frequency: 3
    points: [静态批处理]
    question: |
      静态批处理（static batching）把若干请求凑成一批，一起 Prefill、一起 Decode，整批都结束后才接纳下一批。把它用于在线大模型服务时，最主要的问题是：
    options:
      A: '静态批要求同一批的提示词等长，长短不一的请求要分到不同批次，很难凑满一批'
      B: '静态批的张量形状在整批结束前不能改变，无法使用 Tensor Core，计算效率低'
      C: '短请求被补齐到最长的长度后，pad token 会参与注意力计算，改变短请求的生成结果'
      D: '输出长度差异大：先结束的请求要陪跑到最长的那条结束，新请求也要等整批结束才能进入'
    answer: D
    explanation: |
      **结论**：静态批的根本问题是「同进同出」，而大模型的输出长度从几个到几千个 token 不等。

      - 短请求结束后，它在 batch 里的位置空着（或继续做无用的计算），直到最长的那条结束；
      - 新到的请求要等整批结束才能进来，为了凑批还可能主动等待，TTFT 被拉长；
      - 输入长度不同还要做 padding，浪费计算。

      - A 错：提示词完全可以不同，静态批对齐长度靠 padding。
      - B 错：批处理本身就是为了用好矩阵乘单元，形状固定也不妨碍使用 Tensor Core，与是否静态无关。
      - C 错：pad 位置由注意力掩码屏蔽，不参与计算；批处理只改变调度，不改变每条序列的计算（浮点累加顺序造成的微小差异除外）。

      静态批在离线、输出长度整齐的任务中仍然可用；在线服务的标准做法是连续批处理。

  - id: INF-SCHED-002
    type: calc
    difficulty: 1
    frequency: 2
    points: [静态批处理, 连续批处理]
    question: |
      batch 上限为 4。4 个请求同时到达，输出长度分别为 10、50、100、500 token；此外还有大量输出长度为 100 token 的请求在排队。只考虑 Decode，并假设每一步的耗时与 batch 内的序列数无关。
      (1) 静态批：这一批要跑多少步？期间槽位的利用率（有效生成的 token 数 ÷（槽位数 × 步数））是多少？排队的请求最早什么时候才能开始？
      (2) 连续批：前 500 步内，空出来的槽位可以额外完成多少个排队请求？这 500 步的槽位利用率是多少？
    answer: '(1) 500 步，利用率 33%，排队请求要等到第 500 步之后才能开始；(2) 可额外完成 12 个请求，槽位始终被占满，利用率 100%'
    explanation: |
      **(1) 静态批**：整批跑到最长的那条结束，共 500 步。有效 token $10+50+100+500=660$，槽位 × 步数 $=4\times500=2000$，利用率 $660\div2000=$ **33%**。排队请求要等到第 500 步之后。

      **(2) 连续批**：三个短请求分别在第 10、50、100 步后空出位置，立刻换上排队的请求，每个 100 步：
      $$\left\lfloor\frac{500-10}{100}\right\rfloor+\left\lfloor\frac{500-50}{100}\right\rfloor+\left\lfloor\frac{500-100}{100}\right\rfloor=4+4+4=12$$
      另有两个请求在第 500 步时尚未完成。排队请求源源不断，4 个槽位每一步都在生成，利用率 **100%**，同样 500 步产出 2000 个 token，约为静态批的 3 倍。

      真实系统中每步耗时随 batch 和上下文略有增长，但结论不变：连续批的优势不在算力，而在于空位能被及时补上。

  - id: INF-SCHED-003
    type: judge
    difficulty: 2
    frequency: 2
    points: [静态批处理, 调度权衡]
    question: |
      同样的负载下，静态批处理的 P99 ITL（相邻 token 的间隔）可能比连续批处理（不开 Chunked Prefill）更低，但它的平均端到端时延与平均 TTFT 通常要差得多。
    answer: true
    explanation: |
      **正确**。静态批只在整批开始时做一次 Prefill，之后的 Decode 期间没有新请求插队，相邻 token 的间隔很平稳；连续批每当有新请求加入，就要在某一步里做它的 Prefill，长提示词会让这一步明显变慢，正在生成的用户看到一次卡顿。

      一个迭代级模拟（400 个请求、平均每秒 20 个、batch 上限 64）：
      - 静态批：P99 ITL 8.2 ms，但平均 TTFT 5483 ms、平均端到端 6.40 s；
      - 连续批：P99 ITL 59.1 ms，平均 TTFT 只有 24 ms、平均端到端 0.86 s，吞吐是静态批的 1.56 倍；
      - 连续批 + Chunked Prefill（预算 512）：P99 ITL 降到 15.9 ms，TTFT 35 ms，吞吐几乎不变。

      所以连续批是在线服务的基础，它带来的卡顿再由 Chunked Prefill 解决。

  - id: INF-SCHED-004
    type: single
    difficulty: 2
    frequency: 3
    points: [连续批处理, 迭代级调度]
    tags: [Orca]
    question: |
      Orca 提出迭代级调度时，要解决「同一步里各请求的长度不同，无法拼成规整张量」的问题。它的选择性批处理（selective batching）是怎么做的？
    options:
      A: '把各请求 padding 到本步最长的长度，用注意力掩码屏蔽 pad，再统一完成计算'
      B: '逐 token 的运算把各请求的 token 摊平成一个大矩阵一起算，只有注意力按请求分开'
      C: '按长度把请求分桶，只把长度相同的请求放进同一步，长度不同的请求分到不同的步'
      D: '注意力把各请求拼成一个大矩阵计算，线性层则因权重形状固定而按请求分开计算'
    answer: B
    explanation: |
      **结论**：能合并的合并、不能合并的拆开。

      线性层、FFN、LayerNorm 对每个 token 独立运算，与 token 属于哪个请求、处于什么位置无关。把各请求本步要处理的 token（Prefill 请求的整段提示词、Decode 请求的 1 个 token）摊平拼接成 $(\sum_i n_i)\times d$ 的矩阵，就是一个规整的大矩阵乘，计算量占了绝大部分。注意力不同：每个请求只能看自己的历史 KV，长度、掩码各不相同，Orca 按请求分别计算。

      - A 错：padding 会浪费大量计算，正是要避免的。
      - C 错：这样能组成 batch 的请求很少，失去了批处理的意义。
      - D 错：说反了，注意力才是必须区分请求的部分；线性层的权重对所有 token 相同，正好适合拼在一起算。

      如今的变长、分页注意力 kernel（如 FlashAttention 的 varlen 接口、FlashInfer）能在一个 kernel 里处理长短不一的请求，注意力也不必再逐个请求调用。
    source: 'Orca（Yu 等, OSDI 2022）'

  - id: INF-SCHED-005
    type: multiple
    difficulty: 1
    frequency: 3
    points: [连续批处理]
    question: |
      关于连续批处理（continuous batching），下列说法正确的有：
    options:
      A: 'TensorRT-LLM 把这种调度称为 in-flight batching'
      B: '连续批处理要求事先知道每个请求的输出长度'
      C: '每一步前向结束后都可以让完成的请求离开、等待的请求加入，空位随时补上'
      D: '连续批处理让单个请求每步的计算量变小，因此 TPOT 一定下降'
      E: '新请求的 Prefill 必须单独占用一步：同一步里只能全是 Prefill 或全是 Decode，不能混合'
    answer: [A, C]
    explanation: |
      **结论**：A、C 正确。

      - A 对：不同框架叫法不同，vLLM、SGLang、TGI 等都采用这种调度。
      - B 错：调度器每一步只看谁结束了（遇到 EOS 或达到上限），不需要预知长度；预知长度只在做短作业优先等优化时才需要。
      - C 对：这就是 Orca 提出的迭代级调度。Orca 论文在 GPT-3 175B 上报告，相同时延下吞吐比 FasterTransformer 高 36.9 倍。
      - D 错：每个请求每步的计算不变；连续批让 batch 更满，吞吐更高、排队更短，但 batch 越大每步越慢，TPOT 可能上升。
      - E 错：Orca 的选择性批处理把各请求的 token 摊平后一起过线性层，只有注意力按请求分开算，所以新请求可以在加入的那一步完成（或部分完成）Prefill，与其他请求的 Decode 一起计算。早期有的实现（如未开启 Chunked Prefill 的 vLLM V0）把 Prefill 步与 Decode 步分开，那是实现上的选择，不是连续批处理的要求。
    source: 'Orca（Yu 等, OSDI 2022）'

  - id: INF-SCHED-006
    type: code_output
    difficulty: 2
    frequency: 2
    points: [连续批处理, 静态批处理]
    question: |
      下面的代码用最简模型比较静态批与连续批：8 个请求同时到达，batch 上限 4，每步每条序列生成 1 个 token。两个函数都返回（全部完成所需的步数，各请求完成时刻的平均值）。输出是什么？
    code: |
      def static(outs, B):
          t, done = 0, []
          for i in range(0, len(outs), B):
              batch = outs[i:i + B]
              done += [t + n for n in batch]     # 每条在第 t+n 步生成完
              t += max(batch)                    # 下一批要等这批最长的那条结束
          return t, sum(done) / len(done)

      def continuous(outs, B):
          queue, running, t, done = list(outs), [], 0, []
          while queue or running:
              while queue and len(running) < B:  # 每一步开始前补满空位
                  running.append(queue.pop(0))
              t += 1
              running = [n - 1 for n in running]
              done += [t for n in running if n == 0]
              running = [n for n in running if n > 0]
          return t, sum(done) / len(done)

      outs = [10, 50, 100, 500, 100, 100, 100, 100]   # 各请求的输出长度
      print(static(outs, 4))
      print(continuous(outs, 4))
    answer: |
      (600, 382.5)
      (500, 166.25)
    explanation: |
      **静态批**：第一批 `[10, 50, 100, 500]` 分别在第 10、50、100、500 步完成；第二批 4 个 100 token 的请求要等到第 500 步才开始，都在第 600 步完成。平均完成时刻 $(660+4\times600)\div8=382.5$。

      **连续批**：第 10 步后空出一个位置，换上第 5 个请求，第 110 步完成；第 50 步后换上第 6 个，第 150 步完成；第 100 步后换上第 7 个，第 200 步完成；第 110 步后换上第 8 个，第 210 步完成；最长的那个在第 500 步完成。平均 $(10+50+100+500+110+150+200+210)\div8=166.25$。

      **结论**：总步数由最长的请求决定（500 对 600），但平均完成时间改善了 2.3 倍，关键是短请求不再被长请求「挡住」。真实系统中，连续批的收益还体现在新请求的 TTFT 上：不必等整批结束就能开始。

  - id: INF-SCHED-007
    type: short
    difficulty: 2
    frequency: 3
    points: [连续批处理, 迭代级调度, 静态批处理]
    question: |
      什么是连续批处理（continuous batching）？与静态批处理相比它解决了什么问题，又引入了哪些新的工程问题？主流推理框架分别如何应对？
    answer: |
      1. **定义**：Orca 提出的迭代级调度，调度粒度从「请求」变为「一次前向（迭代）」：每一步之后，完成的请求立即离开，等待的请求立即加入并在当步开始 Prefill。TensorRT-LLM 称之为 in-flight batching。
      2. **解决的问题**：静态批中先结束的请求陪跑、新请求要等整批结束、为凑批而等待、padding 浪费。连续批让 batch 始终是满的，吞吐更高、排队更短（Orca 报告相同时延下吞吐比 FasterTransformer 高 36.9 倍；一个模拟实验中吞吐 1.56 倍、平均 TTFT 从 5.5 s 降到 24 ms）。
      3. **新问题与对策**：
         - **变长拼接**：同一步里各请求长度不同。Orca 用选择性批处理（线性层摊平一起算、注意力按请求分开）；如今用变长、分页注意力 kernel。
         - **KV 显存动态变化**：请求随时进出、长度不断增长，需要按需分配（PagedAttention），以及显存不足时的抢占（swap 或重算）。
         - **Prefill 插队造成卡顿**：长提示词的 Prefill 让同一步里的 Decode 请求等待，ITL 出现尖刺。对策是 Chunked Prefill 的 token 预算，或 PD 分离。
         - **调度开销**：每一步都要做调度、组织输入，CPU 开销变得显眼。对策是调度与 GPU 计算重叠、独立进程、CUDA Graph（按若干档 batch 大小录制并补齐）。
         - **公平与优先级**：谁先进入 batch、谁先被抢占，需要准入控制与优先级策略。
    rubric:
      - '正确定义迭代级调度（3 分）'
      - '说明相对静态批解决的问题及收益（2 分）'
      - '列出变长拼接、KV 动态管理、Prefill 卡顿、调度开销中至少 3 项及对策（4 分）'
      - '提到 Orca 来源或 in-flight batching 等名称（1 分）'
    explanation: |
      **常见失分点**：把连续批理解为「请求一来就单独处理」；说不出它带来的新问题；不知道 PagedAttention、Chunked Prefill 与连续批之间的因果关系：正是连续批让 KV 需要动态管理、让 Prefill 插队成为问题。
    source: 'Orca（Yu 等, OSDI 2022）'

  - id: INF-SCHED-008
    type: single
    difficulty: 2
    frequency: 2
    points: [迭代级调度, Chunked Prefill]
    tags: [vLLM]
    question: |
      vLLM 的 V1 引擎中，调度器不再区分「Prefill 步」与「Decode 步」，而是每一步为每个请求决定「本步要计算多少个 token」：新请求是若干个提示词 token，正在生成的请求通常是 1 个。这种统一抽象的主要好处是：
    options:
      A: '分块 Prefill、前缀缓存、投机解码都可表示为「本步算几个 token」，调度逻辑统一'
      B: '统一按 token 计数后，Prefill 可以跳过提示词中重复的 token，计算量因此变小'
      C: '每个请求只记录一个「已计算 token 数」，KV Cache 因此可以连续存放、不再需要分页管理'
      D: '它让每个请求每一步都只计算 1 个 token，Prefill 也被拆成逐 token 处理，从而让 ITL 恒定'
    answer: A
    explanation: |
      **结论**：用「每个请求已经算到第几个 token、本步再算几个」统一描述所有情况。

      - Chunked Prefill：长提示词每步只分到预算内的一部分 token；
      - 前缀缓存：命中的 token 直接算作「已计算」，本步只需计算剩余部分；
      - 投机解码：本步为一个请求计算「1 + 草稿数」个 token；
      - 抢占后重算：把已计算数清零，按新请求重新排程。

      调度器只需在 token 预算内为每个请求分配一个数字，调度逻辑简单统一，Prefill 与 Decode 也能自然地混在同一步里，不再需要两套调度逻辑。

      - B 错：计算量由需要计算的 token 决定，抽象方式不改变它；跳过已命中的前缀是前缀缓存的作用。
      - C 错：「已计算 token 数」只是调度状态，KV 仍按块分页管理，二者相互独立。
      - D 错：新请求一步可能计算几百上千个 token。

  - id: INF-SCHED-009
    type: judge
    difficulty: 2
    frequency: 2
    points: [迭代级调度]
    question: |
      连续批处理中，新请求加入或旧请求离开 batch，在数学上不会改变 batch 中其他请求的生成结果；实际中可能出现的细微差异，来自不同 batch 组成下浮点运算顺序的变化。
    answer: true
    explanation: |
      **正确**。线性层对每个 token 独立计算，注意力只在请求自己的 token 之间进行，所以别的请求进进出出，在数学上不影响本请求。

      但浮点加法不满足结合律。batch 大小不同时，矩阵乘、注意力等 kernel 可能选用不同的分块方式或归约顺序，同一个请求的 logits 会有极小的差异；在贪心解码中，若两个候选 token 的概率非常接近，这点差异就可能让后续输出分叉。这也是「同样的输入、温度为 0，在线服务的输出仍可能不完全一致」的原因之一。

      需要严格可复现时（例如评测、RL 训练中对比推理与训练的概率），可以使用与 batch 组成无关的（batch-invariant）kernel 实现，代价是一定的性能损失。

  - id: INF-SCHED-010
    type: coding
    difficulty: 2
    frequency: 2
    points: [迭代级调度, Chunked Prefill, 连续批处理]
    tags: [手撕, 调度器]
    question: |
      实现连续批处理调度器的「一步」：

      ```python
      def schedule_step(running: list[dict], waiting: list[dict], max_seqs: int, budget: int) -> list[tuple]: ...
      ```

      - 每个请求是一个字典：`id`、`prompt`（提示词长度）、`done`（提示词中已计算的 token 数；`done == prompt` 表示已进入 Decode）；
      - 规则（按顺序执行）：
        1. **Decode 优先**：`running` 中每个处于 Decode 的请求分配 1 个 token（保证预算不小于 Decode 请求数）；
        2. **继续未完成的 Prefill**：按 `running` 中的顺序，为尚未完成 Prefill 的请求分配 `min(剩余提示词, 剩余预算)` 个 token；
        3. **接纳新请求**：只要还有预算、`len(running) < max_seqs` 且 `waiting` 非空，就按先来先服务从 `waiting` 头部取出请求、追加到 `running`，并为它分配 `min(剩余提示词, 剩余预算)` 个 token；
        4. 预算用完即停止分配；
      - 返回本步的计划：按分配顺序排列的 `(id, token 数)` 列表；函数可以修改 `running`、`waiting`，但不修改 `done`（由调用方在执行完这一步后更新）。
    answer: |
      def schedule_step(running, waiting, max_seqs, budget):
          plan = []
          for r in running:                                    # 1) Decode 优先：每条 1 个 token
              if r["done"] == r["prompt"]:
                  plan.append((r["id"], 1))
                  budget -= 1
          for r in running:                                    # 2) 继续尚未完成的 Prefill（分块）
              if r["done"] < r["prompt"] and budget > 0:
                  n = min(r["prompt"] - r["done"], budget)
                  plan.append((r["id"], n))
                  budget -= n
          while waiting and budget > 0 and len(running) < max_seqs:   # 3) 按 FCFS 接纳新请求
              r = waiting.pop(0)
              running.append(r)
              n = min(r["prompt"] - r["done"], budget)
              plan.append((r["id"], n))
              budget -= n
          return plan
    test: |
      def req(i, prompt, done=0):
          return {"id": i, "prompt": prompt, "done": done}

      running = [req("d1", 5, 5), req("d2", 7, 7), req("d3", 3, 3)]
      waiting = [req("A", 10), req("B", 4)]
      assert schedule_step(running, waiting, max_seqs=8, budget=8) == [("d1", 1), ("d2", 1), ("d3", 1), ("A", 5)]
      assert [r["id"] for r in running] == ["d1", "d2", "d3", "A"] and [r["id"] for r in waiting] == ["B"]
      running[3]["done"] = 5                                   # 调用方执行完这一步后更新进度
      assert schedule_step(running, waiting, 8, 8) == [("d1", 1), ("d2", 1), ("d3", 1), ("A", 5)]
      assert [r["id"] for r in waiting] == ["B"]               # 预算用完，B 进不来
      running[3]["done"] = 10                                  # A 进入 Decode
      assert schedule_step(running, waiting, 8, 8) == [("d1", 1), ("d2", 1), ("d3", 1), ("A", 1), ("B", 4)]
      assert waiting == []
      # 达到 max_seqs：有预算也不接纳
      running, waiting = [req("d1", 5, 5), req("d2", 7, 7)], [req("C", 3)]
      assert schedule_step(running, waiting, max_seqs=2, budget=100) == [("d1", 1), ("d2", 1)]
      assert len(waiting) == 1
      # 多个新请求按 FCFS 依次接纳，最后一个只分到部分预算
      running, waiting = [], [req("x", 3), req("y", 3), req("z", 3)]
      assert schedule_step(running, waiting, 8, 7) == [("x", 3), ("y", 3), ("z", 1)]
      assert waiting == [] and len(running) == 3
      assert schedule_step([], [], 4, 16) == []
    explanation: |
      **思路**：这就是带 token 预算的连续批调度（Sarathi-Serve 的 stall-free batching、vLLM V1 调度器的核心）：
      1. 先保证正在生成的请求每步都能前进，ITL 不被打断；
      2. 再把剩余预算分给未完成的 Prefill，长提示词跨多步完成（测试中 A 用了两步）；
      3. 最后才接纳新请求，同时受预算与 `max_seqs` 限制。

      每一步的总 token 数不超过预算，单步耗时因此有上界。

      **真实调度器还要考虑**：为每个请求分配 KV 块，块不够时抢占；前缀缓存命中的 token 直接计入 `done`；投机解码时 Decode 请求本步计算多个 token；优先级与公平。

      **易错点**：先接纳新请求再处理 Decode，会让 Decode 被饿住；预算判断写成 `budget >= 0`，会接纳分不到任何 token 的请求；忘记更新 `budget` 导致超出预算。
    source: 'Sarathi-Serve arXiv:2403.02310'

  - id: INF-SCHED-011
    type: calc
    difficulty: 2
    frequency: 3
    points: [Chunked Prefill]
    question: |
      某服务的单步耗时模型为：$t=5\ \text{ms}+0.02\ \text{ms}\times(\text{本步 Prefill 的 token 数})+0.05\ \text{ms}\times(\text{本步 Decode 的序列数})$。当前有 60 条序列在 Decode，此时到来一个 6000 token 的提示词。
      (1) 不使用 Chunked Prefill，把它一步做完：这一步耗时多少？与平时相比，正在生成的 60 个用户看到的 ITL 变成多少？
      (2) 使用 Chunked Prefill，每步 token 预算 512（先放 Decode，每条占 1 个 token），这个提示词需要几步完成 Prefill？这几步中最大的 ITL 是多少？
      (3) 这个长提示词自身的 Prefill 从开始到完成，在两种方式下各需多久？
    answer: '(1) 128 ms，平时每步 8 ms，ITL 突增到 128 ms；(2) 14 步，最大 ITL 约 17 ms；(3) 不分块约 128 ms，分块约 232 ms'
    explanation: |
      **(1)** 平时每步 $5+0.05\times60=8$ ms。一步做完 6000 token：$5+0.02\times6000+3=128$ ms，60 个用户都看到一次 **128 ms** 的停顿，是平时的 16 倍。

      **(2)** 每步预算中 60 个给 Decode，剩 452 个给 Prefill：$\lceil6000\div452\rceil=14$ 步（前 13 步各 452 个，最后一步 124 个）。前 13 步每步 $5+0.02\times452+3\approx17.0$ ms，最后一步约 10.5 ms，最大 ITL 约 **17 ms**。

      **(3)** 不分块：**128 ms**；分块：$13\times17.04+10.48\approx$ **232 ms**。

      **结论**：Chunked Prefill 把 Decode 的卡顿从 128 ms 压到约 17 ms，代价是长提示词的 TTFT 增加了约 100 ms。实际增加得还会更多一些：后面的每一块都要读取前面各块的 KV 做注意力，这个模型没有计入。预算越小 ITL 越平稳，但长提示词的 TTFT 越长、Prefill 的效率越低，需要在 SLO 内权衡。

  - id: INF-SCHED-012
    type: single
    difficulty: 3
    frequency: 2
    points: [Chunked Prefill, 调度权衡]
    question: |
      在 H100（BF16 拐点约 295 FLOP/B）上服务 8B 模型。若把 Chunked Prefill 的每步 token 预算设得很小（例如 64），最主要的副作用是：
    options:
      A: '长提示词被切开后，后面的块看不到前面块的 token，注意力只在块内计算，KV Cache 会算错'
      B: '每步都夹带 Prefill 块并多读一遍权重，正在 Decode 的请求的 ITL 会明显变长'
      C: '每步 token 太少，算术强度远低于拐点，算力利用率低，长提示词的 TTFT 明显变长'
      D: '分块后各块是分步写入的，块哈希与完整提示词不一致，前缀缓存会因此失效'
    answer: C
    explanation: |
      **结论**：预算太小时，每一步都要完整读一遍权重，却只处理几十个 token：线性层的算术强度约等于本步的 token 数，远低于拐点，Prefill 变成带宽瓶颈，TTFT 变长，总吞吐下降。

      以 8B 模型为例：每步读权重约 4.8 ms，64 个 token 的计算只需约 1 ms，每步仍约 5 ms，Prefill 速度只有约 $64\div5\ \text{ms}\approx1.3$ 万 token/s；预算为 2048 时每步受算力限制，约 33 ms 处理 2048 个 token，速度约 6 万 token/s。一个 8K 提示词，前者要 128 步、约 0.64 s，后者只要 4 步、约 0.13 s。

      所以预算至少要让每步的 token 数（Decode 加 Prefill）明显超过拐点，常见设置在几百到几千之间，再在 TPOT / ITL 的 SLO 约束下通过压测确定。

      - A 错：后面的块会读取前面各块已写入的 KV，分块 Prefill 的结果与一次做完相同。
      - B 错：每步本来就要读一遍权重，夹带少量 Prefill token 并不会多读；预算越小，每步越短，ITL 越平稳。
      - D 错：块哈希只取决于 token 内容和前缀，与分几步写入无关；命中的部分照样跳过。

  - id: INF-SCHED-013
    type: short
    difficulty: 2
    frequency: 3
    points: [Chunked Prefill]
    tags: [Sarathi-Serve]
    question: |
      Chunked Prefill 解决什么问题？具体如何调度？它的代价是什么？每步的 token 预算（如 vLLM 的 `max_num_batched_tokens`）应如何设置？
    answer: |
      1. **问题**：连续批处理中，长提示词的 Prefill 若在一步内完成，这一步会很长，同一步里所有 Decode 请求都要等待，表现为 ITL 尖刺（生成卡顿）；而纯 Decode 的步又受带宽限制，算力闲置。
      2. **做法**（Sarathi-Serve，Agrawal 等, 2024）：每步设一个 token 预算；先放入所有 Decode 请求（每条 1 个 token），剩余预算分给 Prefill；长提示词被切成多块、分多步完成，后面的块读取前面各块已写入的 KV。这种「不让 Decode 停顿」的批处理被称为 stall-free batching。
      3. **收益**：单步耗时有上界，P99 ITL 大幅降低；受算力限制的 Prefill 块与受带宽限制的 Decode 混在一步里，两种资源同时被利用，吞吐不降甚至提高。
      4. **代价**：
         - 长提示词的 TTFT 增加：要分多步完成，每一块还要重读前面各块的 KV；
         - 块太小时线性层的算术强度低于拐点，Prefill 效率下降；
         - 注意力 kernel 要支持「query 数少于 key 数」的分块 Prefill，并按右下角对齐因果掩码；调度更复杂。
      5. **预算设置**：在 TPOT / ITL 的 SLO 约束下取尽量大的值，并保证每步 token 数明显超过 Roofline 拐点；常见几百到几千；通过压测观察 P99 ITL、TTFT 与吞吐确定；时延敏感的服务取小，吞吐优先的离线任务取大。vLLM 的 V1 引擎默认开启 Chunked Prefill。
    rubric:
      - '说清长 Prefill 阻塞 Decode 造成 ITL 尖刺（2 分）'
      - '说清 token 预算、Decode 优先、长提示词分块的调度方式（3 分）'
      - '说清 TTFT 增加、小块效率低等代价（3 分）'
      - '给出以 SLO 为约束、结合压测与拐点设置预算的方法（2 分）'
    explanation: |
      **常见失分点**：以为 Chunked Prefill 能降低 TTFT（它通常让长提示词的 TTFT 略增）；以为分块会让注意力「看不到」前面的块；只说「预算越小越好」；不知道它和 PD 分离是解决同一问题的两种思路（一个在同一实例内混合调度，一个分到不同实例）。
    source: 'Sarathi-Serve arXiv:2403.02310'

  - id: INF-SCHED-014
    type: single
    difficulty: 1
    frequency: 2
    points: [抢占]
    question: |
      KV 块池用完时，调度器需要抢占部分请求。关于两种抢占方式 swap（把 KV 换出到 CPU 内存）与 recompute（丢弃 KV，恢复时重新 Prefill），下列说法正确的是：
    options:
      A: 'recompute 要把已生成的 token 再逐个 Decode 一遍，步数与原来相同，代价远高于 swap'
      B: 'recompute 把「提示词 + 已生成部分」一起做一次 Prefill，代价往往比直觉上低'
      C: 'swap 经 PCIe 往返时 KV 会被转成低精度，改变模型的输出分布，recompute 不会'
      D: '两种方式都要先等被抢占请求的 KV 换出或丢弃完毕，GPU 上的其他请求才能继续运行'
    answer: B
    explanation: |
      **结论**：recompute 不重新生成 token，只重建 KV。

      被抢占的请求已经生成的 token 作为文本保留下来；恢复时把「提示词 + 已生成部分」一起做一次 Prefill，就得到了全部 KV，然后继续生成。一次 Prefill 并行处理所有 token，比当初逐个 Decode 快得多；若前缀缓存中的块还没被淘汰，还能直接命中。vLLM 的 V1 引擎默认使用重算。swap 适合 KV 很长、重算代价高的情况，但要占用 PCIe 带宽和 CPU 内存。

      - A 错：混淆了「重建 KV」与「重新生成」。
      - C 错：swap 原样拷贝 KV，是无损的；两种方式都只恢复 KV，不改变采样过程（重算可能带来浮点舍入层面的细微差异，与分布无关）。
      - D 错：抢占的目的就是让其他请求继续运行；换出可以异步进行，重算则推迟到该请求重新被调度时。

      无论哪种方式，频繁抢占都说明显存配置过紧，应限制并发、限制最大长度或启用 FP8 KV。

  - id: INF-SCHED-015
    type: judge
    difficulty: 1
    frequency: 2
    points: [抢占]
    question: |
      在先来先服务（FCFS）的调度下，显存不足需要抢占时，应优先抢占最早到达的请求，因为它占用的 KV 通常最多，释放后腾出的空间最大。
    answer: false
    explanation: |
      **错误**。FCFS 下应优先抢占**最晚到达**的请求（优先级调度时则先抢占优先级最低的）：
      - 最早到达的请求排在最前面，抢占它违背了先来先服务的承诺；
      - 它往往已经生成了很多 token、离完成最近，抢占它浪费的进度最多；
      - 负载持续较高时，最早的请求可能被反复抢占、永远完成不了，形成活锁。

      vLLM 的做法是从运行队列的末尾（最晚加入者）开始抢占，被抢占的请求放回等待队列的**最前面**，恢复时仍按原来的先后顺序。腾出空间多少不是首要考虑；需要更多空间时就多抢占几个。

  - id: INF-SCHED-016
    type: calc
    difficulty: 3
    frequency: 1
    points: [抢占]
    source: 'vLLM 论文（Kwon 等, 2023, arXiv:2309.06180，swap 与 recompute 两种抢占恢复方式）；Llama 3 config.json（Hugging Face meta-llama/Meta-Llama-3-8B：32 层、8 个 KV 头、头维度 128，约 8.03B 参数）'
    question: |
      Llama-3-8B 部署在 H100 上。某请求的提示词 1000 token，生成到第 3000 个 token 时因显存不足被抢占。
      (1) 采用 recompute：恢复时要 Prefill 多少个 token？约需多久？（有效算力 600 TFLOPS，FLOPs 按 $2NT+2Ln_qd_hT^2$ 计，$N=8.03\times10^9$，$L=n_q=32$，$d_h=128$）
      (2) 这 3000 个 token 当初按 TPOT 20 ms 逐个生成，用了多久？recompute 需要重新生成它们吗？
      (3) 采用 swap：这个请求的 KV 有多大（每 token 128 KiB）？经有效带宽 25 GB/s 的 PCIe 换出、换入各需多久？
      (4) 两种方式各自消耗什么资源？
    answer: '(1) 4000 token，约 114 ms；(2) 约 60 s；不需要重新生成，重算只重建 KV，耗时约为当初生成时间的 0.2%；(3) 约 0.52 GB，单向约 21 ms；(4) recompute 消耗 GPU 算力并拖慢同一步的其他请求，swap 消耗 PCIe 带宽与 CPU 内存、可与计算重叠'
    explanation: |
      **(1)** 要 Prefill $1000+3000=4000$ 个 token。FLOPs：$2\times8.03\times10^9\times4000\approx6.42\times10^{13}$，注意力 $2\times32\times32\times128\times4000^2\approx4.2\times10^{12}$，合计约 $6.84\times10^{13}$，$\div600$ TFLOPS $\approx$ **114 ms**。

      **(2)** $3000\times20\ \text{ms}=$ **60 s**。重算只是用一次 Prefill 重建 KV，已生成的 token 保留不变，耗时约为当初的 $0.114\div60\approx0.2\%$。若提示词部分的块还在前缀缓存里，重算量更少。

      **(3)** $4000\times128\ \text{KiB}\approx0.52$ GB，单向约 **21 ms**，换出、换入共约 42 ms。

      **(4)**：
      - recompute：不需要额外存储，但要占用约 114 ms 的整卡算力，恢复的那一步会拖慢同 batch 的其他请求（配合 Chunked Prefill 可以分摊）；
      - swap：需要 CPU 内存（通常用锁页内存）与 PCIe 带宽，传输可以与计算重叠，但多张卡共享 PCIe 时会互相争抢，调度也更复杂。

      **结论**：两种方式的代价都远小于「从头再生成」，这也是抢占在实践中可行的原因；真正要避免的是频繁、反复的抢占。

  - id: INF-SCHED-017
    type: code_debug
    difficulty: 2
    frequency: 2
    points: [抢占, 优先级与公平]
    question: |
      下面的函数在 KV 块不足时按「后到先抢」的原则抢占请求（重算模式：直接丢弃被抢占请求的 KV），直到空闲块数满足需求。`running` 按到达顺序排列，`waiting` 是 `deque`。要求被抢占的请求放回等待队列后排在所有等待请求之前，并保持它们原来的到达顺序，FCFS 才不会被破坏。测试发现等待队列的顺序不对，请找出 bug 并修正。
    code: |
      from collections import deque

      def preempt_until_fit(running, waiting, free_blocks, need):
          preempted = []
          while free_blocks < need and running:
              victim = running.pop()                 # 最晚到达的请求先让路
              free_blocks += victim["blocks"]        # 重算模式：直接丢弃它的 KV
              victim["blocks"] = 0
              waiting.append(victim)                 # 放回等待队列
              preempted.append(victim["id"])
          return free_blocks, preempted
    fixed_code: |
      from collections import deque

      def preempt_until_fit(running, waiting, free_blocks, need):
          preempted = []
          while free_blocks < need and running:
              victim = running.pop()                 # 最晚到达的请求先让路
              free_blocks += victim["blocks"]        # 重算模式：直接丢弃它的 KV
              victim["blocks"] = 0
              waiting.appendleft(victim)             # 放回等待队列的最前面
              preempted.append(victim["id"])
          return free_blocks, preempted
    test: |
      def mk(i, b):
          return {"id": i, "blocks": b}

      running = [mk("r1", 2), mk("r2", 2), mk("r3", 2)]       # 按到达顺序
      waiting = deque([mk("r4", 0), mk("r5", 0)])
      free, out = preempt_until_fit(running, waiting, free_blocks=0, need=3)
      assert (free, out) == (4, ["r3", "r2"])
      assert [r["id"] for r in running] == ["r1"]
      assert [r["id"] for r in waiting] == ["r2", "r3", "r4", "r5"], [r["id"] for r in waiting]
      free, out = preempt_until_fit(running, waiting, free_blocks=5, need=3)   # 已经够用：不抢占
      assert (free, out) == (5, []) and len(running) == 1
    answer: |
      **问题**：第 9 行 `waiting.append(victim)` 把被抢占的请求放到了等待队列的**末尾**。它们比所有等待中的请求到得都早，却要排在后来者后面，FCFS 被破坏；负载持续较高时，被抢占的请求可能长期得不到恢复。测试中得到的顺序是 `r4, r5, r3, r2`。

      **修正**：改为 `waiting.appendleft(victim)`。由于先弹出的是最晚到达的 `r3`、后弹出的是 `r2`，依次放到队头后正好得到 `r2, r3, r4, r5`，既排在所有等待请求之前，又保持了原来的到达顺序。
    explanation: |
      抢占要同时满足两条：**选谁让路**（FCFS 下选最晚到达的，优先级调度下选优先级最低的）和**让路之后排在哪**（回到等待队列的最前面，恢复时优先）。vLLM 的调度器正是这样处理被抢占的请求。

      两条都做对，系统在高负载下才不会出现「早到的请求反复被抢占」或「被抢占的请求被新请求插队」的饥饿问题。重算模式下被抢占的请求重新进入时，还可能命中前缀缓存里尚未被淘汰的块，恢复代价更低。

  - id: INF-SCHED-018
    type: scenario
    difficulty: 3
    frequency: 2
    points: [抢占, 调度权衡]
    tags: [推理模型]
    question: |
      团队上线了一个推理模型（8B，GQA，每 token 的 KV 为 128 KiB），单张 H100 上 KV 可用约 54 GiB。它的回答常带有 8K～16K token 的思维链，而部署时沿用了聊天服务的配置：vLLM、`max_num_seqs=256`、上下文上限 32K、BF16 KV。上线后发现：抢占次数很高，吞吐比预期低约 40%，部分请求的端到端时延出现长尾（个别超过 10 分钟）。请分析原因并给出优化方案。
    answer: |
      **1. 原因分析**：
      - **KV 随生成增长**：请求刚进来时只有几百 token 的提示词，调度器按当前占用接纳了大量请求；它们边生成边变长，KV 池很快耗尽，只能抢占。
      - **容量估算**：KV 池约 $54\ \text{GiB}\div128\ \text{KiB}\approx44$ 万个 token。若平均每条请求最终约 1.2 万 token，同时只容纳得下约 36 条；`max_num_seqs=256` 远超可持续的并发。
      - **抖动（thrashing）**：被抢占的请求要重算上万 token 的 Prefill，消耗大量算力；恢复后继续变长，可能再次被抢占，形成恶性循环，吞吐下降、时延长尾。
      - **长尾**：最晚到达的请求反复被抢占，排队与重算叠加，个别请求耗时超过 10 分钟。

      **2. 优化方案**：
      - **按容量控制并发**：根据预期输出长度设置 `max_num_seqs`（或在准入时为每个请求预留增长空间），让并发与 KV 容量匹配，宁可排队也不要频繁抢占；
      - **扩大容量**：FP8 KV（容量翻倍）、更大显存的 GPU 或张量并行；
      - **限制长度**：设置合理的思考预算 / `max_tokens`，避免极端长尾的请求；
      - **调整抢占策略**：长上下文重算代价高时考虑 swap 或卸载到 CPU；避免反复抢占同一请求（如为被抢占过的请求提高优先级）；
      - **隔离部署**：推理模型与普通聊天分开部署，各自按负载画像配置；规模大时考虑 PD 分离；
      - **容量规划**：用 Little 定律估算并发（到达速率 × 端到端时延），按峰值配置实例数。

      **3. 监控与验证**：抢占次数、重算的 token 数、KV 使用率、运行中的请求数、端到端时延的 P99；用线上轨迹回放，对比调整前后的吞吐与长尾。
    rubric:
      - '指出 KV 随生成增长与按当前占用准入之间的矛盾（3 分）'
      - '解释重算导致的抖动与长尾机制（2 分）'
      - '用 KV 容量估算出可持续的并发量级（2 分）'
      - '给出限制并发、FP8 KV、长度限制、抢占策略或隔离部署中的至少 3 项（2 分）'
      - '给出监控与验证方法（1 分）'
    explanation: |
      **常见失分点**：只说「显存不够就加卡」；没有意识到聊天服务的并发上限对长输出负载完全不适用；不知道重算会造成抖动与长尾；不做容量估算；以为把 `gpu_memory_utilization` 调到更高就能根本解决。

  - id: INF-SCHED-019
    type: single
    difficulty: 2
    frequency: 2
    points: [优先级与公平]
    tags: [VTC, 多租户]
    question: |
      多租户推理服务中，VTC（Virtual Token Counter，Sheng 等, 2024）为每个租户维护一个「已获得服务量」的计数器（按输入、输出 token 加权累加），每次优先服务「有排队请求的租户中计数最小的」。当一个长期空闲的租户重新开始发请求时，VTC 会把它的计数器提升到「当前有排队请求的租户中的最小计数」（若它自己的计数更大则保持不变）。这样做的目的是：
    options:
      A: '惩罚空闲租户：把它的计数抬到与活跃租户相同，让它回来后先排在其他租户后面'
      B: '让回来的租户以当前最小计数立即获得最高优先级，独占 GPU 直到计数追上其他租户'
      C: '避免计数器无限增长溢出：提升后可以把各租户的计数整体减去最小值，只保留相对差值'
      D: '防止空闲租户「攒下」额度：否则它回来后会凭很低的旧计数长期优先、挤占其他租户'
    answer: D
    explanation: |
      **结论**：计数提升（counter lift）让公平只在「同时有需求」的租户之间计算，空闲期不能变成以后的特权。

      VTC 的公平以「加权的服务 token 数」衡量（输出 token 的权重通常高于输入 token，因为它更贵），并且是工作保持的（work-conserving）：只要有请求在排队，GPU 就不会因为公平而闲着。若空闲租户保留很低的旧计数，它回来后会长期排在最前面，其他租户在这段时间里几乎得不到服务。提升到当前最小值后，它与其他活跃租户公平竞争，也不会因为曾经空闲而吃亏。

      - A 错：提升到的是当前的**最小**计数，它与计数最少的活跃租户处于同一起跑线，并没有被惩罚。
      - B 错：提升后它只与计数最少的活跃租户并列，按计数轮流获得服务，不会独占；长期独占恰恰是不做提升时会发生的情况。
      - C 错：提升是为了公平，与计数器的数值范围、存储开销无关。

      这一思路与网络调度中的公平排队（fair queuing）一脉相承。
    source: 'Fairness in Serving Large Language Models（Sheng 等, OSDI 2024）'

  - id: INF-SCHED-020
    type: calc
    difficulty: 2
    frequency: 1
    points: [优先级与公平]
    tags: [VTC]
    question: |
      按 VTC 的思路做多租户公平调度（简化版）：
      - 服务完一个请求，其租户的计数器增加「$1\times$ 输入 token 数 $+\ 2\times$ 输出 token 数」；
      - 每次选择「有排队请求的租户中计数最小的」，计数相同时按租户名的字母序；
      - 租户从「没有排队请求」变为「有排队请求」时，计数器更新为 max（自身计数，当前有排队请求的租户中的最小计数）。

      当前 A、B 有排队请求，计数分别为 12000、9000；C 之前空闲、计数为 2000，此刻提交了新请求。
      (1) C 的计数器变为多少？
      (2) 下一个被服务的是哪个租户？若这个请求输入 500、输出 300 token，服务完后该租户的计数是多少？
      (3) 再下一个被服务的是谁？若不做 (1) 中的计数提升，C 回来后大约能优先获得多少「加权 token」的服务，才会轮到 A、B？
    answer: '(1) 9000；(2) B（与 C 计数相同，按字母序），服务后 B 的计数为 10100；(3) C；若不提升，C 要从 2000 追到 9000，约 7000 加权 token 的服务都会优先给 C'
    explanation: |
      **(1)** 当前有排队请求的租户中最小计数为 $\min(12000,9000)=9000$，C 的计数更新为 $\max(2000,9000)=$ **9000**。

      **(2)** B 与 C 都是 9000，按字母序选 **B**。B 增加 $500\times1+300\times2=1100$，变为 **10100**。

      **(3)** 此时 A 12000、B 10100、C 9000，下一个是 **C**。若不提升，C 以 2000 回来，在计数超过 9000 之前都排在 A、B 前面，即大约 **7000** 加权 token（例如约 2300 个输出 token）的服务都优先给 C，A、B 在这段时间里几乎被饿住。

      **说明**：真实的 VTC 在请求被处理的过程中逐步累加计数，并在把请求加入 batch 时做选择；输入、输出的权重可以按成本设定。它保证在一段时间内，各个持续有需求的租户获得的加权服务量之差有界。
    source: 'Fairness in Serving Large Language Models（Sheng 等, OSDI 2024）'

  - id: INF-SCHED-021
    type: multiple
    difficulty: 2
    frequency: 2
    points: [优先级与公平]
    question: |
      关于推理服务中的优先级与公平调度，下列说法正确的有：
    options:
      A: '短作业优先（SJF）能降低平均时延，但要预测输出长度，长请求还可能被饿死'
      B: 'FastServe 借鉴多级反馈队列：已生成的 token 越多，优先级越低，以此近似短作业优先'
      C: '先来先服务（FCFS）按到达顺序处理，各租户获得的服务量与其请求数成正比，因此天然公平'
      D: '在线与离线混部时可给在线请求更高优先级，显存不足时优先抢占低优先级请求'
      E: '有了优先级调度，高优先级请求总能及时得到服务，过载时也不必再做限流或准入控制'
    answer: [A, B, D]
    explanation: |
      **结论**：A、B、D 正确。

      - A 对：输出长度可以用小模型或历史统计预测，预测不准时效果会打折；常配合「等待越久、优先级越高」的老化（aging）机制，防止长请求一直排不上。
      - B 对：在不知道输出长度时，这样能近似实现短作业优先。FastServe（Wu 等, 2023）用跳级多级反馈队列（skip-join MLFQ），按提示词长度决定初始队列，生成的 token 越多优先级越低，并在 token 粒度上抢占。
      - C 错：FCFS 只对「请求」公平，不对「租户」公平；各请求的长度差异很大，服务量也不与请求数成正比。某个租户一次涌入大量请求，就能占满队列，其他租户只能排在后面。多租户公平需要 VTC 这类按租户记账的调度。
      - D 对：离线任务对时延不敏感，用来填满空闲算力；在线流量上来时让离线请求让路。
      - E 错：优先级只决定「谁先」，不改变总的处理能力。到达速率超过容量时，低优先级请求会无限排队，高优先级请求也会越来越慢，仍需要限流、准入控制与降级。
  - id: INF-SCHED-022
    type: single
    difficulty: 1
    frequency: 3
    points: [PD分离]
    question: |
      下列哪一项**最准确**地概括了 PD 分离（Prefill 与 Decode 分离部署）的动机？
    options:
      A: '消除 Prefill 对 Decode 的干扰，并让两阶段按各自的 SLO 独立选择并行配置与卡数'
      B: '分离后两阶段各用专门优化的 kernel，Prefill 与 Decode 的总计算量减少，因此能降低成本'
      C: 'Decode 只需读取权重、用不到 KV Cache，分离后可以省掉 Decode 实例上的 KV 显存'
      D: '分离的主要目的是减少网络传输：Prefill 实例部署在离用户更近的位置，降低首包时延'
    answer: A
    explanation: |
      **结论**：PD 分离解决的是「干扰」与「配置耦合」，不是计算量。

      混部的三个问题：
      1. **互相干扰**：Prefill 插队让 Decode 卡顿，Decode 的大 batch 又拖慢 Prefill；Chunked Prefill 能缓解，不能根除；
      2. **配置耦合**：Prefill 想用更多算力和张量并行来压低 TTFT，Decode 想用大显存和大 batch 来提高吞吐，混部只能二选一；
      3. **不能分别扩容**：TTFT 与 TPOT 哪个超标，都只能整体加卡。

      分离后，Prefill 实例算完 KV 和首个 token，再通过 RDMA 或 NVLink 把 KV 传给 Decode 实例继续生成（DistServe、Splitwise、Mooncake 等）。

      - B 错：kernel 优化不改变计算量；分离后总计算量不变，还多了 KV 传输。
      - C 错：Decode 必须有 KV，正是靠传输得到的。
      - D 错：分离反而增加了一次跨实例的 KV 传输，与用户网络距离无关。
    source: 'DistServe arXiv:2401.09670'

  - id: INF-SCHED-023
    type: calc
    difficulty: 2
    frequency: 2
    points: [PD分离]
    source: 'Splitwise（Patel 等, 2024, arXiv:2311.18677，逐层异步传输 KV）；DistServe arXiv:2401.09670；Llama 3 config.json（Hugging Face meta-llama/Meta-Llama-3-70B：80 层、64 个 Query 头、8 个 KV 头、词表 128256，约 70.55B 参数）'
    tags: [KV 传输, RDMA]
    question: |
      PD 分离部署 Llama-3-70B（80 层、64 个 Query 头、8 个 KV 头、头维度 128，约 70.6B 参数，BF16 KV）。Prefill 实例用 8 张 H100（每张 BF16 989 TFLOPS，按 50% MFU 计），通过有效带宽 50 GB/s 的 RDMA 把 KV 传给 Decode 实例。对一个 8K（8192）token 的提示词：
      (1) 它的 KV 有多大？整体传输需要多久？
      (2) Prefill 需要多久？（FLOPs 按 $2NT+2Ln_qd_hT^2$ 计）传输时间约为 Prefill 时间的百分之几？
      (3) 若按层传输（每算完一层就开始传这一层的 KV），每层的传输量与传输时间是多少？对 TTFT 的额外影响约为多少？
    answer: '(1) 2.5 GiB（约 2.68 GB），约 54 ms；(2) 约 0.31 s，传输约为 Prefill 的 17%；(3) 每层约 33.6 MB、约 0.67 ms，小于每层约 3.9 ms 的计算时间，可被流水线掩盖，额外影响约为最后一层的传输时间，不到 1 ms'
    explanation: |
      **(1)** 每 token：$2\times80\times8\times128\times2=327680$ 字节 = 320 KiB；8192 个 token 共 2.5 GiB ≈ 2.68 GB；$2.68\div50\approx$ **54 ms**。

      **(2)** FLOPs：$2\times70.6\times10^9\times8192\approx1.157\times10^{15}$，注意力 $2\times80\times64\times128\times8192^2\approx8.8\times10^{13}$，合计约 $1.24\times10^{15}$；有效算力 $8\times989\times0.5\approx3.96$ PFLOPS；Prefill 约 **0.31 s**。传输约占 **17%**。

      **(3)** 每层 $2.68\ \text{GB}\div80\approx33.6$ MB，传输约 **0.67 ms**；每层计算约 $0.31\div80\approx3.9$ ms。传输完全藏在后续层的计算之后，只有最后一层的传输露在外面，TTFT 多出约 **0.7 ms**。

      **结论**：按层流水是 PD 分离的标准做法（Splitwise 等工作都采用逐层传输）。但要注意：
      - 传输带宽要与 Prefill 速度匹配，短提示词、小模型时计算很快，传输占比反而上升；
      - 多个请求同时传输会争抢网卡，需要拓扑感知的放置（DistServe 优先把 P、D 放在同一台有 NVLink 的机器上）；
      - 作为对照，8B 模型 4K 提示词的 KV 为 512 MiB，同样带宽下约 11 ms。

  - id: INF-SCHED-024
    type: calc
    difficulty: 2
    frequency: 2
    points: [PD分离, SLO与goodput]
    question: |
      某业务峰值 20 req/s，平均输入 2000 token、输出 250 token。采用 PD 分离：压测得到单个 Prefill 实例在满足 TTFT SLO 时可处理 40000 个输入 token/s；单个 Decode 实例在满足 TPOT SLO（40 ms）时最大 batch 为 128，即约 3200 个输出 token/s。按 70% 的目标利用率规划，实例数向上取整。
      (1) 需要几个 Prefill 实例、几个 Decode 实例？P:D 是多少？
      (2) 用 Little 定律核对：同时处于 Decode 阶段的请求平均有多少个？
      (3) 若业务变化为平均输出 500 token（输入不变），实例数如何调整？这体现了 PD 分离的什么优势？
    answer: '(1) Prefill 2 个、Decode 3 个，P:D = 2:3；(2) 约 200 个（相当于约 1.56 个满载的 Decode 实例）；(3) Prefill 仍为 2 个，Decode 增至 5 个；两阶段可以按各自的负载独立扩缩容'
    explanation: |
      **(1)** Prefill 需求 $20\times2000=40000$ token/s，$40000\div(40000\times0.7)\approx1.43$，取 **2**；Decode 需求 $20\times250=5000$ token/s，$5000\div(3200\times0.7)\approx2.23$，取 **3**；P:D = **2:3**。

      **(2)** 每个请求的 Decode 阶段持续约 $250\times40\ \text{ms}=10$ s，同时在 Decode 的请求数 $\approx20\times10=$ **200**，$200\div128\approx1.56$ 个满载实例，与 (1) 中 $5000\div3200\approx1.56$ 一致。

      **(3)** Decode 需求翻倍为 10000 token/s，$10000\div2240\approx4.46$，取 **5**；Prefill 不变。混部时只能整体扩容，PD 分离可以只加 Decode 实例。

      **注意**：P:D 的最优比例随输入 / 输出长度分布与 SLO 变化，生产中需要持续观测并动态调整（例如弹性地改变实例角色）；KV 传输带宽也要随之规划。
    source: 'DistServe arXiv:2401.09670'

  - id: INF-SCHED-025
    type: judge
    difficulty: 1
    frequency: 2
    points: [PD分离]
    question: |
      PD 分离能减少一个请求的总计算量，这是它能提高 goodput 的主要原因。
    answer: false
    explanation: |
      **错误**。PD 分离不减少计算：Prefill、Decode 的计算一点不少，还多了一次 KV 传输。

      它提高 goodput 靠的是：
      - **消除干扰**：Decode 不再被长 Prefill 打断，TPOT / ITL 更稳；Prefill 也不用和大 batch 的 Decode 挤在同一步里，TTFT 更低；
      - **各自最优的配置**：两阶段分别选择并行方式、batch 大小，甚至不同型号的 GPU（Splitwise 提出 Decode 阶段可以用更便宜的卡）；
      - **独立扩缩容**：按 TTFT、TPOT 各自的 SLO 配置实例数。

      DistServe 以「每张卡的 goodput」为优化目标，论文报告在 90% 以上请求满足时延约束的前提下，相比当时的先进系统可多服务 7.4 倍的请求，或支持严格 12.6 倍的 SLO。代价是 KV 传输带宽、P:D 配比的调整与系统复杂度。
    source: 'DistServe arXiv:2401.09670'

  - id: INF-SCHED-026
    type: short
    difficulty: 3
    frequency: 2
    points: [PD分离, 调度权衡]
    question: |
      PD 分离有哪些收益和代价？在什么情况下不值得做？工程上如何降低它的代价？
    answer: |
      1. **收益**：
         - 消除 Prefill 与 Decode 的相互干扰，ITL 平稳、TTFT 可控；
         - 两阶段各选最优配置：Prefill 用张量并行压低 TTFT，Decode 用大 batch（MoE 模型还可用大规模专家并行）提高吞吐；硬件也可以不同；
         - 按各自 SLO 独立扩缩容，提高单卡 goodput。
      2. **代价**：
         - KV 传输需要高带宽网络（如 70B 模型 8K 提示词约 2.5 GiB），TTFT 略增；
         - P:D 配比要随流量的输入 / 输出长度变化而调整，配比不当会导致一侧过载、一侧闲置；
         - 调度、故障处理、监控都更复杂，两侧都要管理 KV 显存；前缀缓存要在 Prefill 侧（或全局 KV 池）生效。
      3. **不值得做的情况**：规模小（几张卡）、提示词短、SLO 宽松、流量小；这时单实例混部 + Chunked Prefill 往往已经够用，分离反而增加复杂度。
      4. **降低代价**：
         - 按层流水传输 KV，与计算重叠；
         - 拓扑感知放置，尽量让 P、D 位于 NVLink 或高速 RDMA 互联的范围内；
         - 传输 FP8 等压缩后的 KV；
         - 动态调整 P:D，或让实例在两种角色间弹性切换；
         - 引入全局 KV 池（如 Mooncake），复用前缀、减少重复 Prefill；
         - 使用成熟的框架与传输库（vLLM、SGLang 的 PD 分离支持，NVIDIA Dynamo、llm-d 等编排层）。
    rubric:
      - '说清消除干扰、配置解耦、独立扩缩容等收益（3 分）'
      - '说清 KV 传输、P:D 配比、系统复杂度等代价（3 分）'
      - '指出小规模、短提示词等不值得做的情况（2 分）'
      - '给出逐层传输、拓扑感知、动态配比等降低代价的手段（2 分）'
    explanation: |
      **常见失分点**：说 PD 分离「减少了计算量」；忽视 KV 传输的带宽需求；不知道 Chunked Prefill 是混部下的替代方案；不提 P:D 配比需要随负载调整；把 PD 分离说成「任何规模都应该做」。
    source: 'DistServe arXiv:2401.09670；Splitwise arXiv:2311.18677；Mooncake arXiv:2407.00079'

  - id: INF-SCHED-027
    type: single
    difficulty: 1
    frequency: 2
    points: [负载均衡与路由]
    question: |
      多副本推理服务前的负载均衡器若按「请求数轮询」（round-robin）分发请求，最主要的问题是：
    options:
      A: '轮询在副本超时重试时会把同一个请求再发给下一个副本，造成重复处理、浪费算力'
      B: '轮询需要事先知道每个请求的输出长度才能均分，而输出长度无法预知，实际无法实现'
      C: '请求开销可相差几个数量级，请求数代表不了负载；轮询还会打散会话、降低前缀命中率'
      D: '轮询让每个副本都缓存各个会话的 KV，前缀缓存不断膨胀，最终导致 GPU 显存泄漏'
    answer: C
    explanation: |
      **结论**：「请求数」不是 LLM 推理的合适负载单位，而且推理服务有缓存状态，路由要考虑亲和。

      一个 10 万 token 输入的 Agent 请求与一个 50 token 的闲聊请求，开销可能相差上千倍。轮询让每个副本分到的请求数相同，但实际负载可能严重不均。更好的负载信号：
      - 排队中待 Prefill 的 token 数、正在运行的请求数；
      - KV 使用率；
      - 估计的剩余工作量（输入长度 + 预期输出长度）。

      同时，前缀缓存只在单个实例内有效：同一会话的请求被轮询打散后，历史部分很难命中。实践中常把「负载感知」与「会话 / 前缀亲和」结合使用。

      - A、B、D 错：轮询本身不会重复处理请求（超时重试是另一项策略），也不需要预知输出长度；前缀缓存有容量上限、按 LRU 淘汰，不会因轮询而「泄漏」显存。

  - id: INF-SCHED-028
    type: multiple
    difficulty: 2
    frequency: 2
    points: [负载均衡与路由]
    tags: [前缀亲和, 一致性哈希]
    question: |
      关于多实例推理服务的路由，下列说法正确的有：
    options:
      A: 'SGLang 的缓存感知路由器优先发往前缀匹配最长的实例，负载差距过大时改发负载最低的实例'
      B: '前缀亲和让热门前缀在多个实例上各存一份，重复缓存降低了显存利用率，得不偿失'
      C: '启用亲和路由后，会话按哈希均匀分散到各实例，负载自然均衡，路由时不必再看实例负载'
      D: '按会话 ID 或前缀哈希做一致性哈希，让同一会话落到同一实例，提高前缀缓存命中率'
      E: '带负载上限的一致性哈希在目标实例过载时把请求溢出到下一个候选实例'
    answer: [A, D, E]
    explanation: |
      **结论**：A、D、E 正确。

      - A 对：路由器为每个实例维护一棵近似的前缀树，根据历史路由记录推断各实例缓存了哪些前缀；实例间负载差距超过阈值时改为发往负载最低的实例，在负载均衡的前提下追求命中。
      - B 错：说反了，亲和路由让同一前缀集中在一个实例上，减少了重复缓存，缓存「各有所长」，减少了重复 Prefill，通常显著提升吞吐与 TTFT；它的风险是负载不均，而不是显存利用率。
      - C 错：会话数均匀不等于负载均匀。会话的活跃程度、上下文长度差异很大，纯亲和会出现热点实例。
      - D 对：一致性哈希还能在实例增减时只迁移少量会话。
      - E 对：带负载上限的一致性哈希（consistent hashing with bounded loads）让每个实例的负载不超过平均值的若干倍（如 1.25 倍），超出则顺延到下一个实例，命中率略降，但避免了热点。

      延伸：Llumnix（OSDI 2024）支持在实例间实时迁移正在运行的请求（连同 KV），用于再平衡负载、整理碎片和保障高优先级请求。
  - id: INF-SCHED-029
    type: scenario
    difficulty: 3
    frequency: 2
    points: [负载均衡与路由, 调度权衡]
    question: |
      某 Agent 平台的推理服务从 2 个副本扩到 8 个副本后，吞吐只提升到原来的约 2.5 倍，P50 TTFT 反而变差；前缀缓存命中率从 80% 降到 30%。团队把路由改为「按会话 ID 哈希」后命中率回升，但出现了几个实例长期过载（P99 TTFT 很高）而其他实例很闲的情况。请分析原因，并设计一个兼顾命中率与负载均衡的路由方案。
    answer: |
      **1. 扩容后命中率下降**：原来按请求随机或轮询分发。会话的历史只缓存在上一轮所在的实例上，副本从 2 个变成 8 个，下一轮落到同一实例的概率从约 1/2 降到约 1/8；每个请求要重新 Prefill 的 token 大增，算力被重复计算吃掉，吞吐不能线性增长，TTFT 变差。

      **2. 会话哈希后出现热点**：
      - 会话的活跃度、上下文长度高度长尾，少数「重」会话集中在某几个实例上；
      - 大租户的会话多，哈希无法感知负载；
      - 静态映射无法随负载变化调整。

      **3. 路由方案**：
      - **分层看待前缀**：所有会话共享的系统提示词、工具定义在每个实例上预热并常驻，不依赖亲和；只有会话私有的历史才需要亲和。
      - **缓存感知 + 负载约束**：路由器维护各实例的（近似）前缀索引，计算候选实例的命中长度；在负载低于阈值的实例中选命中最长的，全部过载时选负载最低的（与 SGLang 路由器的思路一致）。
      - **带负载上限的一致性哈希**：作为简化方案，设负载上限系数（如平均的 1.25 倍），超出则顺延到下一个实例。
      - **负载信号**：待 Prefill 的 token 数、运行中的请求数、KV 使用率，而不是请求数。
      - **路由走了也能复用**：被路由到其他实例时，从原实例或全局 KV 池（如 Mooncake、LMCache）拉取 KV，而不是重算；必要时在实例间迁移会话。
      - **租户配额**：限制单个租户可占用的实例比例，避免大租户形成热点。

      **4. 验证指标**：各实例的命中率、负载偏斜（最大 / 平均）、各实例的 P99 TTFT、整体 SLO 达标率与吞吐；先用线上轨迹离线模拟多种策略再上线。
    rubric:
      - '解释随机 / 轮询路由在副本增多后命中率下降、算力被重复 Prefill 吃掉（2 分）'
      - '解释会话哈希产生热点的原因（2 分）'
      - '给出兼顾命中与负载的路由设计，如缓存感知 + 负载阈值、带上限的一致性哈希（3 分）'
      - '提出共享前缀常驻、跨实例拉取 KV 或迁移等补充手段（2 分）'
      - '给出验证指标（1 分）'
    explanation: |
      **常见失分点**：只说「加机器」；只在「轮询」与「哈希」之间二选一；不区分共享前缀与会话私有前缀；负载信号仍用请求数；忽略跨实例复用 KV 的可能。

  - id: INF-SCHED-030
    type: single
    difficulty: 2
    frequency: 2
    points: [SLO与goodput]
    tags: [准入控制]
    question: |
      流量突发时，推理服务的请求到达速率超过了处理能力。与「来者不拒、全部排队」相比，在网关处做准入控制（排队过长时直接拒绝或降级一部分请求），对 goodput 的影响通常是：
    options:
      A: '降低 goodput：被拒绝的请求直接计为失败，而排队的请求最终完成也算成功'
      B: '提高 goodput：被接纳的请求能在 SLO 内完成，否则排队会让几乎每个请求都超时'
      C: '基本没有影响：GPU 的处理能力不变，单位时间完成的请求数也不变，只是换了一批请求'
      D: '只影响 TPOT：准入控制限制了 batch 大小，每步更快，但 TTFT 由排队决定、不受影响'
    answer: B
    explanation: |
      **结论**：过载时「少接一些、接的都做好」比「全接下来、都做不好」更好。

      到达速率持续超过处理能力时，队列会不断变长，排队时间越来越长，最终几乎所有请求的 TTFT 都超标，goodput 趋近于零，用户还会因超时而重试，进一步加重负载。准入控制把进入系统的速率压在处理能力附近：被接纳的请求能满足 SLO；被拒绝的请求可以快速失败、重试到其他集群，或降级到更小的模型、更短的输出。

      Mooncake 的调度就包含基于负载预测的提前拒绝：在 Prefill 之前就判断这个请求能否在 SLO 内完成，避免先做了 Prefill 再因 Decode 资源不足而被丢弃，白白浪费算力。

      - A 错：goodput 只统计满足 SLO 的请求，排队太久、最终才完成的请求同样不计入；被拒绝的请求本来也大概率无法达标，拒绝它们保护了其他请求。
      - C 错：处理能力不变，但排队时间与达标率完全取决于准入策略。
      - D 错：过载首先体现为排队，直接推高的是 TTFT；准入控制正是通过缩短排队来保护 TTFT。
    source: 'Mooncake arXiv:2407.00079'

  - id: INF-SCHED-031
    type: fill
    difficulty: 1
    frequency: 1
    points: [SLO与goodput, 调度权衡]
    tags: [Little 定律]
    question: |
      由 Little 定律，系统中平均同时存在的请求数 = 平均到达速率 × 平均停留时间。某服务平均每秒到达 12 个请求、平均端到端时延 8 s，则系统中平均同时有 ____ 个请求；若每个请求平均占用 2500 token 的 KV（Llama-3-8B，每 token 128 KiB），这些请求共需约 ____ GiB 的 KV 显存（保留 1 位小数）。
    answer: ['96', '29.3']
    explanation: |
      - 并发数：$12\times8=$ **96**；
      - KV：$96\times2500\times128\ \text{KiB}=30{,}720{,}000$ KiB $\approx$ **29.3** GiB。

      Little 定律把「速率」与「并发」联系起来，是容量规划与调度分析的常用工具：
      - 端到端时延变长（输出变长、TPOT 变慢、排队变长），在速率不变时并发数随之增加，KV 需求同比上升；
      - 这会形成正反馈：显存吃紧 → 抢占与重算 → 更慢 → 并发更多 → 更吃紧。推理模型的长输出负载尤其容易进入这种状态；
      - 反过来，已知 KV 容量能支撑的并发上限，就能估算出在给定时延下能承受的最大到达速率。

  - id: INF-SCHED-032
    type: multiple
    difficulty: 2
    frequency: 2
    points: [SLO与goodput]
    question: |
      关于推理服务的 SLO 与 goodput，下列说法正确的有：
    options:
      A: '同一个系统，SLO 越严格，在给定达标率目标下能承受的最大请求速率（goodput）越低'
      B: '同时满足 TTFT 与 TPOT 的 SLO 时，batch 上限、分块预算等参数要在两者之间折中'
      C: '聊天场景的 TPOT 可参照阅读速度设定，出字快于阅读后再压低 TPOT 收益有限'
      D: 'GPU 利用率达到 100% 时，系统已没有空闲算力可挖，goodput 也就达到了最大值'
      E: 'SLO 通常写成分位数形式，如 P99 TTFT ≤ 1 s 且 P99 TPOT ≤ 50 ms'
    answer: [A, B, C, E]
    explanation: |
      **结论**：A、B、C、E 正确。

      - A 对：要求越严，能达标的负载越低。
      - B 对：例如增大 Chunked Prefill 预算能降低长提示词的 TTFT，却会抬高 ITL；增大 batch 上限能提高吞吐，却会抬高 TPOT。最优点要在 SLO 约束下通过压测确定，找到 goodput 最高的配置。
      - C 对：人的阅读速度约为每秒几个 token（英文约每分钟 200～300 词），TPOT 降到 100 ms 左右，出字就已快于多数人的阅读，再压低 TPOT 的体验收益很小，不如把余量让给更大的 batch。推理模型的隐藏思维链、Agent 的中间步骤则不同，用户等的是整段完成，TPOT 仍要尽量低。同理，不同业务的 SLO 应按各自的需求设定，离线任务可以用宽松的 SLO 去填充空闲资源。
      - D 错：GPU 利用率高可能意味着 batch 很大、TPOT 已经超标，或大量算力花在重算上；goodput 关心的是满足 SLO 的请求，而不是 GPU 有多忙。
      - E 对：SLO 用分位数而不是平均值，因为均值会掩盖尾部，用户感受到的卡顿和超时都在尾部。
  - id: INF-SCHED-033
    type: short
    difficulty: 3
    frequency: 2
    points: [调度权衡]
    question: |
      推理服务的调度器需要在多个目标之间权衡。请列举主要的权衡关系，说明每一对矛盾的来源与常用的调节手段。
    answer: |
      1. **吞吐 vs 单请求时延**：batch 越大，权重读取摊得越薄，吞吐越高，但每步越慢、TPOT 越高。调节：`max_num_seqs` 等 batch 上限，在 TPOT SLO 内取最大值。
      2. **TTFT vs TPOT / ITL**：尽快做新请求的 Prefill 能压低 TTFT，但会打断正在生成的请求；Decode 优先则相反。调节：Chunked Prefill 的 token 预算、Prefill 与 Decode 的优先级，规模大时用 PD 分离彻底解耦。
      3. **缓存命中 vs 负载均衡**：亲和路由与「前缀匹配长的请求优先」提高命中率，却可能造成热点或让未命中的请求等待更久。调节：带负载上限的亲和、缓存感知路由加负载阈值、调度时给等待时间加权。
      4. **公平 vs 效率**：短作业优先、缓存感知排序提高平均效率，但可能饿死长请求或冷门租户。调节：老化机制、VTC 等按租户记账的公平调度、配额。
      5. **显存利用率 vs 抢占风险**：接纳更多请求能提高利用率，但请求在生成中不断变长，可能引发频繁抢占与重算。调节：为增长预留余量、按预期长度准入、FP8 KV、选择 swap 或 recompute。
      6. **在线 vs 离线**：离线任务填满空闲算力能提高利用率与成本效率，但可能挤占在线流量。调节：优先级、可抢占的离线请求、分时段调度。
      7. **方法**：先写清各类流量的 SLO，再以 goodput 为目标，通过压测扫描参数；上线后持续监控 SLO 达标率、抢占次数、命中率与负载偏斜，动态调整。
    rubric:
      - '说明吞吐与时延、TTFT 与 TPOT 两组权衡及调节手段（4 分）'
      - '说明缓存命中与负载均衡、公平与效率两组权衡（3 分）'
      - '说明显存利用率与抢占或在线与离线的权衡（1 分）'
      - '给出以 SLO / goodput 为目标的调参方法（2 分）'
    explanation: |
      **常见失分点**：只想到「吞吐 vs 时延」一组；只列名词不讲机制；说不出每组矛盾对应的具体参数或机制；没有把权衡落到 SLO 与 goodput 上，给不出可操作的调参方法。

  - id: INF-SCHED-034
    type: design
    difficulty: 3
    frequency: 2
    points: [调度权衡, 优先级与公平, SLO与goodput]
    question: |
      一个推理集群需要同时承载三类流量：① 在线聊天（P99 TTFT ≤ 1 s、P99 TPOT ≤ 50 ms）；② Agent 工作流（上下文长、输出短，关注端到端时延，前缀复用度高）；③ 离线批处理（如数据标注，量大，只要求当天完成）。请设计调度与资源编排方案：请求分级与准入、实例内调度、跨实例路由、抢占与 KV 管理、部署形态与扩缩容、监控指标。
    answer: |
      **1. 分级与准入**：
      - 三个优先级：在线聊天 > Agent > 离线；每类有自己的 SLO 与租户配额；
      - 网关按租户令牌桶限流；根据排队长度与预测时延做准入，过载时对聊天降级（更小的模型、更短的 `max_tokens`），对离线请求暂停投放；
      - 离线任务放在外部任务队列中，由调度器在有空闲时「拉取」，而不是一次性涌入。

      **2. 实例内调度**：
      - 优先级调度，同级内 FCFS；Decode 优先 + Chunked Prefill，预算按聊天的 TPOT SLO 设定；
      - 离线请求只用剩余的 batch 名额与预算，显存紧张时最先被抢占（重算）；
      - Agent 请求按前缀匹配长度适当提前（缓存感知），并对等待时间加权，防止饥饿；
      - 同类内按租户做 VTC 式公平。

      **3. 跨实例路由**：聊天按负载（待 Prefill 的 token 数、KV 使用率）分发；Agent 按会话做带负载上限的亲和路由，共享的系统提示词在各实例常驻；离线流量路由到弹性资源池。

      **4. 抢占与 KV 管理**：抢占顺序为离线 → Agent → 聊天；FP8 KV 扩大容量；为聊天的突发保留余量；Agent 会话在等待工具返回期间，KV 降级到 CPU 内存或分布式 KV 池而不是直接丢弃。

      **5. 部署形态与扩缩容**：
      - 在线专用池（聊天 + Agent）加弹性共享池（白天给在线溢出，夜间跑离线）；
      - Agent 的长提示词规模大时，评估 PD 分离；
      - 按排队长度、KV 使用率、SLO 达标率扩缩容，叠加日内周期的预测式扩容；离线任务作为负载的「缓冲区」。

      **6. 监控**：分类别的 SLO 达标率与 goodput；TTFT / TPOT / ITL 分布；排队时间；抢占次数（按类别）；前缀命中率；实例负载偏斜；离线任务的完成进度与预计完成时间。

      **7. 风险**：优先级反转与离线任务饿死（设置最低配额、截止时间临近时提升优先级）；缓存抖动；大租户挤占；配置复杂度。
    rubric:
      - '给出分级、配额、准入与降级策略（2 分）'
      - '给出实例内的优先级、Chunked Prefill、公平与离线填充策略（2 分）'
      - '给出按流量类型区分的路由与抢占 / KV 管理策略（2 分）'
      - '给出部署形态与扩缩容方案（2 分）'
      - '给出分类别的监控指标与主要风险（2 分）'
    explanation: |
      **常见失分点**：三类流量混在一起用同一个 FCFS 队列；离线任务没有可抢占的设计，挤占在线资源；只做实例内调度而忽略路由与扩缩容；没有分类别的 SLO 监控；忽视离线任务的饥饿与截止时间。

  - id: INF-SCHED-035
    type: single
    difficulty: 2
    frequency: 2
    points: [调度权衡, Chunked Prefill]
    question: |
      连续批处理的调度器在「有新请求等待 Prefill」时有两种基本倾向：Prefill 优先（新请求一到就尽快做完它的 Prefill）与 Decode 优先（先保证正在生成的请求每步都前进，只用剩余能力做 Prefill）。下列说法正确的是：
    options:
      A: 'Prefill 优先压低 TTFT、吞吐高，但会让生成卡顿；Decode 优先保护 ITL，但 TTFT 变长'
      B: 'Prefill 优先能尽快扩大 batch，摊薄权重读取，因此 TTFT 与 TPOT 会同时下降'
      C: 'Decode 优先让每步只含 Decode、batch 保持稳定，因此吞吐更高、新请求的 TTFT 也更短'
      D: '在连续批处理下两者等价：每步会同时包含 Prefill 与 Decode，区别只在实现复杂度'
    answer: A
    explanation: |
      **结论**：两种倾向各保护一个指标，Chunked Prefill 是折中。

      Sarathi-Serve 把调度器分为两类：Prefill 优先（如早期 vLLM 的默认调度、Orca）吞吐高，但会造成生成卡顿（generation stall）；Decode 优先（如静态批时代的做法）ITL 平稳，但新请求要等很久、吞吐也低。它提出的 stall-free batching 每步先放入所有 Decode，再用剩余预算处理 Prefill 块，在两者之间取得平衡。

      - B 错：Prefill 插队会让同一步里的 Decode 变慢，TPOT 与 ITL 变差。
      - C 错：Decode 优先会推迟新请求的 Prefill，TTFT 变长，batch 也补得慢。
      - D 错：两者对 TTFT、ITL 与吞吐的影响截然不同；连续批处理只决定「每步可以换人」，每步放多少 Prefill 正是这两种倾向的分歧所在。
    source: 'Sarathi-Serve arXiv:2403.02310'

  - id: INF-SCHED-036
    type: judge
    difficulty: 2
    frequency: 2
    points: [调度权衡, Chunked Prefill]
    tags: [vLLM]
    question: |
      把 vLLM 的 `max_num_batched_tokens`（每步 token 预算）调大，总能同时降低 TTFT 和 P99 ITL。
    answer: false
    explanation: |
      **错误**。预算调大后：
      - 长提示词能在更少的步数内完成 Prefill，Prefill 的效率也更高，TTFT 往往下降；
      - 但每一步可以塞进更多 Prefill token，单步耗时上限随之提高，同一步里的 Decode 请求等待更久，P99 ITL 上升。

      预算是在 TTFT 与 ITL 之间权衡的旋钮：交互式服务在 ITL / TPOT 的 SLO 内选尽量大的值，吞吐优先的离线任务可以设得很大。具体数值要用接近真实负载的压测来确定，而不是追求「越大越好」或「越小越好」。
