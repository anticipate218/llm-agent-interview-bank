domain: INF
subcategory: QUANT
questions:

  - id: INF-QUANT-001
    type: single
    difficulty: 1
    frequency: 3
    points: [量化基本原理, INT4权重量化]
    question: |
      关于大模型推理中「只量化权重」（如 W4A16：权重 4 bit、激活 16 bit）与「权重和激活都量化」（如 W8A8）的收益，下列说法正确的是：
    options:
      A: 'W4A16 的矩阵乘直接在 INT4 Tensor Core 上完成，所以 Prefill 也能提速约 4 倍'
      B: 'W4A16 主要靠少读权重加速 Decode；W8A8 还能用低精度 Tensor Core 加速 Prefill'
      C: '两种方案的收益都只在显存：腾出的空间能放更多 KV、提高并发，单个请求各阶段的速度不变'
      D: 'W8A8 计算前要把权重和激活都反量化回 BF16，因此只省显存与带宽，Prefill 不会提速'
    answer: B
    explanation: |
      **结论**：量化在推理中有两条收益路径——少读字节（省带宽）和低精度计算（省算力），W4A16 只走第一条，W8A8 两条都能走。

      - Decode 每步要把全部权重从显存读一遍，处于带宽瓶颈。W4A16 让权重字节数降到 BF16 的约 1/4，每步读得少，TPOT 随之下降；同时腾出显存装更多 KV。
      - Prefill 和大 batch 处于算力瓶颈，读权重的时间已不是主要矛盾。W4A16 在计算前把权重反量化回 BF16，用的仍是 BF16 Tensor Core，几乎不提速；W8A8（INT8 或 FP8）让矩阵乘本身在低精度 Tensor Core 上完成，吞吐约为 BF16 的 2 倍。

      逐项看：
      - A 错：W4A16 的计算精度是 16 bit，并没有用 INT4 做矩阵乘。
      - C 错：在带宽瓶颈的 Decode 中，少读字节就直接提速，单个请求的 TPOT 也会下降。
      - D 错：W8A8 的意义正是让整数 / FP8 矩阵乘直接计算，累加后再乘回 scale。

  - id: INF-QUANT-002
    type: calc
    difficulty: 2
    frequency: 3
    points: [对称与非对称量化, 量化基本原理]
    question: |
      对向量 $x=[0.8,\ -2.54,\ 0.033,\ 1.5]$ 做逐张量（整个向量共用一个 scale）的对称量化：$s=\max|x|/(2^{b-1}-1)$，$q=\mathrm{clamp}(\mathrm{round}(x/s),\ -2^{b-1},\ 2^{b-1}-1)$，反量化 $\hat x=s\cdot q$。

      (1) INT8：求 $s$、量化后的整数 $q$、反量化值与最大绝对误差；
      (2) INT4：同样计算；
      (3) 哪个元素的相对误差最大？说明原因。
    answer: '(1) s=0.02，q=[40, −127, 2, 75]，反量化 [0.8, −2.54, 0.04, 1.5]，最大绝对误差 0.007；(2) s≈0.3629，q=[2, −7, 0, 4]，反量化≈[0.726, −2.54, 0, 1.451]，最大绝对误差≈0.074；(3) 0.033：INT8 时相对误差约 21%，INT4 时被量化成 0，相对误差 100%'
    explanation: |
      **(1) INT8**：$\max|x|=2.54$，$s=2.54/127=0.02$。

      $x/s=[40,\ -127,\ 1.65,\ 75]$，取整得 $q=[40,\ -127,\ 2,\ 75]$，反量化 $\hat x=[0.8,\ -2.54,\ 0.04,\ 1.5]$。只有第 3 个元素有误差：$|0.04-0.033|=0.007$，不超过 $s/2=0.01$。

      **(2) INT4**：$s=2.54/7\approx0.3629$。

      $x/s\approx[2.20,\ -7,\ 0.09,\ 4.13]$，取整得 $q=[2,\ -7,\ 0,\ 4]$，反量化 $\hat x\approx[0.726,\ -2.54,\ 0,\ 1.451]$。绝对误差约 $[0.074,\ 0,\ 0.033,\ 0.049]$，最大约 0.074，同样不超过 $s/2\approx0.181$。

      **(3)** 绝对误差的上界由 $s/2$ 决定，与元素自身大小无关，所以**小元素的相对误差最大**：0.033 在 INT8 下相对误差约 21%，在 INT4 下直接变成 0。scale 由最大的元素 2.54 决定，它越大，小元素能用到的刻度越少。这正是「离群值撑大 scale」的问题，也是要用更细粒度（逐通道、分组）或先处理离群值的原因。

  - id: INF-QUANT-003
    type: judge
    difficulty: 2
    frequency: 2
    points: [量化基本原理]
    question: |
      对称量化时，截断阈值 $c$ 影响的是截断误差，阈值以内元素的舍入误差由量化位宽决定、与 $c$ 无关；所以取 $c=\max|x|$、让截断误差为 0，就能得到最小的均方量化误差。
    answer: false
    explanation: |
      **错误**。舍入误差同样取决于 $c$。量化误差由两部分组成：

      1. **舍入误差**：范围内的元素被取整，误差约在 $\pm s/2$ 之内，均方误差约为 $s^2/12$，而步长 $s=c/q_{\max}$ 与截断阈值 $c$ 成正比：位宽只决定有多少个量化级别（$q_{\max}$），$c$ 决定这些级别铺开的宽度；
      2. **截断误差**：$|x|>c$ 的元素被截到 $\pm c$。

      取 $c=\max|x|$ 让截断误差为 0，但当分布是「大部分集中、少数很大」的重尾分布时，$s$ 被少数大值撑大，绝大多数元素的舍入误差都变大。适当减小 $c$，牺牲少数离群值的精度，往往能让总的均方误差更小。所以实践中常用分位数、搜索最小 MSE 的截断比例等方法确定范围；AWQ 的官方实现（llm-awq）在等价缩放之后，也会为每组权重搜索让层输出误差最小的截断范围。代价是被截断的离群值误差变大，如果离群值本身很重要（例如激活的离群通道），就不能简单截断，而要用 SmoothQuant、混合精度等办法。
    source: 'AWQ 官方实现 auto_clip https://github.com/mit-han-lab/llm-awq/blob/main/awq/quantize/auto_clip.py'

  - id: INF-QUANT-004
    type: fill
    difficulty: 1
    frequency: 2
    points: [量化粒度, INT4权重量化]
    question: |
      INT4 权重分组量化：每 128 个权重为一组，每组存一个 FP16 的 scale，平均每个权重占 ____ bit；如果每组再存一个 FP16 的零点（非对称量化），平均每个权重占 ____ bit。
    answer: ['4.125', '4.25']
    explanation: |
      - 只存 scale：$4+16/128=4.125$ bit；
      - scale 与零点都用 FP16：$4+(16+16)/128=4.25$ bit。

      分组越小，元数据占比越高：组大小 32 时只存 FP16 scale 就是 $4+16/32=4.5$ bit。实际实现中零点常常也用 4 bit 整数打包存储，开销更小。

      按 4.125 bit 估算，7B 模型的线性层权重约 $7\times10^9\times4.125/8\approx3.6$ GB，而 BF16 约 14 GB。粗算「INT4 = BF16 的 1/4」会略微低估占用，若词嵌入、lm_head 等保持高精度，实际占用还要再多一些。

  - id: INF-QUANT-005
    type: single
    difficulty: 2
    frequency: 2
    points: [对称与非对称量化]
    question: |
      下列数据中，最适合用非对称量化（带零点 zero-point）而不是对称量化的是：
    options:
      A: '均值接近 0、正负大致对称的线性层权重'
      B: '符号随机、正负幅度相近的梯度'
      C: '经过 ReLU 之后全部非负、且大量集中在 0 附近的激活'
      D: '只有一个离群通道、其余通道正负大致对称的激活'
    answer: C
    explanation: |
      **结论**：非对称量化用零点让整数网格对齐数据的实际范围 $[\min,\max]$，适合明显偏向一侧的分布。

      ReLU 之后的激活全部非负。若用对称量化，范围是 $[-\max,\max]$，负半轴的一半刻度永远用不到，相当于白白损失 1 bit；非对称量化把 $[0,\max]$ 映射到全部 $2^b$ 个整数上，分辨率提高约一倍。

      - A、B 错：数据本身关于 0 对称，对称量化不浪费刻度，还省去零点的存储和计算，权重通常就用对称量化。
      - D 错：离群通道的问题在于 scale 被少数大值撑大，加零点只是平移范围，解决不了；需要更细的粒度、混合精度或 SmoothQuant 一类的平滑方法。

  - id: INF-QUANT-006
    type: judge
    difficulty: 1
    frequency: 2
    points: [对称与非对称量化]
    question: |
      按常规做法（零点取整数，且量化范围包含 0），非对称量化总能精确表示实数 0：0 量化后再反量化，结果仍严格等于 0。这一性质对 padding 位置、ReLU 之后的大量 0 值很重要。
    answer: true
    explanation: |
      **正确**。非对称量化为 $q=\mathrm{clamp}(\mathrm{round}(x/s)+z)$，反量化为 $\hat x=s\,(q-z)$，零点 $z=\mathrm{round}(-\min/s)$ 是整数。代入 $x=0$：$q=\mathrm{round}(0)+z=z$，$\hat x=s(z-z)=0$，没有任何误差。

      为保证这一点，实现时会把范围扩展到包含 0（取 $\min(x_{\min},0)$ 与 $\max(x_{\max},0)$），否则 $z$ 可能落在整数范围之外被截断。0 能精确表示很重要：padding 位置、ReLU 之后的大量 0、卷积的零填充，如果都带上一个小偏差，会在后续层中系统性地累积。对称量化（$z=0$）天然满足这一点。

  - id: INF-QUANT-007
    type: single
    difficulty: 3
    frequency: 1
    points: [对称与非对称量化, 量化粒度]
    question: |
      W8A8 的整数矩阵乘中，激活按 token 做非对称量化 $x_k=s_x\,(q^x_k-z_x)$，权重按输出通道做对称量化 $w_k=s_w\,q^w_k$。于是一个输出元素为

      $$
      y=\sum_k x_kw_k=s_xs_w\Big(\sum_k q^x_kq^w_k-z_x\sum_k q^w_k\Big)
      $$

      关于其中的修正项 $z_x\sum_k q^w_k$，下列说法正确的是：
    options:
      A: '$\sum_k q^w_k$ 只与权重有关，可离线为每个输出通道算好，运行时开销很小'
      B: '这一项含有激活的零点，迫使 kernel 先把激活反量化成浮点，再做浮点矩阵乘'
      C: '$\sum_k q^w_k$ 要随每个 token 的输入重新计算，相当于再做一次同样规模的整数矩阵乘'
      D: '$z_x$ 是整数，且对称量化下 $\sum_k q^w_k$ 的期望为 0，这一项可以直接省略'
    answer: A
    explanation: |
      **结论**：激活带零点只带来一个可以预计算的小修正，主体仍是纯整数矩阵乘 $\sum_k q^x_kq^w_k$（INT8 相乘、INT32 累加）。

      $\sum_k q^w_k$ 是权重矩阵每一行（每个输出通道）的整数和，与输入无关，量化完成后就能离线算好；运行时只需算 $z_x\times(\text{预计算的行和})$ 再减掉，每个输出只多一次乘加，代价相对矩阵乘可以忽略。

      - B 错：修正项本身是整数运算，不需要反量化。
      - C 错：$\sum_k q^w_k$ 与输入无关，不需要随 token 重算；整个修正项只是一个向量与标量的乘积，不是新的矩阵乘。
      - D 错：$z_x$ 一般不为 0；「期望为 0」不代表某个输出通道的行和就是 0，每个通道的 $\sum_k q^w_k$ 是确定的整数，忽略这一项会引入系统性偏差。

      **延伸**：若权重也用非对称量化，还会多出 $z_w\sum_k q^x_k$（每个 token 的激活行和，必须在运行时计算）和常数项 $Kz_xz_w$。这正是 W8A8 kernel 通常让权重保持对称量化的原因之一；权重分布大致关于 0 对称，用对称量化也几乎不损失精度。

  - id: INF-QUANT-008
    type: single
    difficulty: 2
    frequency: 3
    points: [量化粒度]
    question: |
      W8A8 推理中，权重通常按输出通道（per-channel）量化、激活按 token（per-token）量化，而很少按输入通道量化激活——尽管激活的离群值恰恰集中在少数输入通道上。主要原因是：
    options:
      A: '按输入通道量化激活时，离群通道会污染同一 token 的其他通道，精度反而比按 token 量化更差'
      B: '按 token 量化的 scale 可以离线校准后固定下来，运行时不必计算，开销最小'
      C: '权重的离群值集中在输出通道上，权重必须按输出通道量化，激活只好配合按 token 量化'
      D: '沿输入通道（累加维度）变化的 scale 无法提到求和号外，整数矩阵乘就做不成了'
    answer: D
    explanation: |
      **结论**：scale 放在哪个维度，取决于它能否从矩阵乘的求和号里提出来。

      $Y_{t,o}=\sum_i X_{t,i}W_{o,i}$。若激活按 token、权重按输出通道量化：$X_{t,i}\approx s_t\,q^x_{t,i}$，$W_{o,i}\approx s_o\,q^w_{o,i}$，则 $Y_{t,o}\approx s_ts_o\sum_i q^x_{t,i}q^w_{o,i}$，先做纯整数矩阵乘，再乘一个外积缩放即可：输出通道和 token 是矩阵乘的「外侧」维度，scale 可以在 INT32 累加之后统一乘回。若激活按输入通道量化，$s_i$ 随求和下标 $i$ 变化，提不出来，只能在累加前逐项乘 scale，相当于退回浮点计算。

      - A 错：按输入通道量化正好能隔离离群通道，精度反而更好，问题在于无法高效计算。SmoothQuant 的思路就是把这种逐输入通道的缩放离线「折算」进权重。
      - B 错：每个 token 的数值随输入变化，无法离线校准；逐 token 的动态量化恰恰需要在运行时为每个 token 求最大值。
      - C 错：权重按输出通道量化是因为 scale 可以提到外面，且不同输出通道的幅度差异大；激活难量化的根源是输入通道上的离群值。

  - id: INF-QUANT-009
    type: multiple
    difficulty: 2
    frequency: 2
    points: [量化粒度]
    question: |
      关于量化粒度（多少个数共用一个 scale），下列说法正确的有：
    options:
      A: 'W4A16 分组量化的 scale 沿累加维度变化，kernel 要在累加循环里按组反量化权重'
      B: '粒度越细，量化误差通常越小，但要存储的 scale（以及零点）越多'
      C: '组越小精度越高；组大小取 1 时，每个 FP16 scale 摊到每个权重上只多约 0.125 bit'
      D: '逐 token 的动态量化要在运行时按每个 token 当前的数值计算 scale'
      E: 'MXFP4、NVFP4 分别每 32、16 个元素共享一个 scale，Blackwell 的 Tensor Core 可直接使用'
    answer: [A, B, D, E]
    explanation: |
      **结论**：A、B、D、E 正确。

      - A 对：W4A16 的分组量化（如每 128 个输入维度一组）在计算前把权重反量化成 16 bit，scale 沿输入维变化也没关系，只要 kernel 在沿 K 维的循环里按组取 scale 反量化即可；这与 W8A8 不同，W8A8 的整数矩阵乘要求 scale 位于外侧维度。
      - B 对：粒度越细，每个 scale 只需覆盖更小范围内的数，离群值只「污染」自己所在的组；代价是元数据变多（如 INT4、组 128 时约 4.125 bit/权重）。反过来，逐张量量化只用一个 scale，一个离群值就会撑大整个张量的 scale，对离群值最敏感。
      - C 错：0.125 bit 是组大小 128 时的开销（16 ÷ 128）。组大小为 1 时每个元素都配一个 FP16 scale，每个权重多出 16 bit，存储比原始数据还多，失去了压缩意义。
      - D 对：激活随输入变化，逐 token 的 scale 只能在运行时求每行的 $\max|x|$，这是动态量化的少量额外开销。
      - E 对：这是把细粒度量化做进硬件。MXFP4 每 32 个 E2M1 元素共享一个 E8M0 scale，NVFP4 每 16 个元素共享一个 E4M3 scale（另有逐张量的 FP32 scale）；Blackwell 的第五代 Tensor Core 在矩阵乘指令中直接使用块级 scale，不必先在 kernel 里反量化，兼顾了细粒度的精度与 FP4 的算力。
  - id: INF-QUANT-010
    type: code_fill
    difficulty: 2
    frequency: 2
    points: [量化粒度]
    question: |
      补全对称分组量化函数：权重形状为 `(out, in)`，沿输入维每 `group` 个元素共用一个 scale，整数取值范围为 $[-2^{b-1},\ 2^{b-1}-1]$，返回反量化后的权重。
    code: |
      import numpy as np

      def group_quant(w, n_bits=4, group=128):
          out_f, in_f = w.shape
          qmax = ____                                         # 空 1：最大整数
          g = w.reshape(out_f, in_f // group, group)
          scale = np.abs(g).max(axis=____, keepdims=True) / qmax   # 空 2
          scale = np.maximum(scale, 1e-12)                    # 防止全 0 的组除以 0
          q = np.clip(np.round(g / scale), ____, qmax)        # 空 3：最小整数
          return (q * scale).reshape(out_f, in_f)
    answer: ['2 ** (n_bits - 1) - 1', '-1', '-qmax - 1']
    test: |
      rng = np.random.default_rng(0)
      w = rng.normal(size=(4, 256))
      w[0, 3] = 50.0                                   # 第 0 行第 0 组里有一个离群值
      dq = group_quant(w, n_bits=4, group=128)
      assert dq.shape == w.shape
      g = w.reshape(4, 2, 128)
      s = np.abs(g).max(axis=-1, keepdims=True) / 7
      assert np.all(np.abs(dq.reshape(4, 2, 128) - g) <= s / 2 + 1e-12)
      # 离群值只影响自己所在的组
      w2 = w.copy()
      w2[0, 3] = 0.0
      dq2 = group_quant(w2, n_bits=4, group=128)
      assert np.allclose(dq[0, 128:], dq2[0, 128:])
      assert not np.allclose(dq[0, :128], dq2[0, :128])
      # INT8 的误差远小于 INT4
      e4 = np.abs(group_quant(w2, 4) - w2).mean()
      e8 = np.abs(group_quant(w2, 8) - w2).mean()
      assert e8 < e4 / 8
    explanation: |
      - **空 1**：对称量化的最大整数是 $2^{b-1}-1$（INT4 为 7，INT8 为 127），scale $=\max|x|/q_{\max}$。
      - **空 2**：`reshape` 后形状为 `(out, in/group, group)`，每组的元素在最后一维，所以沿 `axis=-1`（写 `2` 也对）求最大值，得到每行每组一个 scale。若写成 `axis=1`，就变成跨组求最大值，scale 被别的组撑大，测试中「每组误差不超过 $s/2$」的断言会失败。
      - **空 3**：整数下界 $-2^{b-1}$，即 `-qmax - 1`（也可写 `-2 ** (n_bits - 1)`）。用 absmax 定 scale 时，$|x/s|\le q_{\max}$，实际取不到 $-q_{\max}-1$，所以写 `-qmax` 也能通过测试；但若改用截断阈值小于 $\max|x|$ 的 scale，下界就必须写对。

      测试验证了分组的核心性质：离群值只撑大自己所在组的 scale，同一行的其他组不受影响。

  - id: INF-QUANT-011
    type: coding
    difficulty: 2
    frequency: 2
    points: [对称与非对称量化, 量化粒度]
    question: |
      用 numpy 实现非对称（带零点）量化与反量化：

      ```python
      def quantize_asym(x, n_bits=8, group=None): ...   # 返回 (q, scale, zero)
      def dequantize_asym(q, scale, zero): ...          # 返回与 x 同形状的浮点数组
      ```

      - `x` 为一维浮点数组；`group` 为每组元素个数，`None` 表示整个数组一组；长度不能被 `group` 整除时抛出 `ValueError`；
      - 每组一个 `scale`（浮点）与一个 `zero`（整数），`q` 为整数，取值 $[0,\ 2^b-1]$；
      - 量化范围必须包含 0，保证 0 能被精确表示；某组全为同一个值（如全 0）时不能出现除以 0；
      - 范围内元素的反量化误差不超过所在组 scale 的一半。
    answer: |
      import numpy as np

      def quantize_asym(x, n_bits=8, group=None):
          x = np.asarray(x, dtype=np.float64)
          g = x.size if group is None else group
          if g <= 0 or x.size % g:
              raise ValueError("长度必须能被 group 整除")
          xs = x.reshape(-1, g)
          qmax = 2 ** n_bits - 1
          lo = np.minimum(xs.min(axis=1), 0.0)          # 范围扩展到包含 0
          hi = np.maximum(xs.max(axis=1), 0.0)
          scale = (hi - lo) / qmax
          scale = np.where(scale > 0, scale, 1.0)       # 全 0 组：避免除以 0
          zero = np.clip(np.round(-lo / scale), 0, qmax).astype(np.int64)
          q = np.round(xs / scale[:, None]) + zero[:, None]
          q = np.clip(q, 0, qmax).astype(np.int64)
          return q.reshape(x.shape), scale, zero

      def dequantize_asym(q, scale, zero):
          qs = np.asarray(q).reshape(len(scale), -1)
          return ((qs - zero[:, None]) * scale[:, None]).reshape(np.shape(q))
    test: |
      q, s, z = quantize_asym([-1.0, 0.0, 2.0, 3.0])
      assert q.dtype.kind == "i" and q.min() >= 0 and q.max() <= 255
      assert z.tolist() == [64] and np.isclose(s[0], 4 / 255)
      x_hat = dequantize_asym(q, s, z)
      assert x_hat[1] == 0.0                                    # 0 被精确表示
      assert np.all(np.abs(x_hat - [-1, 0, 2, 3]) <= s[0] / 2 + 1e-12)

      q, s, z = quantize_asym(np.zeros(4))                      # 全 0：不能除以 0
      assert np.all(np.isfinite(s)) and np.all(dequantize_asym(q, s, z) == 0)

      q, s, z = quantize_asym([2.0, 3.0, 4.0, 5.0], n_bits=4)   # 全正：下界取 0
      assert z.tolist() == [0] and q.max() == 15

      rng = np.random.default_rng(0)
      x = np.concatenate([rng.normal(0, 0.01, 64), rng.normal(0, 10, 64)])
      q, s, z = quantize_asym(x, n_bits=4, group=64)
      assert q.shape == x.shape and len(s) == 2 and s[0] < s[1] / 100
      err = np.abs(dequantize_asym(q, s, z) - x).reshape(2, 64)
      assert np.all(err <= s[:, None] / 2 + 1e-12)
      q1, s1, z1 = quantize_asym(x, n_bits=4)                   # 不分组：小幅度的一半被大幅度拖累
      assert np.abs(dequantize_asym(q1, s1, z1) - x)[:64].mean() > 5 * err[0].mean()

      try:
          quantize_asym(np.ones(10), group=4)
          raise AssertionError("应抛出 ValueError")
      except ValueError:
          pass
    explanation: |
      **思路**：
      1. 按组 reshape 成 `(组数, group)`，每组求 $\min$、$\max$，并扩展到包含 0：$lo=\min(x_{\min},0)$，$hi=\max(x_{\max},0)$；
      2. $s=(hi-lo)/(2^b-1)$，零点 $z=\mathrm{round}(-lo/s)$ 并截断到 $[0,2^b-1]$；
      3. $q=\mathrm{clamp}(\mathrm{round}(x/s)+z)$；反量化 $\hat x=s\,(q-z)$。

      **边界情况**：
      - 全 0（或范围为 0）的组：$s=0$ 会导致除以 0，置为 1 即可，此时 $q=z=0$，反量化仍是 0；
      - 全正的组：$lo$ 取 0，零点为 0，整数网格从 0 开始，0 仍可精确表示；
      - 长度不能整除时报错，而不是静默地丢掉尾部元素。

      **误差**：范围内元素的误差来自 $\mathrm{round}(x/s)$，不超过 $s/2$。测试最后一部分说明了分组的价值：幅度相差千倍的两段数据如果共用一组，小幅度那段的平均误差要大一个数量级。

  - id: INF-QUANT-012
    type: single
    difficulty: 1
    frequency: 3
    points: [PTQ与QAT]
    question: |
      关于训练后量化（PTQ）与量化感知训练（QAT），下列说法正确的是：
    options:
      A: 'PTQ 要用完整训练数据重新训练模型；QAT 只需几十条校准样本统计激活范围，几分钟即可完成'
      B: 'PTQ 只用少量校准数据确定 scale 或补偿误差；QAT 在训练中插入伪量化，让参数适应量化误差'
      C: 'QAT 训练出的模型部署时仍以 BF16 运行，伪量化只在训练中起正则化作用、提升泛化'
      D: 'PTQ 只适用于权重；激活随输入变化、无法离线校准，量化激活要依靠 QAT'
    answer: B
    explanation: |
      **结论**：两者的区别在于「量化发生在训练之后，还是参与训练」。

      - **PTQ**：拿训练好的模型，用一小份校准数据（常见 128 条左右）统计激活范围、确定 scale，或像 GPTQ 那样做误差补偿；几分钟到几小时完成，不需要训练流水线，是推理部署的主流。
      - **QAT**：在前向中插入「量化—反量化」的伪量化算子，反向用直通估计（STE）传梯度，让权重适应量化误差；4 bit 及以下时效果通常明显好于 PTQ，但要付出训练成本和训练数据。部分开源模型（如 Gemma 3）官方就发布了 QAT 版的 INT4 权重。

      - A 错：说反了。
      - C 错：QAT 的目的就是让部署时的量化模型更准，部署时按量化格式运行。
      - D 错：SmoothQuant、FP8 W8A8 都是量化激活的 PTQ 方法；激活可以用校准数据确定静态 scale，也可以在运行时动态计算。
    source: 'Gemma 3 QAT 发布博客 https://developers.googleblog.com/en/gemma-3-quantized-aware-trained-state-of-the-art-ai-to-consumer-gpus/'

  - id: INF-QUANT-013
    type: judge
    difficulty: 2
    frequency: 2
    points: [PTQ与QAT]
    question: |
      QAT 中，取整函数 round 的导数几乎处处为 0，直接反向传播会让梯度消失；常用做法是直通估计（STE）：在截断范围内把「量化—反量化」视为恒等映射，直接把上游梯度传给原始的浮点权重。
    answer: true
    explanation: |
      **正确**。伪量化 $\hat w=s\cdot\mathrm{clamp}(\mathrm{round}(w/s))$ 是阶梯函数：在每个台阶内导数为 0，在台阶跳变处不可导，直接求导梯度处处为 0，权重无法更新。

      STE（Straight-Through Estimator）的做法是：前向照常量化，让损失「看到」真实的量化误差；反向时把 $\partial\hat w/\partial w$ 近似为 1（超出截断范围的部分常置为 0），梯度直接作用在浮点的「影子权重」上。训练结束后，把影子权重量化一次即得部署用的低比特权重。

      延伸：scale 本身也可以设为可学习参数（如 LSQ 一类方法）；QAT 一般从预训练好的模型出发做少量步数的微调，而不是从头训练。
    source: 'STE（Bengio 等, 2013, arXiv:1308.3432）；LSQ（Esser 等, 2019, arXiv:1902.08153）'

  - id: INF-QUANT-014
    type: short
    difficulty: 2
    frequency: 3
    points: [PTQ与QAT]
    question: |
      PTQ 与 QAT 各自的流程、成本与适用条件是什么？现在需要把一个 8B 对话模型压到 4 bit，部署在边缘设备上，你会怎样选择和推进？
    answer: |
      1. **PTQ 的流程与特点**：取训练好的模型，用一小份校准数据（约一两百条）统计激活范围、确定 scale，或像 GPTQ、AWQ 那样做误差补偿与等价缩放；不需要训练流水线，几分钟到几小时完成，8 bit 时几乎无损，4 bit 时借助 GPTQ / AWQ 加分组通常也能接受。
      2. **QAT 的流程与特点**：在前向中插入伪量化，用 STE 反传，让权重适应量化误差；一般在预训练好的模型上用一部分训练数据微调。4 bit 及以下效果通常明显优于 PTQ；代价是训练算力、训练数据和完整的训练与评测流程，超参数也要调。
      3. **怎么选**：先看位宽与掉点容忍度（8 bit、FP8 用 PTQ 即可；3 bit 及以下或掉点不可接受时考虑 QAT）；再看资源（有没有训练数据与算力、模型是否允许继续训练）；还要看能否直接用官方发布的 QAT 权重（如 Gemma 3 的 INT4 QAT 版本）。
      4. **本题的推进路径**：
         - 先查有没有官方 QAT 或社区成熟的 4 bit 版本；
         - 否则先做 PTQ 基线：AWQ / GPTQ，INT4、分组 128，用贴近业务的中文对话数据校准；
         - 建业务评测集（任务成功率、格式正确率、长回复）与 BF16 对比，并测设备上的速度与内存；
         - 掉点超出预算时：定位敏感层保留高精度，或减小组大小；仍不够再做 QAT（或量化后用 LoRA 微调恢复），并控制训练数据分布，防止遗忘。
      5. **验收**：在目标设备上同时满足精度、内存、首 token 时延与生成速度的指标再上线。
    rubric:
      - '说清 PTQ 的流程（校准数据、scale 或误差补偿）与低成本特点（2 分）'
      - '说清 QAT 的流程（伪量化 + STE 微调）与收益、成本（2 分）'
      - '给出选择依据：位宽、掉点容忍度、数据与算力、是否有官方 QAT 权重（2 分）'
      - '给出「先 PTQ 基线、评测、再考虑敏感层或 QAT」的分步推进方案（3 分）'
      - '提到在目标设备上验收精度与速度、内存（1 分）'
    explanation: |
      **常见失分点**：把 QAT 说成「从头训练一个低比特模型」；认为 4 bit 一定要 QAT（GPTQ / AWQ 在多数模型上已经可用）；只谈方法不谈评测，没有 BF16 基线和业务指标；忽略校准数据要贴近业务分布；没考虑边缘设备上 kernel 支持的格式（例如设备只支持某几种 4 bit 格式）。
    source: 'Gemma 3 QAT 发布博客 https://developers.googleblog.com/en/gemma-3-quantized-aware-trained-state-of-the-art-ai-to-consumer-gpus/'

  - id: INF-QUANT-015
    type: multiple
    difficulty: 2
    frequency: 2
    points: [PTQ与QAT, 量化效果评估]
    question: |
      关于 PTQ 中校准数据（calibration set）的选择，下列说法正确的有：
    options:
      A: '校准集越大越好，用全量训练数据校准效果最佳'
      B: '用英文维基百科校准中文客服模型，中文任务可能掉点更多'
      C: '校准完成后，可以直接用校准集来评测量化掉点，最能反映真实误差'
      D: '校准集通常只需一两百条样本（如 128 条），用于统计激活范围或累积 Hessian 等统计量'
      E: '校准数据应贴近线上分布，包括语言、领域与对话模板'
    answer: [B, D, E]
    explanation: |
      - A 错：超过一定数量后统计量已经稳定，收益很小而成本线性增长；更重要的是「像不像线上数据」，而不是「多不多」。
      - B 对：语言不同，激活的分布与显著通道也不同；校准集与业务分布不一致，是量化后特定语言或领域掉点的常见原因。
      - C 错：GPTQ 等方法会利用校准数据做误差补偿，可能对校准集过拟合；在校准集上评测会高估效果，必须用独立的评测集。
      - D 对：PTQ 只需估计统计量（激活的最大值、平均幅度，GPTQ 的 $XX^\top$），少量样本即可收敛。GPTQ 论文用的是 C4 中随机抽取的 128 段、每段 2048 token。
      - E 对：激活分布取决于输入。对话模型的输入带有对话模板和特殊 token，用纯文本校准，统计到的激活范围与线上不符。
    source: 'GPTQ（Frantar 等, 2022, arXiv:2210.17323）'

  - id: INF-QUANT-016
    type: single
    difficulty: 1
    frequency: 3
    points: [LLM.int8与离群值]
    question: |
      LLM.int8()（Dettmers 等, 2022）处理激活离群值的方法是：
    options:
      A: '用逐通道的平滑因子把激活离群值迁移到权重上，让激活变平滑后再统一用 INT8 量化'
      B: '用校准数据的 Hessian 逆把离群通道的量化误差补偿到其他通道上，各维度统一走 INT8'
      C: '把超过阈值（论文取 6）的少数特征维度拆出来走 FP16，其余走向量级 INT8，结果相加'
      D: '把含离群值的 token 单独挑出来用 FP16 计算，其余 token 按逐张量 INT8 量化'
    answer: C
    explanation: |
      **结论**：LLM.int8() = 向量级 INT8 量化 + 混合精度分解。

      论文发现模型规模到 6.7B 左右之后，激活中系统性地出现少数幅度极大的特征维度。它把这些维度（及权重中对应的部分）拆出来走 FP16 矩阵乘，其余 99% 以上的维度走 INT8 矩阵乘（激活逐行、权重逐列的向量级量化），最后相加。这样在 175B 规模上也几乎不掉点，权重显存约减半。代价是拆分与两路计算的开销，速度往往不比 FP16 快，所以它主要用来**省显存**，而不是提速。

      - A 是 SmoothQuant 的思路；
      - B 是 GPTQ 的思路（而且 GPTQ 处理的是权重量化）；
      - D 错：离群值集中在少数特征维度上，并出现在大部分 token 中（6.7B 模型中约 75% 的序列位置都受影响），按 token 拆分几乎要把整个矩阵都挑出来；LLM.int8() 拆分的是特征维度。
    source: 'LLM.int8()（Dettmers 等, 2022, arXiv:2208.07339）'

  - id: INF-QUANT-017
    type: fill
    difficulty: 2
    frequency: 2
    points: [LLM.int8与离群值, 量化粒度]
    question: |
      某层输入激活中，绝大多数元素的绝对值不超过 1，但有一个离群通道的值达到 60。若对整个张量做逐张量的对称 INT8 量化（$s=\max|x|/127$），则 scale 约为 ____（保留 3 位小数）；绝对值不超过 1 的元素只会被映射到 ____ 个不同的整数上。
    answer: [['0.472', '0.4724'], '5']
    explanation: |
      - $s=60/127\approx0.472$；
      - $|x|\le1$ 时，$x/s\in[-2.12,\ 2.12]$，取整后只能是 $-2,-1,0,1,2$，共 **5** 个整数。

      对比：没有这个离群值时，$s=1/127$，同样的元素能用上全部 255 个整数。一个离群值让正常元素的分辨率下降了约 50 倍，等效于只剩 2～3 bit。这就是激活量化的核心难题：离群值集中在少数通道，却通过共享的 scale「拖累」所有通道。LLM.int8() 把离群维度拆出来走 FP16，SmoothQuant 把离群幅度挪给权重，都是为了解决它。
    source: 'LLM.int8()（Dettmers 等, 2022, arXiv:2208.07339）'

  - id: INF-QUANT-018
    type: multiple
    difficulty: 3
    frequency: 2
    points: [LLM.int8与离群值]
    question: |
      关于大模型激活中的离群值（outlier features），下列说法正确的有：
    options:
      A: '离群值主要出现在权重中，激活的分布通常比权重更平坦、更容易量化'
      B: '逐输入通道量化激活能把离群值隔离在各自的通道里，而且这些 scale 可以像逐 token 的 scale 一样，在 INT32 累加之后统一乘回'
      C: '离群值集中在少数固定的特征维度（通道）上，并在大量 token 中同时出现'
      D: '离群值只是训练中的偶然现象，换一个随机种子重新训练就会消失'
      E: '改成逐 token 量化激活并不能解决问题：每个 token 都含有离群通道，各自的 scale 仍会被撑大'
    answer: [C, E]
    explanation: |
      **结论**：C、E 正确。

      - A 错：恰好相反。权重分布相对平坦、可以离线处理，激活才是难点（「权重好量化，激活难量化」）。
      - B 错：按通道量化最符合离群值的结构，但 scale 沿求和维度（输入通道 $k$）变化，$\sum_k s_k\,q^x_k q^w_k$ 中各项的 scale 不同，提不到求和号外，只能在累加循环里逐项反量化，整数矩阵乘就做不成了。逐 token、逐输出通道的 scale 位于外侧维度，才能在累加后统一乘回。SmoothQuant 把这种逐通道缩放离线折算进权重，绕开了这个限制。
      - C 对：LLM.int8() 的分析表明，离群值是系统性的：位于少数固定的隐藏维度，几乎在所有层、大量 token 中出现；SmoothQuant 的论文也观察到离群值「按通道」分布。
      - D 错：离群特征随模型规模增大而系统性地出现，与模型的工作方式有关，不是偶然的训练噪声，所以需要专门的量化方法应对。
      - E 对：离群值沿通道方向分布，每个 token 的那一行都包含离群通道，逐 token 的 scale 依然被它主导。
    source: 'LLM.int8()（Dettmers 等, 2022, arXiv:2208.07339）；SmoothQuant（Xiao 等, 2022, arXiv:2211.10438）'

  - id: INF-QUANT-019
    type: calc
    difficulty: 2
    frequency: 2
    points: [SmoothQuant]
    question: |
      SmoothQuant 为每个输入通道 $j$ 取 $s_j=\max|X_j|^{\alpha}/\max|W_j|^{1-\alpha}$，并做等价变换 $\hat X_j=X_j/s_j$、$\hat W_j=W_j\cdot s_j$（$W_j$ 指与输入通道 $j$ 相乘的那一列权重），乘积 $XW^\top$ 不变。某通道 $\max|X_j|=64$、$\max|W_j|=0.25$。

      (1) $\alpha=0.5$ 时，$s_j$ 是多少？变换后该通道激活与权重的最大幅度各是多少？
      (2) $\alpha=0.75$ 时呢？
      (3) 一般地，变换后两边的最大幅度如何随 $\alpha$ 变化？$\alpha=0.5$ 有什么特殊之处？
    answer: '(1) s=16，激活 64→4，权重 0.25→4；(2) s=32，激活→2，权重→8；(3) 激活最大幅度为 (64×0.25)^(1−α)=16^(1−α)，权重为 16^α；α=0.5 时两者相等，都等于 √(64×0.25)=4'
    explanation: |
      **(1)** $s_j=64^{0.5}/0.25^{0.5}=8/0.5=16$。激活：$64/16=4$；权重：$0.25\times16=4$。

      **(2)** $s_j=64^{0.75}/0.25^{0.25}=2^{4.5}/2^{-0.5}=2^5=32$。激活：$64/32=2$；权重：$0.25\times32=8$。

      **(3)** 记 $a=\max|X_j|$、$b=\max|W_j|$，代入得

      $$
      \max|\hat X_j|=\frac{a}{s_j}=(ab)^{1-\alpha},\qquad \max|\hat W_j|=b\,s_j=(ab)^{\alpha}
      $$

      本题 $ab=16$：$\alpha$ 越大，激活越平、权重越尖。$\alpha=0.5$ 时两边相等，都是 $\sqrt{ab}=4$，量化难度被平均分配。

      **含义**：$\alpha$ 是「把多少难度从激活挪给权重」的旋钮。激活离群越严重，越需要更大的 $\alpha$；但 $\alpha$ 太大会让权重出现新的离群值，权重量化变难。论文在多数模型上取 0.5，离群更严重的模型取更大的值。
    source: 'SmoothQuant（Xiao 等, 2022, arXiv:2211.10438）'

  - id: INF-QUANT-020
    type: single
    difficulty: 2
    frequency: 2
    points: [SmoothQuant]
    question: |
      SmoothQuant 的变换 $Y=(X\,\mathrm{diag}(s)^{-1})(\mathrm{diag}(s)\,W^\top)$ 在推理时如何落地，才能做到几乎没有额外开销？
    options:
      A: '离线算好 $s$，把 $s^{-1}$ 并入前面归一化层的缩放参数，把 $s$ 乘进权重后再量化'
      B: '每次前向按当前 batch 的激活实时计算 $s$，再插入逐元素除法算子，开销可被矩阵乘掩盖'
      C: '先离线算好 $s$，再对模型做少量微调，让后续各层适应平滑后的激活分布'
      D: '主要用于 FFN 的第二个线性层，因为 QKV 投影和 FFN 第一层前面没有可以合并缩放的算子'
    answer: A
    explanation: |
      **结论**：SmoothQuant 是离线、无需训练的等价变换，缩放全部被「吸收」进已有的参数。

      - 激活侧：QKV 投影与 FFN 第一层的输入来自归一化层，其输出为 $\gamma\odot\hat x+\beta$。把 $\gamma$、$\beta$ 都除以 $s$，归一化层的输出就直接是 $X\,\mathrm{diag}(s)^{-1}$。
      - 权重侧：把 $W$ 的第 $j$ 列乘以 $s_j$，再按常规方法量化成 INT8。

      两步都在部署前完成，推理时不增加任何算子，推理图与普通 W8A8 完全相同。

      - B 错：$s$ 由校准数据统计的各通道最大值离线确定；实时计算与额外的除法会带来开销，也没有必要。
      - C 错：变换在数学上严格等价，不需要训练，这正是它属于 PTQ 的原因。
      - D 错：平滑主要作用于归一化层之后的 QKV 投影与 FFN 第一层，这些位置正好能把缩放合并进前面的归一化参数。
    source: 'SmoothQuant（Xiao 等, 2022, arXiv:2211.10438）'

  - id: INF-QUANT-021
    type: judge
    difficulty: 1
    frequency: 2
    points: [SmoothQuant]
    question: |
      SmoothQuant 的迁移强度 $\alpha$ 越大越好：$\alpha=1$ 时激活被完全压平，W8A8 的量化误差最小。
    answer: false
    explanation: |
      **错误**。$\alpha=1$ 时 $s_j=\max|X_j|$，变换后每个激活通道的最大值都是 1，激活确实很平；但权重的第 $j$ 列被乘以 $\max|X_j|$，激活中的离群幅度原封不动地搬到了权重上，权重出现严重的离群列，INT8 权重量化的误差会急剧变大。

      $\alpha$ 的作用是在激活与权重之间分配量化难度：变换后激活的最大幅度为 $(\max|X_j|\cdot\max|W_j|)^{1-\alpha}$，权重为 $(\cdot)^{\alpha}$，$\alpha=0.5$ 时两边相等。论文在多数模型上取 0.5，离群更严重的模型适当取大一些。实践中可以在校准集上网格搜索 $\alpha$，以层输出误差或下游指标为准。
    source: 'SmoothQuant（Xiao 等, 2022, arXiv:2211.10438）'

  - id: INF-QUANT-022
    type: short
    difficulty: 3
    frequency: 2
    points: [SmoothQuant, LLM.int8与离群值]
    question: |
      LLM.int8() 与 SmoothQuant 都是为了解决「激活离群值让 INT8 量化失效」的问题。请说明：(1) 离群值为什么让激活难以量化，为什么不能简单地按输入通道量化激活；(2) 两种方法各自的思路，以及对计算速度的影响；(3) 在 H100 这类支持 FP8 的硬件上，为什么 FP8 W8A8 往往成为更省事的选择，而在 A100 上 SmoothQuant 仍有价值。
    answer: |
      1. **难点**：模型规模变大后，激活中少数固定的通道幅度比其他通道大一两个数量级，并且在几乎所有 token 中出现。逐张量或逐 token 量化时，scale 被这些通道撑大，正常通道只剩很少的刻度。按输入通道量化能隔离离群值，但 scale 沿矩阵乘的累加维度变化，提不到求和号外，无法使用 INT8 矩阵乘、INT32 累加的整数 kernel。
      2. **LLM.int8()**：向量级 INT8 量化（激活逐行、权重逐列），再做混合精度分解——幅度超过阈值（6）的少数特征维度拆出来用 FP16 计算，其余走 INT8，结果相加。在 175B 规模上几乎无损；但拆分带来不规则的计算与额外开销，速度往往不如 FP16，主要价值是省一半权重显存。
      3. **SmoothQuant**：利用「激活难量化、权重好量化」，按通道做等价缩放 $s_j=\max|X_j|^{\alpha}/\max|W_j|^{1-\alpha}$，把激活的离群幅度挪一部分给权重；缩放离线合并进前一层归一化的参数与线性层权重，推理时没有额外算子。之后激活和权重都能用常规 INT8 量化，跑标准的 W8A8 整数矩阵乘，Prefill 与 Decode 都能提速。代价是需要校准数据、要调 $\alpha$。
      4. **FP8 在 H100 上更省事**：FP8 是浮点格式，刻度在 0 附近密、远处疏，天然适合「钟形 + 离群值」的分布；配合逐 token 动态缩放，多数模型无需平滑就几乎无损；H100 的 FP8 Tensor Core 算力约为 BF16 的 2 倍，流程也只需「转换 + 少量校准」。
      5. **A100 上 SmoothQuant 仍有价值**：A100 没有 FP8 Tensor Core，但有 INT8 Tensor Core；想用低精度矩阵乘加速大 batch，就要靠 INT8 W8A8，而让 INT8 激活量化可用的正是 SmoothQuant 这类平滑方法。平滑与 FP8 也可以组合使用。
    rubric:
      - '说清离群值撑大 scale 的机制，以及逐输入通道量化无法用整数矩阵乘的原因（3 分）'
      - '正确描述 LLM.int8() 的混合精度分解及其「省显存不提速」的特点（2 分）'
      - '正确描述 SmoothQuant 的等价缩放、离线合并与 W8A8 加速（2 分）'
      - '说明 FP8 在 H100 上的优势，以及 A100 上只能依靠 INT8 W8A8 的原因（3 分）'
    explanation: |
      **常见失分点**：把 LLM.int8() 说成能显著提速；说 SmoothQuant 需要微调；说不出「为什么不直接按通道量化激活」这一关键约束；认为 FP8 能在 A100 上提速；只背公式，不知道缩放被合并进 LayerNorm、推理时零开销。
    source: 'LLM.int8()（arXiv:2208.07339）；SmoothQuant（arXiv:2211.10438）'

  - id: INF-QUANT-023
    type: single
    difficulty: 1
    frequency: 3
    points: [GPTQ]
    question: |
      GPTQ（Frantar 等, 2022）的核心做法是：
    options:
      A: '在校准集上用反向传播微调量化后的权重，并用直通估计（STE）让梯度穿过取整，直到损失收敛'
      B: '按激活幅度找出约 1% 的显著通道，把对应权重乘以放大系数后再统一量化，以保护显著权重'
      C: '用逐通道平滑因子把激活的离群幅度迁移到权重上，再对权重和激活统一做 INT8 量化'
      D: '逐列量化权重，并用 $H=2XX^\top$ 的逆把每列的量化误差补偿到尚未量化的列上'
    answer: D
    explanation: |
      **结论**：GPTQ = 逐层的输出重建目标 $\min_{\hat W}\|WX-\hat WX\|^2$ + 逐列量化 + 二阶信息（Hessian 逆）误差补偿。

      $X$ 是校准数据在这一层的输入，$H=2XX^\top$ 是层输出误差关于权重的 Hessian，只与输入有关。每量化一列，未量化的列就按 $H^{-1}$ 给出的相关性做一次修正，让它们提前「抵消」这一列引入的输出误差。整个过程不需要反向传播，175B 模型约 4 个 GPU 小时完成，4 bit（甚至 3 bit）下精度明显好于逐元素就近取整（RTN）。

      - A 错：GPTQ 没有梯度训练，修正量由闭式公式给出。
      - B 是 AWQ 的思路。
      - C 是 SmoothQuant 的思路。
    source: 'GPTQ（Frantar 等, 2022, arXiv:2210.17323）'

  - id: INF-QUANT-024
    type: multiple
    difficulty: 3
    frequency: 2
    points: [GPTQ]
    question: |
      关于 GPTQ 的工程实现，下列说法正确的有：
    options:
      A: 'act-order 选项按输入通道的激活幅度（即 Hessian 对角元）从小到大的顺序量化，先处理不重要的列'
      B: 'GPTQ 要对每一层做多轮反向传播来微调量化权重，量化 175B 模型需要数周 GPU 时间'
      C: '大模型上固定的逐列顺序与 OBQ 的贪心顺序效果相近，各行可共用同一套 $H^{-1}$ 信息'
      D: '用 Cholesky 分解一次性得到所需的 $H^{-1}$ 各行，并给 $H$ 的对角线加少量阻尼'
      E: '把列分块做「延迟批量更新」：块内逐列量化与修正，块处理完后再统一更新后面的列，从而减少了算法的理论计算量'
    answer: [C, D]
    explanation: |
      **结论**：C、D 正确。

      - A 错：GPTQ 官方仓库对 act-order 的描述是按激活幅度**从大到小**的顺序量化列；$H$ 的对角元 $2\sum x_j^2$ 正是第 $j$ 个输入通道的激活能量，所以也就是先量化对输出影响大的列，让它们的误差有更多后续列来补偿。仓库报告它在 OPT-66B 上明显改善了 3 / 4 bit 的困惑度，与 true-sequential 配合后也显著改善了 LLaMA-7B 的结果。
      - B 错：GPTQ 不做反向传播，论文报告 175B 模型约 4 个 GPU 小时即可完成。
      - C 对：OBQ 为每一行按贪心顺序挑下一个要量化的权重，每行的 $H^{-1}$ 更新各不相同，代价极高。GPTQ 的「任意顺序」观察表明，固定顺序在大模型上几乎不损失精度；由于 $H$ 只依赖输入 $X$，所有行可以共享同一套更新，每列只需做一次，计算量大幅下降。
      - D 对：反复更新 $H^{-1}$ 会累积数值误差，大模型上可能出现不定矩阵；预先对 $H^{-1}$ 做 Cholesky 分解即可得到每一步所需的行，再配合对角阻尼（如平均对角元的 1%）保证稳定。
      - E 错：延迟批量更新不减少理论计算量。逐列更新整个剩余矩阵是带宽受限的小运算；分块（如每 128 列）后，块内更新局部、块外批量更新，把大部分计算变成大矩阵乘，提高的是计算与访存之比。论文明确说明它不降低理论计算量，但在大模型上带来约一个数量级的实际加速。
    source: 'GPTQ（Frantar 等, 2022, arXiv:2210.17323）；act-order 见 https://github.com/IST-DASLab/gptq'

  - id: INF-QUANT-025
    type: code_debug
    difficulty: 3
    frequency: 1
    points: [GPTQ]
    question: |
      下面是一个简化版的 GPTQ（不分块、不用 Cholesky）：按列依次量化，并把每列的量化误差补偿到后面的列上，目标是让 $\|WX-QX\|$ 尽量小。测试发现它的输出误差反而比逐元素就近取整（RTN）大好几倍。请找出 bug 并修正。
    code: |
      import numpy as np

      def rtn(w, scale):                                   # 对称 INT4 就近取整
          return np.clip(np.round(w / scale), -8, 7) * scale

      def gptq_quantize(W, X, scale):
          """W: (out, in) 权重；X: (in, n) 校准输入；scale: (out,) 每行一个 scale。
          按列依次量化，并把每列的量化误差补偿到后面尚未量化的列上。"""
          W = W.astype(float).copy()
          n = W.shape[1]
          H = 2 * X @ X.T
          H += 0.01 * np.mean(np.diag(H)) * np.eye(n)       # 阻尼，保证正定
          Q = np.zeros_like(W)
          for j in range(n):
              Q[:, j] = rtn(W[:, j], scale)
              err = (W[:, j] - Q[:, j]) / H[j, j]
              W[:, j + 1:] -= np.outer(err, H[j, j + 1:])
              H = H - np.outer(H[:, j], H[j, :]) / H[j, j]   # 消去第 j 个变量
          return Q
    fixed_code: |
      import numpy as np

      def rtn(w, scale):                                   # 对称 INT4 就近取整
          return np.clip(np.round(w / scale), -8, 7) * scale

      def gptq_quantize(W, X, scale):
          """W: (out, in) 权重；X: (in, n) 校准输入；scale: (out,) 每行一个 scale。
          按列依次量化，并把每列的量化误差补偿到后面尚未量化的列上。"""
          W = W.astype(float).copy()
          n = W.shape[1]
          H = 2 * X @ X.T
          H += 0.01 * np.mean(np.diag(H)) * np.eye(n)       # 阻尼，保证正定
          Hinv = np.linalg.inv(H)
          Q = np.zeros_like(W)
          for j in range(n):
              Q[:, j] = rtn(W[:, j], scale)
              err = (W[:, j] - Q[:, j]) / Hinv[j, j]
              W[:, j + 1:] -= np.outer(err, Hinv[j, j + 1:])
              Hinv = Hinv - np.outer(Hinv[:, j], Hinv[j, :]) / Hinv[j, j]
          return Q
    test: |
      rng = np.random.default_rng(0)
      W = rng.normal(size=(16, 32))
      X = rng.normal(size=(32, 8)) @ rng.normal(size=(8, 256)) + 0.3 * rng.normal(size=(32, 256))
      scale = np.abs(W).max(axis=1) / 7
      Q = gptq_quantize(W, X, scale)
      assert np.allclose(Q / scale[:, None], np.round(Q / scale[:, None]))   # 落在 INT4 网格上
      e_rtn = np.linalg.norm(rtn(W, scale[:, None]) @ X - W @ X)
      e_gptq = np.linalg.norm(Q @ X - W @ X)
      assert e_gptq < 0.7 * e_rtn, (e_gptq, e_rtn)
    answer: |
      **问题**：误差补偿用的是 Hessian $H$ 本身，而 OBS / GPTQ 的公式需要的是 **Hessian 的逆** $H^{-1}$（循环里的三处 `H[...]`）。

      量化第 $j$ 列产生误差 $w_j-q_j$ 后，最优的补偿为

      $$
      \delta W_{:,\,j+1:}=-\frac{w_j-q_j}{[H^{-1}]_{jj}}\,[H^{-1}]_{j,\,j+1:}
      $$

      量化完第 $j$ 列后，剩余各列对应的逆矩阵用高斯消元更新：$H^{-1}\leftarrow H^{-1}-H^{-1}_{:,j}H^{-1}_{j,:}/[H^{-1}]_{jj}$。这个消元式只对**逆矩阵**成立；把它和补偿公式套在 $H$ 上，修正方向与幅度都是错的，误差反而被放大。

      **修正**：阻尼之后先求逆，循环中全部改用 `Hinv`：

      ```python
      Hinv = np.linalg.inv(H)
      for j in range(n):
          Q[:, j] = rtn(W[:, j], scale)
          err = (W[:, j] - Q[:, j]) / Hinv[j, j]
          W[:, j + 1:] -= np.outer(err, Hinv[j, j + 1:])
          Hinv = Hinv - np.outer(Hinv[:, j], Hinv[j, :]) / Hinv[j, j]
      ```
    explanation: |
      **为什么是逆矩阵**：层输出误差 $\|(\hat W-W)X\|^2$ 关于某一行权重是二次型，Hessian 为 $H=2XX^\top$。固定第 $j$ 个权重取值 $q_j$ 后，让其余权重自由调整以最小化误差，是一个带等式约束的二次规划，拉格朗日乘子法的解里出现的正是 $H^{-1}$（OBS 公式）。直观上，$H$ 描述「各输入通道的相关性」，而补偿要回答「固定一个变量后，其他变量该怎么动」，这是「条件化」操作，对应逆矩阵的行。

      **为什么能在逆矩阵上消元**：去掉第 $j$ 个变量后，剩余子矩阵的逆等于 $H^{-1}$ 对第 $j$ 个变量做一次高斯消元（Schur 补的性质）。GPTQ 进一步注意到这些行可以由 $H^{-1}$ 的 Cholesky 分解一次性得到，从而省掉逐列的消元并提高数值稳定性。

      本题中，修正后的误差约为 RTN 的 40%；原代码的误差是 RTN 的 3 倍以上。
    source: 'GPTQ（Frantar 等, 2022, arXiv:2210.17323）'

  - id: INF-QUANT-026
    type: short
    difficulty: 2
    frequency: 3
    points: [GPTQ, AWQ]
    question: |
      GPTQ 与 AWQ 都是 4 bit 权重量化的主流 PTQ 方法。请比较它们的核心思想、对校准数据的依赖、量化耗时与精度特点，说明两者共同的局限，以及工程上如何选择。
    answer: |
      1. **GPTQ**：逐层最小化 $\|WX-\hat WX\|^2$，按列量化，用 $H=2XX^\top$ 的逆把每列的误差补偿到未量化的列上；工程上靠固定列序、分块延迟更新、Cholesky 分解实现，175B 约 4 个 GPU 小时。精度好，3 bit 时也可用；会修改权重来拟合校准数据，存在对校准集过拟合的风险。
      2. **AWQ**：观察到约 1% 的显著通道最重要，而显著性要看**激活**幅度；最终不保留 FP16，而是对这些输入通道做等价缩放（放大权重、缩小激活），缩放因子取 $s=\bar x^{\alpha}$ 并在 $[0,1]$ 上网格搜索 $\alpha$。不做反向传播，也不做逐列重建，只依赖激活的平均幅度这一简单统计量，量化快，对校准集不敏感，在指令模型、多模态模型上泛化好。
      3. **共同点与局限**：都是只量化权重的 W4A16，通常配合分组 128；Decode（带宽瓶颈）加速明显，Prefill 与大 batch（算力瓶颈）几乎不受益，反量化甚至带来额外开销；都需要专门的混合精度 kernel；在小模型、推理与代码等任务上掉点更明显。
      4. **怎么选**：两者在主流推理框架中都有支持，最终以自己的业务评测为准；需要快速量化、担心校准数据代表性时优先 AWQ；追求更低比特或在某些模型上精度更好时可试 GPTQ（可配合 act-order）；如果瓶颈在大 batch 吞吐、硬件支持 FP8，优先考虑 FP8 / INT8 W8A8。
    rubric:
      - '正确说明 GPTQ 的 Hessian 补偿思想与工程实现要点（3 分）'
      - '正确说明 AWQ 按激活选显著通道、等价缩放与网格搜索 α（3 分）'
      - '比较校准依赖、耗时与过拟合风险（2 分）'
      - '指出两者都是 W4A16、大 batch 收益有限，并给出选择建议（2 分）'
    explanation: |
      **常见失分点**：说「AWQ 把 1% 权重保留成 FP16」（那只是动机实验）；说 GPTQ 需要反向传播；把两者说成能加速 Prefill；只讲原理、不提要用业务评测集决定取舍。
    source: 'GPTQ（arXiv:2210.17323）；AWQ（arXiv:2306.00978）'

  - id: INF-QUANT-027
    type: single
    difficulty: 1
    frequency: 3
    points: [AWQ]
    question: |
      AWQ（Activation-aware Weight Quantization）判断哪些权重通道「显著」（对量化误差影响最大）的依据是：
    options:
      A: '权重本身的幅度，例如每个输入通道权重的 L2 范数'
      B: '对应输入通道上激活的平均幅度'
      C: '预训练过程中该通道梯度的大小'
      D: '该通道权重的量化误差：误差越大越显著'
    answer: B
    explanation: |
      **结论**：AWQ 的名字就是答案——按**激活**判断权重的重要性。

      一个输入通道的激活越大，它对应的那一列权重的量化误差被放大得越多（输出误差 ≈ 激活 × 权重误差）。论文的动机实验显示：按激活幅度挑出约 1% 的通道保持 FP16，困惑度就大幅改善；按权重幅度挑选，效果与随机挑选差不多。

      - A 错：这正是论文用来对照的「按权重挑选」，几乎无效。
      - C 错：PTQ 不使用训练梯度；AWQ 只需在校准数据上统计激活幅度。
      - D 错：每个权重的取整误差上界都由所在组的 scale 决定，误差本身不反映该通道对输出的影响。
    source: 'AWQ（Lin 等, 2023, arXiv:2306.00978）'

  - id: INF-QUANT-028
    type: judge
    difficulty: 2
    frequency: 2
    points: [AWQ]
    question: |
      AWQ 的最终方案是：按激活幅度挑出约 1% 的显著权重通道保留为 FP16，其余权重量化为 INT4，推理时做混合精度计算。
    answer: false
    explanation: |
      **错误**。保留 1% 显著通道为 FP16 只是论文的**动机实验**，用来证明「按激活挑选」的有效性。混合精度的权重布局不规则，对硬件和 kernel 都不友好。

      AWQ 的最终方案是**等价缩放**：把显著输入通道对应的权重乘以 $s>1$ 再量化，激活相应除以 $s$（可合并进前一个算子）。在所在组的 scale 基本不变时，该通道权重折算回原尺度的量化误差约缩小为原来的 $1/s$。缩放因子取 $s=\bar x^{\alpha}$（$\bar x$ 为该通道激活的平均幅度），在 $[0,1]$ 上网格搜索 $\alpha$，使层输出误差最小。所有权重仍是统一的 INT4（分组量化），kernel 可以高效实现。$s$ 也不能太大，否则会撑大整组的 scale，伤害组内其他权重的精度。
    source: 'AWQ（Lin 等, 2023, arXiv:2306.00978）'

  - id: INF-QUANT-029
    type: code_output
    difficulty: 3
    frequency: 2
    points: [AWQ]
    question: |
      下面的代码用一组 8 个权重演示 AWQ 的缩放：下标 2 的输入通道激活很大（显著通道），把这个通道的权重放大 $s$ 倍再做对称 INT4 量化（整组共用一个 scale），量化后再除回 $s$。输出是什么？
    code: |
      import numpy as np

      def q4(w):                                    # 对称 INT4，整组共用一个 scale
          delta = np.abs(w).max() / 7
          return np.round(w / delta) * delta, delta

      w = np.array([0.70, -0.36, 0.03, 0.20, -0.52, 0.11, 0.46, -0.27])
      x = np.array([5, 5, 50, 5, 5, 5, 5, 5.0])    # 下标 2 是激活很大的显著通道
      for s in [1, 4, 40]:
          scale = np.ones(8)
          scale[2] = s                              # 只放大显著通道
          wq, delta = q4(w * scale)
          err = wq / scale - w                      # 除回 s，折算到原尺度的误差
          print(s, round(delta, 4), round(abs(err[2]), 4), round(np.abs(err * x).sum(), 2))
    answer: |
      1 0.1 0.03 2.2
      4 0.1 0.005 0.95
      40 0.1714 0.0 1.27
    explanation: |
      每行输出：放大倍数 $s$、组的 scale $\Delta$、显著通道的误差、按激活加权的总误差 $\sum_i|x_i\,e_i|$。

      - **s = 1**：$\Delta=0.7/7=0.1$。显著权重 0.03 → $0.3$ 取整为 0，误差 0.03，乘以激活 50 贡献 1.5；其余 7 个权重的误差之和为 0.14（如 −0.36 → −0.4），乘以 5 贡献 0.7，合计 **2.2**。
      - **s = 4**：显著权重变成 0.12，组内最大值仍是 0.7，$\Delta$ 不变；0.12 → 1.2 取整为 1 → 0.1，除回 4 得 0.025，误差降到 0.005（约为原来的 1/4，加权后 0.25）；其余权重不受影响，合计 **0.95**。
      - **s = 40**：显著权重变成 1.2，成了组内最大值，$\Delta$ 增大到 $1.2/7\approx0.1714$。显著通道本身变得精确（误差 0），但其余权重的刻度变粗，误差之和增大到约 0.254，加权后约 **1.27**，反而比 $s=4$ 差。

      **结论**：适度放大显著通道，能在组 scale 基本不变的前提下按 $1/s$ 缩小它的误差；放大过度会撑大整组的 scale，损害其他权重。这就是 AWQ 要在 $s=\bar x^{\alpha}$ 上搜索折中点、而不是把 $s$ 取得越大越好的原因（一个模拟实验中搜得 $\alpha=0.4$）。
    source: 'AWQ（Lin 等, 2023, arXiv:2306.00978）'

  - id: INF-QUANT-030
    type: single
    difficulty: 1
    frequency: 2
    points: [FP8格式]
    question: |
      在 H100 上部署 FP8 W8A8 推理时，权重和激活通常选用哪种 FP8 格式？
    options:
      A: '都用 E4M3：范围由逐通道 / 逐 token 缩放解决，多 1 位尾数精度更高'
      B: '都用 E5M2：最大值可达 57344，不容易溢出，省去了缩放因子的计算'
      C: '权重用 E4M3，激活用 E5M2：激活里有离群值，需要更大的动态范围'
      D: '不区分格式：FP8 推理在 H100 上实际走 INT8 Tensor Core，FP8 只是 INT8 的另一种叫法'
    answer: A
    explanation: |
      **结论**：推理中权重与激活都用 E4M3。

      | 格式 | 指数 / 尾数位 | 最大值 | 特点 |
      |---|---|---|---|
      | E4M3 | 4 / 3 | 448 | 精度较高，范围较小 |
      | E5M2 | 5 / 2 | 57344 | 范围大，精度低 |

      推理时有 scale：权重逐通道、激活逐 token 动态缩放，先把数值缩放到 E4M3 的表示范围内再转换。范围问题由 scale 解决，剩下决定误差的是尾数位数，所以选精度更高的 E4M3。E5M2 主要用在训练中动态范围很大的梯度上。

      - B 错：有了 scale 就不需要靠格式本身的范围扛离群值，E5M2 只有 2 位尾数，精度明显更差。
      - C 错：激活的离群值同样由逐 token（或逐张量）的 scale 处理；主流推理框架的 FP8 W8A8 对激活也用 E4M3。
      - D 错：FP8 是浮点格式，刻度在 0 附近密、远处疏，与均匀刻度的 INT8 不同；H100 有专门的 FP8 Tensor Core。
    source: 'FP8 Formats for Deep Learning（Micikevicius 等, 2022, arXiv:2209.05433）'

  - id: INF-QUANT-031
    type: multiple
    difficulty: 2
    frequency: 2
    points: [FP8格式]
    question: |
      关于 FP8 推理，下列说法正确的有：
    options:
      A: '权重逐通道、激活逐 token 动态缩放的 FP8 W8A8，对多数模型几乎无损'
      B: '激活的静态 scale 要用校准数据离线确定；动态 scale 每次前向按当前张量计算，更稳健'
      C: 'FP8 与 INT8 都有 256 个码点，刻度同样均匀分布，两者的量化误差基本相同'
      D: 'E4M3 的最大值为 448，足以覆盖权重和激活的范围，FP8 量化可以省去 scale'
      E: 'Hopper 与 Ada 架构有 FP8 Tensor Core，稠密算力约为 BF16 的 2 倍'
    answer: [A, B, E]
    explanation: |
      - A 对：这是 H100 上常用的默认方案。FP8 的浮点刻度适合「钟形 + 离群值」的分布，配合细粒度缩放，多数模型的掉点很小。
      - B 对：静态 scale 省去运行时求最大值，但若线上输入分布与校准数据不同，可能溢出或损失精度；动态 scale 每次按实际数值计算，更稳健，代价是少量运行时开销。
      - C 错：FP8 每个 2 的幂区间内有固定数量的刻度，越靠近 0 越密，与 INT8 的均匀刻度不同；这也是它比 INT8 更能容忍离群值的原因。
      - D 错：E4M3 最大只有 448，最小的正规数为 $2^{-6}$，权重（常在 $10^{-2}$ 量级）和激活的数值范围都要先缩放到合适的区间，否则会溢出或损失精度。
      - E 对：Hopper（H100 / H200）与 Ada（如 L40S）都有 FP8 Tensor Core。H100 SXM 的 FP8 稠密算力约 1979 TFLOPS，BF16 约 989 TFLOPS。
    source: 'NVIDIA H100 产品规格 https://www.nvidia.com/en-us/data-center/h100/'

  - id: INF-QUANT-032
    type: fill
    difficulty: 2
    frequency: 1
    points: [FP8格式, 量化粒度]
    question: |
      Blackwell 架构支持的 4 bit 浮点格式都采用「小块共享 scale」的设计：MXFP4 每 32 个 FP4（E2M1）元素共用一个 8 bit、2 的幂次的 scale（E8M0），平均每个元素占 ____ bit；NVFP4 每 16 个元素共用一个 FP8（E4M3）scale（另有一个逐张量的 FP32 scale，可忽略），平均每个元素占 ____ bit。
    answer: ['4.25', '4.5']
    explanation: |
      - MXFP4：$4+8/32=4.25$ bit；
      - NVFP4：$4+8/16=4.5$ bit。

      两者的取舍：NVFP4 的块更小（16 个元素），scale 也不局限于 2 的幂次，量化误差更小，代价是元数据多一些。FP4（E2M1）本身只能表示 $0,\pm0.5,\pm1,\pm1.5,\pm2,\pm3,\pm4,\pm6$ 这几个值，完全依赖细粒度的块缩放才能用于权重。

      实例：OpenAI 的 gpt-oss 以 MXFP4 格式发布 MoE 专家的权重，120B 版本因此能放进一张 80 GB 的 GPU。
    source: 'NVFP4 介绍 https://developer.nvidia.com/blog/introducing-nvfp4-for-efficient-and-accurate-low-precision-inference/；gpt-oss 模型卡（arXiv:2508.10925）'

  - id: INF-QUANT-033
    type: judge
    difficulty: 1
    frequency: 2
    points: [FP8格式]
    question: |
      A100 没有 FP8 Tensor Core，FP8 在 A100 上最多只能作为权重或 KV 的存储格式（计算前转换成 16 bit），享受不到矩阵乘算力翻倍；若要在 A100 上用低精度矩阵乘加速大 batch 推理，可以考虑 INT8 W8A8（如 SmoothQuant）。
    answer: true
    explanation: |
      **正确**。A100（Ampere）的 Tensor Core 支持 TF32、FP16 / BF16、INT8、INT4，没有 FP8。FP8 权重在 A100 上只能「存储时省一半、计算前转回 16 bit」，属于只量化权重的用法：Decode 时少读字节能带来一些收益，但算力瓶颈的 Prefill 与大 batch 不会加速。

      A100 的 INT8 稠密算力约为 BF16 的 2 倍（约 624 TOPS 对 312 TFLOPS），想在算力瓶颈的场景提速，就要用 INT8 W8A8；而激活中的离群值让直接量化掉点严重，所以需要 SmoothQuant 一类的平滑方法。FP8 Tensor Core 从 Hopper（H100）和 Ada（L40S 等）开始提供。
    source: 'NVIDIA A100 产品规格 https://www.nvidia.com/en-us/data-center/a100/'

  - id: INF-QUANT-034
    type: calc
    difficulty: 2
    frequency: 3
    points: [INT4权重量化, KV Cache量化]
    source: 'Llama 3 config.json（Hugging Face meta-llama/Meta-Llama-3-70B：80 层、64 个 Query 头、8 个 KV 头、词表 128256，约 70.55B 参数）'
    question: |
      Llama-3-70B 约 70.55B 参数，其中词嵌入与 lm_head 各约 1.05B，其余约 68.45B 位于各层的线性层；80 层、8 个 KV 头、头维度 128。计划部署到单张 80 GB 的 GPU：线性层用 INT4 分组量化（每 128 个一组、FP16 scale，即 4.125 bit/权重），词嵌入与 lm_head 保持 BF16。显存按 80 GB 计（1 GB = $10^9$ B），可用 90%，另为激活等预留 4 GB。

      (1) BF16 原模型的权重约多大？单卡能否放下？
      (2) 量化后权重约多大？
      (3) 剩余显存能放下多少个 token 的 KV（BF16）？最多能同时服务多少条 8K（8192）token 的请求？KV 改用 FP8 呢？
    answer: '(1) 约 141 GB，放不下；(2) 约 39.5 GB（线性层 35.3 GB + 词嵌入与 lm_head 4.2 GB）；(3) 每 token KV 为 327,680 B（320 KiB），剩余约 28.5 GB，可放约 8.7 万个 token，约 10 条 8K 请求；FP8 KV 约 17.4 万个 token、约 21 条'
    explanation: |
      **(1)** $70.55\times10^9\times2\approx141$ GB，超过单卡 80 GB，BF16 至少要两张卡。

      **(2)**
      - 线性层：$68.45\times10^9\times4.125/8\approx35.3$ GB；
      - 词嵌入与 lm_head：$2\times1.05\times10^9\times2\approx4.2$ GB；
      - 合计约 **39.5 GB**。

      **(3)**
      - 每 token 的 KV：$2\times80\times8\times128\times2=327{,}680$ B（320 KiB）；
      - 可用显存：$80\times0.9-4=68$ GB，减去权重，剩余约 28.5 GB；
      - BF16 KV：$28.5\times10^9/327{,}680\approx8.7$ 万个 token，$\div8192\approx10.6$，即约 **10 条** 8K 请求；
      - FP8 KV：每 token 160 KiB，约 17.4 万个 token，约 **21 条**。

      **结论**：INT4 让 70B 模型能单卡部署，但此后容量瓶颈立刻转移到 KV 上；长上下文、高并发的场景还要叠加 KV 量化、更短的上下文上限，或者改用多卡。另外要评估 INT4 对 70B 模型业务效果的影响。

  - id: INF-QUANT-035
    type: single
    difficulty: 2
    frequency: 2
    points: [INT4权重量化]
    question: |
      团队把一个离线批量推理任务（batch 很大、提示词长、输出短）的部署从 H100 上的 FP8 W8A8 改成 AWQ INT4（W4A16），希望「位宽更低、跑得更快」，结果吞吐反而下降。最可能的原因是：
    options:
      A: 'INT4 权重需要额外的 scale 与零点，叠加后留给 KV Cache 的显存反而变少，batch 被迫减小'
      B: 'AWQ 把约 1% 的显著权重保留为 FP16，混合精度的两路矩阵乘拖慢了大 batch 计算'
      C: '负载受算力限制，W4A16 反量化后仍用 BF16 矩阵乘，算力只有 FP8 的一半'
      D: 'INT4 按 128 分组存 scale 与零点后，平均位宽超过 8 bit，显存占用反而比 FP8 更大'
    answer: C
    explanation: |
      **结论**：位宽更低不等于更快，要看瓶颈在哪里。

      大 batch、长提示词的 Prefill 是算力瓶颈，每读一次权重要做大量计算，读权重的字节数已经不是主要矛盾。W4A16 只省了读权重的带宽，矩阵乘仍在 BF16 精度下进行，反量化还要额外花计算；FP8 W8A8 则让矩阵乘本身在 FP8 Tensor Core 上完成，算力约为 BF16 的 2 倍。所以在这类负载上 W4A16 可能比 FP8 W8A8 更慢。W4A16 的优势场景是小 batch 的 Decode（带宽瓶颈）和显存吃紧的部署。

      - A 错：权重精度不影响 KV 的大小；scale 与零点摊到每个权重上只有零点几 bit，INT4 权重反而腾出更多显存给 KV。
      - B 错：AWQ 的最终方案是等价缩放，全部权重都是 INT4，并不保留 FP16 通道。
      - D 错：分组 128 时 scale 与零点只让平均位宽升到约 4.1～4.3 bit，仍比 8 bit 小得多。

  - id: INF-QUANT-036
    type: calc
    difficulty: 2
    frequency: 2
    points: [KV Cache量化, INT4权重量化]
    source: 'NVIDIA H100 规格 https://www.nvidia.com/en-us/data-center/h100/；Llama 3 config.json（Hugging Face meta-llama/Meta-Llama-3-8B：32 层、8 个 KV 头、头维度 128，约 8.03B 参数）'
    question: |
      Llama-3-8B（BF16 权重 16.06 GB；每个 token 的 KV 为 128 KiB）在 H100（带宽 3.35 TB/s）上提供 32K（32768）token 上下文的长文档问答，Decode 的 batch = 12。只考虑每个 Decode 步必须从显存读取的权重与 KV 字节数（1 GB = $10^9$ B），用带宽估算每步耗时的下界，比较四种配置：

      (a) 现状（权重与 KV 都是 BF16）；
      (b) 只把权重量化为 INT4（按 4.125 bit/权重估算全部权重），KV 不变；
      (c) 只把 KV 改为 FP8，权重不变；
      (d) 两者都做。

      哪种单项改动的收益更大？为什么？
    answer: '(a) 约 67.6 GB、20.2 ms；(b) 约 55.7 GB、16.6 ms（−18%）；(c) 约 41.8 GB、12.5 ms（−38%）；(d) 约 29.9 GB、8.9 ms（−56%）；KV 改 FP8 的收益更大，因为长上下文、多并发时 KV 是每步读取量的大头'
    explanation: |
      **KV 总量**：$128\ \text{KiB}\times32768\times12=48\ \text{GiB}\approx51.54$ GB。

      | 配置 | 权重 | KV | 每步读取 | 下界 |
      |---|---|---|---|---|
      | (a) | 16.06 GB | 51.54 GB | 67.60 GB | 20.2 ms |
      | (b) INT4 权重 | $16.06\times4.125/16\approx4.14$ GB | 51.54 GB | 55.68 GB | 16.6 ms |
      | (c) FP8 KV | 16.06 GB | 25.77 GB | 41.83 GB | 12.5 ms |
      | (d) 两者 | 4.14 GB | 25.77 GB | 29.91 GB | 8.9 ms |

      每步耗时下界 = 读取字节数 ÷ 3.35 TB/s。

      **结论**：权重是整个 batch 共享的，只读一遍；KV 是每条序列私有的，随上下文长度和 batch 线性增长。本例中 KV 占读取量的 76%，所以把 KV 减半比把权重压到 1/4 更有效。短上下文、小 batch 时结论相反：权重是大头，W4A16 收益更大。选量化方案前先算清「每步读的字节里谁是大头」。

  - id: INF-QUANT-037
    type: single
    difficulty: 2
    frequency: 2
    points: [KV Cache量化]
    question: |
      下列场景中，把 KV Cache 从 BF16 改为 FP8（权重与计算精度不变）收益最大的是：
    options:
      A: '8B 模型做短文本分类：提示词约 500 token，只输出 1 个标签'
      B: '8B 模型的单用户本地聊天：上下文约 2K token，batch = 1'
      C: '离线批量计算文本向量（Embedding 模型，一次前向即可，不做自回归生成）'
      D: '8B 模型的长文档问答服务：上下文 32K token，高并发'
    answer: D
    explanation: |
      **结论**：KV 量化的收益与「KV 在显存和每步读取量中的占比」成正比，而 KV 总量 ∝ 上下文长度 × 并发数。

      以 Llama-3-8B（每 token 128 KiB）为例：
      - D：一条 32K 请求的 KV 就有 4 GiB，高并发时 KV 远超 16 GB 的权重；FP8 让可容纳的并发约翻倍，Decode 读 KV 的时间也减半，收益最大。
      - A：只生成 1 个 token，几乎没有 Decode，KV 只在 Prefill 中短暂存在，瓶颈在 Prefill 的计算。
      - B：2K token 的 KV 约 256 MiB，与 16 GB 的权重相比很小，每步耗时主要花在读权重上，应优先考虑权重量化。
      - C：Embedding 模型一次前向就结束，不做自回归生成，也不需要保留 KV Cache。

  - id: INF-QUANT-038
    type: single
    difficulty: 2
    frequency: 3
    points: [量化效果评估]
    question: |
      某团队把 Agent 底座模型量化为 INT4 后，WikiText-2 困惑度只从 5.80 升到 5.86，于是直接上线。随后工具调用的 JSON 参数错误率从 0.5% 升到 3%。下列分析最合理的是：
    options:
      A: '困惑度只上升 0.06，量化误差可以忽略；JSON 错误更可能来自上线后提示词或工具描述的变化'
      B: '困惑度是逐 token 平均的指标，对少数关键 token 的错误不敏感，应补测格式正确率等业务指标'
      C: '困惑度上升 0.06 已超出 INT4 的正常范围，说明量化过程出错、模型受损，应改回 BF16'
      D: '换用 Agent 对话数据作为评测集重新测困惑度，就能准确反映 JSON 参数的错误率'
    answer: B
    explanation: |
      **结论**：困惑度适合做便宜、敏感的初筛，不能单独作为上线依据。

      困惑度是对大量普通文本 token 的平均对数损失。一个 JSON 参数是否合法，取决于少数几个关键 token：一个引号、一个括号、一个字段名错了，整个调用就失败。这些 token 在 WikiText 里占比极小，平均之后几乎看不出来。Agent 场景还有多步累积：每步的小偏差会被后续步骤放大。上线前应补充格式正确率、工具调用成功率、Agent 端到端成功率等业务评测。

      - A 错：同一提示词下只换了模型精度，错误率跃升，量化是首要嫌疑；应在 BF16 与 INT4 之间做对照实验确认。
      - C 错：INT4 量化让困惑度上升零点几很常见，涨 0.06 通常只意味着轻微的分布偏移，不能断言量化出错或模型受损，关键是在业务指标上量化影响。
      - D 错：换数据测的仍是逐 token 平均的困惑度，关键 token 的错误依然被稀释，也反映不了多步生成中的误差累积；问题出在评测指标与业务需求不匹配，应直接测格式正确率与工具调用成功率。

  - id: INF-QUANT-039
    type: multiple
    difficulty: 2
    frequency: 2
    points: [量化效果评估]
    question: |
      要公平、可信地评估一个量化模型相对 BF16 基线的掉点，下列做法正确的有：
    options:
      A: 'MMLU 覆盖 57 个学科，它不掉点就足以说明代码与数学能力也没有下降'
      B: '推理模型的长输出任务、低资源语言要单独评测，它们往往掉得更多'
      C: '量化版与 BF16 基线使用同一批题目、同样的解码参数和对话模板'
      D: '报告置信区间或多次运行的方差，差异小于噪声时不下结论'
      E: '直接用校准集里的样本做评测：它与量化时看到的分布一致，最能反映量化误差'
    answer: [B, C, D]
    explanation: |
      - A 错：MMLU 学科虽多，题目却都是知识类选择题。不同能力对量化的敏感度不同，知识类选择题最「耐量化」，代码、数学、长链推理更敏感，要分别评测。
      - B 对：推理模型输出动辄上万 token，误差会累积；校准数据以英文为主时，中文等语言的掉点往往更大。
      - C 对：解码参数或模板不同，差异就不能归因于量化。
      - D 对：很多评测集只有几百题，几个点的波动可能就是噪声；采样解码时还要多次运行。
      - E 错：GPTQ 等方法会利用校准数据做误差补偿，可能对校准集过拟合；评测必须用独立数据。

      完整的评估通常包括：困惑度初筛 → 通用下游任务（知识、数学、代码、长上下文）→ 业务指标（格式正确率、工具调用、端到端成功率）→ 上线灰度监控。
  - id: INF-QUANT-040
    type: scenario
    difficulty: 3
    frequency: 2
    points: [量化效果评估, AWQ, PTQ与QAT]
    question: |
      某电商团队把 14B 的中文客服模型用 AWQ 量化为 INT4（分组 128）后上线，校准数据沿用了开源工具默认的英文语料。上线前只测了 WikiText-2 困惑度（比 BF16 高 0.1）和 MMLU（掉 0.8 个点）。一周后发现：

      1. 回复中的订单号、金额偶尔出现数字错位；
      2. 工具调用的 JSON 参数错误率从 0.6% 升到 2.5%；
      3. 长回复的后半段更容易出现重复和答非所问。

      请分析可能的原因，并给出排查与改进方案。
    answer: |
      **可能的原因**
      1. **校准数据不匹配**：英文通用语料与中文客服对话（对话模板、数字、商品术语、JSON）的激活分布不同，AWQ 搜到的显著通道和缩放因子不适合真实流量。
      2. **评测不覆盖业务**：困惑度和 MMLU 对少数关键 token（数字、引号、字段名）的错误不敏感，也测不出长生成中的误差累积。
      3. **误差累积**：长回复中每步的小偏差不断叠加，后半段更容易偏离。
      4. **敏感层**：首尾若干层、lm_head 或激活幅度特别大的层对 INT4 更敏感，统一量化放大了误差。

      **排查**
      1. 先止血：对受影响的流量回退到 BF16（或 FP8）版本，或缩小灰度比例。
      2. 建对照评测集：从线上采样，覆盖数字抄写（订单号、金额）、工具调用 JSON、长回复、多轮对话；BF16 与 INT4 用同样的解码参数对比，确认掉点确实由量化引起，并定位类别。
      3. 敏感层扫描：逐层只量化一层（或量化全部、逐层恢复），看业务指标或输出分布的 KL 散度，找出最敏感的层。

      **改进**
      1. 用线上分布的中文对话（套用真实的对话模板）重新校准；
      2. 敏感层与 lm_head 保留 BF16 或 INT8，或对这些层减小组大小；对比 GPTQ（act-order）；
      3. 硬件支持时改用 FP8 W8A8，通常几乎无损；
      4. 必要时用业务数据做 QAT，或量化后用 LoRA 微调恢复；
      5. 工程兜底：工具调用用约束解码保证 JSON 合法；订单号、金额从工具结果中原样引用并校验，不让模型「抄写」；
      6. 把评测集加入量化发布的门禁，灰度上线时监控格式错误率、数字校验失败率、投诉率。
    rubric:
      - '指出校准数据与业务分布不匹配（2 分）'
      - '指出困惑度 / MMLU 无法反映格式、数字与长生成问题（2 分）'
      - '给出止血与基于业务评测集的对照排查（2 分）'
      - '给出重新校准、敏感层混合精度、FP8 或 QAT 等修复方案（3 分）'
      - '提到约束解码、数值校验等工程兜底与发布门禁（1 分）'
    explanation: |
      **常见失分点**：只说「换回 BF16」而不分析原因；把问题全归咎于提示词；不建业务评测集就直接调参；只给「换 GPTQ」一类单点方案，没有敏感层分析与灰度验证。高分回答要把「原因 → 证据 → 修复 → 防止再犯」串起来。

  - id: INF-QUANT-041
    type: short
    difficulty: 2
    frequency: 2
    points: [量化效果评估, 量化粒度]
    question: |
      量化后整体指标的掉点超出了预算，如何定位「敏感层」并用混合精度修复？请给出具体步骤、衡量敏感度的指标和取舍方法。
    answer: |
      1. **建立基线**：固定评测集与解码参数，记录 BF16 与「全部量化」两个端点的指标，确认掉点超出预算的幅度。
      2. **逐层扫描**（两种方向任选或结合）：
         - 只量化第 $i$ 层、其余保持 BF16，测指标下降；
         - 全部量化，只把第 $i$ 层恢复为 BF16，测指标回升。
         按敏感度排序。层数多时可按块（如每几层一组）粗筛，再细查。
      3. **敏感度指标**：业务指标最直接但贵；便宜的代理指标有：该层输出的相对误差或余弦相似度、最终输出分布与 BF16 的 KL 散度、top-1 一致率。困惑度可以参考，但不够敏感。
      4. **常见结论**：词嵌入与 lm_head、首尾若干层、激活幅度特别大的层（如部分 MLP 的输出投影）往往更敏感。
      5. **修复与取舍**：从最敏感的层开始，逐个提高精度（BF16 / INT8）或减小组大小，每改一次重新评测，直到满足掉点预算；同时计算显存与速度代价，在精度—成本曲线上选点。也可以只对敏感层换方法（如改用 GPTQ、调整截断范围）。
      6. **工程确认**：推理引擎与 kernel 要支持逐层不同的量化配置；最终在独立评测集和灰度流量上验证。
    rubric:
      - '给出逐层量化 / 逐层恢复的扫描方法（3 分）'
      - '给出合理的敏感度指标（如层输出误差、KL 散度、业务指标）（2 分）'
      - '说出常见的敏感层（2 分）'
      - '说明按敏感度逐步提高精度并权衡显存、速度与掉点（2 分）'
      - '提到引擎支持与独立评测验证（1 分）'
    explanation: |
      **常见失分点**：只说「把重要的层不量化」，说不出怎么找；只用困惑度衡量敏感度；不考虑混合精度带来的显存与 kernel 支持问题；在调参用的数据上验证最终效果。

  - id: INF-QUANT-042
    type: short
    difficulty: 3
    frequency: 3
    points: [FP8格式, INT4权重量化, KV Cache量化]
    source: 'NVIDIA A100 规格 https://www.nvidia.com/en-us/data-center/a100/（无 FP8 Tensor Core）；NVIDIA H100 规格 https://www.nvidia.com/en-us/data-center/h100/；SmoothQuant arXiv:2211.10438；AWQ arXiv:2306.00978；GPTQ arXiv:2210.17323；RULER arXiv:2404.06654'
    question: |
      请为下面四种部署需求分别选择量化方案（权重、激活、KV 的格式与方法），并说明理由：

      (1) H100 上的 8B 在线对话服务，追求吞吐与延迟的平衡；
      (2) A100 上的 70B 离线批处理，追求吞吐；
      (3) 单张 24 GB 消费级显卡上运行 32B 模型的本地助手，batch = 1；
      (4) H100 上 32K 上下文、高并发的长文档问答。
    answer: |
      1. **H100 在线对话**：FP8 W8A8（E4M3，权重逐通道、激活逐 token 动态缩放）。几乎无损；Prefill 用上 FP8 Tensor Core，Decode 读权重的字节减半，两个阶段都受益，流程简单。可按需开启 FP8 KV。
      2. **A100 离线 70B**：A100 没有 FP8 Tensor Core，大 batch 是算力瓶颈，要靠 INT8 W8A8（SmoothQuant 平滑激活）用上 INT8 Tensor Core；W4A16 在大 batch 下几乎不提速，反量化还有开销。70B 的 INT8 权重约 70 GB，单卡放下后 KV 余量很小，通常仍需 2 卡张量并行，换取更大的 batch。
      3. **24 GB 显卡跑 32B**：BF16 需约 64 GB，放不下；INT4 权重（AWQ / GPTQ，或 llama.cpp 的 4 bit GGUF）约 17～20 GB（取决于分组与元数据开销），留出 KV 与运行缓冲后能放下。batch = 1 的 Decode 是带宽瓶颈，W4A16 正好提速。上下文较长时可再用 8 bit KV，并接受一定的掉点风险。
      4. **H100 长文档问答**：KV 是显存和每步读取量的大头（每条 32K 请求的 KV 可达数 GiB），优先 FP8 KV（容量与 Decode 带宽都约减半），权重用 FP8 W8A8；若还不够再考虑 INT4 KV 等更低比特，但必须用长上下文任务（大海捞针、RULER、真实文档问答）验证。
      5. **共同原则**：先判断瓶颈（显存容量、带宽、算力），再选「省哪一部分」；任何方案都要用业务评测集对比 BF16 基线，并确认推理引擎与硬件支持对应的 kernel。
    rubric:
      - '(1) 选 FP8 W8A8 并说明它对两个阶段的收益（2.5 分）'
      - '(2) 指出 A100 无 FP8、算力瓶颈下应选 INT8 W8A8 + SmoothQuant，而非 W4A16（2.5 分）'
      - '(3) 算出 BF16 放不下、选 INT4 权重量化并说明 batch = 1 时受益于带宽（2.5 分）'
      - '(4) 指出 KV 是大头、优先 FP8 KV 并强调长上下文评测（2.5 分）'
    explanation: |
      **常见失分点**：所有场景一律回答「INT4」；不区分算力瓶颈与带宽瓶颈；忽略 A100 不支持 FP8 计算；长上下文场景只量化权重；不提效果评测与硬件、kernel 支持。答题时先用一两句话判断瓶颈，再给方案，最能体现理解。

  - id: INF-QUANT-043
    type: single
    difficulty: 2
    frequency: 2
    points: [剪枝与稀疏化]
    tags: [Wanda, SparseGPT]
    question: |
      Wanda（Sun 等, 2023）对大模型做一次性剪枝（不重新训练）时，判断权重 $W_{ij}$（第 $i$ 个输出、第 $j$ 个输入通道）是否保留的方法是：
    options:
      A: '得分为 $|W_{ij}|\cdot\|X_j\|_2$，在每个输出内部比较，剪掉低分者，其余权重不更新'
      B: '只看权重的绝对值 $|W_{ij}|$，整层统一排序，剪掉绝对值最小的一半，剩余权重保持不变'
      C: '利用校准数据的二阶信息（Hessian 的逆）逐列剪枝，并更新尚未处理的权重来补偿剪枝带来的误差'
      D: '为每个权重学习一个掩码分数，在继续训练中由梯度决定保留哪些权重，训练后再固定稀疏模式'
    answer: A
    explanation: |
      **结论**：Wanda 的得分 = 权重幅值 × 输入激活范数，在每个输出内部比较，不更新权重。

      - 为什么乘激活范数（$\|X_j\|_2$ 是第 $j$ 个输入通道在校准数据上的激活 L2 范数）：大模型的激活中有少数幅值很大的通道（离群特征），与它们相连的权重即使本身很小，对输出的影响也很大；只看 $|W|$ 会误剪这些权重。
      - 为什么按输出比较：论文发现，对 LLM 在每一行内部按比例剪枝，比整层统一排序更好（LLaMA-7B、50% 稀疏时困惑度 7.26 对比 7.95）。
      - 代价极低：只需一次前向收集激活范数，LLaMA-7B 上计算得分约 0.54 秒，SparseGPT 约 203 秒。

      - B 错：这是整层的幅值剪枝（magnitude pruning），忽略了激活的影响，在 LLM 上明显差于 Wanda。
      - C 错：这是 SparseGPT 的做法，基于二阶信息并做权重重建，可以一次性剪到 50%～60% 的非结构化稀疏，但计算量更大。
      - D 错：这是需要训练的掩码学习类方法，Wanda 不做任何梯度更新。
    source: 'Wanda arXiv:2306.11695；SparseGPT arXiv:2301.00774'

  - id: INF-QUANT-044
    type: fill
    difficulty: 2
    frequency: 1
    points: [剪枝与稀疏化]
    tags: [2:4 稀疏, Sparse Tensor Core]
    question: |
      NVIDIA 的 2:4 结构化稀疏要求每 4 个连续权重中至少有 2 个为 0。压缩存储时只保留 2 个非零值，并为每个非零值记录一个 2 bit 的位置索引。对 FP16 权重，每组 4 个权重的存储从 64 bit 变为 ____ bit，节省约 ____ %；对 INT8 权重，每组从 32 bit 变为 ____ bit。
    answer: ['36', ['43.75', '44', '43.8'], '20']
    explanation: |
      - FP16：$2\times16+2\times2=36$ bit，节省 $1-36/64=43.75\%$，约 44%；
      - INT8：$2\times8+2\times2=20$ bit，节省 $1-20/32=37.5\%$，约 38%。

      元数据的开销只占非零值的 12.5%（2/16）或 25%（2/8）。相比之下，CSR 这类非结构化格式要为每个非零值存列号，开销大得多。

      **意义与代价**：
      - Ampere 及之后的 Sparse Tensor Core 直接读取这种压缩格式，按元数据从另一个操作数中取出对应元素，矩阵乘的理论吞吐翻倍；实测收益小于 2 倍，Wanda 论文在 A6000 上测得 LLaMA-65B 的线性层约 1.6 倍、LLaMA-7B 端到端约 1.24 倍。
      - Decode 阶段受显存带宽限制，收益主要来自读取的权重字节变少（FP16 约少 44%）。
      - 同样是 50% 稀疏，2:4 的约束比非结构化剪枝严格，掉点更多（Wanda 论文中 LLaMA-7B 的困惑度：非结构化 50% 为 7.26，2:4 为 11.53），通常要配合微调或重新训练来恢复。
    source: 'Accelerating Sparse Deep Neural Networks arXiv:2104.08378；Wanda arXiv:2306.11695'

  - id: INF-QUANT-045
    type: judge
    difficulty: 2
    frequency: 2
    points: [剪枝与稀疏化]
    question: |
      把大模型的权重做 50% 的非结构化剪枝（任意位置的一半权重置零）后，即使仍用原来的稠密矩阵乘 kernel 计算，GPU 推理也能提速约 2 倍，因为一半的乘法都是在乘 0。
    answer: false
    explanation: |
      **错误**。稠密 kernel 不会跳过 0：置零的权重照样被读取、照样参与乘加，计算量和访存量都没变，速度基本不变。

      要把稀疏变成加速，需要「存储格式 + kernel + 硬件」配合：
      - **非结构化稀疏**：位置不规则，要用 CSR 等压缩格式和专门的稀疏 kernel。稀疏度只有 50% 时，索引开销与不规则访存往往抵消收益，在 GPU 上很难提速；
      - **2:4 半结构化稀疏**：有 Sparse Tensor Core 支持，矩阵乘的理论吞吐翻倍；Wanda 论文实测线性层约 1.6 倍、端到端约 1.24 倍；
      - **结构化剪枝**（删注意力头、FFN 通道或整层）：得到的是更小的稠密模型，用普通 kernel 就能直接提速，但掉点更多，通常要蒸馏或继续训练来恢复。

      所以评估剪枝方案时，精度和速度都要在目标推理引擎上实测，不能用「稀疏度」直接换算加速比。
    source: 'SparseGPT arXiv:2301.00774；Wanda arXiv:2306.11695；Accelerating Sparse Deep Neural Networks arXiv:2104.08378'

  - id: INF-QUANT-046
    type: code_fill
    difficulty: 2
    frequency: 1
    points: [剪枝与稀疏化]
    tags: [2:4 稀疏, Wanda, numpy]
    question: |
      补全 2:4 剪枝的掩码函数：按 Wanda 得分 $|W_{ij}|\cdot\|X_j\|_2$，在权重矩阵的每一行中，每 4 个连续元素里保留得分最高的 2 个。`W` 的形状为 `(out, in)`（`in` 是 4 的倍数），`x_norm` 的形状为 `(in,)`，是各输入通道激活的 L2 范数。
    code: |
      import numpy as np

      def mask_2of4(W, x_norm):
          out_dim, in_dim = W.shape
          score = np.abs(W) * ____                      # 把各输入通道的激活范数乘到每一行上
          g = score.reshape(out_dim, in_dim // 4, 4)    # 每 4 个连续元素为一组
          idx = np.argsort(g, axis=-1)[..., ____]       # 每组中得分最高的 2 个元素的下标
          mask = np.zeros(g.shape, dtype=bool)
          np.put_along_axis(mask, idx, True, axis=-1)
          return mask.reshape(out_dim, in_dim)
    answer: ['x_norm[None, :]', '2:']
    test: |
      W = np.array([[0.5, -0.4, 0.3, 0.1, 1.0, 0.2, -0.3, 0.05]])
      xn = np.array([0.1, 1.0, 1.0, 10.0, 1.0, 1.0, 1.0, 1.0])
      assert mask_2of4(W, xn).tolist() == [[False, True, False, True, True, False, True, False]]

      rng = np.random.default_rng(0)
      W = rng.normal(size=(6, 16))
      xn = rng.uniform(0.1, 5.0, size=16)
      m = mask_2of4(W, xn)
      assert m.shape == W.shape and (m.reshape(6, 4, 4).sum(-1) == 2).all()
      s = np.abs(W) * xn
      for i in range(6):
          for j in range(0, 16, 4):
              assert s[i, j:j + 4][m[i, j:j + 4]].min() >= s[i, j:j + 4][~m[i, j:j + 4]].max()
      assert (mask_2of4(W, np.ones(16)) != m).any()    # 只看幅值时，保留的权重会不同
    explanation: |
      - 第一空 `x_norm[None, :]`：把形状 `(in,)` 的范数扩成 `(1, in)`，与 `(out, in)` 的 $|W|$ 逐元素相乘，第 $j$ 列都乘以 $\|X_j\|_2$；直接写 `x_norm` 也能靠广播得到同样的结果。
      - 第二空 `2:`：`argsort` 按升序排列，最后 2 个下标对应得分最高的元素（写 `-2:` 等价）。写成 `:2` 会保留得分最低的两个，正好剪反。

      测试中第一组权重为 $[0.5,-0.4,0.3,0.1]$，激活范数为 $[0.1,1,1,10]$，得分为 $[0.05,0.4,0.3,1.0]$，保留下标 1 和 3；若只看权重幅值，会保留 0.5 和 −0.4。权重 0.1 虽小，却连着激活很大的通道，对输出的贡献最大，这正是 Wanda 的出发点。

      实际部署时，还要把剪枝后的权重按 2:4 的压缩格式存储（非零值 + 2 bit 索引），才能在 Sparse Tensor Core 上加速。
    source: 'Wanda arXiv:2306.11695'

  - id: INF-QUANT-047
    type: short
    difficulty: 3
    frequency: 2
    points: [剪枝与稀疏化, 量化效果评估]
    tags: [结构化剪枝, Minitron, LLM-Pruner]
    question: |
      大模型剪枝有非结构化、半结构化（如 2:4）和结构化三类。请比较它们的精度代价与实际加速效果；说明结构化剪枝落地到推理服务时常见的坑；并给出剪枝后验证精度的方案。
    answer: |
      1. **三类剪枝的对比**：
         - **非结构化**：可剪任意单个权重，同等稀疏度下掉点最少（SparseGPT 在 OPT-175B、BLOOM-176B 上一次性剪到 60% 稀疏，困惑度几乎不变）；但位置不规则，GPU 上很难加速，省显存也要依赖压缩格式。
         - **半结构化 2:4**：每 4 个里至少 2 个为 0，有 Sparse Tensor Core 支持，矩阵乘理论吞吐翻倍，实测收益更小（Wanda 论文：线性层约 1.6 倍、端到端约 1.24 倍）；FP16 权重存储约省 44%。同为 50% 稀疏，掉点比非结构化明显，常需微调恢复。
         - **结构化**：删除注意力头、FFN 中间通道、隐藏维度或整层，得到更小的稠密模型，任何硬件与推理引擎都能直接加速；掉点最大，必须配合恢复训练。LLM-Pruner 用梯度信息找出不重要的耦合结构，再用 LoRA 恢复；Minitron 对深度、宽度、注意力与 MLP 剪枝后做知识蒸馏，只用不到原训练数据 3% 的 token 就从 15B 得到 8B 和 4B 模型。
      2. **结构化剪枝落地的坑**：
         - 形状约束：头数要能被 TP 整除，GQA 的分组关系要保持一致；隐藏维度、中间维度最好是 64 或 128 的倍数，否则 Tensor Core 效率下降；
         - 各层剪得不一样大，很多推理引擎假设所有层结构相同，需要改配置与加载逻辑，因此常选择各层统一的剪枝比例；
         - 重要性评估依赖校准数据，领域不匹配会剪掉业务需要的能力；
         - 与量化叠加时误差会累积，两者的先后顺序与校准要一起设计；
         - 删层对长上下文、多步推理的影响往往大于对短文本困惑度的影响。
      3. **精度验证**：
         - 不只看困惑度：分别评测知识（MMLU 类）、推理（数学、代码）、长上下文检索、指令遵循、工具调用格式与安全；
         - 业务评测集与线上 A/B，按任务切片看掉点，而不只看平均分；
         - 与同等大小的现成稠密小模型对比：如果「剪枝 + 恢复训练」还不如直接用一个小模型，剪枝就没有意义；
         - 在目标推理引擎上实测 TTFT、TPOT 与吞吐，确认真的变快了。
    rubric:
      - '准确对比三类剪枝的精度代价与能否实际加速（3 分）'
      - '能举出结构化剪枝需要恢复训练或蒸馏的例子（如 LLM-Pruner、Minitron）（1 分）'
      - '说出至少三个结构化剪枝落地的坑（形状约束、层间不一致、校准数据、与量化叠加等）（3 分）'
      - '给出多维度评测、与同尺寸稠密模型对比、实测速度的验证方案（3 分）'
    explanation: |
      **常见失分点**：认为「稀疏度 50% 就提速 2 倍」；只用困惑度判断剪枝效果；忽视推理引擎对非均匀层结构与形状对齐的要求；不和同尺寸的现成小模型做对比，说不清剪枝的价值。
    source: 'SparseGPT arXiv:2301.00774；Wanda arXiv:2306.11695；LLM-Pruner arXiv:2305.11627；Minitron arXiv:2407.14679；Accelerating Sparse Deep Neural Networks arXiv:2104.08378'
