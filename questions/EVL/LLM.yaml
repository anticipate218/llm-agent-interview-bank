domain: EVL
subcategory: LLM
questions:

  - id: EVL-LLM-001
    type: single
    difficulty: 1
    frequency: 3
    points: [评测维度]
    question: |
      HELM（Holistic Evaluation of Language Models）在每个场景下同时报告准确率、校准、鲁棒性、公平性、偏见、毒性、效率 7 类指标，而不是只看准确率。这样做的主要理由是：
    options:
      A: '前沿模型的准确率在多数场景都已接近满分，准确率在大模型时代已经没有参考价值'
      B: '只看准确率会掩盖其他维度的缺陷，且各指标之间存在取舍，同一条件下多指标并列才能看清权衡'
      C: '7 类指标可以按固定权重加权合成一个总分，从而用一个数字给模型排名，彻底取代人工评测'
      D: '为了让不同厂商的模型都能在至少一个指标上排名第一，便于各家对外宣传、推动生态参与'
    answer: B
    explanation: |
      **结论**：评测要回答「这个模型在哪些方面好、哪些方面差、代价是什么」，单一准确率回答不了。

      HELM 选了 16 个核心场景，在尽可能多的场景上测量全部 7 类指标，并在标准化条件下评测 30 个模型。论文统计：在 HELM 之前，各模型平均只在 17.9% 的核心场景上评测过，HELM 把这一比例提高到 96.0%，让模型之间真正可比。多指标并列还让「准确率更高但校准更差、毒性更高」之类的权衡显式暴露出来。

      - A 错：准确率仍然是核心指标，只是不够；多数场景的准确率也远未饱和。
      - C 错：HELM 强调把多个指标并列呈现，而不是压成一个分数；人工评测也无法被替代。
      - D 错：与评测目的无关。
    source: 'Liang 等, Holistic Evaluation of Language Models, arXiv:2211.09110'

  - id: EVL-LLM-002
    type: single
    difficulty: 2
    frequency: 2
    points: [评测维度, 评测协议]
    question: |
      评测大模型的开放式输出（写作、问答、代码）时，BLEU、ROUGE 这类基于 n-gram 重叠的指标往往不可靠。最根本的原因是：
    options:
      A: '它们需要对每个回答与每个参考答案逐一做 n-gram 匹配，计算太慢，无法用于大规模评测'
      B: '它们依赖空格分词，只能用于英文等以空格分隔单词的语言，无法评测中文'
      C: '它们必须为每条输出请人工写一份参考答案并逐条打分，标注成本太高'
      D: '它们只衡量与参考答案的字面重叠：换个说法的正确答案会被扣分，字面接近的错误答案却能得高分'
    answer: D
    explanation: |
      **结论**：n-gram 重叠衡量的是「像不像参考答案」，而不是「对不对、好不好」。

      Codex 论文专门做了对比：在 HumanEval 上，功能正确与错误的代码在 BLEU 分数上的分布无法明显分开，说明优化 BLEU 并不等于优化功能正确性，因此 HumanEval 改用单元测试判分。开放式问答与写作同理，一个回答可以与参考答案用词完全不同但更好；反过来，字面接近的答案却可能是错的，例如代码只差一个符号就无法运行。

      替代方案：能用程序判定的就用程序（单元测试、精确匹配、规则校验），开放式质量用带评分细则的 LLM 评审（并用人工标注校准），关键结论再做人工评测。BLEU、ROUGE 在答案空间较窄、参考答案质量高的任务（如部分翻译、摘要）中仍有参考价值。

      - A 错：n-gram 匹配只是计数，计算非常快。
      - B 错：它们与语言无关，中文可以按字或按分词结果计算。
      - C 错：它们只需要每道题有参考答案，不需要对每条输出逐条人工打分。
    source: 'Chen 等, Evaluating Large Language Models Trained on Code（Codex）, arXiv:2107.03374'

  - id: EVL-LLM-003
    type: single
    difficulty: 1
    frequency: 3
    points: [知识与推理基准]
    question: |
      关于 MMLU，下列说法正确的是：
    options:
      A: '它是覆盖 57 个学科的四选一知识题基准，前沿模型准确率已超过 90%，区分度明显下降'
      B: '它是多轮对话基准，由 GPT-4 按 1～10 分给每个回答打分，覆盖写作、推理、编程等 8 类问题'
      C: '它通过运行单元测试来判断模型生成的代码是否正确，按 pass@1 报告各学科的得分'
      D: '它专门测试模型从 10 万 token 以上的长文档中检索信息的能力，文档覆盖 57 个学科'
    answer: A
    explanation: |
      **结论**：MMLU（Hendrycks 等, 2020）是知识类多选题基准的代表，也是「基准饱和」的典型。

      它覆盖数学、历史、法律、医学等 57 个学科。随着模型变强，头部模型都挤在 90% 以上，分数差异越来越难反映真实差距；HLE 的论文就以此作为动机。后续基准的思路包括：增加选项与推理难度（MMLU-Pro）、请领域专家出「搜不到答案」的难题（GPQA）、汇集各学科专家的前沿难题（HLE）。

      - B 错：这是 MT-Bench 的做法。
      - C 错：这是 HumanEval 等代码基准的做法。
      - D 错：这是大海捞针、RULER 等长上下文评测的内容。
    source: 'Hendrycks 等, Measuring Massive Multitask Language Understanding, arXiv:2009.03300；Phan 等, Humanity''s Last Exam, arXiv:2501.14249'

  - id: EVL-LLM-004
    type: multiple
    difficulty: 2
    frequency: 2
    points: [知识与推理基准]
    question: |
      关于知识与推理类基准，下列说法**正确**的有：
    options:
      A: 'GPQA 的答案大多可以通过搜索引擎在几分钟内查到，它主要考查的是模型调用工具检索信息的能力'
      B: '基准分数越高，模型在真实业务上通常也越强，公开基准排名可以直接作为业务选型的依据，不必再做业务评测'
      C: 'GPQA 的题目由领域专家编写：本领域博士约 65% 正确，非本领域的验证者即使联网查 30 分钟以上也只有约 34%'
      D: 'Humanity''s Last Exam（HLE）包含 2,500 道多学科难题，论文发布时前沿模型的准确率都很低，校准也很差'
      E: 'MMLU-Pro 把选项从 4 个扩到 10 个并加入更多推理题，思维链的收益比在原 MMLU 上更明显'
    answer: [C, D, E]
    explanation: |
      - A 错：GPQA 恰恰难以靠搜索解决：非本领域的高水平验证者联网查 30 分钟以上，正确率也只有约 34%。
      - B 错：公开基准只覆盖有限的能力切面，还可能被污染或过拟合，与具体业务的相关性需要验证；业务决策必须有自己的评测集。
      - C 对：这正是 GPQA 被称为「Google-proof」的原因，共 448 道生物、物理、化学题，GPT-4 基线当时只有 39%。
      - D 对：HLE 由各学科专家出题，题目有唯一、可自动判定的答案，且无法通过简单搜索得到。论文（2025 年初）中受测的前沿模型准确率在 3%～13% 之间，RMS 校准误差都在 70% 以上；此后分数提升很快，到 2026 年官方榜单上的最高分已超过 50%，引用这类数字要注明时间。
      - E 对：MMLU-Pro 论文报告准确率比 MMLU 低 16%～33%，在 24 种提示风格下分数波动从 4%～5% 降到约 2%；思维链在 MMLU-Pro 上优于直接作答，而在原 MMLU 上并非如此，说明它更侧重推理。
    source: 'Wang 等, MMLU-Pro, arXiv:2406.01574；Rein 等, GPQA, arXiv:2311.12022；Phan 等, Humanity''s Last Exam, arXiv:2501.14249'

  - id: EVL-LLM-005
    type: fill
    difficulty: 1
    frequency: 2
    points: [知识与推理基准, 评测协议]
    question: |
      四选一基准随机猜测的期望准确率为 ____ %，十选一基准为 ____ %。用「扣除随机水平后的归一化得分」$(acc-chance)/(1-chance)$ 比较：某模型在四选一的 MMLU 上得 40%，在十选一的 MMLU-Pro 上得 28%，两者的归一化得分分别为 ____ 和 ____。
    answer: ['25', '10', ['0.2', '20%'], ['0.2', '20%']]
    explanation: |
      - 随机水平：四选一为 1/4 = 25%，十选一为 1/10 = 10%；
      - MMLU：$(0.40-0.25)/(1-0.25)=0.15/0.75=0.2$；
      - MMLU-Pro：$(0.28-0.10)/(1-0.10)=0.18/0.9=0.2$。

      原始分数 40% 与 28% 看起来差距很大，扣除随机水平后其实一样：都只比瞎猜好了「剩余空间的 20%」。这提醒我们：
      1. 比较不同选项数的基准时，不能只看原始准确率；
      2. 小模型或训练早期的检查点常常接近随机水平，此时的小幅波动没有意义；
      3. 增加选项（如 MMLU-Pro 的 10 个选项）能降低猜中的概率，让分数更有区分度。
    source: 'Wang 等, MMLU-Pro, arXiv:2406.01574'

  - id: EVL-LLM-006
    type: judge
    difficulty: 2
    frequency: 2
    points: [知识与推理基准]
    question: |
      MMLU 的题目与标准答案经过了严格审核，可以认为几乎没有错误；如果模型在某个学科上得分偏低，就一定说明它缺乏这方面的知识。
    answer: false
    explanation: |
      **错误**。「Are We Done with MMLU?」（Gema 等, 2024）人工复核发现，MMLU 存在相当数量的标注错误：估计全库约 6.49% 的题目有问题，其中病毒学（Virology）子集被分析的题目中竟有 57% 含有错误。作者据此发布了重新标注 5,700 道题的 MMLU-Redux，并指出用它评测时模型的表现与原始报告存在明显出入。

      启示：
      - 基准本身也有噪声，某个子集分数异常时，先抽查题目和标准答案；
      - 头部模型差距只有一两个点时，标注错误足以改变结论；
      - 自建评测集同样要做多人复核和一致性检查。
    source: 'Gema 等, Are We Done with MMLU?, arXiv:2406.04127'

  - id: EVL-LLM-007
    type: single
    difficulty: 2
    frequency: 3
    points: [数学与代码基准]
    question: |
      HumanEval 有 164 道手写编程题，平均每题约 7.7 个单元测试。EvalPlus 把测试用例自动扩充约 80 倍得到 HumanEval+，发现多个模型的 pass@k 明显下降，部分模型的排名也发生了变化。这说明：
    options:
      A: 'HumanEval 的题目太难、测试太严，导致多数模型的分数偏低，应该换成更简单的题'
      B: '大模型生成的代码大多无法运行，扩充测试后语法错误被集中暴露出来'
      C: '测试不足时部分「通过」的代码其实是错的，单元测试指标会高估正确率，甚至排错名次'
      D: '单元测试覆盖不全，代码评测应改用 BLEU 与参考解比对，衡量得更全面'
    answer: C
    explanation: |
      **结论**：单元测试判分的可靠性取决于测试的充分性。

      EvalPlus 结合 LLM 生成与变异的方式自动构造输入，在 26 个模型上发现大量此前未被发现的错误解答，pass@k 最多下降 19.3%～28.9%；在 HumanEval+ 上，WizardCoder-CodeLlama 与 Phind-CodeLlama 都超过了 ChatGPT，而在原版 HumanEval 上并非如此。

      - A 错：问题不在难度，而在测试覆盖不足；扩充测试后分数是下降而不是上升。
      - B 错：大量代码能通过原始测试，问题是「通过」不等于「正确」。
      - D 错：BLEU 衡量字面相似，比单元测试更不可靠。

      延伸：HumanEval 自 2021 年公开，题目与题解早已广泛传播，还要考虑污染问题，可以配合 LiveCodeBench 这类按时间切分的新题。
    source: 'Liu 等, Is Your Code Generated by ChatGPT Really Correct?（EvalPlus）, arXiv:2305.01210；Chen 等, Codex, arXiv:2107.03374'

  - id: EVL-LLM-008
    type: single
    difficulty: 1
    frequency: 2
    points: [数学与代码基准, 数据污染]
    question: |
      LiveCodeBench 持续从 LeetCode、AtCoder、Codeforces 收集新题，并记录每道题的发布时间。它缓解数据污染的核心思路是：
    options:
      A: '只公开题目、不公开测试用例，模型即使见过题目也拿不到判分标准'
      B: '只用模型训练截止日期之后发布的题来评测，并比较截止日期前后的表现差异来发现污染'
      C: '用 LLM 把收集到的题目全部改写一遍再发布，让模型无法凭记忆认出原题和对应的题解'
      D: '只评测代码的运行速度与内存占用，不评测正确性，因为正确的解法最容易被模型记住'
    answer: B
    explanation: |
      **结论**：用「时间」作为天然的隔离：模型不可能在训练时见过截止日期之后才出现的题。

      LiveCodeBench 论文发布时收录了 2023 年 5 月至 2024 年 5 月发布的 400 道题，除代码生成外，还评测自我修复、代码执行和测试输出预测。对每个模型，可以只在其训练截止日期之后的「时间窗口」内统计成绩；如果模型在截止日期之前的旧题上明显强于之后的新题，就是污染或过拟合的信号。

      注意：新旧题的难度未必一致，模型公布的截止日期也可能不准，所以时间切分是强有力的证据，但不是绝对的证明。

      - A 错：题目公开、答案可被网上的题解泄露，隐藏测试用例不能解决训练数据污染。
      - C 错：改写泄露同样会造成污染，而且不是该基准的做法。
      - D 错：与基准的目标不符。
    source: 'Jain 等, LiveCodeBench, arXiv:2403.07974'

  - id: EVL-LLM-009
    type: code_output
    difficulty: 2
    frequency: 2
    points: [数学与代码基准, 评测协议]
    question: |
      下面是一个简化的数学题判分脚本：先从回答中抽取答案（优先取 `\boxed{}` 中的内容，否则取最后一个数），再分别用「严格字符串匹配」和「数值归一化后比较」两种口径统计答对的题数。输出是什么？
    code: |
      import re
      from fractions import Fraction

      def extract(ans):
          m = re.search(r"\\boxed\{([^{}]*)\}", ans)
          if m:
              return m.group(1).strip()
          nums = re.findall(r"-?\d+(?:\.\d+)?(?:/\d+)?", ans)
          return nums[-1] if nums else ans.strip()

      def normalize(s):
          s = s.replace("$", "").replace(" ", "")
          try:
              return str(Fraction(s))
          except ValueError:
              return s

      gold = ["1/2", "3", "x+1"]
      pred = ["\\boxed{0.5}", "所以答案是 3。", "\\boxed{1+x}"]
      strict = sum(extract(p) == g for p, g in zip(pred, gold))
      loose = sum(normalize(extract(p)) == normalize(g) for p, g in zip(pred, gold))
      print(strict, loose)
      print([normalize(extract(p)) for p in pred])
    answer: |
      1 2
      ['1/2', '3', '1+x']
    explanation: |
      逐题看：
      1. `\boxed{0.5}` 抽取出 `0.5`，与标准答案 `1/2` 字符串不同；归一化时 `Fraction("0.5")` 得到 `1/2`，判对。
      2. 没有 `\boxed{}`，取最后一个数 `3`，两种口径都判对。
      3. `1+x` 与 `x+1` 数学上相等，但不是数值，`Fraction` 解析失败，原样比较，两种口径都判错。

      所以严格匹配只对 1 题，归一化后对 2 题：**同一组回答，换一个判分脚本，准确率就从 33% 变成 67%**。真实评测中要做的还有：用 sympy 一类的工具判断表达式等价、处理单位与百分号、处理多个 `\boxed{}`、避免「取最后一个数」误抽到中间步骤的数字。报告分数时必须说明答案抽取与等价判断的规则，否则不同团队的数字无法比较。

  - id: EVL-LLM-010
    type: fill
    difficulty: 1
    frequency: 2
    points: [指令遵循评测]
    question: |
      IFEval 风格的评测中，4 条提示分别包含 2、3、1、3 条可自动核验的指令，模型分别遵守了 2、2、0、3 条。提示级严格准确率（一条提示中的全部指令都遵守才算对）为 ____ %，指令级严格准确率为 ____ %（保留一位小数）。
    answer: ['50', ['77.8', '77.78']]
    explanation: |
      - **提示级**：第 1 条（2/2）和第 4 条（3/3）全部遵守，第 2 条（2/3）、第 3 条（0/1）不算，$2/4=50\%$；
      - **指令级**：$(2+2+0+3)/(2+3+1+3)=7/9\approx77.8\%$。

      提示级更严格，反映「用户的要求能否被一次满足」；指令级反映「单条约束的遵守率」。IFEval（Zhou 等, 2023）包含 25 类可验证指令、541 条提示，同时报告这两个级别在 strict 与 loose 两种判定口径下的结果，共 4 个数字。比较模型时要说明用的是哪一个。
    source: 'Zhou 等, Instruction-Following Evaluation for Large Language Models, arXiv:2311.07911'

  - id: EVL-LLM-011
    type: short
    difficulty: 2
    frequency: 2
    points: [指令遵循评测]
    question: |
      IFEval 这类「可验证指令」基准测的是什么？它的 strict 与 loose 两种判定口径有何区别？它有哪些局限？如果要评测业务中的复杂指令遵循（多约束、多轮对话、系统提示词），你会怎样设计？
    answer: |
      1. **测什么**：能用程序自动核验的指令，如字数限制、必须包含的关键词、全小写、指定段落数、输出 JSON、以指定语句结尾等。IFEval 有 25 类指令、541 条提示，判分客观、便宜、可复现。
      2. **strict 与 loose**：strict 直接对原始回答运行核验函数；loose 会对回答做若干变换（去掉 `*`、`**` 等 Markdown 修饰，去掉第一行或最后一行，以及它们的组合），只要任一变换后的版本通过就算遵守，用来减少「开头写了一句『好的，以下是……』」之类造成的误判，但也可能引入误放（例如去掉一行后恰好满足字数）。所以两者要一起看。
      3. **局限**：只测表面的、可验证的约束，不测内容是否正确、是否有用；以单轮为主；不考查系统提示词与用户指令冲突时的优先级；约束类型有限，模型可以针对这类格式过拟合；核验函数本身也有边界情况。
      4. **业务评测设计**：
         - 把业务要求拆成约束清单：能程序化的（格式、长度、必含字段、禁用词）写核验函数；语义类的（语气、是否引用政策）用带评分细则的 LLM 评审，并用人工标注校准；
         - 覆盖多约束组合、多轮持续遵守（第 1 轮定下的规则第 5 轮是否还遵守）、系统提示词与用户要求冲突的处理；
         - 同时报告单条约束遵守率与「全部约束同时满足率」，按约束类型拆分；
         - 与回答质量指标一起看，防止「格式全对、内容变差」；
         - 把线上失败案例持续补进回归集。
    rubric:
      - '说明可验证指令的含义与 IFEval 的规模和优点（2 分）'
      - '正确区分 strict 与 loose，并说明 loose 的利弊（3 分）'
      - '指出至少两项局限（只测表面约束、单轮、无冲突处理等）（2 分）'
      - '给出业务评测设计：约束拆解、程序核验与 LLM 评审结合、多轮与冲突、分项与全满足率（3 分）'
    explanation: |
      **常见失分点**：把 IFEval 说成用 GPT-4 打分；不知道 loose 口径做了哪些变换；只报一个总分；业务设计中只说「让 GPT-4 打分」，没有可程序化的核验，也不做人工校准。
    source: 'Zhou 等, Instruction-Following Evaluation for Large Language Models, arXiv:2311.07911'

  - id: EVL-LLM-012
    type: single
    difficulty: 1
    frequency: 3
    points: [对话评测与Arena]
    question: |
      关于 Chatbot Arena（后更名为 LMArena，2026 年 1 月起改名为 Arena）的评测方式，下列说法正确的是：
    options:
      A: '由固定的专家团队按统一的评分细则，对每个模型逐题打 1～10 分，再按平均分从高到低排名'
      B: '使用固定的 80 道多轮题库，由 GPT-4 判断两个模型的回答哪个更好，再按两两之间的胜率排名'
      C: '只比较各模型的平均回答长度与生成速度，回答越快、越详细的模型排名越高，与回答质量无关'
      D: '用户自由提问，两个匿名模型同时作答，由用户投票选优，再用 Bradley-Terry 汇总成排名'
    answer: D
    explanation: |
      **结论**：Arena 是「真实用户、开放问题、匿名成对比较」的众包评测。

      论文（Chiang 等, 2024）报告，截至 2024 年 1 月已收集超过 24 万条投票，来自约 9 万名用户、100 多种语言。用户的问题不预设，两个随机抽取的模型匿名作答，用户投票（也可选平局）后才揭晓模型身份，降低了品牌偏见；排名用 Bradley-Terry 系数表示，并给出置信区间。它的优势是贴近真实使用、难以针对固定题库刷分；局限包括问题分布偏向通用聊天、众包投票者不一定能发现事实错误、回答的长度与格式会影响投票等。

      - A 错：Arena 依赖大量普通用户的投票，而不是固定专家打分。
      - B 错：这更接近 MT-Bench（80 道多轮题、GPT-4 评审）、Arena-Hard 等自动评测的做法。
      - C 错：与评测方式无关。
    source: 'Chiang 等, Chatbot Arena: An Open Platform for Evaluating LLMs by Human Preference, arXiv:2403.04132；Arena 博客 LMArena is now Arena（2026-01-28），https://arena.ai/blog/lmarena-is-now-arena/'

  - id: EVL-LLM-013
    type: multiple
    difficulty: 3
    frequency: 2
    points: [对话评测与Arena, 评测偏差]
    question: |
      关于 Chatbot Arena 一类众包成对评测的局限与改进，下列说法**正确**的有：
    options:
      A: '众包投票者容易忽视事实错误：论文中众包与专家的一致率为 72.8%～83.1%，比专家之间低约 5～10 个点'
      B: '问题来自自愿参与的用户，分布偏向通用聊天和编程，与某个具体业务的需求分布可能差别很大'
      C: '问题由用户实时提出、模型匿名，厂商无法针对题目优化，Arena 的排名不会受到厂商提交策略的影响'
      D: 'Arena-Hard-Auto 从 Arena 真实提问中选出 500 道难题、用 LLM 评审判分，是 Arena 排名的低成本近似'
      E: '回答长度、Markdown 标题与列表等风格会影响投票，Arena 在 2024 年引入了风格控制来校正'
    answer: [A, B, D, E]
    explanation: |
      - A 对：论文在两组共 160 场对战上比较，众包与专家的一致率为 72.8%～83.1%，专家之间为 79.4%～89.8%；作者认为两者约 5%～10% 的差距主要来自众包用户犯错或忽视回答中的事实错误。专家之间也有 10%～20% 的分歧，多因很多问题本来就没有标准答案。
      - B 对：Arena 衡量的是「这批用户在这些问题上的偏好」，业务选型仍需自己的评测集。
      - C 错：The Leaderboard Illusion（Singh 等, 2025）指出，少数厂商可以在发布前私下测试多个变体、只公开最好的结果（论文称 Meta 在发布 Llama 4 前测试了 27 个私有变体），不同厂商获得的对战数据量也差别很大，这些都会让排名偏离真实能力。
      - D 对：Arena-Hard-Auto 论文报告其区分度约为 MT-Bench 的 3 倍，与人类偏好排名的相关度达 98.6%，评测成本约 20 美元。
      - E 对：风格控制把回答长度、Markdown 标题、列表等特征作为协变量加入 Bradley-Terry 回归。LMSYS 2024 年 8 月的分析中，长度是影响最大的风格因素；控制风格后部分模型的名次明显变化。
    source: 'Chiang 等, arXiv:2403.04132；LMSYS 博客 Does Style Matter?（2024-08）；Singh 等, The Leaderboard Illusion, arXiv:2504.20879；Li 等, Arena-Hard 与 BenchBuilder, arXiv:2406.11939'

  - id: EVL-LLM-014
    type: calc
    difficulty: 1
    frequency: 3
    points: [Elo评分]
    question: |
      按 Elo 公式 $E_A=\dfrac{1}{1+10^{(R_B-R_A)/400}}$：

      (1) 模型 A 评分 1200、模型 B 评分 1100，A 的期望胜率是多少？若相差 200 分呢？
      (2) 一局对战中 B 爆冷获胜，取 $K=32$，按 $R'=R+K(S-E)$（胜为 1、负为 0）更新后，两者的评分各是多少？
      (3) A 对 B 的期望胜率为 75% 时，两者大约相差多少分？
    answer: '(1) 约 0.64；相差 200 分时约 0.76；(2) A 约 1179.5，B 约 1120.5；(3) 约 191 分'
    explanation: |
      **(1)** $E_A=1/(1+10^{-100/400})=1/(1+10^{-0.25})=1/(1+0.562)\approx0.640$；相差 200 分时 $1/(1+10^{-0.5})=1/(1+0.316)\approx0.760$。

      **(2)** $E_B=1-0.640=0.360$。
      - A：$1200+32\times(0-0.640)\approx1200-20.5=1179.5$；
      - B：$1100+32\times(1-0.360)\approx1100+20.5=1120.5$。

      爆冷时期望越低的一方赢，评分变化越大；两者的加减量相等，总分守恒。

      **(3)** $0.75=1/(1+10^{-\Delta/400})\Rightarrow10^{-\Delta/400}=1/3\Rightarrow\Delta=400\log_{10}3\approx190.8$ 分。

      **用法提醒**：Elo 与 Bradley-Terry 的分数只有「差值」有意义，常用来换算两个模型的预期胜率；分差的置信区间同样重要，区间重叠很多时排名先后并不可靠。
    source: 'Elo 评分公式；Chiang 等, Chatbot Arena, arXiv:2403.04132'

  - id: EVL-LLM-015
    type: single
    difficulty: 2
    frequency: 2
    points: [Elo评分, 对话评测与Arena]
    question: |
      Chatbot Arena 早期用国际象棋式的在线 Elo 更新排名，2023 年 12 月起改为用 Bradley-Terry（BT）模型对全部投票做最大似然估计。主要原因是：
    options:
      A: '在线 Elo 依赖对局顺序、偏重近期结果，而模型发布后实力固定，用 BT 对全部投票一次性拟合更稳定'
      B: 'Elo 只能在两个选手之间比较，无法同时给几十个模型排出全局名次，只能做两两对比后再人工汇总'
      C: 'BT 模型只需要各模型在公开基准上的分数就能估计胜率，不必再收集大量的成对投票'
      D: 'Elo 无法处理平局，而 Arena 的投票中有相当比例是平局，按 Elo 计算时这些投票都要丢弃'
    answer: A
    explanation: |
      **结论**：在线 Elo 假设选手实力随时间变化，适合「实力在变、比赛按时间进行」的棋手；发布后的模型版本实力固定、全部对局记录都可得，更适合离线、集中地拟合全部数据。

      LMSYS 的说明：在线 Elo 的更新顺序会影响结果，K 值要在「稳定」与「新模型能尽快上升」之间折中，评分波动较大；BT 假设比赛顺序无关，用全部历史数据做最大似然估计，评分明显更稳定，并可以对 BT 分数做 bootstrap 得到置信区间。两种方法得到的平均评分与排名非常接近，展示时仍沿用 Elo 式的分数刻度。

      - B 错：Elo 本来就用于多名选手两两对局后的统一排名。
      - C 错：BT 同样从成对比较数据中估计，不使用公开基准的分数。
      - D 错：平局可以按「半胜半负」计入，两种方法都能处理。
    source: 'LMSYS 博客 Chatbot Arena: New models & Elo system update（2023-12-07）；Chiang 等, arXiv:2403.04132'

  - id: EVL-LLM-016
    type: code_output
    difficulty: 2
    frequency: 2
    points: [Elo评分]
    question: |
      三个模型循环相克：A 赢 B 三次、B 赢 C 三次、C 赢 A 三次，每个模型都是 3 胜 3 负。下面用在线 Elo（初始 1000 分，K = 32）按两种顺序处理同一组对局。输出是什么？
    code: |
      def play(games, K=32):
          r = {"A": 1000.0, "B": 1000.0, "C": 1000.0}
          for w, l in games:
              e = 1 / (1 + 10 ** ((r[l] - r[w]) / 400))   # 胜者赛前的期望胜率
              r[w] += K * (1 - e)
              r[l] -= K * (1 - e)
          return {k: round(v, 1) for k, v in r.items()}

      games = [("A", "B")] * 3 + [("B", "C")] * 3 + [("C", "A")] * 3
      print(play(games))
      print(play(games[::-1]))
    answer: |
      {'A': 988.4, 'B': 1005.5, 'C': 1006.1}
      {'A': 1011.6, 'B': 993.9, 'C': 994.5}
    explanation: |
      同一组对局，只是处理顺序相反，A 从倒数第一变成了第一：
      - 正序时 A 先连赢 B 三次涨分，最后连输给 C 三次时，它的分已经偏高，期望胜率高，输一局扣得更多，所以最终最低；
      - 倒序时 A 先输给 C、再赢 B，结果正好反过来。

      在线 Elo 每次只根据「当前评分」做增量更新，近期对局权重更大，结果依赖顺序。而三者的战绩完全对称，用 Bradley-Terry 对全部数据做最大似然拟合，三者会得到相同的评分（任意两者预期胜率 50%），与顺序无关。这就是 Chatbot Arena 改用 BT 拟合的直观原因。
    source: 'LMSYS 博客 Chatbot Arena: New models & Elo system update（2023-12-07）'

  - id: EVL-LLM-017
    type: judge
    difficulty: 1
    frequency: 2
    points: [Elo评分]
    question: |
      在 Elo / Bradley-Terry 模型中，两个模型的预测胜率只取决于它们的评分之差；把排行榜上所有模型的评分同时加 100 分，任何一对模型的预测胜率都不变。因此不同排行榜的绝对分数不能直接拿来比较。
    answer: true
    explanation: |
      **正确**。BT 模型中 $P(i\succ j)=\sigma\big(\xi_i-\xi_j\big)$（Elo 刻度下是 $1/(1+10^{-(R_i-R_j)/400})$），整体平移不改变任何差值，所以评分只有相对意义：拟合时需要固定一个锚点（如某个模型取固定值或均值取固定值）才能得到唯一解。

      推论：
      - 「模型在 A 榜 1300 分、在 B 榜 1250 分」这类跨榜单比较没有意义；
      - 同一榜单不同时期的绝对分数也可能因加入新模型、重新拟合而整体漂移，应比较同一次拟合中的分差及其置信区间；
      - 这与奖励模型的 BT 损失只依赖分差是同一个道理。
    source: 'Chiang 等, Chatbot Arena, arXiv:2403.04132'

  - id: EVL-LLM-018
    type: single
    difficulty: 2
    frequency: 3
    points: [LLM-as-Judge]
    question: |
      用 GPT-4 这类强模型当评审来判定数学题回答的对错时，MT-Bench 论文发现：即使评审自己能解出这道题，也常被待评回答中的错误推理带偏。论文中效果最好的改进是：
    options:
      A: '把评审的温度调高，让它在判断时多考虑几种可能的解法，减少一条路走到黑'
      B: '改成单点打分（1～10 分），不再要求评审判断对错，避免它被二元判断带偏'
      C: '参考答案引导：先让评审独立解题或给出参考答案，再对照参考答案评判'
      D: '把两个回答的顺序随机打乱、交换后各评一次，消除评审受到的位置干扰'
    answer: C
    explanation: |
      **结论**：对有标准答案的题，让评审「先有自己的答案、再评别人」，比让它边看边评可靠得多。

      论文在 10 道数学题上交换顺序共做 20 次判断：默认提示失败 14 次；思维链提示失败 6 次（评审常重复待评回答中的错误）；参考答案引导只失败 3 次。所以数学、事实类问题常用参考答案引导的评审；能用程序核验答案的，更应直接用程序判分。

      - A 错：提高温度只会增加随机性。
      - B 错：打分方式改变不了「被带偏」的问题，单点打分还更难校准。
      - D 错：交换顺序针对的是位置偏差，与数学判错无关。
    source: 'Zheng 等, Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena, arXiv:2306.05685'

  - id: EVL-LLM-019
    type: multiple
    difficulty: 2
    frequency: 3
    points: [LLM-as-Judge]
    question: |
      关于提高 LLM 评审（LLM-as-a-Judge）可靠性的做法，下列说法**正确**的有：
    options:
      A: 'G-Eval 用各分数 token 的概率对分数加权求和，得到连续分数，缓解整数打分造成的大量并列'
      B: '用与被评模型同一系列的模型当评审最公平：它最理解被评模型的风格，打分的波动也最小'
      C: '要求评审先写出评价理由（思维链）再给分，便于抽查，也常能提高与人工判断的一致性'
      D: '把「好」拆成可逐条检查的评分细则（rubric），比让评审直接给一个笼统的 1～10 分更稳定'
      E: '只要评审模型足够强（如当前最强的闭源模型），评审结果就可以直接当真值，不需要人工标注来校准'
    answer: [A, C, D]
    explanation: |
      - A 对：G-Eval 观察到直接打分时某个分数会占据绝大多数、整数分数之间大量并列，于是用 $\sum_s p(s)\cdot s$ 计算加权分；GPT-4 不提供 token 概率时，论文用 20 次采样来估计。
      - B 错：同系列评审存在自我偏好的风险（Panickssery 等, 2024 发现模型的自我识别能力与自我偏好程度呈线性相关），应尽量用不同来源的评审或多评审投票。
      - C 对：先推理后打分是 G-Eval、MT-Bench 等工作的常用做法；理由也是人工复核的依据。
      - D 对：细则把主观判断拆成多个二元或小范围的判断，减少评审的随意性，也便于定位分歧。
      - E 错：任何评审在具体任务上都可能有系统性偏差，必须用人工标注集测一致性（如一致率与 Cohen's kappa），评审模型或提示词一改就要重测。
    source: 'Liu 等, G-Eval, arXiv:2303.16634；Zheng 等, arXiv:2306.05685；Panickssery 等, LLM Evaluators Recognize and Favor Their Own Generations, arXiv:2404.13076'

  - id: EVL-LLM-020
    type: calc
    difficulty: 2
    frequency: 2
    points: [LLM-as-Judge]
    question: |
      用 G-Eval 的方式给两份摘要按 1～5 分打分。评审模型输出各分数 token 的概率为：

      | 分数 | 1 | 2 | 3 | 4 | 5 |
      |---|---|---|---|---|---|
      | 摘要甲 | 0.05 | 0.10 | 0.25 | 0.40 | 0.20 |
      | 摘要乙 | 0 | 0.02 | 0.08 | 0.50 | 0.40 |

      (1) 若直接取概率最大的分数，两份摘要各得几分？
      (2) 按 $\sum_s p(s)\cdot s$ 加权，各得几分？
      (3) 这说明了什么？
    answer: '(1) 都是 4 分；(2) 甲 3.6 分，乙 4.28 分；(3) 加权得分能区分整数打分下并列的样本，给出更细粒度的连续分数'
    explanation: |
      **(1)** 两份摘要的众数都是 4 分，直接打分时并列。

      **(2)**
      - 甲：$1\times0.05+2\times0.10+3\times0.25+4\times0.40+5\times0.20=0.05+0.2+0.75+1.6+1.0=3.6$；
      - 乙：$2\times0.02+3\times0.08+4\times0.50+5\times0.40=0.04+0.24+2.0+2.0=4.28$。

      **(3)** 评审对乙「更有把握是高分」，对甲则有相当概率给 3 分甚至更低。加权分保留了这部分信息，在大量样本上能显著减少并列、提高与人工评分的相关性（G-Eval 在摘要任务上与人工的 Spearman 相关达到 0.514）。代价是需要拿到 token 概率；拿不到时只能多次采样估计分数分布，成本更高。
    source: 'Liu 等, G-Eval: NLG Evaluation using GPT-4 with Better Human Alignment, arXiv:2303.16634'

  - id: EVL-LLM-021
    type: short
    difficulty: 3
    frequency: 3
    points: [LLM-as-Judge, 评测偏差]
    question: |
      什么是 LLM-as-a-Judge？它有哪几种常见用法，各适合什么场景？有哪些已知的偏差，如何缓解？它的上限与风险在哪里，怎样判断一个评审模型在你的任务上是否可信？
    answer: |
      1. **定义**：用一个（通常更强的）大模型按提示词中的标准评价其他模型的输出，替代或辅助人工评测，成本低、速度快、可规模化。
      2. **三种用法**（MT-Bench 论文的划分）：
         - 单点打分：给一个回答打分，可扩展，但分数会漂移、区分度差，换评审后不可比；
         - 成对比较：判断两个回答谁更好，对细微差别更敏感，适合新旧版本 A/B；候选多时需用 Elo / Bradley-Terry 汇总；
         - 参考答案引导：先给参考答案再评，适合数学、事实类问题。
      3. **已知偏差与缓解**：
         - 位置偏差：交换顺序各评一次，不一致记平局（MT-Bench 中 GPT-4 默认提示下只有约 65% 的判断不受顺序影响）；
         - 长度 / 冗长偏差：细则写明长度不加分，用长度控制胜率或回归校正；
         - 自我偏好：评审与被评模型不同源，多评审投票；
         - 被权威语气、格式或回答中夹带的指令带偏：把被评内容当数据隔离，要求先写理由再打分；
         - 推理与数学判错：参考答案引导，或改用程序判分。
      4. **上限与风险**：评审能力决定上限，判不了自己也不会的题；与被评模型的错误可能相关；被当作优化目标时会被钻空子（奖励投机）；评审模型版本更新会导致分数漂移；高风险场景不能只靠它。
      5. **如何判断可信**：用一批人工标注（最好多人标注并仲裁）的样本，计算评审与人工的一致率和 Cohen's kappa，与人与人之间的一致性对比；看混淆矩阵判断它偏宽还是偏严；按任务类型分别校准；评审模型或提示词一改就重测；上线后定期抽检。
    rubric:
      - '说明三种用法及各自适用场景（2 分）'
      - '列出至少三种偏差并给出对应缓解方法（3 分）'
      - '说明上限与风险：能力上限、可被钻空子、版本漂移等（2 分）'
      - '给出用人工标注校准的方法（一致率、kappa、与人人一致性对比、变更后重测）（3 分）'
    explanation: |
      **常见失分点**：只说「用 GPT-4 打分」不讲偏差；只会「交换顺序」而不知道它治不了长度偏差；认为强评审不需要校准；不知道评审作为训练奖励时会被钻空子；只看一致率而不考虑「碰巧一致」（应看 kappa）。
    source: 'Zheng 等, arXiv:2306.05685；Wang 等, Large Language Models are not Fair Evaluators, arXiv:2305.17926'

  - id: EVL-LLM-022
    type: code_debug
    difficulty: 2
    frequency: 2
    points: [LLM-as-Judge, 评测偏差]
    question: |
      下面的函数用 LLM 评审做成对比较，为了抵消位置偏差，每对回答交换顺序各评一次。上线后发现：换了一个明显偏爱「排在前面的回答」的评审模型后，新模型的胜率反而变得更高、更不可信。请找出 bug 并修正。
    code: |
      def pairwise_result(judge, question, a, b):
          """judge(question, first, second) 返回 'first' 或 'second'。交换顺序各评一次，返回 'a'、'b' 或 'tie'"""
          r1 = judge(question, a, b)          # a 在前
          r2 = judge(question, b, a)          # b 在前
          if r1 == "first" or r2 == "second":
              return "a"
          if r1 == "second" or r2 == "first":
              return "b"
          return "tie"

      def win_rate(judge, pairs):
          """pairs: [(question, a, b)]，平局算半场，返回 a 的胜率"""
          score = {"a": 1.0, "tie": 0.5, "b": 0.0}
          return sum(score[pairwise_result(judge, q, a, b)] for q, a, b in pairs) / len(pairs)
    fixed_code: |
      def pairwise_result(judge, question, a, b):
          """judge(question, first, second) 返回 'first' 或 'second'。交换顺序各评一次，返回 'a'、'b' 或 'tie'"""
          r1 = judge(question, a, b)          # a 在前
          r2 = judge(question, b, a)          # b 在前
          if r1 == "first" and r2 == "second":
              return "a"
          if r1 == "second" and r2 == "first":
              return "b"
          return "tie"

      def win_rate(judge, pairs):
          """pairs: [(question, a, b)]，平局算半场，返回 a 的胜率"""
          score = {"a": 1.0, "tie": 0.5, "b": 0.0}
          return sum(score[pairwise_result(judge, q, a, b)] for q, a, b in pairs) / len(pairs)
    test: |
      always_first = lambda q, x, y: "first"                      # 只有位置偏差的评审
      prefer_long = lambda q, x, y: "first" if len(x) >= len(y) else "second"
      assert pairwise_result(always_first, "q", "A", "B") == "tie"
      assert pairwise_result(prefer_long, "q", "long answer", "short") == "a"
      assert pairwise_result(prefer_long, "q", "short", "long answer") == "b"
      pairs = [("q1", "x", "yy"), ("q2", "yy", "x"), ("q3", "zzz", "y")]
      assert win_rate(always_first, pairs) == 0.5                  # 纯位置偏差不应让任何一方占优
      assert abs(win_rate(prefer_long, pairs) - 2 / 3) < 1e-9
    answer: |
      **问题**：第 5、7 行用了 `or`。只要「a 在前时判前者胜」这一次成立，就直接判 a 胜，第二次的结论被忽略。对一个总是偏爱前一位置的评审，`r1 == "first"` 恒成立，a（总是先被放在前面）每一对都赢，位置偏差原封不动地进入了结果。

      **修正**：两次结论一致才判胜负，不一致记平局：

      ```python
      if r1 == "first" and r2 == "second":
          return "a"
      if r1 == "second" and r2 == "first":
          return "b"
      return "tie"
      ```
    explanation: |
      交换顺序的目的，是让「位置」这个干扰因素在两次评判中各占一次，只有不依赖位置的结论才被采信。修正后，纯位置偏差的评审在每一对上都给出平局，总胜率为 50%，不再偏向任何一方。

      延伸：
      - 两次结论不一致的比例本身就是重要的诊断指标，比例高说明评审在这类任务上不可靠，应改进提示词、换评审或引入人工；
      - 交换顺序只能消除位置偏差，治不了长度偏差：测试中偏爱长回答的评审在两种顺序下结论一致，依然会让长回答胜出；
      - 有的实现会让评审直接输出「平局」，或用两次打分的平均值，原则相同：不能只看一次的结论。
    source: 'Zheng 等, arXiv:2306.05685；Wang 等, arXiv:2305.17926'

  - id: EVL-LLM-023
    type: single
    difficulty: 2
    frequency: 2
    points: [评测偏差]
    question: |
      Wang 等（2023）的实验中，用 ChatGPT 当评审比较 Vicuna-13B 与 ChatGPT 的回答：仅仅交换两个回答的先后顺序，就能让 Vicuna-13B 在 80 道题中的 66 道上「胜出」。这一现象及其最直接的缓解办法是：
    options:
      A: '长度偏差；把两个回答截断到相同的长度后再评，消除长回答的优势'
      B: '位置偏差；每对回答交换顺序各评一次，两次一致才算胜，不一致记平局'
      C: '自我偏好；ChatGPT 偏爱自己的回答，换一个更大的、不同系列的评审模型就能彻底消除'
      D: '数据污染；评审见过这 80 道题，换一批评审没见过的新题即可'
    answer: B
    explanation: |
      **结论**：评审的判断随回答出现的位置而改变，这是位置偏差，交换顺序是最直接的对策。

      论文提出了三种校准：多证据校准（先写出多条证据再打分）、平衡位置校准（综合不同顺序的结果）、人在回路校准（用指标找出难以判定的样本交给人工）。MT-Bench 论文也测到，GPT-4 在默认提示下只有约 65% 的判断不受顺序影响，剩下的大多偏向第一个位置。

      - A 错：现象由「交换顺序」触发，与长度无关；截断回答还会破坏内容。
      - C 错：更强的评审能减轻、但不能消除位置偏差；自我偏好也解释不了「只换顺序结论就反转」，它会让 ChatGPT 当评审时偏向 ChatGPT，而不是偏向 Vicuna。
      - D 错：与训练数据无关。
    source: 'Wang 等, Large Language Models are not Fair Evaluators, arXiv:2305.17926；Zheng 等, arXiv:2306.05685'

  - id: EVL-LLM-024
    type: calc
    difficulty: 3
    frequency: 2
    points: [评测偏差, LLM-as-Judge]
    question: |
      用 LLM 评审比较新模型 A 与旧模型 B 的 200 对回答，每对交换顺序各评一次，结果为：
      - 两次都判 A 胜：70 对；两次都判 B 胜：50 对；
      - 两次都判「排在前面的」胜（结论随顺序翻转）：60 对；
      - 两次都判「排在后面的」胜：20 对。

      (1) 两次结论一致的比例是多少？在不一致的样本中，偏向前一位置的占多少？
      (2) 按「两次一致才算胜、不一致记平局、平局算半场」计算 A 的胜率。
      (3) 如果只评一次，并且总是把 A 放在前面，A 的胜率会是多少？与 (2) 相比偏差多大？
    answer: '(1) 一致率 60%；不一致的样本中 75% 偏向前一位置；(2) 55%；(3) 65%，高估 10 个百分点'
    explanation: |
      **(1)** 一致：$70+50=120$ 对，占 $120/200=60\%$；不一致 80 对，其中偏向前一位置 60 对，占 $60/80=75\%$。

      **(2)** A 胜 70 对，平局 80 对：$(70+0.5\times80)/200=110/200=55\%$。

      **(3)** A 总在前面时，A 会在「两次都判 A 胜」的 70 对和「判前者胜」的 60 对上获胜，胜率 $130/200=65\%$，比交换后的 55% 高出 10 个点。反过来总把 B 放在前面，A 只赢 $70+20=90$ 对，胜率 45%。只评一次时，结论取决于你碰巧怎么排列。

      **解读**：40% 的样本两次结论不一致，说明这个评审在该任务上很不稳定；即使交换顺序后得出 55% 的胜率，也要配合置信区间和人工抽检，必要时换评审或改写评分细则。

  - id: EVL-LLM-025
    type: judge
    difficulty: 2
    frequency: 2
    points: [评测偏差]
    question: |
      成对比较时，把两个回答的顺序交换各评一次、只在两次结论一致时才判胜负，就能同时消除位置偏差和长度偏差。
    answer: false
    explanation: |
      **错误**。交换顺序只针对位置偏差：位置在两次评判中各出现一次，相互抵消。长度偏差与位置无关，如果评审偏爱更长的回答，那么无论长回答放在前面还是后面，它都会胜出，两次结论「一致」，偏差原封不动地进入结果。

      缓解长度偏差要用别的办法：
      - 评分细则明确「长度本身不加分」，按信息量和正确性打分；
      - 统计上控制长度，如 AlpacaEval 2.0 的长度控制胜率、Chatbot Arena 的风格控制；
      - 构造长度相近的对照，或单独报告回答的平均长度；
      - 人工抽检长回答获胜的样本。
    source: 'Dubois 等, Length-Controlled AlpacaEval, arXiv:2404.04475'

  - id: EVL-LLM-026
    type: single
    difficulty: 2
    frequency: 2
    points: [评测偏差, 对话评测与Arena]
    question: |
      AlpacaEval 2.0 的「长度控制胜率」（length-controlled win rate）是怎样去除评审的长度偏差的？
    options:
      A: '把所有回答截断到与基线回答同样的长度后再交给评审，从源头上消除长度差异'
      B: '直接丢弃比基线回答更长的样本，只在不长于基线的回答上统计胜率'
      C: '在评审的提示词里明确要求它忽略回答长度、只看内容质量，再用新提示词重新计算胜率'
      D: '用广义线性模型拟合评审偏好，把长度差作为解释变量，再令长度差为 0 预测胜率'
    answer: D
    explanation: |
      **结论**：这是统计上的「控制变量」：先估计长度对偏好的影响，再在反事实的「等长」条件下读出偏好，回答「如果两个回答一样长，评审会偏向谁」。

      论文报告，长度控制后 AlpacaEval 与 Chatbot Arena 排名的 Spearman 相关从 0.94 提高到 0.98，也更不容易被「让模型写长一点」这类做法刷分。Chatbot Arena 在 2024 年推出的风格控制思路相同：把回答长度、Markdown 标题、列表、加粗等特征作为协变量加入 Bradley-Terry 回归。

      - A 错：截断会破坏内容，评的就不是原回答了。
      - B 错：丢弃样本会引入选择偏差，也浪费数据。
      - C 错：提示词能减轻、但不能可靠消除偏差，也无法量化剩余的偏差。
    source: 'Dubois 等, Length-Controlled AlpacaEval: A Simple Way to Debias Automatic Evaluators, arXiv:2404.04475；LMSYS 博客 Does Style Matter?（2024-08）'

  - id: EVL-LLM-027
    type: single
    difficulty: 1
    frequency: 2
    points: [数据污染]
    question: |
      BIG-bench 要求在每个任务文件中写入一段 canary 字符串（声明「基准数据不应出现在训练语料中」，并附一个固定的 GUID）。这样做的主要目的是：
    options:
      A: '让数据构建者能搜索并过滤掉基准数据，事后还能检查模型能否复现这个 GUID 来判断污染'
      B: '作为加密密钥：题目的标准答案用这段 GUID 加密存放，防止答案被人直接看到或抓取'
      C: '标记题目所属的任务与难度等级，方便评测框架按任务和难度分组统计成绩'
      D: '提示模型这是一道评测题，让它切换到更严谨的作答模式，从而提高在该基准上的表现'
    answer: A
    explanation: |
      **结论**：canary 字符串是「预防加检测」的标记：过滤时有据可查，泄露后有迹可循。

      BIG-bench 的说明是：任务文件和讨论 BIG-bench 的文档都应包含这段字符串，方便从网页爬取的语料中过滤；它还提供了专门的任务，通过检查模型是否「认识」这个 GUID（例如比较真 GUID 与随机 GUID 的对数概率，或给出前半段让模型补全）来事后诊断污染。很多后来的基准也采用了同样的做法。

      局限：依赖训练方自觉过滤；被转载、改写、翻译后丢掉 canary 的副本照样会进入语料；模型复现不出 GUID 也不能证明没被污染。

      - B 错：canary 是明文声明，不加密任何内容，答案照样公开。
      - C 错：它不表示任务或难度，整个基准用的是同一个 GUID。
      - D 错：canary 的目的不是让模型「知道这是评测」；模型若因见过它而改变行为，恰恰说明基准数据混进了训练。
    source: 'BIG-bench 文档（github.com/google/BIG-bench/blob/main/docs/doc.md）；Srivastava 等, Beyond the Imitation Game, arXiv:2206.04615'

  - id: EVL-LLM-028
    type: code_output
    difficulty: 2
    frequency: 2
    points: [数据污染]
    question: |
      Min-K% Prob 用「一段文本中最低的 k% 个 token 对数概率的平均值」判断文本是否出现在训练数据中。下面对两段同样长度的文本分别计算 Min-20% 分数与全部 token 的平均对数概率。输出是什么？
    code: |
      def min_k(logps, k=0.2):
          n = max(1, int(len(logps) * k))
          return sum(sorted(logps)[:n]) / n

      seen   = [-0.1, -0.3, -0.2, -0.5, -0.4, -0.2, -0.1, -0.6, -0.3, -0.2]
      unseen = [-0.1, -2.5, -0.2, -0.3, -4.0, -0.2, -0.1, -0.4, -0.3, -0.2]
      print(round(min_k(seen), 2), round(min_k(unseen), 2))
      print(round(sum(seen) / 10, 2), round(sum(unseen) / 10, 2))
    answer: |
      -0.55 -3.25
      -0.29 -0.83
    explanation: |
      - Min-20%：10 个 token 取最低的 2 个。`seen` 是 −0.6 与 −0.5，平均 −0.55；`unseen` 是 −4.0 与 −2.5，平均 −3.25。
      - 全体平均：`seen` 为 −0.29，`unseen` 为 −0.83。

      **原理**：Min-K% Prob 的假设是，没见过的文本里往往有几个「意外」的离群 token，概率很低；见过的文本很少出现这种离群值。只看最低的那部分 token，能把这种差别放大（本例中两者的差距从 0.54 扩大到 2.7），比看整体平均更敏感。分数高于某个阈值就判为「可能见过」。

      **注意**：它只给出概率性证据，阈值需要在已知「见过 / 没见过」的数据上标定（论文为此构建了 WikiMIA 基准）；本身就很常见、很好预测的文本也会得到高分，不能单凭它断定污染。
    source: 'Shi 等, Detecting Pretraining Data from Large Language Models（Min-K% Prob）, arXiv:2310.16789'

  - id: EVL-LLM-029
    type: multiple
    difficulty: 2
    frequency: 2
    points: [数据污染]
    question: |
      在拿不到模型训练数据的情况下，下列检测或缓解基准污染的做法，说法**正确**的有：
    options:
      A: '困惑度测试：模型在某段基准文本上的困惑度很低，就足以证明这段文本出现在它的训练数据中'
      B: '补全测试：给出题目的前半段，看模型能否逐字补全后半段或直接说出答案'
      C: '时间切分：只用模型训练截止日期之后发布的题评测，或比较截止日期前后发布的题的表现差异'
      D: '时间核验：只要题目发布在模型公布的训练截止日期之后，就可以确定这些题没有被污染'
      E: '扰动测试：仿照原基准重新出题（如 GSM1k 对照 GSM8K），分数明显下降说明模型可能记住了原题'
    answer: [B, C, E]
    explanation: |
      - A 错：常见、规范的文本本来就容易预测，低困惑度只是概率性的线索；需要与对照文本比较（如 Min-K% Prob 在已知标签的数据上标定阈值）。
      - B 对：能逐字补全题目或答案是很强的记忆证据，但偏定性，难以量化。
      - C 对：时间是天然的隔离（如 LiveCodeBench 按发布时间切分），但新旧题的难度要可比。
      - D 错：截止日期可能不准，答案也可能更早被转载到别处；「之前发布」也不一定被污染。要综合多种证据下结论。
      - E 对：GSM1k 按 GSM8K 的风格与难度重新出了一批从未公开的题，发现部分模型家族在几乎所有尺寸上都出现系统性下降，而前沿模型的过拟合迹象很小；模型生成 GSM8K 样例的概率越高，两者的差距往往越大（Spearman $r^2=0.36$）。
    source: 'Zhang 等, A Careful Examination of LLM Performance on Grade School Arithmetic（GSM1k）, arXiv:2405.00332；Jain 等, LiveCodeBench, arXiv:2403.07974'

  - id: EVL-LLM-030
    type: scenario
    difficulty: 3
    frequency: 3
    points: [数据污染, 评测协议]
    question: |
      某开源新模型宣称在 GSM8K 上达到 95%。团队自建了一批与 GSM8K 风格、难度相近、从未公开的新题，用同一套脚本评测：该模型只有 78%；作为对照，另一个在 GSM8K 上 90% 的模型在新题上为 86%。请分析可能的原因，说明如何进一步确认是否存在数据污染，以及在选型报告中应如何呈现结论。
    answer: |
      **1. 可能的原因**（按排查顺序）
      - **评测协议不一致**：官方的 95% 可能用了不同的提示词、少样本示例、思维链、答案抽取规则或多次采样，与自建脚本不可比；
      - **新题难度不可比**：自建题的步数、数字大小、语言风格可能更难，或有标注错误；
      - **统计噪声**：自建题数量有限，差距可能落在置信区间内；
      - **数据污染或过拟合**：GSM8K 测试题（或其改写、由它衍生的合成数据）进入了训练数据，或者模型过度适配了 GSM8K 的出题模板。对照模型从 90% 只降到 86%，而该模型从 95% 降到 78%，降幅明显不同，污染或过拟合的嫌疑较大。

      **2. 进一步确认**
      - **对齐协议**：先用官方公布的评测设置复现 95%，再用同一设置跑新题，排除协议差异；
      - **校验新题**：请人工确认题目与答案无误，比较人工解题正确率、解题步数、数值大小，确认与 GSM8K 难度相当（GSM1k 的做法）；
      - **统计检验**：计算两个集合准确率的置信区间，对多个模型比较「GSM8K 分数 − 新题分数」的差距；
      - **记忆探测**：扰动原题（换数字、换人名、改写措辞）看分数是否大幅下降；给出原题前半段看能否逐字补全；比较模型在 GSM8K 测试题与新题上的 Min-K% 等似然指标；
      - **查资料**：阅读模型报告与数据说明，看训练数据中是否包含相关数学数据集或其合成衍生数据。

      **3. 报告呈现**
      - 同时报告公开基准分数与私有新题分数，附题量、置信区间和完整评测设置；
      - 明确证据强度：只有「降幅异常」时写「疑似过拟合或污染」，有补全或扰动证据时写「存在记忆证据」，不要把推测写成定论；
      - 选型结论以私有集和业务评测为主，公开基准只作参考。
    rubric:
      - '先排查协议差异、难度可比性与统计噪声，而不是直接断定污染（3 分）'
      - '利用对照模型的降幅差异进行推理（1 分）'
      - '给出至少三种确认手段：复现官方设置、扰动测试、补全测试、似然指标、资料核查等（3 分）'
      - '报告中区分证据强度，同时呈现公开与私有分数并附置信区间（2 分）'
      - '说明选型应以私有集和业务评测为主（1 分）'
    explanation: |
      **常见失分点**：一看到分数下降就断定「刷榜作弊」；不检查评测协议是否一致；自建新题不做难度校验；不给置信区间；报告中只写结论不写证据和评测设置。
    source: 'Zhang 等, GSM1k, arXiv:2405.00332；Shi 等, Min-K% Prob, arXiv:2310.16789'

  - id: EVL-LLM-031
    type: calc
    difficulty: 2
    frequency: 2
    points: [评测协议]
    question: |
      用 lm-evaluation-harness 风格的似然打分评测一道选择题：分别计算每个候选答案文本在题干之后的对数似然。三个候选的对数似然与字符数为：「Paris」−2.0（5 个字符）、「the city of Lyon」−4.0（16 个字符）、「Marseille」−3.0（9 个字符）。标准答案是「Paris」。分别按 acc（取对数似然最大的选项）和 acc_norm（对数似然除以字符数后取最大）判定，这道题是否答对？
    answer: 'acc 选 Paris，答对；acc_norm 选 the city of Lyon（−0.25 大于 −0.33 和 −0.40），答错'
    explanation: |
      **acc**：比较原始对数似然，−2.0 > −3.0 > −4.0，选 Paris，**答对**。

      **acc_norm**：按字符数归一化：
      - Paris：$-2.0/5=-0.40$；
      - the city of Lyon：$-4.0/16=-0.25$；
      - Marseille：$-3.0/9\approx-0.33$。

      最大的是 −0.25，选 the city of Lyon，**答错**。

      **要点**：对数似然是逐 token 累加的负数，候选越长总分越低，所以原始 acc 偏向短选项；按长度归一化（lm-evaluation-harness 的 acc_norm 按字符数归一化）修正了这一点，却可能反过来偏向长选项。两种口径在同一模型上可能差好几个点，论文和排行榜各自报告其中之一，因此跨来源比较分数前，必须确认用的是哪个指标、哪种提示格式。
    source: 'EleutherAI lm-evaluation-harness 源码（lm_eval/api/task.py 中 acc 与 acc_norm 的计算）'

  - id: EVL-LLM-032
    type: multiple
    difficulty: 2
    frequency: 3
    points: [评测协议]
    question: |
      下列因素中，会让同一个模型在同一个基准上的分数出现明显差异的有：
    options:
      A: '提示词格式的细微变化（如分隔符、空格、大小写）：有研究报告在少样本设定下最多可相差 76 个百分点'
      B: '推理模型的最大生成长度：设得太小会截断思考过程，导致根本没有给出最终答案'
      C: '是否使用思维链，以及答案抽取的规则'
      D: '只要使用同一份题目，不同评测框架给出的分数就可以直接横向比较'
      E: '少样本示例的数量、选择与排列顺序'
    answer: [A, B, C, E]
    explanation: |
      - A 对：Sclar 等（2023）发现 LLaMA-2-13B 在少样本设定下，仅改变不影响语义的格式就能让准确率相差最多 76 个百分点，且这种敏感性在更大的模型、更多示例和指令微调后依然存在；作者建议报告一组合理格式下的分数区间。
      - B 对：推理模型的思考过程很长，DeepSeek-R1 评测时把最大生成长度设为 32768 token；长度不够时模型还没写出答案就被截断。
      - C 对：思维链对推理类基准影响很大；答案抽取规则写得不好，会把答对的回答判错。
      - D 错：不同框架的提示模板、少样本示例、打分方式（生成或似然）、答案抽取都可能不同，同一份题目也会得到不同分数。报告时必须写明完整的评测设置。
      - E 对：少样本示例影响模型对格式与任务的理解，选择与顺序都会带来波动。
    source: 'Sclar 等, Quantifying Language Models'' Sensitivity to Spurious Features in Prompt Design, arXiv:2310.11324；DeepSeek-R1 模型卡'

  - id: EVL-LLM-033
    type: single
    difficulty: 2
    frequency: 2
    points: [评测协议, 数学与代码基准]
    question: |
      DeepSeek-R1 报告推理类基准成绩时，以温度 0.6、top-p 0.95 为每道题采样 64 个回答，用它们的平均正确率估计 pass@1（最大生成长度 32768 token），而不是用贪心解码只跑一次。最主要的原因是：
    options:
      A: '采样能让模型探索更多解法，分数一定高于贪心解码，报告的成绩因此更好看'
      B: '贪心解码每一步都要对整个词表做完整排序，对输出很长的推理模型来说比采样更耗算力'
      C: '贪心解码易让推理模型陷入重复，单次结果方差也大，多次采样取平均能更稳定地估计 pass@1'
      D: '为了让每道题至少有一次答对，从而报告 64 次采样中的最好成绩，充分体现模型的能力上限'
    answer: C
    explanation: |
      **结论**：「多次采样取平均的 pass@1」既符合推理模型的推荐用法，又降低了评测本身的随机误差。

      DeepSeek-R1 的模型卡说明：评测时最大生成长度 32768，需要采样的基准用温度 0.6、top-p 0.95，每题生成 64 个回答估计 pass@1；使用建议中也要求温度在 0.5～0.7，以避免无休止的重复或不连贯。小题量的基准（AIME 两场各 15 题，共 30 题，一题就是 3.3 分）里，单次运行的偶然对错会让分数大幅波动，取平均能显著稳定结果（但压不低题目抽样本身的方差：题少就是题少）。

      - A 错：采样并不保证更高分，目的在于稳定和与推荐用法一致。
      - B 错：贪心解码每一步只需取概率最大的 token，并不比采样更耗算力。
      - D 错：那是 pass@64（只要有一次答对就算对），与平均正确率是不同的指标；多数投票的结果（如 cons@64）也要单独标注，不能混称为 pass@1。
    source: 'DeepSeek-R1 模型卡（Evaluation 与 Usage Recommendations）'

  - id: EVL-LLM-034
    type: scenario
    difficulty: 3
    frequency: 3
    points: [评测协议, 评测偏差]
    question: |
      团队复现某开源模型的公开成绩：官方报告 MMLU-Pro 70.2%、GSM8K 92%，你们用自己写的评测脚本只测出 62% 和 81%。领导怀疑官方在「刷分」。请给出排查思路与检查清单，并说明如何写一份可复现的评测报告。
    answer: |
      **1. 排查原则**：先假设是评测协议差异，逐项对齐、一次只改一个因素；在协议完全一致后仍有明显差距，才考虑模型版本问题或官方结果有误。

      **2. 检查清单**
      - **模型与精度**：权重版本是否一致（Base / Instruct、具体版本号），是否被量化，推理框架与数值精度；
      - **提示与模板**：是否套用了正确的对话模板与系统提示词；是否重复添加 BOS；少样本示例的数量与内容；是否要求思维链；
      - **解码参数**：贪心还是采样、温度与 top-p、每题采样次数；**最大生成长度**是否太短导致截断（思维链被截断最常见）；停止条件是否过早触发；
      - **判分方式**：生成式判分还是似然打分；acc 还是 acc_norm；答案抽取正则是否覆盖了模型的实际输出格式（如 `\boxed{}`、「答案是 B」）；数值等价判断；
      - **数据集版本**：MMLU-Pro 的版本与子集，GSM8K 的测试集是否完整（1319 题）；
      - **工具版本**：评测框架版本、脚本中的默认参数。

      **3. 定位方法**
      - 优先运行官方公开的评测脚本或其指定的框架配置，看能否复现；
      - 抽查判错样本：区分「答案抽取失败」「输出被截断」「真的做错了」三类，往往大部分差距来自前两类；
      - 逐项替换配置，记录每一项带来的分数变化；
      - 计算置信区间，确认剩余差距是否超出噪声。

      **4. 可复现的评测报告**：写明模型与权重哈希、精度、推理框架及版本；完整提示词与模板、少样本示例；解码参数与采样次数、随机种子；判分与答案抽取规则；数据集版本与题量；分数及置信区间；典型的成功与失败样例；与官方设置的差异说明。
    rubric:
      - '提出先对齐协议、逐项排查的原则，而不是直接认定刷分（2 分）'
      - '检查清单覆盖模型与模板、解码参数与截断、判分与答案抽取、数据集与工具版本（4 分）'
      - '给出定位方法：复现官方脚本、抽查判错样本、逐项消融、置信区间（2 分）'
      - '说明可复现报告应包含的要素（2 分）'
    explanation: |
      **常见失分点**：一上来就怀疑造假；只检查提示词，不检查最大生成长度与答案抽取（这两项最常造成大幅偏低）；不看判错样本；报告里只有分数没有设置。
    source: 'Sclar 等, arXiv:2310.11324'

  - id: EVL-LLM-035
    type: single
    difficulty: 1
    frequency: 2
    points: [长上下文评测]
    question: |
      RULER 用来报告模型的「有效上下文长度」。它的定义是：
    options:
      A: '模型配置文件中的 max_position_embeddings，即位置编码能表示的最大长度'
      B: '以 Llama-2-7B 在 4K 长度下的平均得分（85.6%）为门槛，模型仍高于该门槛的最大测试长度'
      C: '在原版大海捞针测试中，所有深度与长度组合都能全部通过的最大长度'
      D: '模型在长文档上的困惑度开始明显上升时对应的长度，即长度外推开始失效的位置'
    answer: B
    explanation: |
      **结论**：有效长度是「在一组有难度的任务上，表现仍不低于一个固定基准水平」的最大长度。

      RULER 包含 13 个任务，分为检索（多种大海捞针变体）、多跳追踪（变量追踪）、聚合（高频词提取）和加入干扰段落的问答四类。论文评测了 17 个长上下文模型：几乎都能在原版大海捞针上接近满分，但随长度增加明显下降；它们都宣称支持 32K 以上，却只有约一半在 32K 时仍保持令人满意的表现。

      - A 错：那是标称的位置上限，不代表能用好。
      - C 错：大海捞针只考字面检索，过于简单。
      - D 错：困惑度主要反映局部预测，不能说明模型用上了远处的信息。
    source: 'Hsieh 等, RULER: What''s the Real Context Size of Your Long-Context Language Models?, arXiv:2404.06654'

  - id: EVL-LLM-036
    type: multiple
    difficulty: 2
    frequency: 2
    points: [长上下文评测]
    question: |
      关于长上下文评测，下列说法**正确**的有：
    options:
      A: 'LongBench v2 有 503 道多选题，上下文 8K～200 万词，人类专家限时 15 分钟的正确率只有 53.7%'
      B: '长上下文评测只需要在模型宣称的最大长度上测一次：最长的长度能通过，更短的长度自然没有问题'
      C: 'RULER 只有检索类任务：它把大海捞针扩展成多根针、多种针型和多个查询，用来估计有效长度'
      D: 'NoLiMa 让问题与「针」几乎没有字面重叠；在 32K 长度下，13 个模型中有 11 个跌到短上下文基线的一半以下'
      E: '只要模型在大海捞针测试的所有长度和所有插入深度上全部通过，就说明它也能可靠地完成长文档中的多跳推理与信息汇总'
    answer: [A, D]
    explanation: |
      - A 对：LongBench v2 覆盖单文档与多文档问答、长上下文学习、长对话历史、代码仓库与长结构化数据六类任务；直接作答的最好模型为 50.1%，加长推理的 o1-preview 为 57.7%。
      - B 错：应在多个长度（如 4K～128K）和多个证据位置上测，画出随长度与位置变化的曲线，才能看出在哪里开始退化；「中间丢失」等现象说明短一些的长度、特定的证据位置同样可能出错。
      - C 错：多根针、多种针型、多个查询只是 RULER 检索类任务的变体；它还包含多跳追踪（变量追踪）、信息聚合（高频词提取）和加入干扰段落的问答。这些任务难度可调，用来估计有效长度。
      - D 对：NoLiMa（ICML 2025）指出传统大海捞针允许模型靠「字面匹配」找针；去掉字面重叠后，模型必须靠语义联想才能找到针，即使是表现较好的 GPT-4o，也从短上下文的 99.3% 降到 32K 时的 69.7%。
      - E 错：大海捞针只考单点的字面检索，「全绿」不代表能整合分散的信息。
    source: 'Modarressi 等, NoLiMa, arXiv:2502.05167；Bai 等, LongBench v2, arXiv:2412.15204；Hsieh 等, RULER, arXiv:2404.06654'

  - id: EVL-LLM-037
    type: single
    difficulty: 3
    frequency: 2
    points: [安全评测, 评测协议]
    question: |
      早期不少越狱研究用「回答里是否出现拒绝短语（如 I'm sorry、I cannot）」来判定攻击是否成功。HarmBench 对这种做法提出了批评，下列说法正确的是：
    options:
      A: '关键词匹配要对每条回答遍历上百条拒绝短语，速度太慢，无法用于大规模评测'
      B: '关键词匹配的问题只在于短语列表不全，补充更多语言和说法的拒绝短语后就足够可靠'
      C: '关键词匹配只适用于英文模型，HarmBench 的主要改进是把拒绝短语翻译成多种语言后再做匹配'
      D: '结果随生成长度大幅波动（攻击成功率最多差 30%），也识别不了「先拒绝、后照做」，故改用分类器判定'
    answer: D
    explanation: |
      **结论**：判定方法本身就是安全评测协议的核心，判定不标准，攻击成功率（ASR）就没有可比性。

      HarmBench 指出，此前的工作至少使用了九种互不相同的评测设置，难以比较；用子串匹配计算 ASR 时，生成长度这个从未统一的参数就能让结果变化多达 30%。它把生成长度固定为 512 token，并用微调的 Llama 2 13B 分类器判定（能识别「先拒绝、后照做」和答非所问），在人工标注的验证集上与人类的一致率约 93%，高于 GPT-4 评审的约 88% 和 Llama Guard 的约 67%。HarmBench 共有 510 个有害行为，比较了 18 种红队方法与 33 个目标模型和防御。

      - A 错：关键词匹配非常快，遍历几百条短语也只是毫秒级。
      - B 错：问题不在短语列表全不全：用了拒绝短语也可能接着照做，没用也可能实际拒绝了，结果还随生成长度大幅波动，补短语解决不了。
      - C 错：与语言无关；HarmBench 的改进是固定生成长度并改用分类器判定，而不是翻译拒绝短语。
    source: 'Mazeika 等, HarmBench, arXiv:2402.04249'

  - id: EVL-LLM-038
    type: multiple
    difficulty: 2
    frequency: 2
    points: [安全评测, 评测维度]
    question: |
      关于大模型的安全评测，下列说法**正确**的有：
    options:
      A: 'TruthfulQA 用人们常有误解的问题测试回答是否真实，可以作为可靠性评测的一部分'
      B: '更新系统提示词、接入新工具或更换检索数据后，安全评测都要作为回归门禁重新跑'
      C: '安全评测要同时看两面：有害请求上的攻击成功率（如 HarmBench），以及无害请求上的过度拒答（如 XSTest）；只看一面会鼓励「一概拒绝」或「有求必应」'
      D: '越狱评测的结论与所用的攻击方法强相关，在固定攻击集上攻击成功率低，不代表面对自适应攻击时同样安全'
      E: '只要模型在公开安全基准上的攻击成功率为 0，就可以认为它在任何部署场景下都是安全的'
    answer: [A, B, C, D]
    explanation: |
      - A 对：TruthfulQA 共 817 道题，覆盖健康、法律、金融等 38 个类别。
      - B 对：提示词、工具、检索数据、护栏的任何变化都可能改变安全表现（例如新接入的工具带来新的间接注入入口），安全评测应作为每次变更的回归门禁，而不是发布前做一次就结束。
      - C 对：XSTest 用 250 条措辞像有害、实际无害的提示（另有 200 条不安全的对照提示）检测「夸大安全」；与有害请求的攻击成功率放在一起，才能看清安全与有用之间的权衡。
      - D 对：HarmBench 同时比较多种攻击方法正是为此；评测集应持续加入新的攻击方式，并配合人工红队。
      - E 错：公开基准覆盖有限，还可能被针对性优化；部署场景（工具权限、用户群体、语言）不同，风险也不同。
    source: 'Röttger 等, XSTest, arXiv:2308.01263；Mazeika 等, HarmBench, arXiv:2402.04249；Lin 等, TruthfulQA, arXiv:2109.07958'

  - id: EVL-LLM-039
    type: judge
    difficulty: 2
    frequency: 2
    points: [安全评测]
    question: |
      TruthfulQA（817 道题，覆盖健康、法律、金融、政治等 38 个类别）专门收集人们常有误解的问题。论文发现：表现最好的模型只有 58% 的回答是真实的（人类为 94%），而且更大的模型往往反而更不真实；作者认为这是因为更大的模型更善于模仿训练文本中流传的错误说法。
    answer: true
    explanation: |
      **正确**。这是 TruthfulQA 论文（Lin 等, ACL 2022）的核心发现，被称为「模仿性错误」（imitative falsehoods）：问题专门针对常见误解设计，模型从人类文本中学到的流行错误说法会被复现，而模型越大，越忠实地拟合训练分布，这类错误越多，呈现「逆缩放」。

      启示：
      - 单靠扩大规模不能解决真实性问题，需要以「真实」为目标的微调或对齐；
      - 评测要针对具体的失败模式设计，平均性能好不代表在这类陷阱题上可靠；
      - 解读时也要注意时代背景：论文测试的是 GPT-3 等早期模型，后来经过对齐的模型在该基准上已有明显提升，而基准本身也存在被针对性优化的可能。
    source: 'Lin 等, TruthfulQA: Measuring How Models Mimic Human Falsehoods, arXiv:2109.07958'

  - id: EVL-LLM-040
    type: design
    difficulty: 3
    frequency: 3
    points: [评测维度, 评测协议, 数据污染, LLM-as-Judge]
    question: |
      公司要为自研大模型（以及选型时的外部模型）建立一套统一的评测体系，用于训练迭代中的回归、版本发布决策和外部模型选型。请设计：评测维度与评测集构成、判分方式、评测协议与版本管理、污染控制、统计与报告方式、发布门禁，以及如何与线上指标对齐。
    answer: |
      **1. 需求澄清**：服务对象（训练团队要快速回归、业务方要发布决策、采购要选型）；业务场景（客服、代码、数据分析……）；预算与频率（每个检查点跑小集、发布前跑全集）。

      **2. 评测维度与评测集**
      - 通用能力：知识与推理（MMLU-Pro、GPQA）、数学（GSM8K、MATH 或 AIME 类竞赛题）、代码（HumanEval+、LiveCodeBench）、指令遵循（IFEval 类）、长上下文（RULER、LongBench v2）、多语言与中文；
      - 业务能力：按业务场景分层抽样的私有评测集，包含真实线上难例与回归用例，定期刷新；
      - 对话质量：内部成对对战（匿名、交换顺序），用 Bradley-Terry 汇总；
      - 安全：有害请求攻击成功率与无害请求过度拒答率，配合红队用例；
      - 效率与成本：延迟、吞吐、每千次请求成本。

      **3. 判分方式**：能程序判的优先程序判（精确匹配、单元测试、规则校验）；开放式质量用带评分细则的 LLM 评审，并用人工标注集校准（一致率与 kappa，评审或提示词变更即重测）；关键发布决策加人工盲评。

      **4. 评测协议与版本管理**：所有模型用同一套提示模板、少样本示例、思维链设置、解码参数与最大生成长度、答案抽取规则；推理模型按其推荐参数多次采样取平均；评测集、脚本、评审模型与提示词都打版本号，结果记录完整配置，可一键复现。

      **5. 污染控制**：训练数据与所有评测集做 n-gram 与语义去重；内部评测集放入 canary 字符串、严禁进入训练；保留只有少数人能访问的盲测集；定期加入新题（时间切分）；对异常高分做扰动与补全测试。

      **6. 统计与报告**：报告置信区间；新旧版本在同一批题上做配对比较；调参与选方案用开发集，只在测试集上报告最终结果；按维度、难度、场景分层展示，防止「总分涨、关键子集跌」；附典型样例。

      **7. 发布门禁**：核心业务集不显著下降（非劣效检验）；安全指标（攻击成功率、过度拒答率）不劣化；关键能力不低于阈值；延迟与成本在预算内。

      **8. 与线上对齐**：灰度发布与 A/B（解决率、满意度、转人工率等），定期分析离线分数与线上指标的相关性；把线上失败案例回流进评测集；离线与线上结论冲突时优先查评测集的代表性。
    rubric:
      - '评测维度完整：通用能力、业务私有集、对话质量、安全、效率（2 分）'
      - '判分方式分层：程序判分优先、LLM 评审加人工校准、关键决策人工评测（2 分）'
      - '统一评测协议并做版本管理，保证可复现（2 分）'
      - '给出污染控制措施（去重、canary、盲测集、时间切分）（1 分）'
      - '统计方法与分层报告，避免在测试集上过拟合（1 分）'
      - '给出发布门禁并说明与线上指标的对齐与回流（2 分）'
    explanation: |
      **常见失分点**：只罗列公开基准，没有业务私有集；判分方式只说「GPT-4 打分」；不统一评测协议，导致不同模型的分数不可比；忽略污染与测试集过拟合；没有门禁标准与线上验证，评测与发布决策脱节。
    source: 'Liang 等, HELM, arXiv:2211.09110'

  - id: EVL-LLM-041
    type: scenario
    difficulty: 3
    frequency: 2
    points: [评测协议, 评测维度]
    source: 'McNemar, Note on the sampling error of the difference between correlated proportions or percentages, Psychometrika 1947；Miller, Adding Error Bars to Evals, arXiv:2411.00640'
    tags: [微调评估, 回归验证, 显著性]
    question: |
      团队用 2 万条历史客服对话对一个 7B 开源模型做了领域 SFT，汇报称：「在 200 道业务测试题上，正确率从 71% 提升到 78%，模型显著变好了，建议上线。」测试题是从同一批历史对话中随机抽取、由同一位同事出题并打分的。

      作为评审，你会对这个结论提出哪些质疑？请设计一套能证明「微调后确实变好、而且没有明显退化」的评估方案，并说明上线的判定规则。
    answer: |
      **一、对现有结论的质疑**
      1. **数据泄漏**：测试题和训练数据出自同一批历史对话，可能高度相似甚至重复，测到的是「记忆」而不是能力。需要按 n-gram 或向量相似度去重，最好按时间切分（用训练数据截止日期之后的对话出题）。
      2. **样本量与显著性**：若把两组结果当作独立样本，差值的标准误约为 $\sqrt{0.71\times0.29/200+0.78\times0.22/200}\approx4.3$ 个百分点，95% 置信区间约为 $7\pm8.5$ 个点，跨过 0。同一批题前后对比应做配对检验（McNemar）：比如 24 题由错变对、10 题由对变错，净增 14 题（7 个点），$\chi^2=(24-10)^2/34\approx5.8$，$p\approx0.02$；若是 18 对 4，同样净增 14 题，证据还更强。只报两个百分比，无法判断。
      3. **评测协议是否一致**：前后两次的提示模板、对话模板、解码参数、判分标准是否相同；同一位同事出题又打分，并且知道哪个是新模型，存在主观偏差。
      4. **覆盖面**：只看业务正确率，不知道通用能力、指令遵循、安全与格式有没有退化。

      **二、评估方案**
      1. **业务测试集**：用训练截止之后的新对话、由未参与训练的人员构建；按意图、难度分层；规模按需要的精度确定（想把差值的 95% 置信区间压到 ±3 个点以内，配对设计下通常要数百到上千题，取决于前后结论不一致的题所占的比例）；与训练集去重。
      2. **对照组**：基座模型、基座 + 精心设计的提示词或 RAG（验证「是否真的需要微调」）、微调模型，三者在同一协议下评测。
      3. **判分**：能程序判的用规则判分；开放回答用带评分细则的 LLM 评审，成对比较时交换顺序、盲评，并用一批人工标注校准评审的一致性（如 Cohen's kappa）；对关键样本做人工双盲评审。
      4. **统计**：配对设计，报告差值的置信区间（bootstrap）与配对检验的 p 值；按切片报告，防止整体平均掩盖某类问题的退化。
      5. **退化回归集**：通用知识与推理（如 MMLU、GSM8K 类基准）、指令遵循（IFEval 类）、多轮对话、工具调用与 JSON 格式正确率、安全与拒答，事先为每项设定非劣效阈值（例如下降不超过 1～2 个点）。
      6. **线上验证**：小流量 A/B，主指标（解决率、转人工率）加护栏指标（投诉、时延、成本）。

      **三、上线判定规则**（评测前写好，防止事后挑指标）
      - 业务主指标的提升在配对检验下显著，且差值置信区间的下界大于 0；
      - 所有退化回归项满足非劣效阈值；
      - 安全与格式类指标不下降；
      - 线上 A/B 的主指标不劣于对照，护栏指标在阈值内。
    rubric:
      - '指出测试集与训练数据同源可能泄漏，并给出去重、按时间切分的做法（2 分）'
      - '指出 200 题下 7 个点的差距不一定显著，知道要用配对检验或置信区间（2 分）'
      - '指出评测协议不一致、出题与打分同一人且非盲评的偏差（1 分）'
      - '设计业务测试集、对照组、判分与评审校准方案（2 分）'
      - '设计通用能力、指令遵循、格式与安全的退化回归集，并设非劣效阈值（2 分）'
      - '给出事先约定的上线判定规则与线上 A/B（1 分）'
    explanation: |
      **常见失分点**：只关心「涨了多少」，不问测试题从哪里来；不会估算 200 题下比例差值的误差范围，或者把同一批题的前后对比当成独立样本；不做通用能力与格式的回归；先看结果再选指标，没有事先约定判定规则。

      计算说明：独立样本时，差值标准误 $=\sqrt{p_1(1-p_1)/n+p_2(1-p_2)/n}$；配对时只有「结论不一致」的题（错变对 $b$、对变错 $c$）提供信息，McNemar 统计量为 $(b-c)^2/(b+c)$，自由度为 1。
