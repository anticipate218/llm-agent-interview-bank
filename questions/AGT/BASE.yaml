domain: AGT
subcategory: BASE
questions:

  - id: AGT-BASE-001
    type: single
    difficulty: 1
    frequency: 3
    points: [Agent定义与组成, 工作流与Agent]
    tags: [Building effective agents, Anthropic]
    question: |
      Anthropic 在工程博文《Building effective agents》（2024）中区分了「工作流」与「Agent」。按照这一划分，下列哪一项最符合「Agent」的含义？
    options:
      A: '由预先写好的代码路径依次编排多个 LLM 调用和工具，并按每一步的结果在几条固定分支间路由'
      B: '由 LLM 在循环中根据环境反馈，动态决定调用哪些工具、走多少步、何时结束'
      C: '参数规模足够大、经过推理训练，能独立完成多步推理的基础模型'
      D: '接入了检索、工具和记忆的模型，单次调用时自主选择用哪个工具，拿到工具结果后直接返回'
    answer: B
    explanation: |
      **结论**：Agent 的本质是「LLM 在循环里根据环境反馈使用工具」，并由模型自己决定流程和何时停止。

      Anthropic 把工作流和 Agent 统称为智能体系统（agentic systems），区别在于控制流：工作流由预先写好的代码路径编排 LLM 和工具；Agent 由 LLM 动态决定自己的流程与工具使用。

      - A 错：这是**工作流**的定义，路径由代码写死；按结果在固定分支间选择也只是路由模式，仍属工作流。
      - C 错：Agent 不是「更强的模型」，而是「模型 + 运行时」。推理能力再强，没有与环境交互的循环也不是 Agent；死循环、超支、越权等问题大多出在运行时。
      - D 错：这是**增强型 LLM**（augmented LLM），是所有模式的积木。即使由模型选择工具，只走一轮、没有「观察 → 再决策」的循环，还算不上 Agent。

  - id: AGT-BASE-002
    type: multiple
    difficulty: 1
    frequency: 3
    points: [Agent定义与组成]
    tags: [Lilian Weng]
    question: |
      常见的拆法把 Agent 看作「LLM + 工具 + 记忆 + 规划 + 循环」。下列关于各组件职责的说法，**正确**的有：
    options:
      A: '循环在模型的一次前向计算内部完成，因此运行时不需要参与步数和预算控制'
      B: '工具让模型获得训练数据之外的新信息，或对外部世界产生作用，如下单、改代码、发邮件'
      C: '工具函数由 LLM 自己执行，运行时只负责把执行结果展示给用户'
      D: '短期记忆通常就是上下文里的消息轨迹，长期记忆则放在文件、数据库或向量库等外部存储中'
      E: '规划负责拆解目标、安排子任务顺序，并在受阻时重新规划'
    answer: [B, D, E]
    explanation: |
      **结论**：B、D、E 正确。LLM 负责决策，工具、记忆、规划各司其职，循环由运行时驱动。

      - A 错：循环是**运行时**的 while 循环：每一步调用一次模型、执行工具、回填观察，并检查步数、预算和是否陷入循环。模型的一次前向计算只产出一段输出。
      - B 对：工具是 Agent 的「手脚」，一类获取信息（搜索、查库），一类改变外部世界（写操作，带来副作用）。
      - C 错：模型只输出「调用单」（工具名 + 参数），真正执行、校验参数、检查权限的是运行时。
      - D 对：短期记忆就是每一步重新发给模型的消息列表；长期记忆在上下文之外，按需读取。
      - E 对：规划包括目标分解、排序和遇阻重规划（ReAct、Plan-and-Execute、todo 清单都是规划的实现）。
  - id: AGT-BASE-003
    type: judge
    difficulty: 1
    frequency: 3
    points: [Agent定义与组成, 自主程度光谱]
    question: |
      某客服机器人接入了 Function Calling：每轮根据用户问题最多调用一次查询工具，拿到结果后直接生成回复，不会根据工具结果再决定下一步。按照自主程度光谱，它已经属于自主 Agent。
    answer: false
    explanation: |
      **错误**。它属于**增强型 LLM**：模型可以自己决定是否检索、调哪个工具，但只走一轮，没有「观察 → 再决策」的循环。

      判断自主程度的关键是**谁决定下一步、能走多少步**：单次调用（代码决定）→ 增强型 LLM（模型决定本轮是否用工具）→ 工作流（代码写死路径）→ 受限 Agent（模型在给定工具里自选下一步）→ 自主 Agent（模型决定做什么、做几步、何时停）。

      「接了工具」不等于 Agent。Agent 的三个标志是：多步、可能产生副作用、自己决定何时停止。

  - id: AGT-BASE-004
    type: single
    difficulty: 2
    frequency: 2
    points: [自主程度光谱]
    question: |
      按「谁决定下一步」来划分，下面四个系统中哪一个属于**受限 Agent**（既不是工作流，也不是自主 Agent）？
    options:
      A: '先由小模型给工单分类，再按类别路由到不同的处理提示词与工具，最后由大模型生成回复'
      B: '每次先检索知识库，再把检索结果与问题交给模型生成答案；检索词由模型根据问题改写'
      C: '订票助手只开放「查询航班」和「占座」两个工具，先查还是先追问、调用几次由模型决定'
      D: '编码助手可以读写整个仓库、运行任意命令，自行决定做什么、做几步、何时结束'
    answer: C
    explanation: |
      **结论**：C 是受限 Agent：模型自己决定下一步，但只能在给定的工具和状态范围内行动。

      - A 错：分类 → 按类别处理 → 生成，路径由代码写死，是工作流（路由模式）。
      - B 错：「先检索、再生成」的顺序由代码固定，是一次带检索的调用（固定 RAG 流程）。模型改写检索词只是在填参数，下一步仍不由模型决定，离 Agent 还差一个「观察后再决策」的循环。
      - C 对：动作空间被限制（两个工具），但决策权在模型。生产中的业务 Agent 多数处在这一档，例如只开放查询与占座、把支付交给状态机。
      - D 错：做什么、做几步、何时停都由模型决定，工具范围也几乎不受限，是自主 Agent。

      自主程度越高越灵活，也越难预测、越贵、越难调试，所以工程上要「按需拧旋钮」，而不是一律追求最高档。

  - id: AGT-BASE-005
    type: single
    difficulty: 1
    frequency: 3
    points: [工作流与Agent]
    question: |
      区分「工作流」和「Agent」最关键的标准是：
    options:
      A: '系统中是否调用了大模型：工作流的节点都是普通代码，不含 LLM'
      B: '是否使用了外部工具：能调用工具并处理返回结果的是 Agent，只生成文本的是工作流'
      C: '调用次数与步数：一次任务中 LLM 被调用多轮、步骤超过若干步（如 3 步）的就是 Agent'
      D: '控制流由谁决定：工作流的路径由代码预先写好，Agent 的下一步由模型决定'
    answer: D
    explanation: |
      **结论**：看控制流归属。工作流里每个节点都可以是 LLM 调用，但「下一步去哪」由代码决定；Agent 则把这个决定交给模型。

      - A 错：工作流不等于没有 LLM。提示链、路由、并行化等工作流模式的每个节点几乎都是 LLM 调用。
      - B 错：工作流的节点同样可以调用工具（如路由后调退款工具）；是否用工具不是分界线。
      - C 错：调用次数不决定性质。一条 5 步的提示链仍是工作流；一个第 2 步就结束的 Agent 仍是 Agent。
      - D 对：Agent 的下一步由模型在运行时决定，这也是二者可预测性、成本、调试难度差异的根源。

  - id: AGT-BASE-006
    type: judge
    difficulty: 1
    frequency: 2
    points: [工作流与Agent]
    tags: [Building effective agents]
    question: |
      在 Anthropic 的划分里，工作流与 Agent 都属于智能体系统（agentic systems）：两者都可以在每个步骤调用 LLM 和工具，区别在于流程由预先写好的代码路径决定，还是由 LLM 动态决定。
    answer: true
    explanation: |
      **正确**。《Building effective agents》用 agentic systems 统称两类系统：

      - **工作流**：LLM 和工具通过预先定义的代码路径编排；
      - **Agent**：LLM 动态决定自己的流程和工具使用，自己掌控完成任务的方式。

      两者的积木都是增强型 LLM（配有检索、工具、记忆的模型调用）。实践中常常混用：用工作流搭骨架，在需要判断的局部放一个 Agent。

  - id: AGT-BASE-007
    type: single
    difficulty: 2
    frequency: 3
    points: [提示链]
    question: |
      需求：为新产品生成营销文案。先写一版中文文案，用程序检查是否包含必须出现的 3 个卖点、字数是否在 200 字以内，检查通过后再分别翻译成英文和日文；检查不通过就直接结束并报错。这个需求最贴合哪种模式？
    options:
      A: '路由'
      B: '评估者-优化者'
      C: '提示链（带门控）'
      D: '编排者-工作者'
    answer: C
    explanation: |
      **结论**：步骤固定、前一步的输出是后一步的输入、中间有程序化检查，这是带门控（gate）的提示链。

      提示链把任务拆成固定的几步，每次 LLM 调用只做一件更简单的事，用延迟换准确率；门控用代码检查中间结果，不合格就提前结束，后面的调用一次都不花。

      - A 错：路由是「先分类，再进入不同分支」，这里没有分类。
      - B 错：评估者-优化者是「生成 → 给意见 → 修改」的**循环**；本题检查不通过就结束，不会带着意见回炉修改。
      - D 错：编排者-工作者的子任务由中心 LLM 在运行时决定；本题的步骤事先就写清了。

  - id: AGT-BASE-008
    type: single
    difficulty: 2
    frequency: 3
    points: [路由]
    question: |
      某客服系统的请求分三类：退款（要调用订单与退款工具）、技术故障（要检索产品文档，推理较复杂）、一般咨询（答案基本固定）。团队把三类要求写进同一个提示词后发现，优化一类请求总会让另一类变差。最合适的模式及其成立的前提是：
    options:
      A: '路由：先分类，再进入各自专门的流程；前提是类别边界清楚、分类能做得足够准'
      B: '并行化（投票）：三套提示词同时处理每个请求再取多数；前提是三类请求的答案可以直接比较'
      C: '编排者-工作者：由中心 LLM 为每个请求临时拆分子任务；前提是子任务无法事先确定'
      D: '提示链：把三类处理串成一条流水线依次执行；前提是每一步都能加程序化门控'
    answer: A
    explanation: |
      **结论**：输入类别差异大、分开优化效果更好，正是路由的适用场景；它成立的前提是分类本身足够准确（可以用 LLM，也可以用传统分类模型）。

      路由实现了关注点分离：每个分支有自己的提示词、工具，甚至不同大小的模型（一般咨询交给小模型或 FAQ 模板，技术故障交给强模型加检索），从而避免「按下葫芦浮起瓢」。

      - B 错：投票是让同一任务跑多次求可靠，不解决「不同类别需要不同处理」，还会把成本乘以 3。
      - C 错：每类请求的处理步骤基本可预知，不需要运行时临时拆任务，用编排者-工作者徒增成本。
      - D 错：三类请求互斥，每个请求只需走其中一条，串成流水线没有意义。

  - id: AGT-BASE-009
    type: multiple
    difficulty: 2
    frequency: 2
    points: [路由]
    question: |
      关于路由（routing）模式，下列说法**正确**的有：
    options:
      A: '可以把简单、常见的问题交给小模型，把困难问题交给强模型，以优化成本和速度'
      B: '分类置信度低或不属于任何已知类别时，应走兜底分支，如追问用户或转人工'
      C: '收益来自关注点分离：每个分支单独写提示词、配工具，优化一个分支不会拖累其他分支'
      D: '分类器既可以是 LLM，也可以是传统的分类模型或规则'
      E: '分类出错的代价可以忽略，因为每个分支最终都会给出一个答案'
    answer: [A, B, C, D]
    explanation: |
      **结论**：A、B、C、D 正确。路由 = 先分类、再进入专门的后续流程。

      - A 对：这是《Building effective agents》给出的典型用法之一，按难度分流到不同大小的模型。
      - B 对：分类器不可能百分之百准确，低置信度或「不属于任何类别」的输入要有去处，如追问用户、转人工或交给通用 Agent，而不是硬塞进某个分支。
      - C 对：没有路由时，为一类输入优化提示词常常损害另一类输入的效果。各分支完全可以用不同的模型、提示词和工具，评估也按分支分别做，再看整体指标。
      - D 对：只要分类足够准，用什么做分类都可以；规则或小分类模型往往更便宜、更快。
      - E 错：路由的前提恰恰是「分类能做得足够准」。分错类，请求会进入不合适的流程（退款请求被当成闲聊），答案再流畅也是错的。实践中要持续监控分类准确率。
  - id: AGT-BASE-010
    type: fill
    difficulty: 2
    frequency: 2
    points: [路由, Agent适用场景]
    question: |
      某退改签咨询若全部交给 Agent 处理，平均每单累计输入约 66K token；若走固定的工作流，每单约 6K token。统计显示 80% 的咨询是「查规则」这类固定问题。用路由把这 80% 交给工作流、其余 20% 交给 Agent 后（忽略分类本身的开销），平均每单累计输入约为 ____ K token，只有全部走 Agent 时的约 ____ %（取整数）。
    answer: [['18', '18.0'], ['27', '27%']]
    explanation: |
      **计算**：

      - 加权平均：$0.8\times6+0.2\times66=4.8+13.2=18$ K token；
      - 占比：$18/66\approx0.273$，即约 **27%**，省下约七成输入 token。

      **启示**：路由不只是为了效果，也是控制成本的利器。把高频、步骤固定的请求固化成工作流，只把真正需要判断的长尾交给 Agent。要注意分类本身也有开销（通常一次小模型调用），以及分错类的代价：固定问题被错送进 Agent 只是多花钱，复杂问题被错送进工作流则可能答错，要有兜底。

  - id: AGT-BASE-011
    type: single
    difficulty: 2
    frequency: 2
    points: [并行化]
    question: |
      下面两个需求分别属于并行化（parallelization）的哪种变体？

      - 需求一：主模型回答用户问题的同时，另一个模型实例审查该请求是否违规，两路同时运行，最后合并结果；
      - 需求二：用 5 个侧重点不同的提示词同时审查同一段代码是否有安全漏洞，至少 2 个提示词报警才判定有漏洞。
    options:
      A: '需求一是投票，需求二是分段'
      B: '需求一是分段，需求二是投票'
      C: '两者都是投票，因为都对同一个输入运行了多个模型调用'
      D: '两者都是编排者-工作者，因为都是把一个任务派给多个 LLM'
    answer: B
    explanation: |
      **结论**：需求一是**分段**（sectioning），需求二是**投票**（voting）。

      - 分段：把任务拆成**不同的**独立子任务同时跑，再合并。「回答」和「安全审查」是两件不同的事，各自得到专注的处理；Anthropic 指出，这样通常比让同一次调用既回答又自查效果更好。
      - 投票：对**同一个问题**（这段代码有没有漏洞）运行多次，按票数聚合。即使各提示词关注点不同，它们回答的仍是同一个是非问题，门槛（2 票）用来平衡误报和漏报。

      - A 错：恰好说反。
      - C 错：判断依据不是「输入是否相同」，而是子任务是否相同、结果如何聚合。
      - D 错：两个需求的子任务都在代码里写死，不是由中心 LLM 在运行时拆出来的。

  - id: AGT-BASE-012
    type: judge
    difficulty: 2
    frequency: 2
    points: [并行化, 编排者-工作者]
    question: |
      并行化（分段）与编排者-工作者在拓扑上很像，区别在于：分段的子任务由中心 LLM 根据输入在运行时决定，而编排者-工作者的子任务在代码中预先写好。
    answer: false
    explanation: |
      **错误**，说反了。

      - **并行化（分段）**：子任务在代码里写死，例如永远是「回答 + 安全审查」两路；
      - **编排者-工作者**：中心 LLM 根据具体输入**在运行时**决定拆成哪些子任务、派给哪些工作者，再汇总结果。

      这是最容易混淆的一对模式。判断方法：问一句「子任务列表能不能在写代码时就列出来」。能，就是并行化；不能（如要改几个文件取决于 issue 内容），就是编排者-工作者。后者更灵活，也更贵、更难预测。

  - id: AGT-BASE-013
    type: single
    difficulty: 2
    frequency: 3
    points: [编排者-工作者]
    question: |
      需求：用户提交一个 GitHub issue，系统要完成修复。事先不知道要改几个文件、每个文件改什么，需要先分析 issue 再决定分派哪些修改任务，最后合并各处修改。在下列模式中，最合适的是：
    options:
      A: '提示链'
      B: '并行化（分段）'
      C: '路由'
      D: '编排者-工作者'
    answer: D
    explanation: |
      **结论**：子任务的数量和内容取决于具体输入、无法事先确定，这是编排者-工作者的典型场景（Anthropic 举的例子正是「每次都要对多个文件做复杂修改的编码产品」）。

      编排者（orchestrator）在运行时分析任务、拆出子任务并派给工作者（worker），最后综合结果。

      - A 错：提示链要求步骤固定，这里步骤数量都不确定。
      - B 错：分段的子任务在代码里写死，无法适应「这次改 2 个文件、下次改 7 个」。
      - C 错：路由只是把请求分到某个预设分支，不负责拆分与汇总。

      延伸：如果连「先分析、再分派、再合并」这个结构都不固定，需要边做边看测试结果，那就走向了自主 Agent。

  - id: AGT-BASE-014
    type: single
    difficulty: 2
    frequency: 2
    points: [评估者-优化者]
    tags: [Building effective agents]
    question: |
      Anthropic 给出了判断「评估者-优化者」模式是否适合某任务的两个信号，它们是：
    options:
      A: '人给出明确反馈时 LLM 的输出能明显改进；并且 LLM 自己也能给出这种反馈'
      B: '任务可以拆成互不依赖的子任务；并且子任务可以同时运行以节省时间'
      C: '输入可以划分为差异明显的几类；并且分类能由 LLM 或传统分类器做得足够准确'
      D: '任务步数无法预知、需要多轮决策；并且环境能在每一步给出「地面真相」式的可靠反馈'
    answer: A
    explanation: |
      **结论**：评估者-优化者成立的前提是「反馈有用」且「模型能给出这种反馈」，再加上评估标准清晰。典型例子是文学翻译：译者模型初稿可能漏掉细微之处，评估者模型能指出来，修改后质量可衡量地提升。

      其余选项分别是其他模式的判据：

      - B：并行化（分段）的适用条件；
      - C：路由的适用条件；
      - D：自主 Agent 的适用条件（开放式问题、步数无法预知、环境能提供「地面真相」）。

      注意：如果评估标准模糊，评估者可能永远不满意，造成死循环，所以必须设轮数上限。

  - id: AGT-BASE-015
    type: code_debug
    difficulty: 2
    frequency: 2
    points: [评估者-优化者, 终止条件]
    question: |
      下面是评估者-优化者循环的实现。调用方的约定是：**返回通过评估的稿件；若 `max_rounds` 轮评估都没有通过，返回 `None`，由上层转人工或降级**。其中 `evaluate` 返回问题列表，空列表表示通过。请指出 bug 并修正。
    code: |
      def evaluator_optimizer(generate, evaluate, revise, max_rounds=3):
          draft = generate()
          for _ in range(max_rounds):
              issues = evaluate(draft)
              if not issues:
                  break
              draft = revise(draft, issues)
          return draft
    fixed_code: |
      def evaluator_optimizer(generate, evaluate, revise, max_rounds=3):
          draft = generate()
          for _ in range(max_rounds):
              issues = evaluate(draft)
              if not issues:
                  return draft          # 只有通过评估才交付
              draft = revise(draft, issues)
          return None                   # 达到上限仍未通过：明确失败，交给上层
    test: |
      seen = []
      def never_ok(d):
          seen.append(d)
          return ["不符合风格"]
      r1 = evaluator_optimizer(lambda: "v0", never_ok, lambda d, issues: d + "+", max_rounds=3)
      assert r1 is None, "未通过评估的稿件不能当作结果交付"
      assert len(seen) == 3
      r2 = evaluator_optimizer(lambda: "v0", lambda d: [] if d.endswith("!!") else ["语气不够"],
                               lambda d, issues: d + "!", max_rounds=5)
      assert r2 == "v0!!"
    answer: |
      **问题**：循环因达到 `max_rounds` 而结束时，函数依然 `return draft`，把一份**从未通过评估**的稿件当成成功结果交了出去（而且最后一次修改后的版本根本没被评估过）。调用方无法区分「通过了」和「轮数用完了」，失败被静默吞掉。

      **修正**：通过时立即返回稿件；循环正常结束说明一直没通过，返回 `None`：

      ```python
      for _ in range(max_rounds):
          issues = evaluate(draft)
          if not issues:
              return draft
          draft = revise(draft, issues)
      return None
      ```
    explanation: |
      评估者-优化者有两个工程要点：

      1. **轮数上限**：评估者可能永远不满意（标准模糊、或与优化者存在系统性分歧），没有上限就会死循环；
      2. **失败要显式**：触发上限不能静默返回「看起来像成功」的结果，要让上层知道「停在第几轮、还剩哪些问题」，再决定转人工、降级或换策略。

      更完整的实现会返回 `(结果, 历史意见)`，便于排查是评估标准的问题还是生成能力的问题。顺带一提：修正版在最后一轮失败后仍会多调用一次 `revise`，可以再加一个判断省掉这次调用。

  - id: AGT-BASE-016
    type: code_fill
    difficulty: 1
    frequency: 2
    points: [提示链]
    question: |
      补全一个通用的「带门控的提示链」执行器：每一步的输入是上一步的输出；每一步执行后用门控函数检查结果，`gate(out)` 返回 `None` 表示通过，否则返回失败原因。任何一步不通过就立即结束，返回 `(None, "步骤名: 原因")`；全部通过返回 `(最终结果, None)`。
    code: |
      def run_chain(x, steps):
          """steps: [(name, step_fn, gate), ...]"""
          for name, step, gate in steps:
              x = step(x)
              reason = ____
              if reason is not None:
                  return None, f"{name}: {reason}"
          return ____, None
    answer: ['gate(x)', 'x']
    test: |
      calls = []
      def mk(name, f):
          def s(v):
              calls.append(name)
              return f(v)
          return s
      steps = [("outline", mk("outline", lambda t: [t + "是什么", t + "怎么用"]),
                lambda o: None if len(o) >= 2 else "要点不足"),
               ("write", mk("write", lambda o: "；".join(o)),
                lambda d: None if len(d) <= 30 else "超长"),
               ("polish", mk("polish", lambda d: d + "。"), lambda d: None)]
      assert run_chain("Agent", steps) == ("Agent是什么；Agent怎么用。", None)
      calls.clear()
      bad = [("outline", mk("outline", lambda t: [t]),
              lambda o: None if len(o) >= 2 else "要点不足")] + steps[1:]
      assert run_chain("A", bad) == (None, "outline: 要点不足")
      assert calls == ["outline"], "门控失败后不应再产生后续调用"
    explanation: |
      答案：第一空 `gate(x)`，用门控检查**刚刚产出的**中间结果；第二空 `x`，全部通过后返回最后一步的输出。

      提示链的两个要点：

      - **每步只做一件简单的事**，前一步的输出直接作为后一步的输入，用多几次调用（更高延迟）换更高的准确率；
      - **门控用代码检查**，不靠模型自觉。不合格就提前结束，后面的调用一次都不花，测试中 `calls == ["outline"]` 验证的就是这一点。

      门控失败时返回步骤名和原因，便于定位问题出在哪一步；这也是工作流比 Agent 更好调试的原因之一。

  - id: AGT-BASE-017
    type: calc
    difficulty: 3
    frequency: 2
    points: [并行化]
    question: |
      用 5 个侧重点不同的审查提示词并行投票，判断一段代码是否有安全漏洞。为简化计算，假设各审查员的判断相互独立：

      - 代码**没有**漏洞时，每个审查员以 10% 的概率误报；
      - 代码**有**漏洞时，每个审查员以 70% 的概率报警。

      分别计算投票门槛为「≥1 票」和「≥2 票」时，整体的误报率与漏报率。
    answer: '误报率：≥1 票约 41.0%，≥2 票约 8.1%；漏报率：≥1 票约 0.24%，≥2 票约 3.1%'
    explanation: |
      报警票数服从二项分布 $X\sim B(5,q)$。

      **误报率**（无漏洞，$q=0.1$，判定为有漏洞）：

      - 门槛 ≥1：$1-P(X=0)=1-0.9^5=1-0.59049\approx0.410$；
      - 门槛 ≥2：$1-P(X=0)-P(X=1)=1-0.59049-5\times0.1\times0.9^4=1-0.59049-0.32805\approx0.081$。

      **漏报率**（有漏洞，$q=0.7$，判定为无漏洞）：

      - 门槛 ≥1：$P(X=0)=0.3^5=0.00243\approx0.24\%$；
      - 门槛 ≥2：$P(X=0)+P(X=1)=0.00243+5\times0.7\times0.3^4=0.00243+0.02835\approx3.1\%$。

      **结论**：门槛从 1 票提到 2 票，误报率从约 41% 降到约 8%，漏报率从约 0.24% 升到约 3.1%。门槛就是在误报与漏报之间调节的旋钮：安全审查宁可误报，门槛设低；自动拦截用户内容则要防误伤，门槛设高。

      **注意**：独立性是理想假设。多个审查员如果用同一个模型，错误往往是相关的（同样的盲点），实际收益会小于计算值。换不同的提示词视角、甚至不同的模型，就是为了降低这种相关性。

  - id: AGT-BASE-018
    type: calc
    difficulty: 3
    frequency: 3
    points: [Agent Loop, 终止条件]
    question: |
      某 Agent 的首轮上下文（系统提示词 + 工具定义 + 用户输入）约 6K token，此后每步新增约 2K token（模型输出 + 工具结果），平均 12 步完成一个任务；每一步都要把完整上下文重新发给模型。

      1. 一个任务的累计输入 token 是多少？
      2. 每天 1 万个任务、输入单价 2 美元 / 百万 token、不考虑缓存时，每天的输入成本是多少？
      3. 若平均步数翻倍到 24 步，累计输入变为原来的几倍？
    answer: '约 204K token；约 4080 美元 / 天；约 3.4 倍'
    explanation: |
      **公式**：设首轮上下文 $C_0$、每步新增 $\Delta$、步数 $n$，第 $t$ 步的输入为 $C_0+(t-1)\Delta$，累计输入

      $$T_{\text{in}}=\sum_{t=1}^{n}\big(C_0+(t-1)\Delta\big)=nC_0+\frac{n(n-1)}{2}\Delta$$

      1. $n=12$：$12\times6\text{K}+\frac{12\times11}{2}\times2\text{K}=72\text{K}+132\text{K}=204\text{K}$；
      2. $204\text{K}\times10^4=2.04\times10^9$ token $=2040$ 百万 token，$\times2$ 美元 $=4080$ 美元 / 天；
      3. $n=24$：$24\times6\text{K}+\frac{24\times23}{2}\times2\text{K}=144\text{K}+552\text{K}=696\text{K}$，$696/204\approx3.4$ 倍。

      **结论**：步数翻倍，累计输入超过三倍，因为第二项随 $n^2$ 增长。所以要：设步数与预算上限、检测无进展、让前缀保持稳定以命中 Prompt Caching、控制每步观察的大小，并在上下文过长时做压缩。

  - id: AGT-BASE-019
    type: code_output
    difficulty: 2
    frequency: 2
    points: [Agent Loop, 终止条件]
    question: |
      下面的代码模拟了一个带多种终止条件的 Agent 循环（`policy(step)` 代替模型，返回本步的动作与 token 消耗）。输出是什么？
    code: |
      def run(policy, max_steps=5, budget=10_000):
          used, seen = 0, {}
          for step in range(1, max_steps + 1):
              action, cost = policy(step)
              used += cost
              if action == "final":
                  return f"完成 step={step}"
              if used > budget:
                  return f"超预算 step={step}"
              seen[action] = seen.get(action, 0) + 1
              if seen[action] >= 3:
                  return f"重复 step={step}"
          return f"步数上限 step={max_steps}"

      print(run(lambda s: ("final", 100) if s == 3 else (f"search:{s}", 100)))
      print(run(lambda s: ("search:x", 100)))
      print(run(lambda s: (f"read:{s}", 4000)))
      print(run(lambda s: (f"search:{s}", 100)))
    answer: |
      完成 step=3
      重复 step=3
      超预算 step=3
      步数上限 step=5
    explanation: |
      逐个分析：

      1. 前两步动作不同，第 3 步返回 `final`，正常完成；
      2. 每步都是同一个动作 `search:x`，第 3 次出现时计数达到 3，判为重复；
      3. 每步消耗 4000，第 3 步累计 12000 > 10000，判为超预算（动作各不相同，不会触发重复）；
      4. 动作各不相同、消耗很小，跑满 5 步，触发步数上限。

      这四种分别对应最终答案、无进展（重复）、预算、步数这几类终止条件。真实系统里，停下后要返回**停止原因和当前进度**；重复检测通常先「提醒」再「强制停止」，并对参数做规范化（键序不同也算同一动作）。

  - id: AGT-BASE-020
    type: judge
    difficulty: 1
    frequency: 3
    points: [终止条件]
    question: |
      在 Agent 循环中，模型不再请求工具、给出最终回答，就表示任务已经成功完成；因此评测 Agent 时，可以按这一信号统计任务成功率。
    answer: false
    explanation: |
      **错误**。「模型不再调用工具」只说明模型**认为**自己做完了，不代表任务真的完成。模型可能误以为测试已通过、订单已出票，甚至编造执行结果。

      能验证就要验证：跑测试看是否通过、查数据库看订单状态是否为已出票、用规则检查输出格式与约束。评测 Agent 时更是如此，要用环境终态判定成败，而不是看模型是否停止调用工具、回复里是否写了「已完成」。

  - id: AGT-BASE-021
    type: multiple
    difficulty: 2
    frequency: 3
    points: [终止条件]
    question: |
      关于 Agent 终止条件的设计，下列做法**合理**的有：
    options:
      A: '触发上限时直接返回空结果并记录日志，避免把不完整的中间结论暴露给用户造成误导'
      B: '同时设置步数、token、费用和墙钟时间上限，任何一项超限就停止'
      C: '提供 final_answer 工具，让模型以结构化方式交卷，便于程序检查'
      D: '各类任务统一使用相同的步数上限（如 10 步），便于运维监控和跨任务比较成本'
      E: '同一动作（工具名 + 规范化参数）反复出现或几步无新信息时，先提醒模型，仍无改善再强制停止'
    answer: [B, C, E]
    explanation: |
      **结论**：B、C、E 合理。

      - A 错：触发上限不能静默失败（日志只有运维看得到），要返回停止原因、已完成的部分和还差什么，方便用户或上层重规划、人工接手；标明进度的部分结果不会造成误导。
      - B 对：多种硬上限是防死循环、防超支的最后一道闸，任何一项超限都要停。
      - C 对：结构化交卷让「何时停」和「交了什么」都能被程序检查，OpenAI 的 Agent 构建指南也把特定工具调用或结构化输出列为常见退出条件。
      - D 错：步数上限要按任务定：查天气 5 步足够，修一个 bug 可能要几十步。阈值应从线上轨迹统计正常任务的步数分布，取高分位数再留余量。
      - E 对：无进展检测要分级处理，先把「你已用相同参数调用 3 次，结果不会变」作为观察回填，给模型一次改正机会，再强制停止或要求重规划。
  - id: AGT-BASE-022
    type: single
    difficulty: 2
    frequency: 2
    points: [终止条件]
    question: |
      一个调研 Agent 在第 30 步触发了步数上限，此时用户要求的 5 个子问题已完成 3 个。下列处理方式最合理的是：
    options:
      A: '返回空结果并记录日志，前端显示「暂无结果」，避免把不完整的调研结论交给用户'
      B: '自动把步数上限翻倍到 60 步后从头重跑整个任务，直到 5 个子问题都完成'
      C: '返回停止原因、已完成 3 个子问题的结论与未完成部分，由用户或上层决定是否继续'
      D: '让模型基于已检索到的资料，把剩下 2 个子问题也直接作答并标注置信度，保证报告完整'
    answer: C
    explanation: |
      **结论**：停下来时要报告**原因和进度**，把决定权交给用户或上层（继续、缩小范围、转人工）。

      - A 错：返回空结果就是静默失败，日志只有运维看得到。它既浪费了已完成的工作，也让用户无从判断发生了什么；部分结果只要标明进度，并不会误导用户。
      - B 错：「翻倍重跑」可能让成本失控；如果问题在于循环或无进展，重跑只会重复同样的错误。若要继续，也应从断点继续而不是从头开始。
      - D 错：没有查证就作答，等于鼓励模型编造，标注置信度也改变不了这一点，比明确告知「未完成」更糟。

  - id: AGT-BASE-023
    type: single
    difficulty: 1
    frequency: 3
    points: [Agent Loop]
    question: |
      在一次 Agent Loop 迭代（感知 → 思考 → 行动 → 观察）中，下列哪项工作是**由模型完成**的？
    options:
      A: '按工具的 JSON Schema 校验参数是否合法，并检查当前用户对本次调用是否有权限'
      B: '根据上下文决定下一步调用哪个工具、传什么参数，还是直接给出最终答案'
      C: '执行工具调用，并把返回结果（包括报错信息）追加到消息列表'
      D: '累计已用的 token、步数与费用，判断是否触发预算上限、要不要终止循环'
    answer: B
    explanation: |
      **结论**：模型只负责「思考」这一步：输出工具调用请求，或者输出最终答案。

      其余工作都由运行时（Harness）负责：

      - A：参数校验与权限检查。模型可能编造参数或越权，必须由运行时把关；
      - C：执行工具、回填观察。模型从不直接执行任何东西，错误也要作为观察回填；
      - D：预算与循环检测。把「停」做成系统机制，而不是指望模型自觉。

      一句话：**模型负责决策，系统负责兜底**。

  - id: AGT-BASE-024
    type: fill
    difficulty: 2
    frequency: 2
    points: [Agent适用场景]
    question: |
      设 Agent 每一步独立地以概率 $p$ 成功，一个任务需要连续 $n$ 步全部成功。若 $p=0.95$、$n=20$，任务成功率约为 ____（保留两位小数）；若要让 20 步任务的成功率不低于 0.9，单步成功率至少约为 ____（保留三位小数）。
    answer: [['0.36', '36%'], ['0.995', '99.5%']]
    explanation: |
      **计算**：

      - $0.95^{20}=e^{20\ln0.95}\approx e^{-1.026}\approx0.36$；
      - 要求 $p^{20}\ge0.9$，即 $p\ge0.9^{1/20}=e^{\ln0.9/20}\approx e^{-0.00527}\approx0.995$。

      **启示**：单步 95% 看起来很可靠，串起 20 步只剩三成多；要让长任务整体可靠，单步可靠性必须接近 99.5%。这就是 Anthropic 所说自主 Agent 有「错误累积」（compounding errors）风险的原因，也解释了为什么要：能固定的步骤用工作流固定下来、缩短链路、每步都从环境拿到可靠反馈并允许纠错、关键步骤加验证和人工确认。

  - id: AGT-BASE-025
    type: single
    difficulty: 2
    frequency: 3
    points: [Agent适用场景]
    question: |
      下列四个需求中，**最适合**交给自主 Agent 完成的是：
    options:
      A: '修复开源仓库里的一个 bug：定位代码、修改、运行测试，按失败信息继续修改直到通过'
      B: '把每天收到的上千张发票图片抽取成固定的 12 个字段，校验金额合计后写入报销系统'
      C: '为每篇新闻生成 50 字摘要并翻译成英文和日文，再按频道模板排版后推送'
      D: '用户在聊天中发起转账，模型从对话中识别金额和收款人，自主确认无误后直接调用接口打款'
    answer: A
    explanation: |
      **结论**：A 同时满足上自主 Agent 的几个条件：路径无法预知（要改哪里、改几轮取决于中间结果）；环境能给出可靠反馈（测试是否通过）；出错代价可控（在沙箱或分支里改，可以回滚和评审）。

      - B 错：步骤固定、输出结构固定，单次调用（结构化抽取）或简单工作流就够了，上 Agent 只会更贵、更不稳定。
      - C 错：典型的提示链（摘要 → 翻译 → 排版），步骤事先就能写清。
      - D 错：转账是不可逆的高风险写操作，应该用工作流搭骨架（状态机），金额和收款人必须经用户确认，绝不能交给模型自主决定后直接执行。

  - id: AGT-BASE-026
    type: single
    difficulty: 2
    frequency: 3
    points: [工作流与Agent, Agent适用场景]
    question: |
      团队要给公司内部 IT 帮助台做智能问答。历史工单显示，大多数问题在知识库里都有现成答案。按照「先找最简单的方案、只在必要时增加复杂度」的原则，第一步应该尝试的是：
    options:
      A: '直接搭建一个能自主调用各内部系统 API 的自主 Agent'
      B: '设计多 Agent 系统：一个理解问题、一个检索知识库、一个审核答案后再回复用户'
      C: '采用编排者-工作者模式，让中心 LLM 动态拆解每个问题，再分派给多个检索工作者'
      D: '用单次 LLM 调用配合知识库检索和少量示例，评测效果不够时再增加复杂度'
    answer: D
    explanation: |
      **结论**：Anthropic 的建议是先找最简单的方案；对很多应用来说，用检索和上下文示例优化好单次 LLM 调用就足够了。

      实用的判断顺序：一次调用加检索和示例能否搞定 → 步骤能否事先写清（能就用工作流）→ 路径无法预知且环境反馈可靠、出错代价可控时才上 Agent。

      - A、B、C 错：在没有证明简单方案不够之前就引入 Agent、多 Agent 或动态编排，会带来更高的成本、延迟和调试难度，却未必换来效果提升。智能体系统往往是在用延迟和成本换效果，这笔账要先算清楚。

  - id: AGT-BASE-027
    type: multiple
    difficulty: 2
    frequency: 3
    points: [提示链, 并行化, 编排者-工作者, 评估者-优化者]
    question: |
      下列「需求 → 模式」的匹配，**恰当**的有：
    options:
      A: '对同一份模型输出，用几个独立的调用分别评估相关性、事实性、语气三个方面，再汇总成评测报告 → 并行化（分段）'
      B: '多源调研：要查哪些子问题和信息源取决于用户的问题，由中心 LLM 临时拆解、分派并汇总 → 并行化（投票）'
      C: '把客服请求分成退款、技术、咨询三类后分别交给不同流程处理 → 编排者-工作者'
      D: '文学翻译：译者模型出初稿，另一个模型按忠实度和文风逐条提意见，译者据此修改，直到通过或达到轮数上限 → 评估者-优化者'
      E: '先写文档大纲，用程序检查大纲是否覆盖了必选章节，通过后再按大纲成文 → 提示链'
    answer: [A, D, E]
    explanation: |
      **结论**：A、D、E 恰当。

      - A 对：几个方面是事先确定的不同子任务，同时评估后合并，属于分段（Anthropic 也举过「每个调用评估模型表现的一个不同方面」的例子）。
      - B 错：子任务由 LLM 在运行时决定，是**编排者-工作者**；投票是把同一任务跑多次再聚合。
      - C 错：「先分类、再进入专门分支」是**路由**。三条流程是预先设计好的，并非中心 LLM 在运行时拆出的子任务。
      - D 对：评估标准清晰、迭代能带来可衡量的改进，是评估者-优化者的典型场景。
      - E 对：固定步骤 + 程序化门控，是提示链的经典例子。
  - id: AGT-BASE-028
    type: multiple
    difficulty: 2
    frequency: 3
    points: [Agent适用场景]
    question: |
      按照「能用简单方案就别上 Agent」的选型原则，下列哪些是引入自主 Agent 的**合理前提**？
    options:
      A: '解决路径无法预知，需要根据中间结果决定下一步'
      B: '每天请求量巨大，且对单次请求的成本和延迟极其敏感'
      C: '任务的价值足以覆盖更高的 token 成本与延迟'
      D: '环境能给出可靠反馈，并且出错能被发现、纠正或回滚'
      E: '要求系统行为完全可预测，每条执行路径都能被枚举测试'
    answer: [A, C, D]
    explanation: |
      **结论**：A、C、D 是前提；B、E 恰恰是倾向于选择工作流的信号。

      - A 对：路径能事先写清就该用工作流，只有写不清时才需要模型动态决策。
      - B 错：高频、对成本延迟敏感的请求应固化成工作流，或用路由把它们和需要 Agent 的长尾分开。
      - C 对：Agent 平均要走很多步，累计输入随步数平方级增长，延迟也更长、更不稳定，任务价值要配得上。
      - D 对：Agent 每一步都要从环境获取「地面真相」来评估进度；错误会累积，必须能发现和恢复。涉及付款、删除数据等不可逆操作时，用工作流骨架 + 局部 Agent + 人工确认。
      - E 错：可预测、可枚举是工作流的优势；Agent 同一输入可能走不同路径。
  - id: AGT-BASE-029
    type: multiple
    difficulty: 3
    frequency: 2
    points: [编排者-工作者]
    question: |
      实现编排者-工作者（orchestrator-workers）模式时，下列说法**正确**的有：
    options:
      A: '汇总（synthesis）这一步可以省略，把各工作者的输出直接拼接返回即可'
      B: '编排者在运行时决定子任务，因此要校验它产出的任务清单，如数量上限、所用工具是否存在、有无重复'
      C: '子任务拆得过细会放大调度与汇总的开销，拆得过粗又会失去并行和专注的好处'
      D: '工作者应继承编排者的完整对话历史，信息越全越不容易出错，多出的 token 开销可以忽略'
      E: '子任务并行执行，所以整体 token 成本一定低于单个 Agent 串行完成同一任务'
    answer: [B, C]
    explanation: |
      **结论**：B、C 正确。

      - A 错：各工作者的结果可能重复、冲突或格式不一，需要编排者综合、去重、解决矛盾，必要时追加子任务。
      - B 对：任务清单是模型生成的，可能过多、重复，或引用不存在的工具，派发前要像校验工具参数一样校验它，并设置子任务数量与预算上限。
      - C 对：粒度要与任务匹配，这也是编排者提示词设计的重点。
      - D 错：工作者只需拿到完成自己子任务所需的上下文。继承全部历史既浪费 token，又会让无关信息干扰判断；给工作者干净、聚焦的上下文正是这种模式的主要收益之一。
      - E 错：并行缩短的是墙钟时间，不是 token。每个工作者都有自己的提示词和上下文，多 Agent 系统的 token 消耗往往远高于单 Agent（Anthropic 公开的数据是多 Agent 约为普通对话的 15 倍）。
  - id: AGT-BASE-030
    type: judge
    difficulty: 1
    frequency: 2
    points: [提示链]
    question: |
      提示链（prompt chaining）的核心取舍，是用多次 LLM 调用带来的额外延迟，换取每一步任务更简单、整体准确率更高。
    answer: true
    explanation: |
      **正确**。Anthropic 对提示链的描述正是：适用于能干净地拆成固定子任务的场景，主要目标是**用延迟换准确率**，让每次 LLM 调用都只做一件更容易的事。

      配套做法是在中间步骤加程序化门控，确保流程仍在正轨上；不合格就提前终止，后续调用一次也不花。如果步骤无法事先确定，提示链就不适用了。

  - id: AGT-BASE-031
    type: fill
    difficulty: 1
    frequency: 2
    points: [并行化]
    question: |
      并行化（parallelization）有两种变体：把任务拆成互相独立的**不同**子任务同时运行，叫作 ____；把**同一**任务运行多次、再按票数或规则聚合结果，叫作 ____。
    answer: [['分段', 'sectioning'], ['投票', 'voting']]
    explanation: |
      - **分段**（sectioning）：求速度或求专注。例如回答与安全审查同时跑；对一份输出的多个方面分别评估。
      - **投票**（voting）：求可靠。例如多个提示词审查同一段代码是否有漏洞，用投票门槛平衡误报和漏报。

      两者的共同点是子任务都在代码里写死；如果子任务要由 LLM 在运行时决定，就是编排者-工作者。

  - id: AGT-BASE-032
    type: short
    difficulty: 1
    frequency: 3
    points: [Agent定义与组成, 自主程度光谱]
    question: |
      什么是 Agent？它和一般的 LLM 应用（如单次问答、带检索的问答）有什么区别？
    answer: |
      1. **定义**：Agent 是让大模型在循环中根据环境反馈、自主使用工具去完成目标的系统。常拆成五部分：LLM（决策）、工具（获取信息、执行动作）、记忆（短期为上下文中的轨迹，长期为外部存储）、规划（拆解、排序、重规划）、循环（加上终止条件把它们串起来）。
      2. **三个本质区别**：
         - 多步：一个目标需要多轮「思考 → 行动 → 观察」；
         - 有副作用：会下单、改代码、发邮件，而不只是生成文本；
         - 自己决定下一步和何时停：控制流交给了模型。
      3. **自主程度是光谱**：单次调用 → 增强型 LLM（带检索、工具，但只走一轮）→ 工作流（代码写死路径）→ 受限 Agent（在限定工具内自选下一步）→ 自主 Agent。区别在于谁决定下一步。
      4. **工程含义**：一旦自主，就要处理终止条件、错误恢复、预算、权限与结果验证。这些都属于运行时，所以 Agent = 模型 + 运行时，而不是「更聪明的模型」。
    rubric:
      - '给出「LLM 在循环中根据环境反馈使用工具」的定义，并说出主要组件及职责（3 分）'
      - '说清多步、副作用、自主决定何时停这三个区别（3 分）'
      - '用自主程度光谱说明增强型 LLM、工作流与 Agent 的差异（2 分）'
      - '指出终止、错误处理、预算、权限等运行时问题（2 分）'
    explanation: |
      **常见失分点**：把 Agent 说成「更聪明的模型」或「接了插件的聊天机器人」；把只调用一次工具的问答也叫 Agent；只背组件名，说不出多步、副作用、自主停止带来的工程难点。追问「只调用一次工具的机器人算不算 Agent」时，要答出它是增强型 LLM，缺少观察后再决策的循环。

  - id: AGT-BASE-033
    type: short
    difficulty: 2
    frequency: 3
    points: [工作流与Agent, Agent适用场景]
    question: |
      工作流和 Agent 怎么选？请从控制流、可预测性、成本与延迟、调试、擅长的任务五个维度对比两者，并给出一个实用的选型判断顺序。
    answer: |
      **对比**：

      | 维度 | 工作流 | 自主 Agent |
      |---|---|---|
      | 控制流 | 代码写死，LLM 只负责每个节点 | LLM 在运行时决定下一步和何时停 |
      | 可预测性 | 高，路径可枚举、可测试 | 低，同一输入可能走不同路径 |
      | 成本与延迟 | 固定、可估算 | 随步数波动，累计输入随步数平方级增长 |
      | 调试 | 能定位到具体节点 | 要读完整轨迹才能定位 |
      | 擅长 | 步骤明确的高频任务 | 开放式、步数无法预知的任务 |

      **选型顺序**：

      1. 单次调用加检索和示例能否解决？能就停在这里；
      2. 步骤能否事先写清？能就用工作流（提示链、路由、并行化等）；
      3. 路径无法预知，**并且**环境能给出可靠反馈（测试、页面状态）、出错代价可控，才上 Agent；
      4. 涉及付款、删除数据等不可逆操作：工作流搭骨架，只在局部放 Agent，关键步骤加人工确认。

      **实践**：生产中多为混合架构，例如用路由把高频固定问题交给工作流，只把长尾复杂问题交给受限 Agent。
    rubric:
      - '五个维度的对比准确，尤其说清控制流归属与成本特征（4 分）'
      - '给出由简到繁的选型顺序，并点明上 Agent 需要的前提条件（4 分）'
      - '提到混合架构或高风险操作的处理方式（2 分）'
    explanation: |
      **常见失分点**：一上来就说「用 Agent 更智能」；只说「Agent 更灵活」而说不出代价；不会算账（Agent 的累计输入随步数平方级增长，延迟和结果也更不稳定）；忽略「环境反馈可靠」和「出错代价可控」这两个前提。

  - id: AGT-BASE-034
    type: short
    difficulty: 2
    frequency: 3
    points: [提示链, 路由, 并行化, 编排者-工作者, 评估者-优化者]
    tags: [Building effective agents]
    question: |
      Anthropic 总结的五种工作流模式各是什么结构、适合什么场景？其中最容易混淆的是哪一对，怎么区分？
    answer: |
      1. **提示链**：A → 检查 → B → C，每步处理上一步的输出，中间可加程序化门控。适合能干净拆成固定步骤的任务，用延迟换准确率。例：先写大纲、检查合格后再成文。
      2. **路由**：先分类，再进入专门的分支。适合输入类别差异大、分开优化效果更好、且分类能做准的场景。例：客服分流；简单问题交给小模型。
      3. **并行化**：分段（拆成独立的不同子任务同时跑）求速度或专注；投票（同一任务跑多次再聚合）求可靠。例：回答与安全审查并行；多个提示词投票审查代码漏洞。
      4. **编排者-工作者**：中心 LLM 在运行时拆任务、派给工作者、汇总结果。适合子任务无法事先确定的复杂任务。例：要改多个文件的编码任务、多源调研。
      5. **评估者-优化者**：生成 → 评估给意见 → 修改，循环。适合评估标准清晰、迭代能带来可衡量改进的任务。例：文学翻译、需要多轮搜索的复杂检索。

      **最易混淆的一对**：并行化（分段）与编排者-工作者。两者拓扑相似，区别在于子任务是**代码里写死**的，还是由 **LLM 在运行时**根据输入决定的。
    rubric:
      - '正确描述提示链与路由的结构和适用场景（3 分）'
      - '说清并行化的分段与投票两种变体（2 分）'
      - '正确描述编排者-工作者与评估者-优化者（3 分）'
      - '指出分段与编排者-工作者易混，并给出「子任务由谁决定」的区分标准（2 分）'
    explanation: |
      **常见失分点**：只背名字，说不出各自的适用条件；把投票和分段混为一谈；把路由说成编排者-工作者；评估者-优化者不提「评估标准清晰」这个前提，也不提轮数上限。能结合一个自己做过的业务场景说明选型，是加分项。

  - id: AGT-BASE-035
    type: short
    difficulty: 2
    frequency: 3
    points: [终止条件]
    question: |
      如何设计 Agent 的终止条件？请说明终止条件有哪几类、停下来之后应该返回什么，以及各种阈值怎么确定。
    answer: |
      1. **五类终止条件**：
         - 最终答案：模型不再请求工具；也可以提供 `final_answer` 工具让它结构化交卷；
         - 步数上限：防死循环的最后一道闸；
         - 预算：token、费用、墙钟时间，任何一项超限即停；
         - 无进展：同一动作重复、两个动作来回振荡、连续几步没有新信息；有任务指标时看指标（通过的测试数、清单完成数）是否改善；
         - 外部事件：用户打断、需要人工审批、遇到不可恢复的错误。
      2. **分级处理**：先提醒（把「相同参数已调用 3 次，结果不会变」作为观察回填），再强制（禁用该工具、要求重规划），最后停止并升级给人。
      3. **停下后返回什么**：停止原因、已完成的部分、尝试过的路径、还差什么，以及建议的下一步；不能静默失败。「模型说完成了」时还要尽量验证（跑测试、查订单状态）。
      4. **阈值怎么定**：从线上轨迹统计正常任务的步数、token 和重复率分布，取高分位数再留余量；按任务类型分别设置（查天气与修 bug 差几个数量级），并随版本持续回看。
    rubric:
      - '列出最终答案、步数、预算、无进展、外部事件等主要类别（4 分）'
      - '说明先提醒、再强制、最后停止的分级处理（2 分）'
      - '说明停止后要返回原因与进度，并验证「完成」是否属实（2 分）'
      - '阈值基于轨迹统计并按任务类型区分（2 分）'
    explanation: |
      **常见失分点**：只答「设一个 max_iterations」——那只是最后一道闸，撞上限之前可能已经白烧了很多钱；不提无进展检测；触发上限后静默返回空结果；把模型自称「完成」当成真的完成。

  - id: AGT-BASE-036
    type: short
    difficulty: 2
    frequency: 2
    points: [自主程度光谱]
    source: 'Anthropic《Building effective agents》（2024-12-19）：https://www.anthropic.com/engineering/building-effective-agents'
    question: |
      有人说「自主程度是旋钮，不是开关」。请解释这句话：光谱上大致有哪几档？越往自主一端移动，收益和代价分别是什么？工程上如何「按需拧旋钮」？
    answer: |
      1. **几档**（区别在于谁决定下一步）：单次调用（代码）→ 增强型 LLM（模型决定本轮是否检索、用哪个工具，只走一轮）→ 工作流（代码写死路径，模型填每一格）→ 受限 Agent（模型在给定工具和状态里自选下一步）→ 自主 Agent（模型决定做什么、做几步、何时停）。
      2. **收益**：能处理开放式、步数无法预知的任务，能根据中间结果随机应变，人工编排的工作量更少。
      3. **代价**：更难预测和测试；成本和延迟更高且波动大；错误会逐步累积；调试要读完整轨迹；权限越大，越权与被注入的风险越高。
      4. **按需拧旋钮**：
         - 能固定的步骤固定下来，只把真正需要判断的地方交给模型；
         - 用受限 Agent 缩小动作空间，例如用状态机按阶段开放工具，模型无法跳过「用户确认」直接付款；
         - 高风险、不可逆的操作加人工确认，只读操作自动放行；
         - 框架与平台也体现了这种思路：扣子、Dify 同时提供工作流与智能体，LangGraph 允许在一张图里混用两者。
    rubric:
      - '说出光谱的主要档位及「谁决定下一步」这一划分标准（3 分）'
      - '说清自主性的收益与代价，至少包含可预测性、成本、错误累积中的两项（3 分）'
      - '给出按需调节的具体做法，如固定步骤、受限动作空间、人工确认（4 分）'
    explanation: |
      **常见失分点**：把「是不是 Agent」当成非黑即白；认为越自主越先进；只讲收益不讲代价；说不出受限 Agent 这类中间形态。好的回答会举出具体例子，比如订票场景里「查询比价交给 Agent、占座支付交给状态机」。

  - id: AGT-BASE-037
    type: short
    difficulty: 3
    frequency: 2
    points: [评估者-优化者]
    question: |
      评估者-优化者（evaluator-optimizer）模式在什么条件下有效？实践中常见哪些失败方式，分别如何规避？
    answer: |
      **有效的条件**：

      1. 评估标准清晰，最好能逐条检查（品牌规范、术语表、格式要求）；
      2. 迭代能带来可衡量的改进：人给出反馈时输出确实能改好，并且 LLM 也能给出这样的反馈。

      **常见失败与规避**：

      | 失败方式 | 规避方法 |
      |---|---|
      | 评估者永远不满意，死循环 | 设轮数上限；到上限返回失败与剩余问题，转人工或降级 |
      | 评估者和优化者是同一模型、同一套提示词，盲点相同，发现不了问题 | 能用规则、测试、工具验证的部分尽量用程序评估；其余换提示词视角，条件允许换一个模型 |
      | 意见空泛（「再改进一下」），优化者无从下手 | 要求评估者逐条给出可执行的意见，引用具体位置 |
      | 来回振荡：改好 A 又弄坏 B | 每轮对已通过的标准做回归检查；记录各轮意见，检测重复出现的问题 |
      | 迎合评估者：输出越来越符合评估者口味，却偏离真实目标 | 定期用人工或独立评测集抽查；评估标准与业务指标对齐 |
      | 成本与延迟随轮数成倍增长 | 统计通过所需的轮数分布，限制轮数，只对高价值任务使用 |
    rubric:
      - '说出评估标准清晰、反馈能带来可衡量改进这两个前提（3 分）'
      - '列出至少三种失败方式，如死循环、同源盲点、意见空泛、振荡、迎合评估者（4 分）'
      - '为失败方式给出对应的规避方法（3 分）'
    explanation: |
      **常见失分点**：只说「生成、评估、修改」的流程，不讲适用前提；默认评估者总是对的；不设轮数上限；没有意识到同一个模型自评自改容易「自我感觉良好」。这一模式与反思类方法同理：评估信号越客观（测试、规则、工具），效果越可靠。

  - id: AGT-BASE-038
    type: scenario
    difficulty: 3
    frequency: 2
    points: [路由, 工作流与Agent, Agent适用场景]
    question: |
      某航司把所有退改签咨询都交给一个 ReAct Agent 处理，它可以调用查询订单、查询退改规则、提交退票等工具，费用由模型根据规则文本自行计算。上线一个月后发现：

      1. 平均每单要走 9 步，成本约为旧版固定工作流的 10 倍；
      2. 同一个问题问两次，算出的退票费不一致；
      3. 出现过两起用户还没确认、Agent 就直接提交了退票的投诉。

      请分析原因，并给出改造方案。
    answer: |
      **原因分析**：

      1. **自主性用错了地方**：多数咨询是「查规则、算费用」这类步骤固定的问题，却全部走 Agent；Agent 的累计输入随步数平方级增长，成本自然高出一个数量级。
      2. **确定性计算交给了模型**：退票费是规则计算，本应确定、可复现，让模型读规则文本心算，必然出现不一致和算错。
      3. **写操作没有护栏**：提交退票是不可逆的写操作，却和查询工具一样随时可调用，没有状态机约束，也没有用户确认环节。

      **改造方案**：

      1. **路由分流**：意图分类后，规则咨询、费用查询走固定工作流（查订单 → 规则引擎算费 → 生成解释）；只有复杂、需要多轮澄清的情况交给 Agent。
      2. **费用由工具确定性计算**：把规则做成规则引擎或计算工具，模型只负责收集参数和解释结果。
      3. **写操作进状态机**：收集信息 → 算费 → 复述并请用户确认（航班、乘客、金额）→ 提交退票。每个状态只开放该状态允许的工具，模型无法跳过确认；提交带幂等键，防止重复。
      4. **受限 Agent**：保留的 Agent 只开放只读工具，设步数与预算上限，无进展时转人工。
      5. **验证与指标**：离线用用户模拟器和测试库覆盖改签、退票、价格变化等场景，用数据库终态判定；线上盯每单成本、同问题费用一致率、未经确认的写操作数（必须为 0）、转人工率和投诉率。
    rubric:
      - '准确指出三个问题的根因：滥用自主性、确定性计算交给模型、写操作无护栏（3 分）'
      - '提出路由加工作流分流高频固定请求（2 分）'
      - '提出费用由规则引擎或工具确定性计算（2 分）'
      - '提出状态机、用户确认、幂等等写操作控制（2 分）'
      - '给出验证方法和关键指标（1 分）'
    explanation: |
      **常见失分点**：只想着「换个更强的模型」或「改提示词让它别乱提交」；没有意识到费用计算应当确定性实现；只做路由却忘了写操作的确认与状态机。高分回答的主线是：**能固定的固定下来，需要判断的才交给模型，有副作用的必须有系统级护栏**。

  - id: AGT-BASE-039
    type: scenario
    difficulty: 3
    frequency: 2
    points: [提示链, 路由, 并行化, 编排者-工作者, 评估者-优化者]
    question: |
      为下面五个需求分别选择最合适的工作流模式，并各用一两句话说明理由：

      1. 合同审查：同时检查付款条款、违约责任、保密条款三个方面，最后汇总成一份审查报告；
      2. 客户来信：先判断意图（投诉、咨询、商务合作），再进入各自的处理流程；
      3. 周报生成：从工单系统抽取本周数据 → 生成要点 → 用程序核对要点中的数字与数据一致 → 润色成文；
      4. 广告文案：按一份可逐条检查的品牌规范反复打磨，直到全部符合；
      5. 根据一句话需求生成一个小型网站：需要哪些页面、每个页面包含哪些组件，取决于具体需求。
    answer: |
      1. **并行化（分段）**：三个方面是事先确定、互相独立的不同子任务，可以同时审查再汇总；每个调用专注一个方面，效果通常好于一次调用面面俱到。
      2. **路由**：输入类别差异大、各类处理方式不同；只要意图分类足够准，就能为每类单独优化提示词和工具。
      3. **提示链（带门控）**：步骤固定、前后相继；核对数字是程序化门控，不通过就提前结束或报错，不再润色。
      4. **评估者-优化者**：评估标准清晰（品牌规范可逐条检查），迭代能带来可衡量的改进；要设轮数上限。
      5. **编排者-工作者**：子任务（页面与组件）无法事先确定，需要中心 LLM 在运行时拆解、分派给工作者并整合。
    rubric:
      - '需求 1 选并行化（分段）并说明子任务固定且独立（2 分）'
      - '需求 2 选路由并说明分类前提（2 分）'
      - '需求 3 选提示链并指出门控的作用（2 分）'
      - '需求 4 选评估者-优化者并提到评估标准清晰与轮数上限（2 分）'
      - '需求 5 选编排者-工作者并说明子任务需运行时决定（2 分）'
    explanation: |
      **常见失分点**：把需求 1 答成编排者-工作者（三个方面是写死的，不需要 LLM 临时拆）；把需求 5 答成并行化（页面数量和内容事先不知道）；把需求 3 的「核对数字」误认为评估者-优化者（门控不通过就结束，而不是带着意见循环修改）。判断时始终问两个问题：步骤能否事先写清？子任务由谁决定？

  - id: AGT-BASE-040
    type: design
    difficulty: 3
    frequency: 2
    points: [Agent适用场景, 工作流与Agent, 终止条件, 编排者-工作者]
    question: |
      设计一个企业「差旅报销审核助手」：员工提交报销单（发票图片、行程、金额、事由），系统需要检查是否符合差旅标准、发票是否有效、是否重复报销；对异常情况（如酒店价格超标）要调查原因（比如是否因会议安排只能住在会场酒店），最后给出「建议通过 / 建议驳回 / 转人工」的结论。请说明你会如何在工作流与 Agent 之间做取舍，并给出整体架构、工具与权限、终止与人工介入、评测指标和主要风险。
    answer: |
      **1. 需求澄清与估算**：每月单量、单据平均张数、可接受的处理时延；自动审核的目标覆盖率；哪些结论必须由人确认（驳回、大额）。假设每月 2 万单，约八成为标准单据。

      **2. 取舍原则**：绝大多数检查步骤固定、规则明确，用**工作流**保证可预测、可审计、成本可控；只有「异常原因调查」路径无法预知，放一个**受限 Agent**。

      **3. 架构**：

      1. 结构化抽取：单次 LLM 调用（结构化输出）从发票图片中抽取金额、日期、商户、税号；
      2. 规则校验（代码）：差旅标准、发票验真接口、重复报销查重、日期与行程匹配；
      3. 路由：全部通过 → 生成「建议通过」；明显违规（假票、重复）→ 生成「建议驳回」并附证据；存在可解释的异常 → 进入调查 Agent；
      4. 调查 Agent（受限 ReAct）：只读工具，如查日历与会议安排、查差旅政策知识库、查历史同类审批；输出「异常原因 + 证据 + 建议」；
      5. 汇总：按模板生成审核意见，所有结论附可追溯的证据。

      **4. 工具与权限**：调查 Agent 只能用只读工具，按当前报销单的员工身份做数据权限过滤；系统本身不直接执行审批，审批动作由人或下游审批流完成。

      **5. 终止与人工介入**：Agent 设步数、token、时间上限；无进展或证据不足时停止并转人工，附上已查过的内容；驳回和大额单据必须人工确认。

      **6. 评测指标**：与资深审核员结论的一致率；**误放行率**（最关键）与误驳回率；自动处理率；每单成本与时延；转人工率。离线用历史已审单据回放评测，上线先灰度、人工复核抽样。

      **7. 主要风险**：发票或附件中的文字可能含注入指令，一律当数据处理，不能改变流程；个人信息脱敏与访问审计；规则更新后的回归测试；模型抽取错误由验真接口和金额交叉校验兜底。
    rubric:
      - '明确「工作流为骨架、仅异常调查用受限 Agent」的取舍并说明理由（3 分）'
      - '架构完整：抽取、规则校验、路由、调查、汇总（2 分）'
      - '工具只读、权限按员工过滤、审批动作不由模型执行（2 分）'
      - '有终止条件、预算与人工介入设计（1 分）'
      - '给出以误放行率为核心的评测指标，并识别注入、隐私等风险（2 分）'
    explanation: |
      **常见失分点**：整件事交给一个自主 Agent；让模型直接做最终审批；不区分误放行与误驳回的代价；忽视发票中嵌入文字的注入风险。好的设计体现「按需拧旋钮」：确定的部分用代码和工作流，不确定的部分才交给模型，且模型的权限只够完成调查。

  - id: AGT-BASE-041
    type: coding
    difficulty: 3
    frequency: 3
    points: [Agent Loop, 终止条件]
    tags: [手写Agent Loop, ScriptedLLM, 工具注册]
    question: |
      不使用任何 Agent 框架，手写一个最小的 Agent 循环：

      ```python
      def run_agent(llm, tools, task, max_steps=8, max_tokens=None, max_repeat=3) -> dict: ...
      ```

      - `llm(messages)` 返回一个 dict：要么是 `{"final": 文本, "tokens": n}`（交卷），要么是 `{"tool": 工具名, "args": 参数 dict, "tokens": n}`（调用工具）；`tokens` 缺省时按 0 计。测试用下面的 `ScriptedLLM` 按脚本依次返回预设回复来模拟模型，并记录每次收到的消息。
      - `tools` 把工具名映射到 `{"fn": 函数, "required": [必填参数名, ...]}`。
      - 消息列表以 `{"role": "user", "content": task}` 开始；每执行一次工具调用，依次追加 `{"role": "assistant", "tool": 工具名, "args": 参数}` 和 `{"role": "tool", "content": 观察}`。
      - 观察的生成规则：工具不存在 → `"错误：未知工具 <工具名>"`；缺少必填参数 → `"错误：缺少参数 a, b"`（按 `required` 中的顺序列出）；函数抛异常 → `"错误：<异常类名>: <异常信息>"`；否则为 `str(返回值)`。出错时不终止循环，让模型看到错误后自行修正。
      - 每一步先调用模型并累计 token，再依次判断：
        1. 回复是 final → 返回 `{"status": "done", "answer": 文本, "steps": 本步序号}`；
        2. 设置了 `max_tokens` 且累计 token 超过它 → 返回 status 为 `"budget"`，本步的工具调用不再执行；
        3. 本次调用与紧邻的前 `max_repeat - 1` 次已执行的调用完全相同（工具名与参数都相同，参数键的顺序不影响）→ 返回 status 为 `"repeat"`，本次不执行；
        4. 否则执行工具并回填。
      - 调用模型 `max_steps` 次仍未交卷 → 返回 status 为 `"max_steps"`。非 done 时 `answer` 为 `None`，`steps` 为已调用模型的次数。约定 `max_repeat >= 2`。

      ```python
      class ScriptedLLM:
          def __init__(self, replies):
              self.replies, self.calls = list(replies), []

          def __call__(self, messages):
              self.calls.append([dict(m) for m in messages])
              if not self.replies:
                  raise RuntimeError("脚本已用完")
              return self.replies.pop(0)
      ```
    answer: |
      import json


      def run_agent(llm, tools, task, max_steps=8, max_tokens=None, max_repeat=3):
          messages = [{"role": "user", "content": task}]
          used, recent = 0, []                      # recent：已执行调用的签名
          for step in range(1, max_steps + 1):
              reply = llm(messages)
              used += reply.get("tokens", 0)
              if "final" in reply:
                  return {"status": "done", "answer": reply["final"], "steps": step}
              if max_tokens is not None and used > max_tokens:
                  return {"status": "budget", "answer": None, "steps": step}
              name, args = reply.get("tool"), reply.get("args") or {}
              sig = (name, json.dumps(args, sort_keys=True, ensure_ascii=False))
              k = max_repeat - 1
              if len(recent) >= k and all(s == sig for s in recent[-k:]):
                  return {"status": "repeat", "answer": None, "steps": step}
              recent.append(sig)
              messages.append({"role": "assistant", "tool": name, "args": args})
              messages.append({"role": "tool", "content": execute(tools, name, args)})
          return {"status": "max_steps", "answer": None, "steps": max_steps}


      def execute(tools, name, args):
          spec = tools.get(name)
          if spec is None:
              return f"错误：未知工具 {name}"
          missing = [p for p in spec.get("required", []) if p not in args]
          if missing:
              return "错误：缺少参数 " + ", ".join(missing)
          try:
              return str(spec["fn"](**args))
          except Exception as e:                    # 工具异常回填给模型，而不是让循环崩溃
              return f"错误：{type(e).__name__}: {e}"
    test: |
      class ScriptedLLM:
          def __init__(self, replies):
              self.replies, self.calls = list(replies), []

          def __call__(self, messages):
              self.calls.append([dict(m) for m in messages])
              if not self.replies:
                  raise RuntimeError("脚本已用完")
              return self.replies.pop(0)


      tools = {"add": {"fn": lambda a, b: a + b, "required": ["a", "b"]},
               "div": {"fn": lambda a, b: a / b, "required": ["a", "b"]}}

      # 1. 正常完成：工具调用与结果都按顺序回填
      llm = ScriptedLLM([{"tool": "add", "args": {"a": 1, "b": 2}, "tokens": 10},
                         {"final": "3", "tokens": 5}])
      assert run_agent(llm, tools, "1+2=?") == {"status": "done", "answer": "3", "steps": 2}
      assert llm.calls[0] == [{"role": "user", "content": "1+2=?"}]
      assert llm.calls[1][1:] == [{"role": "assistant", "tool": "add", "args": {"a": 1, "b": 2}},
                                  {"role": "tool", "content": "3"}]

      # 2. 未知工具、缺参数、工具异常都作为观察回填，循环继续
      llm = ScriptedLLM([{"tool": "mul", "args": {}}, {"tool": "add", "args": {"a": 1}},
                         {"tool": "div", "args": {"a": 1, "b": 0}}, {"final": "放弃"}])
      assert run_agent(llm, tools, "t") == {"status": "done", "answer": "放弃", "steps": 4}
      obs = [m["content"] for m in llm.calls[3] if m["role"] == "tool"]
      assert obs[0] == "错误：未知工具 mul" and obs[1] == "错误：缺少参数 b"
      assert obs[2].startswith("错误：ZeroDivisionError")

      # 3. 连续第 3 次相同调用（键序不同也算相同）时停止，且这一次不执行
      hits = []
      tools2 = {"search": {"fn": lambda q, k=1: hits.append(q) or "无结果", "required": ["q"]}}
      llm = ScriptedLLM([{"tool": "search", "args": {"q": "x", "k": 1}},
                         {"tool": "search", "args": {"k": 1, "q": "x"}},
                         {"tool": "search", "args": {"q": "x", "k": 1}}])
      assert run_agent(llm, tools2, "t") == {"status": "repeat", "answer": None, "steps": 3}
      assert hits == ["x", "x"]

      # 4. 不连续的相同调用不算重复
      llm = ScriptedLLM([{"tool": "add", "args": {"a": 1, "b": 1}}, {"tool": "add", "args": {"a": 2, "b": 2}},
                         {"tool": "add", "args": {"a": 1, "b": 1}}, {"final": "ok"}])
      assert run_agent(llm, tools, "t")["status"] == "done"

      # 5. 预算：超出后不再执行工具；给出最终回答的那一步不受影响
      hits.clear()
      llm = ScriptedLLM([{"tool": "search", "args": {"q": "a"}, "tokens": 60},
                         {"tool": "search", "args": {"q": "b"}, "tokens": 60}])
      assert run_agent(llm, tools2, "t", max_tokens=100) == {"status": "budget", "answer": None, "steps": 2}
      assert hits == ["a"]
      assert run_agent(ScriptedLLM([{"final": "ok", "tokens": 500}]), tools, "t", max_tokens=100)["status"] == "done"

      # 6. 步数上限：恰好调用 max_steps 次模型
      llm = ScriptedLLM([{"tool": "add", "args": {"a": i, "b": 0}} for i in range(10)])
      assert run_agent(llm, tools, "t", max_steps=4) == {"status": "max_steps", "answer": None, "steps": 4}
      assert len(llm.calls) == 4
    explanation: |
      **思路**：Agent 循环的骨架只有「调模型 → 判断 → 执行 → 回填」四步，难点全在边界处理。

      1. **工具注册与参数校验**：执行前先查注册表、再查必填参数，把问题变成一条「观察」回填，而不是抛异常。模型看到「缺少参数 b」通常下一步就能改正；让异常冒泡会使整个任务崩溃，前面的进度全部丢失。
      2. **回填顺序**：先追加模型的调用（assistant），再追加工具结果（tool）。真实 API（OpenAI 的 `tool_calls` / `tool` 消息、Anthropic 的 `tool_use` / `tool_result`）都要求结果紧跟在对应的调用之后，顺序错了请求会被拒绝。
      3. **三类终止条件**：
         - 步数上限是最后一道闸；
         - 预算要在**执行工具之前**检查：已经超支时再执行一个可能有副作用、又要花钱的工具没有意义；但已经交卷的那一步照常返回答案；
         - 重复检测用「工具名 + 规范化参数」作签名：`json.dumps(..., sort_keys=True)` 让键序不同的同一调用得到同一个签名；只看**连续**重复，隔几步再查一次同样的东西可能是合理的。
      4. **返回停止原因**：调用方据此决定重试、转人工还是给用户部分结果，不能只返回一个空答案。

      **为什么用 ScriptedLLM**：真实模型的输出有随机性，没法写确定的断言。按脚本返回预设回复的假模型让每个分支（正常完成、报错回填、重复、超预算、步数耗尽）都能被精确触发，这也是测试 Agent 循环的常规做法。

      **常见错误**：工具报错就 `raise`；忘了把 assistant 的调用消息加进历史；预算检查放在执行工具之后；重复检测不做参数规范化，键序一变就漏检。面试时还可以继续扩展：工具超时、并行调用、把每步状态写入检查点以便断点续跑。
    source: 'OpenAI 与 Anthropic 工具调用文档（消息顺序约定）'

  - id: AGT-BASE-042
    type: code_debug
    difficulty: 2
    frequency: 2
    points: [Agent Loop]
    question: |
      下面是一个最小的 Agent 循环：`llm(messages)` 返回 `{"final": 文本}` 或 `{"tool": 工具名, "args": 参数}`，`tools` 把工具名映射到函数。上线后出现两个现象：

      1. 某个工具抛出异常（如除零）时，整个任务直接崩溃；
      2. 模型像是「失忆」了：每一步都只看到最初的任务，反复发出同样的调用，直到步数耗尽。

      请指出代码中的问题并修正。
    code: |
      def run_agent(llm, tools, task, max_steps=5):
          messages = [{"role": "user", "content": task}]
          for step in range(1, max_steps + 1):
              reply = llm(messages)
              if "final" in reply:
                  return reply["final"], step
              name, args = reply["tool"], reply.get("args", {})
              result = tools[name](**args)
              history = messages + [
                  {"role": "assistant", "tool": name, "args": args},
                  {"role": "tool", "content": str(result)},
              ]
          return None, max_steps
    fixed_code: |
      def run_agent(llm, tools, task, max_steps=5):
          messages = [{"role": "user", "content": task}]
          for step in range(1, max_steps + 1):
              reply = llm(messages)
              if "final" in reply:
                  return reply["final"], step
              name, args = reply["tool"], reply.get("args", {})
              try:
                  if name not in tools:
                      raise KeyError(f"未知工具 {name}")
                  obs = str(tools[name](**args))
              except Exception as e:
                  obs = f"错误：{type(e).__name__}: {e}"
              messages += [
                  {"role": "assistant", "tool": name, "args": args},
                  {"role": "tool", "content": obs},
              ]
          return None, max_steps
    test: |
      class ScriptedLLM:
          def __init__(self, replies):
              self.replies, self.seen = list(replies), []

          def __call__(self, messages):
              self.seen.append(list(messages))       # 记录本次调用时看到的消息快照
              return self.replies.pop(0)


      def div(a, b):
          return a / b


      llm = ScriptedLLM([{"tool": "div", "args": {"a": 1, "b": 0}},
                         {"tool": "div", "args": {"a": 6, "b": 3}},
                         {"final": "2.0"}])
      assert run_agent(llm, {"div": div}, "6/3") == ("2.0", 3)
      assert llm.seen[1][-1]["content"].startswith("错误：ZeroDivisionError")
      assert llm.seen[2][-1] == {"role": "tool", "content": "2.0"}
      assert len(llm.seen[2]) == 5
      llm = ScriptedLLM([{"tool": "nope", "args": {}}, {"final": "ok"}])
      assert run_agent(llm, {}, "t") == ("ok", 2)
      assert "nope" in llm.seen[1][-1]["content"]
    answer: |
      **问题 1（第 8 行）**：`tools[name](**args)` 没有任何保护。工具名不存在会抛 `KeyError`，工具内部出错会抛各种异常，异常一路冒泡，整个任务崩溃。应当捕获异常，把错误信息作为观察回填给模型，让它换参数或换工具。

      **问题 2（第 9～12 行）**：`messages + [...]` 生成了一个**新列表**并赋给 `history`，`messages` 本身从未改变，`history` 也没有再被使用。下一轮调用模型时传入的仍是只有任务的 `messages`，模型看不到自己做过什么、得到了什么，只能重复同样的调用。应当原地追加：`messages += [...]`（或 `messages.extend(...)`）。

      **修正**：

      ```python
      try:
          if name not in tools:
              raise KeyError(f"未知工具 {name}")
          obs = str(tools[name](**args))
      except Exception as e:
          obs = f"错误：{type(e).__name__}: {e}"
      messages += [
          {"role": "assistant", "tool": name, "args": args},
          {"role": "tool", "content": obs},
      ]
      ```
    explanation: |
      两个 bug 对应 Agent 循环最基本的两条不变式：

      1. **工具错误是观察，不是异常**：模型看到「错误：ZeroDivisionError: division by zero」后，通常下一步就能修正参数；直接崩溃则会丢掉前面所有进度。只有真正无法继续的情况（如鉴权彻底失败）才应终止，并且要返回停止原因。
      2. **历史必须累积**：Agent 的「记忆」就是不断增长的消息列表。`a + b` 返回新对象，`a += b` 才原地修改列表，这是 Python 中很常见的失误；症状正是「模型失忆、反复调用同一工具」，很容易被误判成模型能力问题，进而去改提示词。

      注意测试里的假模型记录的是 `list(messages)` 快照：修正后的代码会原地修改同一个列表，如果只保存引用，之后的追加会改写「当时看到的内容」，测试就失去意义。只修好其中一个 bug，测试仍然不能通过。

  - id: AGT-BASE-043
    type: code_fill
    difficulty: 2
    frequency: 2
    points: [Agent Loop, 终止条件]
    tags: [状态机]
    question: |
      把 ReAct 循环改写成显式状态机：THINK（调用模型）→ ACT（执行工具）→ OBSERVE（回填观察）→ THINK……，其中 DONE 与 FAILED 是终止状态。步数上限在每次进入 THINK、调用模型**之前**检查，达到上限即转入 FAILED。补全代码中的四个空。
    code: |
      def step(state, ctx, llm, tools, max_steps):
          """执行一次状态转移，返回下一个状态。"""
          if state == "THINK":
              if ____:
                  return "FAILED"
              ctx["steps"] += 1
              reply = llm(ctx["messages"])
              if "final" in reply:
                  ctx["answer"] = reply["final"]
                  return "DONE"
              ctx["pending"] = reply
              return ____
          if state == "ACT":
              call = ctx.pop("pending")
              fn = tools.get(call["tool"])
              try:
                  ctx["obs"] = str(fn(**call["args"])) if fn else f"未知工具 {call['tool']}"
              except Exception as e:
                  ctx["obs"] = f"错误：{e}"
              ctx["messages"].append({"role": "assistant", "tool": call["tool"], "args": call["args"]})
              return "OBSERVE"
          if state == "OBSERVE":
              ctx["messages"].append({"role": "tool", "content": ctx.pop("obs")})
              return ____
          raise ValueError(f"非法状态 {state}")


      def run(llm, tools, task, max_steps=6):
          state = "THINK"
          ctx = {"messages": [{"role": "user", "content": task}], "steps": 0}
          while state not in ____:
              state = step(state, ctx, llm, tools, max_steps)
          return state, ctx.get("answer"), ctx["steps"]
    answer: ['ctx["steps"] >= max_steps', '"ACT"', '"THINK"', '("DONE", "FAILED")']
    test: |
      class ScriptedLLM:
          def __init__(self, replies):
              self.replies, self.seen = list(replies), []

          def __call__(self, messages):
              self.seen.append(list(messages))
              return self.replies.pop(0)


      tools = {"add": lambda a, b: a + b}
      llm = ScriptedLLM([{"tool": "add", "args": {"a": 2, "b": 3}}, {"final": "5"}])
      assert run(llm, tools, "2+3") == ("DONE", "5", 2)
      assert llm.seen[1][-1] == {"role": "tool", "content": "5"}
      llm = ScriptedLLM([{"tool": "add", "args": {"a": 1, "b": 1}}] * 10)
      assert run(llm, tools, "loop", max_steps=3) == ("FAILED", None, 3)
      assert len(llm.seen) == 3
      llm = ScriptedLLM([{"tool": "sub", "args": {}}, {"final": "x"}])
      assert run(llm, tools, "t") == ("DONE", "x", 2)
      assert llm.seen[1][-1] == {"role": "tool", "content": "未知工具 sub"}
    explanation: |
      四个空依次是：`ctx["steps"] >= max_steps`、`"ACT"`、`"THINK"`、`("DONE", "FAILED")`。

      - 第 1 空：步数检查放在**调用模型之前**，已经用满 `max_steps` 次就不再调用，转入 FAILED。测试中 `max_steps=3` 时模型恰好被调用 3 次。
      - 第 2、3 空：模型要调用工具就进入 ACT；回填观察之后回到 THINK，形成「思考 → 行动 → 观察」的环。
      - 第 4 空：运行循环只认终止状态集合，DONE 与 FAILED 之外的状态都会继续转移。

      **为什么要写成显式状态机**：每个转移都是一个可以单独测试的小函数；环上的每一圈都必须经过 THINK，而 THINK 里有计数守卫，所以循环一定会终止；`(state, ctx)` 可以在每次转移后序列化保存，崩溃后从断点恢复；要加人工审批，只需增加一个 WAIT_APPROVAL 状态和相应的转移。LangGraph 的状态图本质上就是这种写法的通用化。

  - id: AGT-BASE-044
    type: short
    difficulty: 2
    frequency: 2
    points: [Agent Loop, 终止条件]
    tags: [状态机, 人在回路]
    question: |
      面试官问：「你的 Agent 主循环就是一个 `while True`：调模型、执行工具、回填结果。你怎么保证它不会死循环？进程崩溃后能不能从中间恢复？要在执行退款前插入人工审批，又该怎么改？」请说明如何把它改写成显式状态机：给出状态、转移条件和终止状态，并分析这种写法相对 `while` 循环的收益与代价。
    answer: |
      1. **状态与转移**（示例）：
         - THINK：调用模型。返回最终答案 → DONE（交卷前可先过一道结果校验）；返回工具调用 → ACT；步数、token、费用或时长超限 → FAILED。
         - ACT：校验参数与权限后执行工具。动作属于高风险（如退款）→ WAIT_APPROVAL；执行完成 → OBSERVE。
         - WAIT_APPROVAL：批准 → 回到 ACT 执行；驳回 → 把驳回理由作为观察，回到 THINK；超时未处理 → FAILED，或升级给人。
         - OBSERVE：回填结果，做无进展检测（重复动作、状态签名不变）。正常 → THINK；判定兜圈子 → 先插入提醒，再次触发 → FAILED。
         - 终止状态：DONE、FAILED（附停止原因：步数、预算、重复、审批超时、不可恢复的错误）。
      2. **防死循环**：环上的每一圈都经过 THINK，计数和预算守卫就放在这里，循环一定会结束；非法转移直接报错，不会「悄悄」进入没有设计过的路径；终止状态是显式的，调用方拿到的是明确的结局和原因，而不是一个跑满了才停的循环。
      3. **崩溃恢复**：每次转移后把 `(state, ctx)` 写入检查点（ctx 含消息、计数、待执行的调用）。重启后从最后保存的状态继续。注意 ACT 可能在「已执行、未保存」时崩溃，重放会重复执行，所以有副作用的工具要带幂等键。
      4. **人工审批**：审批是一个持久化的等待状态，可以挂起几小时甚至几天，审批结果到达后从 WAIT_APPROVAL 恢复，不需要让进程一直阻塞。
      5. **可观测与可测试**：状态转移日志就是天然的 trace；用按脚本返回的假模型可以逐个测试转移，例如「第 3 步返回退款调用 → 应进入 WAIT_APPROVAL」。
      6. **代价**：代码更多、更啰嗦；把业务规则也塞进状态机会导致状态爆炸；状态机只约束控制流，「下一步做什么」仍由模型决定，效果问题不会因此消失。只有两三步的简单任务，一个带守卫的 `while` 循环就够了；需要持久化与审批时，也可以直接使用 LangGraph 这类状态图框架（checkpointer + interrupt），而不必全部自己写。
    rubric:
      - '给出合理的状态集合、转移条件和显式的终止状态（3 分）'
      - '说明守卫放在环上必经的状态里，从而保证终止；终止时返回原因（2 分）'
      - '说明逐次转移的检查点恢复，并指出副作用步骤需要幂等（2 分）'
      - '把人工审批设计成可持久化的等待状态（1 分）'
      - '分析收益与代价，指出简单任务不必上状态机（2 分）'
    explanation: |
      **常见失分点**：只说「加个最大步数」，没有讲清终止状态和停止原因；把状态机理解成「用规则代替模型做决策」；谈恢复却忽略「已执行未保存」带来的重复副作用；把审批写成同步阻塞的 `input()`，进程一重启审批就丢了。好的回答会画出状态转移图，并点明「每一圈都必须经过带守卫的状态」这一保证终止的关键。
