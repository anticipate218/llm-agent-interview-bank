domain: AGT
subcategory: MULTI
questions:

  - id: AGT-MULTI-001
    type: single
    difficulty: 1
    frequency: 3
    points: [多Agent收益与代价]
    question: |
      把一个调研任务从单 Agent 改成「编排者 + 若干子 Agent」后，下列哪一项是多 Agent 最实在、也最常被低估的收益？
    options:
      A: '多个 Agent 分工协作、互相补充视角，系统整体的推理能力会超过其中最强的那个单体模型'
      B: '总 token 消耗明显下降：每个子 Agent 只处理任务的一部分，不必重复读入整份材料'
      C: '子 Agent 在各自干净的上下文里消化原始材料，只交回压缩后的结论，主窗口不被原文塞满'
      D: '子 Agent 之间可以交叉检查彼此的结论，单个子 Agent 的错误很难再沿链路传播'
    answer: C
    explanation: |
      **结论**：多 Agent 的核心收益是**上下文隔离**，其次才是并行与专业分工。

      子 Agent 翻了几十个网页、读了十几万 token，交回去的只是一页结论；编排者的窗口里只有任务、简报和各路摘要。粗略估算：单 Agent 读 8 个网页后窗口里堆着约 60K 原文；改成 1 个编排者 + 4 个子 Agent，总 token 约 180K（约 3 倍），但编排者窗口里只有约 20K。多花的 token 买到的是覆盖面、并行和一个干净的主上下文。

      - A 错：拆分不提升模型本身的能力，提升的是可用上下文总量和并行度。「多 Agent 更智能」「多个视角就能超过最强的单体」是最常见的误解。
      - B 错：恰恰相反，每个子 Agent 都要重新读系统提示词、任务说明和各自的材料，Anthropic 给出的量级是多 Agent 系统的 token 约为普通对话的 15 倍。
      - D 错：交叉检查的副本往往犯相关的错误，多 Agent 反而让错误传播更隐蔽：一个子 Agent 的幻觉写进共享状态，下游就当成事实使用，单点错误会变成一条链。
    source: 'Anthropic《How we built our multi-agent research system》（2025）'

  - id: AGT-MULTI-002
    type: fill
    difficulty: 1
    frequency: 3
    points: [多Agent收益与代价]
    tags: [Anthropic]
    question: |
      Anthropic 在介绍其多 Agent 研究系统的工程博文（2025）中给出过 token 用量的量级：Agent 交互的 token 用量约为普通对话的 ____ 倍，多 Agent 系统约为普通对话的 ____ 倍。
    answer: ['4', '15']
    explanation: |
      **答案**：约 4 倍与约 15 倍。

      原因：Agent 要多轮调用工具，每一轮都把上下文重新发给模型；多 Agent 系统中每个子 Agent 还要各自读一遍系统提示词、任务简报和自己的材料，编排者也要规划与汇总。

      这组数字的用途是「算账」：多 Agent 只适合价值足够高、撑得起数倍 token 的任务。同一篇文章还指出，在 BrowseComp 评测上，token 用量一项就能解释约 80% 的表现差异，多 Agent 本质上是一种能有效「多花 token」的结构。因此评估多 Agent 时，必须和**同等预算**的单 Agent 比较，否则提升可能只是因为花得多。
    source: 'Anthropic《How we built our multi-agent research system》（2025）'

  - id: AGT-MULTI-003
    type: single
    difficulty: 2
    frequency: 3
    points: [多Agent收益与代价, 何时不用多Agent]
    question: |
      下列四个任务中，**最适合**采用「编排者 + 并行子 Agent」多 Agent 架构的是：
    options:
      A: '为一个 3000 行的前端项目重构状态管理，要求所有组件的写法风格保持一致'
      B: '回答用户「我的订单到哪了」，查询一次物流接口即可作答'
      C: '写一篇 2 万字的连载小说，要求人物性格前后统一、伏笔前后呼应'
      D: '调研 12 家竞品近一年的定价与功能变化，各家资料互不相关，最后汇总成一张对比表'
    answer: D
    explanation: |
      **结论**：适合多 Agent 的任务通常是**读多写少、子任务独立、原始材料远超一个窗口、结果价值高**。D 同时满足这几条：12 家竞品可以并行调研，彼此没有需要对齐的隐含决策，每个子 Agent 只回传结构化要点，编排者汇总成表。

      - A 错：重构是「写多、强耦合」的任务，每处改动都隐含风格、接口上的决定，分头改必然冲突。适合单 Agent，最多配几个只读的调研子 Agent。
      - B 错：一次工具调用就能完成，拆分只会增加协调开销和 token，属于「协调比干活还贵」。
      - C 错：长文写作和编码一样强耦合，人物、伏笔是贯穿全文的隐含决策，分头写到合并时才暴露矛盾。

      判断时可以逐一过五个维度：子任务耦合度、读写比例、上下文规模、任务价值、子结果能否独立验收。

  - id: AGT-MULTI-004
    type: judge
    difficulty: 2
    frequency: 2
    points: [多Agent收益与代价]
    tags: [Anthropic, BrowseComp]
    question: |
      Anthropic 的多 Agent 研究系统在内部评测上明显优于单 Agent，其主要原因是角色分工让模型的推理能力变强了；至于 token 用量多少，与最终效果的关系不大。
    answer: false
    explanation: |
      **错误**。Anthropic 在 2025 年的工程博文中报告：以 Claude Opus 4 为主 Agent、Claude Sonnet 4 为子 Agent 的多 Agent 系统，在内部调研评测上比单 Agent 的 Opus 4 高 90.2%；而在 BrowseComp 评测上，**token 用量一项就能解释约 80% 的表现差异**，再加上工具调用次数和模型选择，可解释约 95%。

      也就是说，多 Agent 的主要作用是让系统**有效地花更多 token**：多个子 Agent 在各自独立的上下文里并行搜索、阅读，突破了单个窗口的容量限制。拆分本身不会让模型更聪明。由此得到两条实践要求：只把它用在价值撑得起 token 的任务上；与单 Agent 比较时必须用**同等预算**，否则提升可能只是「多花了钱」。
    source: 'Anthropic《How we built our multi-agent research system》（2025）'

  - id: AGT-MULTI-005
    type: calc
    difficulty: 2
    frequency: 2
    points: [多Agent收益与代价, 何时不用多Agent]
    question: |
      某合同质检任务有两种方案：

      - 单 Agent：每单模型成本 0.30 美元，成功率 70%；
      - 多 Agent（编排者 + 3 个子 Agent）：每单模型成本 2.00 美元，成功率 85%。

      失败的单子需要人工补救，每单补救成本为 $C$ 美元。

      (1) 只看模型成本，两种方案「每次成功」的成本各是多少？
      (2) 计入补救成本后，$C$ 至少为多少时，多 Agent 的平均每单总成本更低？
    answer: '(1) 单 Agent 约 0.43 美元、多 Agent 约 2.35 美元；(2) C 大于约 11.33 美元时多 Agent 更划算'
    explanation: |
      **(1) 每次成功的成本** = 每单成本 ÷ 成功率：

      - 单 Agent：$0.30/0.70\approx0.43$ 美元；
      - 多 Agent：$2.00/0.85\approx2.35$ 美元，约为单 Agent 的 5.5 倍。

      **(2) 计入失败代价后的平均每单总成本** = 模型成本 + 失败率 × $C$：

      - 单 Agent：$0.30+0.30C$；
      - 多 Agent：$2.00+0.15C$。

      令 $2.00+0.15C<0.30+0.30C$，得 $0.15C>1.70$，即 $C>11.33$ 美元。

      **结论**：只看每次成功的成本，多 Agent 贵了 5 倍多；但如果一次失败需要人工花 11.3 美元以上补救（例如质检漏判引发客诉），多 Agent 反而更省。回答「该不该上多 Agent」时要把**失败的代价**算进去，而不是只比 token 账单。

  - id: AGT-MULTI-006
    type: single
    difficulty: 2
    frequency: 2
    points: [何时不用多Agent, 冲突与一致性]
    tags: [Cognition]
    question: |
      Cognition 在《Don't Build Multi-Agents》（2025）中举例：让两个子 Agent 分别实现 Flappy Bird 的「背景与管道」和「小鸟」，结果一个把背景做成了超级马里奥风格，另一个做的小鸟既不像游戏素材、动起来也不像原作。即使把用户的原始需求和前序对话都交给子 Agent，风格仍然对不上。其根本原因是：
    options:
      A: '并行的子 Agent 各自做出的隐含决策（画风、动效）彼此不可见，到合并时才暴露冲突'
      B: '子 Agent 用的是更便宜的小模型，理解不了「Flappy Bird 风格」这类依赖常识的原始需求'
      C: '任务简报里没有约定素材的输出格式和尺寸，导致两份产物在合并时无法拼接'
      D: '负责合并的 Agent 上下文窗口太小，看不全两份产物，仅凭摘要拼出了风格混乱的结果'
    answer: A
    explanation: |
      **结论**：Cognition 的第二条原则是「行动隐含决策，决策冲突就出坏结果」。写代码、做素材的每一步都隐含着风格、接口上的决定；两个子 Agent 同时工作，谁也看不到对方**正在**做的决定。

      他们的第一条原则是「共享上下文，而且共享完整的 Agent 轨迹，而不只是单条消息」。但即便共享了前序上下文，并行的子 Agent 仍看不到彼此的进行中决策，所以他们主张这类任务用单线程的线性 Agent，超长任务再引入专门压缩历史的模型。

      - B 错：问题不在模型能力，子 Agent 换成更强的模型照样各做各的决定。
      - C 错：格式、尺寸能对齐「怎么交付」，对齐不了「画成什么风格、怎么动」这类隐含决策。
      - D 错：合并的 Agent 看得再全，也只能硬拼两份互相误解的产物，返工不可避免。

      延伸：这与 Anthropic 的多 Agent 研究系统并不矛盾。调研读多写少，子 Agent 交回的是可交叉验证的「事实」；编码写多、强耦合，交回的是带着隐含决策的「产物」。
    source: 'Cognition《Don''t Build Multi-Agents》（2025）'

  - id: AGT-MULTI-007
    type: short
    difficulty: 2
    frequency: 3
    points: [多Agent收益与代价, 何时不用多Agent]
    source: 'Anthropic《How we built our multi-agent research system》（2025-06-13）：https://www.anthropic.com/engineering/multi-agent-research-system ；Cognition《Don''t Build Multi-Agents》（2025-06-12）：https://cognition.ai/blog/dont-build-multi-agents'
    tags: [Anthropic, Cognition]
    question: |
      2025 年 6 月，Anthropic 发布《How we built our multi-agent research system》，称多 Agent 研究系统效果显著优于单 Agent；几乎同时，Cognition 发布《Don't Build Multi-Agents》，主张不要构建多 Agent。面试官问：「这两篇你怎么看？实际项目里你会怎么选？」请作答。
    answer: |
      1. **Anthropic 的做法与证据**：主 Agent 规划后并行派出 3～5 个子 Agent 搜索，结论压缩回传。Opus 4 主 Agent + Sonnet 4 子 Agent 的系统在内部调研评测上比单 Agent 的 Opus 4 高 90.2%，token 约为普通对话的 15 倍。它也承认：需要所有 Agent 共享同一上下文、子任务之间依赖多的领域（如多数编码任务）并不适合。
      2. **Cognition 的主张**：两条原则，一是共享上下文，而且共享完整轨迹，不只是单条消息；二是行动隐含决策，决策冲突就出坏结果。Flappy Bird 的例子说明并行子 Agent 看不到彼此的隐含决策。主张用单线程线性 Agent，超长任务用专门的模型压缩历史。
      3. **两者不矛盾，分歧来自任务形态**：调研读多写少、广度优先，子任务之间几乎没有要对齐的隐含决策，交回的是可交叉验证的事实；编码写多、强耦合，每一步都带风格、接口上的决定，分头做必然冲突。
      4. **共同点**：都把上下文当成核心问题，也都在做压缩：Anthropic 让子 Agent 压缩后回传，Cognition 用模型压缩长历史。
      5. **我的选型标准**：子任务耦合度、读写比例、上下文规模、任务价值、子结果能否独立验收；先用单 Agent 立基线，再在**同等预算**下证明拆分划算。
      6. **常用折中**：「单 Agent 写、子 Agent 只读」：主 Agent 掌握全部决策，只把「查清一个问题」这类只读任务派出去，既获得上下文隔离，又不引入写冲突。
    rubric:
      - '准确概括 Anthropic 的做法、收益数据与其自己承认的局限（2 分）'
      - '准确概括 Cognition 的两条原则及 Flappy Bird 例子的含义（2 分）'
      - '指出分歧来自任务形态：读多写少、可并行 vs 写多、强耦合（3 分）'
      - '给出可操作的选型维度，并提到同预算基线或「主写子读」的折中（3 分）'
    explanation: |
      **常见失分点**：直接选边站（「多 Agent 是趋势」或「多 Agent 没用」）；只会背 90.2%、15 倍这些数字，讲不出各自成立的条件；把 Cognition 的观点理解成「上下文窗口不够长」，没有讲到「隐含决策冲突」；忽略两篇在上下文压缩上的共同点。

  - id: AGT-MULTI-008
    type: single
    difficulty: 1
    frequency: 3
    points: [Handoff与Swarm, Supervisor模式]
    question: |
      某银行 App 要做智能助手：信用卡、贷款、理财三类业务各有独立的合规话术和工具；用户一旦进入某类业务（如信用卡挂失需要多轮核身），就由该业务的专员 Agent 直接与用户对话、负责到底。下列组织方式中最合适的是：
    options:
      A: 'Supervisor：总控 Agent 把每轮用户消息派给专员 Agent，拿回结果后由总控统一组织语言回复用户'
      B: 'Handoff：分诊 Agent 识别意图后把对话整体转交给对应专员，专员直接与用户多轮对话，转交时附上交接单'
      C: '黑板：三个专员订阅同一块共享状态，谁先能回答就把答案写上去'
      D: '投票：三个专员各自回答每一轮问题，按多数票决定回复内容'
    answer: B
    explanation: |
      **结论**：「按意图分流、每段由专人负责到底、直接面对用户」正是 Handoff 的典型场景。Supervisor 与 Handoff 的区别在**控制权回不回来**：Supervisor 的子 Agent 像函数调用，干完把结果交回；Handoff 之后由新 Agent 接管对话。

      - A 不合适：多轮核身的每一轮都要经过总控转述，多一跳时延，还会出现「传话」走样；总控的上下文会随所有业务的细节不断膨胀，合规话术由谁负责也变得模糊。
      - C 错：黑板适合「多个专家逐步补全同一份结果」，不适合有明确负责人的多轮对话。
      - D 错：投票适合有标准答案的判断，客服对话不需要三个专员同时作答。

      Handoff 的两个经典问题要一起设计：交接时丢信息（用交接单：摘要 + 必要字段 + 约束原文），以及来回踢皮球（设转交次数上限并检测循环）。

  - id: AGT-MULTI-009
    type: multiple
    difficulty: 2
    frequency: 2
    points: [Handoff与Swarm]
    question: |
      分诊 Agent 和用户聊了 10 条消息（含订单查询的工具结果、闲聊和退款政策），现在要把对话转交给退款 Agent。关于交接设计，下列说法**正确**的有：
    options:
      A: '订单号、金额等下游必需的字段缺失时应拒绝转交，先补查或追问用户'
      B: '去掉工具消息不会丢失关键信息，因为模型的回复里通常会复述订单金额等字段'
      C: '转交次数不必设上限：甲转给乙、乙又转回甲说明双方在协商，多转几轮总会收敛'
      D: '用户的约束原话（如「不要优惠券」「原路退回」）应原文写进交接单，而不是交给摘要模型改写'
      E: '只保留最近 3 条消息即可兼顾 token 与信息完整，因为用户最新的需求总在最后几条'
    answer: [A, D]
    explanation: |
      **结论**：好的交接 =「摘要 + 必要字段 + 约束原文」的交接单，再加上转交上限防循环。

      - A 对：交接前做 schema 校验，下游要用的字段缺一个都不转，否则退款 Agent 只能再问一遍用户。
      - B 错：金额、订单状态这类字段往往**只**出现在工具结果里，「去掉工具消息」看似稳妥，实则可能把它们删掉。
      - C 错：来回踢皮球是 Handoff 的另一个经典问题，模型之间互相转交并不保证收敛。要设置单次会话的转交次数上限并检测转交环，触发上限后转人工并附上交接单。
      - D 对：约束改写一次就可能变味（「不要优惠券」被摘要成「对退款方式有要求」），所以要原文照抄。
      - E 错：用户的要求恰恰常在对话开头就说了。一个模拟实验中，只留最近 3 条只用了 202 token，却丢了订单号和三条约束中的两条。

      模拟实验的数据：完整历史 843 token；交接单 219 token，约束和字段一个不丢，只有完整历史的约 26%。
  - id: AGT-MULTI-010
    type: single
    difficulty: 2
    frequency: 2
    points: [Supervisor模式]
    tags: [Magentic-One]
    question: |
      微软的 Magentic-One 采用编排者-工作者结构，编排者维护「任务账本」（task ledger）和「进度账本」（progress ledger）两份状态。其中进度账本的主要作用是：
    options:
      A: '记录已确认的事实、有待查证的猜测和当前计划，作为编排者制定与修订计划的依据'
      B: '记录每个工作者每一步消耗的 token、调用次数与费用，超出预算时提醒编排者收尾并结算'
      C: '每步判断任务是否完成、是否兜圈子、有无进展、下一步派给谁；停滞过久就退回外层重规划'
      D: '保存每个工作者的完整对话历史与中间产物，供下一个接手的工作者原样读入、继续推进'
    answer: C
    explanation: |
      **结论**：Magentic-One 的编排者有内外两层循环。外层维护**任务账本**（已知事实、待查事实、有根据的猜测、计划）；内层每一步更新**进度账本**，回答「任务完成了吗？是否陷入循环？是否在推进？下一个由谁干、给它什么指令？」。如果连续若干步没有进展（停滞计数超过阈值），就跳回外层，更新事实与计划后重新开始。

      - A 错：这是任务账本的内容。
      - B 错：成本统计与预算控制是运行时的职责，不是进度账本的设计目的。
      - D 错：编排者只向工作者下达具体指令，工作者之间并不共享完整历史，这正是编排者-工作者结构上下文隔离的好处。

      这套设计可以直接迁移到面试回答中：长程任务除了步数上限，还要有「无进展检测 + 重新规划或升级给人」的机制，否则 Agent 会原地打转、白白烧钱。
    source: 'Magentic-One（Fourney 等, 2024）'

  - id: AGT-MULTI-011
    type: judge
    difficulty: 1
    frequency: 2
    points: [层级结构]
    question: |
      层级式多 Agent（总编排者 → 小组长 → 工作者）中，层数越多，每个编排者直接管理的下级越少、负担越轻，因此整体的信息损失和时延会随层数增加而下降。
    answer: false
    explanation: |
      **错误**。层级式是 Supervisor 的递归，它解决的是「子任务成百上千、一个编排者管不过来」的问题。但每多一层就多一次「传话」：任务说明被逐层转述、结果被逐层压缩，信息损失和时延都会**叠加**；层数一多，出了问题也很难定位是哪一层的错。

      所以实践中层数通常控制在两层以内：每个小组长负责一组同类子任务，向上只汇报结构化的汇总和异常清单。是否分层取决于子任务规模和编排者的上下文能否承受，而不是「每人管得越少越好」。

  - id: AGT-MULTI-012
    type: single
    difficulty: 2
    frequency: 2
    points: [层级结构, Supervisor模式]
    question: |
      法务部门要对 2000 份供应商合同做合规审查，每份合同检查付款、违约、保密、数据安全、管辖法律 5 个方面，最后输出一份按风险等级排序的总报告。下列组织方式中最合适的是：
    options:
      A: '单个编排者直接派发 1 万个子任务，逐条阅读每份审查结果后亲自撰写总报告'
      B: '五层层级结构，每层每个编排者只管 2 个下级，让每个编排者的负担尽量轻、出错面最小'
      C: '审查 Agent 加入同一个群聊共享进度，由选择器决定谁发言、谁汇报结果，避免重复审查'
      D: '两层结构：总编排者按合同类型分组，各组组长派发审查，只上报结构化的统计与异常清单'
    answer: D
    explanation: |
      **结论**：子任务上万时，单个编排者的上下文和注意力都扛不住，需要层级式；但层数要少，两层通常就够。

      - A 错：1 万条结果全部回到一个窗口，编排者本身成了瓶颈，上下文隔离的好处荡然无存。
      - B 错：层数过多，每一层都是一次转述，信息损失和时延逐层叠加，出错后也难以定位是哪一层。
      - C 错：群聊让所有 Agent 共享历史，上下文随人数膨胀，还容易出现客套循环，几千个参与者根本无法管理；避免重复审查靠派活时划清边界即可。
      - D 对：小组长向上只汇报「风险分布 + 高风险合同清单 + 证据指针」，逐条结果写入存储，需要时按合同 ID 回查。

  - id: AGT-MULTI-013
    type: single
    difficulty: 2
    frequency: 2
    points: [黑板与共享状态]
    question: |
      某团队用黑板架构让规划、调研、写稿、审稿四个 Agent 协作生成旅行攻略，最初任何 Agent 都能写任何条目。上线后发现：审稿 Agent 有时直接改掉写稿 Agent 的稿件；调研 Agent 把整页网页原文贴到黑板上，黑板的内容越积越多。最根本的改进是：
    options:
      A: '每种条目定义必填字段和唯一写者，由写入接口强制校验；大材料存外部，黑板只放指针'
      B: '在每个 Agent 的系统提示词里反复强调「只写自己负责的内容，不要贴原文」'
      C: '改成群聊，让四个 Agent 先在对话里商量好分工和要写的内容，再由一个代表统一写入黑板'
      D: '每次写入后让四个 Agent 投票，多数同意才保留这条内容，并定期清理过期条目'
    answer: A
    explanation: |
      **结论**：黑板的问题是「谁都能写就会冲突和污染」，解法是把约束放到**存储层强制执行**：条目带类型和 schema，每种条目只有一个写者（单写者原则）；审稿人只能写「审稿意见」条目，由写稿人合并修改；条目只追加不覆盖，修改就是写一个新版本，历史天然可审计。

      - B 错：提示词是软约束，长任务里最先失效，也挡不住被注入或「好心越权」的 Agent。
      - C 错：群聊共享的是自然语言历史，上下文膨胀更严重，也没有解决写权限问题。
      - D 错：投票大幅增加调用量；「能不能写」是权限问题，不该交给模型投票决定；定期清理也挡不住整页原文持续涌入。

      黑板上应只放**结构化、验收过的结论**；原始材料放外部存储，黑板只留路径或 ID，这样它就不会越写越大。

  - id: AGT-MULTI-014
    type: code_output
    difficulty: 2
    frequency: 2
    points: [黑板与共享状态, 冲突与一致性]
    question: |
      下面是一个简化的共享黑板：每种条目有必填字段和唯一写者，条目只追加不覆盖，按类型分别编号版本。运行输出是什么？
    code: |
      SCHEMA = {"draft": {"text"}, "review": {"ok"}}
      WRITERS = {"draft": "writer", "review": "critic"}
      board = []

      def post(kind, author, **data):
          if WRITERS[kind] != author:
              return f"拒绝：{author} 无权写 {kind}"
          missing = SCHEMA[kind] - data.keys()
          if missing:
              return f"拒绝：缺字段 {sorted(missing)}"
          version = sum(1 for k, _, _ in board if k == kind) + 1
          board.append((kind, version, data))
          return f"{kind} v{version}"

      print(post("draft", "writer", text="初稿"))
      print(post("draft", "critic", text="我直接改"))
      print(post("review", "critic", comment="太短"))
      print(post("review", "critic", ok=False, comment="太短"))
      print(post("draft", "writer", text="二稿"))
      print(len(board), board[-1][1])
    answer: |
      draft v1
      拒绝：critic 无权写 draft
      拒绝：缺字段 ['ok']
      review v1
      draft v2
      3 2
    explanation: |
      逐行看：

      1. writer 写 draft，字段齐全，是第 1 条 draft，输出 `draft v1`；
      2. critic 想直接改稿，但 draft 的唯一写者是 writer，被拒绝。审稿人想改稿，只能写 review 条目，由写者合并；
      3. review 缺必填字段 `ok`，被拒绝。多出的 `comment` 字段不影响校验，缺少必填字段才拒绝；
      4. 字段齐全，是第 1 条 review，输出 `review v1`；
      5. writer 写第 2 版稿件。版本号**按类型**计数，board 中已有 1 条 draft，所以是 `draft v2`，而不是 v3；
      6. 被拒绝的写入没有进入 board，共 3 条，最后一条的版本号是 2。

      这三道检查（单写者、schema、只追加并带版本）都放在写入接口上强制执行，而不是写在 Agent 的提示词里：即使某个 Agent 被注入或「好心越权」，也写不进去。

  - id: AGT-MULTI-015
    type: short
    difficulty: 2
    frequency: 2
    points: [子Agent上下文隔离, 黑板与共享状态]
    question: |
      多 Agent 系统中，Agent 之间共享上下文的方式从「全共享」到「全隔离」大致有五档：完整历史、过滤后的历史、任务简报（交接单）、共享结构化状态、共享工件。请说明每一档传什么、代价与风险是什么，指出 Anthropic 的子 Agent 与 Cognition 的主张分别落在哪一档，并说明实际系统通常如何组合。
    answer: |
      1. **完整历史**：传全部消息与工具结果（群聊、默认的 Handoff）。不丢信息，但 token 随 Agent 数和轮数膨胀，无关内容稀释注意力，可能超窗或泄露无关信息。适合短对话的转交。
      2. **过滤后的历史**：去掉工具消息或只留最近 K 轮。省 token，但可能误删只存在于工具结果里的字段（金额、订单状态）和对话开头的约束，而且「不自知」。
      3. **任务简报 / 交接单**：专门为下游写的「摘要 + 必要字段 + 约束原文」。上下文最干净，信息损失取决于抽取质量，需要字段校验。用于子 Agent 派活和 Handoff。
      4. **共享结构化状态**：黑板、State 对象，只放带类型的字段与验收过的结论。token 低，但只有结论没有过程；并发写入会冲突，需要写权限与版本号。
      5. **共享工件**：文件、对象存储、代码仓库，消息里只传路径或 ID。token 极低，按需读取不丢信息，要管好权限与版本；长产物不经转述，避免「传话游戏」式的走样。
      6. **两家的位置**：Cognition 主张共享完整轨迹，属于第 1 档；Anthropic 的子 Agent 用的是第 3 档（任务简报）加第 5 档（长产物写文件、只回传引用）。
      7. **组合原则**：决策链共享、原始材料隔离。关键决策与约束进入简报或结构化状态，大材料走工件引用；约束原文照抄；子 Agent 回传设长度上限，防止把原文当摘要交回。
    rubric:
      - '五档策略分别传什么、代价与风险说清楚（至少四档）（5 分）'
      - '正确指出 Cognition 与 Anthropic 分别对应的档位（2 分）'
      - '给出「决策链共享、原始材料隔离」之类的组合原则，并提到约束原文、回传上限等细节（3 分）'
    explanation: |
      **常见失分点**：认为「把全部上下文都给子 Agent 最保险」（成本翻倍、注意力被稀释、隔离失效）；把黑板说成「把聊天记录共享出去」；忽略过滤历史会误删工具结果里的关键字段；只讲隔离的好处，不讲信息损失与字段校验。

  - id: AGT-MULTI-016
    type: calc
    difficulty: 3
    frequency: 2
    points: [辩论与投票]
    question: |
      5 个 Agent 对一批是非题（答案只有「是 / 否」）各自独立作答后多数投票。每个 Agent 单独作答的准确率都是 70%。

      (1) 若各 Agent 的错误相互独立，多数投票的准确率是多少？
      (2) 实际上这 5 个 Agent 是同一个模型、同一套提示词。假设题库中 20% 是「陷阱题」，5 个 Agent 在陷阱题上全部答错；其余 80% 的题上，各 Agent 独立地以 87.5% 的概率答对（于是单个 Agent 的整体准确率仍是 70%）。此时多数投票的准确率是多少？继续增加同质 Agent 的数量，投票准确率的上限是多少？
    answer: '(1) 约 83.7%；(2) 约 78.7%，上限为 80%'
    explanation: |
      **(1) 错误独立**：答对人数 $X\sim\mathrm{Bin}(5,0.7)$，多数投票正确当且仅当 $X\ge3$：

      $$P=\binom{5}{3}0.7^3\,0.3^2+\binom{5}{4}0.7^4\,0.3+0.7^5=0.3087+0.36015+0.16807\approx0.837$$

      **(2) 错误相关**：陷阱题上 5 人全错，投票必错；非陷阱题上 $X\sim\mathrm{Bin}(5,0.875)$：

      $$P(X\ge3)=10\times0.875^3\times0.125^2+5\times0.875^4\times0.125+0.875^5\approx0.1047+0.3664+0.5129\approx0.984$$

      总准确率 $=0.8\times0.984+0.2\times0\approx0.787$。

      上限：Agent 再多，非陷阱题的投票准确率也只能趋近 1，陷阱题始终全错，所以上限是 **80%**。

      **结论**：单个准确率同为 70%，错误相关让投票的增益从约 13.7 个点缩小到约 8.7 个点，而且无论堆多少同质副本都超不过 80%。投票的收益来自「错误独立」，不是来自「人多」。要突破上限，就要让错误去相关：换不同的模型、提示词、信息源，或引入可执行的验证。

  - id: AGT-MULTI-017
    type: judge
    difficulty: 1
    frequency: 3
    points: [辩论与投票]
    question: |
      多数投票能提升准确率，前提是各 Agent 的错误相互独立；如果 5 个 Agent 是同一个模型、同一套提示词的副本，它们常常会掉进同一个坑，此时继续增加副本数量，对准确率的帮助很小。
    answer: true
    explanation: |
      **正确**。投票的收益来自「错误独立」，不是来自「人多」。同质副本的错误高度相关：一道题如果容易诱导出某个错误答案，几个副本很可能一起答错，多数投票只会让这个错误「全票通过」。蒙特卡洛模拟中，错误独立时投票把单个 60% 的准确率推到 82%；错误相关时只涨了约 3 个点，约 24% 的题首轮就全票通过了错误答案。

      提高收益的办法是增加**多样性**：不同模型、不同提示词、不同检索来源，或者引入可执行的验证（测试、对账），而不是堆同一个模型的副本。也要记住：共识不等于正确。

  - id: AGT-MULTI-018
    type: multiple
    difficulty: 2
    frequency: 2
    points: [辩论与投票]
    tags: [Multiagent Debate]
    question: |
      关于多 Agent 辩论（Multiagent Debate）与投票，下列说法**正确**的有：
    options:
      A: '辩论中 Agent 能看到他人答案，存在从众效应：多数人答错时可能把原本答对的人拉过去'
      B: '只要 5 个 Agent 在首轮就达成一致，就可以认定答案正确，不需要任何外部验证'
      C: '辩论的调用量大约是「Agent 数 × 轮数」，上线前应与同等调用量的自洽性采样（独立作答后投票）做对比'
      D: '如果正确的论证并不比错误的论证更有说服力，辩论基本会退化成一种更贵的投票'
      E: '已有研究一致表明，多轮辩论稳定优于自洽性等更简单的方法，而且对超参数不敏感'
    answer: [A, C, D]
    explanation: |
      - A 对：信息交换是双刃剑，「正确的人说服别人」和「错误的多数裹挟正确的少数」同时存在。
      - B 错：同质 Agent 的错误高度相关，首轮全票通过的可能是一个共同的错误答案；共识不等于正确。
      - C 对：辩论每轮每个 Agent 都要调用一次，成本随轮数线性增长；合理的基线是同成本的独立采样投票。
      - D 对：一个模拟实验中，去掉「正确论证更有说服力」这一假设后，辩论准确率从 0.94 降回 0.82，与 5 人投票相同，调用量却多得多。
      - E 错：《Should we be going MAD?》（Smit 等, 2023）发现，辩论并不稳定地优于自洽性、集成等更简单的方法，而且对超参数更敏感。

      辩论什么时候值得用？有可验证的标准答案、错误来源足够多样、答错代价高，并且在评测中确实打败了同成本的投票基线。
    source: 'Multiagent Debate（Du 等, 2023, arXiv:2305.14325）'

  - id: AGT-MULTI-019
    type: single
    difficulty: 1
    frequency: 2
    points: [SOP流水线]
    question: |
      一条「需求分析 → 系统设计 → 编码 → 测试」的四角色 SOP 流水线，经常到测试阶段才发现需求文档漏掉了一个关键约束，导致后面三个阶段全部返工。最有效的改进是：
    options:
      A: '再增加一个「资深架构师」角色，在系统设计完成后对照需求文档把设计再评审一遍'
      B: '每个阶段交接处设验收关卡：用 schema 和需求清单等可执行检查把关，不通过就打回'
      C: '把四个角色改成群聊、共享完整历史，让测试角色在需求阶段就能随时提出疑问'
      D: '取消固定流程，改由模型根据当前产物的质量自主决定下一步进入哪个阶段、是否回退'
    answer: B
    explanation: |
      **结论**：SOP 流水线可预测、产物可检查，但「上游错误顺流而下」是它的结构性弱点。问题发现得越早越便宜，所以要在**每个交接处**设关口：产物格式用 schema 校验，内容尽量用可执行检查（需求条目逐项对照、接口与设计对账、跑测试），不通过就退回当前阶段。

      - A 错：新增的评审只在设计之后检查一次，而且对照的正是那份漏了约束的需求文档，本该在需求阶段就拦住的问题仍然漏过；多一个角色还多一次「传话」。在阶段之间加验收关卡，往往比再加一个角色更有用。
      - C 错：群聊让上下文膨胀、容易出现客套循环，也没有明确的验收标准。
      - D 错：流程成熟、顺序固定的任务正适合写死；改成自主 Agent 只会让行为更难预测、更难排查。

  - id: AGT-MULTI-020
    type: multiple
    difficulty: 2
    frequency: 2
    points: [SOP流水线, Supervisor模式, Handoff与Swarm, 何时不用多Agent]
    question: |
      下列「场景 → 协作拓扑」的匹配中，**恰当**的有：
    options:
      A: '数学竞赛题：同一模型、同一提示词的 20 个副本独立作答后投票，能把准确率稳定推到接近 100% → 投票'
      B: '银行 App 客服：按意图把对话转给信用卡、贷款、理财专员，由专员直接服务用户 → Handoff'
      C: '合规文书生产：起草 → 法务审核 → 合规审核 → 定稿，流程成熟且每一步都有检查清单 → SOP 流水线'
      D: '重构一个强耦合的核心模块：5 个 Agent 进入同一群聊，各改一部分代码并随时讨论 → 群聊'
      E: '季度财报解读：并行解读 6 家公司的财报，再汇总成一份对比分析 → Supervisor（编排者-工作者）'
    answer: [B, C, E]
    explanation: |
      - A 错：同质副本的错误高度相关，难题上常常一起答错，投票准确率的上限受这部分题限制；要提升收益得增加多样性或引入可执行验证。
      - B 对：按意图分流、每段由专人负责、直接面对用户，是 Handoff 的典型场景。
      - C 对：流程成熟、顺序固定、每步产物可检查，适合固化成流水线，并在阶段之间设验收关卡。
      - D 错：强耦合的写任务最怕多个 Agent 分头改，隐含决策会冲突；群聊还会让上下文膨胀、出现客套循环。应由单 Agent 负责写，最多配只读的调研子 Agent。
      - E 对：6 家公司的解读互相独立、以读为主，并行派发后压缩回传，是 Supervisor 的典型场景。

      选型口诀：能单不多，先立基线；读多可并行，派子 Agent；按意图分流，用 Handoff；多方补一份结果，上黑板；流程成熟，走流水线；有标准答案，再谈投票。
  - id: AGT-MULTI-021
    type: multiple
    difficulty: 1
    frequency: 3
    points: [子Agent上下文隔离]
    question: |
      编排者给子 Agent 派活时写的「任务简报」，应当包含下列哪些内容？
    options:
      A: '其他子 Agent 的中间推理过程，便于大家互相对齐'
      B: '具体目标，以及一句话的整体目标，帮助子 Agent 在执行中取舍'
      C: '任务边界：明确写出不负责什么，避免与兄弟 Agent 重复劳动'
      D: '编排者至今的完整对话历史与全部工具输出，以免子 Agent 漏掉信息'
      E: '输出格式与长度上限，以及工具调用的次数、token、时间等预算'
    answer: [B, C, E]
    explanation: |
      **结论**：一份合格的简报包括目标、边界、约束、输出格式、预算和已知信息。Anthropic 的经验是：早期只给子 Agent 一句简短指令，结果子 Agent 互相重复、理解跑偏；后来要求每个子 Agent 都有明确的目标、输出格式、可用工具与信息源的指引，以及清晰的任务边界。

      - A 错：子 Agent 需要的是已确认的结论（写进「已知信息」），而不是别人的推理过程。
      - B 对：缺了目标，子 Agent 只能猜意图；一句整体目标能帮它判断什么重要。
      - C 对：写清「不负责什么」是防止重复劳动的第一道防线。
      - D 错：把全部历史塞给子 Agent，成本翻倍、注意力被稀释，上下文隔离也白做了。
      - E 对：没有格式，结果无法合并；没有预算，费用和时延会失控。

      另外两项常被漏掉：全局约束（如「只用公开资料」）要原文写入；验收标准要在派活时就写进简报，而不是事后补。
    source: 'Anthropic《How we built our multi-agent research system》（2025）'

  - id: AGT-MULTI-022
    type: single
    difficulty: 1
    frequency: 2
    points: [子Agent上下文隔离]
    question: |
      子 Agent 在调研中生成了一份 3 万行的 CSV 数据和一段 2000 字的分析，编排者只需要据此写出最终结论。子 Agent 最合适的回传方式是：
    options:
      A: '把 CSV 全文和分析原文一起放进返回消息，保证编排者拿到完整信息、能自行核对每个数字'
      B: '只回传一句「已完成」和文件路径，编排者需要细节时再追问，最大限度节省上下文'
      C: '把自己的完整上下文压缩成一份摘要回传，让编排者了解推理过程和每一次中间尝试'
      D: '把 CSV 写入共享存储，只回传文件路径、简短结论、关键数字的出处和完成状态'
    answer: D
    explanation: |
      **结论**：回传的应是「结论 + 证据指针 + 工件路径 + 如实的状态」：

      - 结论按约定格式给出，标明置信度和没解决的问题；
      - 证据附来源，便于编排者或验收者抽查；
      - 长代码、长表格写进文件系统或对象存储，只回传路径。Anthropic 称之为避免「传话游戏」：工件不经编排者转述，就不会在一次次复述中走样；
      - 状态必须如实：完成、部分完成（如预算耗尽）、失败，编排者据此决定补派还是放弃。

      - A 错：原文进了编排者的窗口，上下文隔离就失效了。回传要设长度上限。
      - B 错：信息太少，编排者无法汇总，也不知道结果是否可靠；只有路径，编排者还得自己去读 3 万行数据，反而要多一轮往返。
      - C 错：编排者不需要子 Agent 的推理过程和中间尝试，读它只会稀释注意力；它需要的是结论要点（几百 token 即可）和证据指针。

  - id: AGT-MULTI-023
    type: fill
    difficulty: 2
    frequency: 2
    points: [子Agent上下文隔离]
    tags: [Anthropic, Cognition]
    question: |
      Anthropic 的多 Agent 研究系统让子 Agent 把长产物直接写进文件系统、只向编排者回传轻量引用，以避免信息在一次次转述中走样的「____」问题；Cognition 则主张，Agent 之间共享上下文时要共享完整的 ____，而不只是单条消息。
    answer: [['传话游戏', 'game of telephone', '传声筒', '传话'], ['轨迹', 'Agent 轨迹', '完整轨迹', 'agent traces', 'traces', 'trace']]
    explanation: |
      - **传话游戏**（game of telephone）：信息每经过一个中间人转述都可能走样。子 Agent 直接把产物写入存储、编排者按引用读取，就省掉了「子 Agent 复述 → 编排者再复述」的环节，也节省了编排者的上下文。
      - **完整轨迹**（full agent traces）：Cognition 的第一条原则。只传一条任务消息，子 Agent 看不到之前做过的决定和理由；共享完整轨迹，它才能理解其中的隐含决策。

      两种做法针对的是同一个问题：上下文怎么传才不失真。Anthropic 的答案是「隔离原始材料、工件直达」；Cognition 的答案是「强耦合的任务干脆别拆，单线程共享全部轨迹」。

  - id: AGT-MULTI-024
    type: calc
    difficulty: 3
    frequency: 2
    points: [任务分解与依赖图]
    question: |
      某调研任务拆成如下子任务（括号内为耗时）：

      - 规划（2 分钟）；
      - 检索 A（6 分钟）、检索 B（4 分钟）、检索 C（3 分钟）、检索 D（3 分钟），都依赖规划；
      - 交叉核对（4 分钟），依赖检索 A、B；
      - 撰写（3 分钟），依赖交叉核对、检索 C、检索 D；
      - 校对（2 分钟），依赖撰写。

      每个 Agent 同一时间只能做一个子任务，子任务不可中途拆分。

      (1) 求总工作量 $W$ 与关键路径长度 $D$；
      (2) 用 2 个 Agent 最快多少分钟完成？用 4 个呢？
      (3) 有人提议把检索 A 拆成两个互不依赖、各 3 分钟的子任务（交叉核对要等两者都完成）。拆分后用 2 个 Agent、3 个 Agent 分别最快多少分钟？
    answer: '(1) W = 27 分钟，D = 17 分钟；(2) 2 个与 4 个 Agent 都是 17 分钟；(3) 2 个 Agent 仍需 17 分钟，3 个 Agent 可降到 15 分钟'
    explanation: |
      **(1)** $W=2+6+4+3+3+4+3+2=27$ 分钟（串行耗时）。关键路径是「规划 → 检索 A → 交叉核对 → 撰写 → 校对」，$D=2+6+4+3+2=17$ 分钟；经过 B 的路径为 15 分钟，经过 C 或 D 的为 10 分钟。

      **(2)** 下界 $T_p\ge\max(W/p,\,D)$。$p=2$ 时为 $\max(13.5,17)=17$，并且可以达到：

      - 0～2：Agent 1 规划；
      - 2～8：Agent 1 检索 A；2～6：Agent 2 检索 B，6～9 检索 C，9～12 检索 D；
      - 8～12：Agent 1 交叉核对；12～15 撰写；15～17 校对。

      $p=4$ 时下界仍是 $\max(6.75,17)=17$。关键路径决定了极限，加 Agent 只会更贵，不会更快。

      **(3)** 拆分后 $W$ 不变，关键路径变为「规划 → 检索 B → 交叉核对 → 撰写 → 校对」$=2+4+4+3+2=15$ 分钟。

      - **2 个 Agent**：交叉核对要等 A1、A2、B 全部完成，三者共 10 个 Agent·分钟。从第 2 分钟起，最好的分配是一个 Agent 做 A1、A2（2～8），另一个做 B（2～6），交叉核对最早 8 分钟开始、12 分钟结束，撰写、校对后仍是 **17 分钟**。
      - **3 个 Agent**：A1、A2、B 同时开始，B 在第 6 分钟结束，交叉核对 6～10；C、D 由第 5 分钟空出来的两个 Agent 在 5～8 完成；撰写 10～13，校对 13～15，共 **15 分钟**。

      **结论**：并行的极限由关键路径决定，提速要去缩短关键路径；而缩短关键路径的拆分，还要有足够的并行度才能兑现。估算时用 $\max(W/p,D)$ 快速判断「加 Agent 有没有用」。

  - id: AGT-MULTI-025
    type: multiple
    difficulty: 2
    frequency: 2
    points: [任务分解与依赖图]
    question: |
      关于多 Agent 任务依赖图（DAG）的调度与失败处理，下列说法**正确**的有：
    options:
      A: '允许部分失败的汇总节点可以只用已成功的上游输入继续执行，但要在产出中写明缺失了哪些部分'
      B: '为了尽快完成，应把并发数开到下游 API 配额之上，失败的请求再重试即可'
      C: '调度开始前先检测依赖图中有没有环，有环就拒绝执行，并报告构成环的任务'
      D: '某任务重试耗尽而失败后，硬依赖它的下游任务应标记为跳过，并且「跳过」要继续向下传播'
      E: '子任务因限流（429）、超时失败时适合指数退避重试；因参数错误这类确定性原因失败时，重试多少次结果都一样'
    answer: [A, C, D, E]
    explanation: |
      - A 对：哪些节点允许降级，设计 DAG 时就要标出来；汇总节点不能「假装完整」。
      - B 错：并发打满会触发大量 429，反而更慢；应用信号量把并发限制在配额以内。
      - C 对：有环的依赖图排不出执行顺序，环上的任务会互相等待、永远不会就绪。可以用 Kahn 算法做拓扑排序，排不完所有节点就说明有环。
      - D 对：任务 X 失败导致下游 Y 跳过，依赖 Y 的 Z 也要跳过，否则 Z 会永远等下去。
      - E 对：偶发故障（超时、限流）重试有意义；确定性失败重试只是浪费，要先区分错误类型。

      此外，不要用 gather 等同一层全部完成后再统一解锁下游，那样会被每层最慢的任务拖住；用 `asyncio.wait(..., return_when=FIRST_COMPLETED)` 这类方式，谁先完成就先解锁谁的下游。每个子任务还要设超时，超时按「部分完成」处理。
  - id: AGT-MULTI-026
    type: coding
    difficulty: 3
    frequency: 2
    points: [任务分解与依赖图]
    question: |
      实现多 Agent 任务图的状态推演函数：

      ```python
      def resolve(deps: dict[str, list[str]], fails: set[str], partial: set[str]) -> dict[str, str]: ...
      ```

      - `deps`：每个任务 → 它依赖的上游任务列表，所有任务都出现在 `deps` 的键中；
      - `fails`：执行后会失败（重试已耗尽）的任务；
      - `partial`：允许部分失败的任务（如汇总节点），只要上游都已结束就照常执行；
      - 每个任务的状态为 `"ok"`、`"failed"`、`"skipped"` 之一。任务在上游全部结束后才处理：若它不在 `partial` 中、且有任一上游的状态不是 `"ok"`，则为 `"skipped"`（跳过会继续向下传播）；否则执行它，在 `fails` 中为 `"failed"`，否则为 `"ok"`；
      - 依赖图有环、或依赖了不存在的任务时，抛出 `ValueError`。
    answer: |
      def resolve(deps, fails, partial):
          for t, ups in deps.items():
              for u in ups:
                  if u not in deps:
                      raise ValueError(f"{t} 依赖了不存在的任务 {u}")
          indeg = {t: len(set(ups)) for t, ups in deps.items()}
          children = {t: [] for t in deps}
          for t, ups in deps.items():
              for u in set(ups):
                  children[u].append(t)
          ready = [t for t, k in indeg.items() if k == 0]
          status = {}
          while ready:
              t = ready.pop()
              if t not in partial and any(status[u] != "ok" for u in deps[t]):
                  status[t] = "skipped"
              else:
                  status[t] = "failed" if t in fails else "ok"
              for c in children[t]:
                  indeg[c] -= 1
                  if indeg[c] == 0:
                      ready.append(c)
          if len(status) != len(deps):
              raise ValueError("任务图有环")
          return status
    test: |
      deps = {
          "plan": [], "a": ["plan"], "b": ["plan"], "c": ["plan"],
          "sum_c": ["c"], "report": ["a", "b", "sum_c"], "cite": ["report"],
      }
      s = resolve(deps, fails={"c"}, partial={"report"})
      assert s == {"plan": "ok", "a": "ok", "b": "ok", "c": "failed",
                   "sum_c": "skipped", "report": "ok", "cite": "ok"}, s
      # 汇总节点不允许部分失败时，跳过要一路传播到底
      s = resolve(deps, fails={"c"}, partial=set())
      assert s["sum_c"] == s["report"] == s["cite"] == "skipped" and s["a"] == "ok"
      # 部分失败节点自己执行失败，下游照样跳过
      s = resolve(deps, fails={"report"}, partial={"report"})
      assert s["report"] == "failed" and s["cite"] == "skipped"
      # 根任务失败，全部下游跳过
      assert resolve({"x": [], "y": ["x"], "z": ["y"]}, {"x"}, set()) == {
          "x": "failed", "y": "skipped", "z": "skipped"}
      # 空图
      assert resolve({}, set(), set()) == {}
      # 重复依赖不应被误判为环
      assert resolve({"x": [], "y": ["x", "x"]}, set(), set()) == {"x": "ok", "y": "ok"}
      # 有环（含自环）
      for bad in ({"x": ["y"], "y": ["x"], "z": []}, {"x": ["x"]}):
          try:
              resolve(bad, set(), set())
              raise AssertionError("有环必须报错")
          except ValueError:
              pass
      # 依赖不存在的任务
      try:
          resolve({"x": ["ghost"]}, set(), set())
          raise AssertionError("未知依赖必须报错")
      except ValueError:
          pass
    explanation: |
      **思路**：Kahn 拓扑排序。先校验依赖是否都存在，再统计入度；每弹出一个入度为 0 的任务，它的上游必然都已有状态，按规则决定它的状态，再把下游的入度减 1。处理完后若仍有任务没被处理，说明存在环。

      **要点**：

      1. 「跳过」必须传播：被跳过的任务状态不是 `"ok"`，它的非 partial 下游会继续被跳过，否则下游会永远等待；
      2. partial 节点只是「上游失败也照跑」，它自己执行失败时，下游同样要跳过；真实系统里它要在产出中写明缺了哪些输入；
      3. 重复依赖要用 `set` 去重后再算入度和下游，否则入度永远减不到 0，会被误判为环；
      4. 时间复杂度 $O(V+E)$。

      真实的异步调度器还要加上：有界并发（信号量）、按错误类型区分的指数退避重试、超时，以及「谁先完成就先解锁谁的下游」。

  - id: AGT-MULTI-027
    type: fill
    difficulty: 2
    frequency: 3
    points: [检查点与恢复]
    question: |
      某长程任务共 40 步，每步独立成功的概率为 0.97，任何一步出错整条轨迹即失败。一次走完的成功概率约为 ____（保留两位小数）。若改成 4 段、每段 10 步，每段结束时做可靠的验收，不通过就从该段起点的检查点重来，每段最多尝试 3 次，则整体成功概率约为 ____（保留两位小数）。
    answer: [['0.30', '0.3', '30%'], ['0.93', '93%']]
    explanation: |
      - 一次走完：$0.97^{40}\approx0.296\approx$ **0.30**。
      - 分段验收：每段一次成功的概率 $0.97^{10}\approx0.737$；3 次之内成功的概率 $1-(1-0.737)^3=1-0.263^3\approx0.982$；4 段全部通过 $0.982^4\approx$ **0.93**。

      从 30% 到 93%，靠的不是更强的模型，而是**检查点让失败只损失一段，验收让错误不往下传**。这个估算的前提是验收能识别出错误、各次重试相对独立，实践中要打些折扣；验收与重试本身也要花步数和 token，需要预留预算。

  - id: AGT-MULTI-028
    type: single
    difficulty: 1
    frequency: 3
    points: [检查点与恢复]
    question: |
      长程 Agent 任务写检查点时，要求存下「每一步的输出」，而不能只记录「已经做到第几步」。最主要的原因是：
    options:
      A: '只记录步号时检查点要频繁覆盖同一个计数器，并发写入下无法保证原子性'
      B: 'LLM 采样不可重放：重算已完成的步骤会得到不同结果，与已发生的副作用对不上'
      C: '存下输出后，恢复时就能换成更便宜的模型从断点继续执行，这是检查点的主要用途'
      D: '存输出能让检查点做增量压缩，最终比只存步数占用的存储空间更少'
    answer: B
    explanation: |
      **结论**：检查点要回答「换一台机器、换一个进程，能不能从这里接着跑，而且结果和没崩一样」。温度大于 0 的 LLM 调用、依赖实时数据的工具调用都不可重放；只记步数、恢复时重算，前面步骤的结果就变了。例如报告已按 A 版本发给了老板，恢复后后续步骤却基于重算出的 B 版本继续；重算已完成的步骤还要重复花钱。

      - A 错：原子性取决于写入方式（先写临时文件，再用 `os.replace` 替换），与存什么无关。
      - C 错：换模型不是检查点的设计目的；检查点里反而要记录模型与提示词的版本，用来判断能否安全恢复。
      - D 错：存输出比只存步数占用更多空间，压缩也改变不了这一点，这是为正确性付出的代价。

      完整的检查点还应包括：任务定义与计划、工作记忆（todo、关键决策、对话摘要）、副作用账本（幂等键与回执）、环境快照引用，以及各组件版本与已用预算。

  - id: AGT-MULTI-029
    type: multiple
    difficulty: 2
    frequency: 2
    points: [检查点与恢复]
    question: |
      关于长程 Agent 任务的检查点（checkpoint），下列做法**正确**的有：
    options:
      A: '记录模型、提示词、工具的版本与已消耗的预算，并给检查点格式带上 schema 版本号'
      B: '记录副作用账本：调用过的外部写操作、对应的幂等键与回执'
      C: '把访问外部系统的密钥和临时令牌一并写入检查点，恢复时就不用重新获取'
      D: '记录环境快照的引用（如代码仓库的 commit、文件哈希），恢复前先校验环境是否一致'
      E: '记录每个已完成步骤的输出，而不只是「做到第几步」，恢复时直接复用，不再重新调用模型'
    answer: [A, B, D, E]
    explanation: |
      - A 对：版本信息决定旧检查点能否在新代码上恢复；带上 schema 版本号，升级后要么提供迁移，要么明确拒绝并转人工。
      - B 对：最危险的时刻是「副作用已发生、检查点还没写」，有了账本和幂等键，恢复后的重试才不会产生重复副作用。
      - C 错：密钥和临时令牌不该落进检查点，恢复时重新获取；检查点常被复制、归档，存密钥会扩大泄露面。
      - D 对：恢复时环境可能已经变了（文件被改、分支前进），校验不一致就回滚环境或退回更早的检查点。
      - E 对：LLM 采样不可重放，恢复时重算已完成的步骤会得到不同的结果，与已经发生的副作用对不上，还要重复花钱；存下输出才能原样复用。

      写检查点本身也要防崩溃：不要直接覆盖原文件（写到一半崩溃会留下半个 JSON），应先写临时文件，再用 `os.replace` 原子替换。

      存储策略可以选每步快照、事件溯源（只追加日志 + 定期快照）、持久化执行框架（如 Temporal，要求工作流代码是确定性的）、阶段快照，或环境快照（git commit、容器快照），按状态大小与恢复要求取舍。
  - id: AGT-MULTI-030
    type: code_debug
    difficulty: 2
    frequency: 2
    points: [检查点与恢复, 幂等步骤]
    question: |
      下面是一个长任务执行器：每完成一步就把输出原子地写进 JSON 检查点，进程重启后从检查点恢复、跳过已完成的步骤。测试发现：第一次运行在第 3 步崩溃后，第二次运行要么报 `KeyError`，要么返回的结果缺了前两步的输出。请找出 bug 并修正。
    code: |
      import json
      import os

      def run(steps, ckpt_path, do):
          """steps：步骤名列表；do(name, state) 执行一步并返回输出（可能调用 LLM 或外部服务）"""
          ckpt = {"done": {}}
          if os.path.exists(ckpt_path):
              with open(ckpt_path, encoding="utf-8") as f:
                  ckpt = json.load(f)
          state = {}
          for name in steps:
              if name in ckpt["done"]:
                  continue
              state[name] = do(name, state)
              ckpt["done"][name] = state[name]
              tmp = ckpt_path + ".tmp"
              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(ckpt, f, ensure_ascii=False)
              os.replace(tmp, ckpt_path)
          return state
    fixed_code: |
      import json
      import os

      def run(steps, ckpt_path, do):
          """steps：步骤名列表；do(name, state) 执行一步并返回输出（可能调用 LLM 或外部服务）"""
          ckpt = {"done": {}}
          if os.path.exists(ckpt_path):
              with open(ckpt_path, encoding="utf-8") as f:
                  ckpt = json.load(f)
          state = dict(ckpt["done"])
          for name in steps:
              if name in ckpt["done"]:
                  continue
              state[name] = do(name, state)
              ckpt["done"][name] = state[name]
              tmp = ckpt_path + ".tmp"
              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(ckpt, f, ensure_ascii=False)
              os.replace(tmp, ckpt_path)
          return state
    test: |
      import tempfile

      calls = []
      crash = {"on": True}

      def do(name, state):
          calls.append(name)
          if name == "search":
              return "资料#1"
          if name == "outline":
              return "提纲<-" + state["search"]
          if crash["on"]:
              crash["on"] = False
              raise RuntimeError("进程被杀")
          return "报告<-" + state["outline"]

      with tempfile.TemporaryDirectory() as d:
          path = os.path.join(d, "job.json")
          steps = ["search", "outline", "write"]
          try:
              run(steps, path, do)
          except RuntimeError:
              pass
          calls.clear()
          final = run(steps, path, do)
          assert calls == ["write"], calls          # 已完成的步骤不重跑
          assert final == {"search": "资料#1", "outline": "提纲<-资料#1",
                           "write": "报告<-提纲<-资料#1"}, final
    answer: |
      **问题**：恢复时 `state = {}` 是空的。已完成的步骤被 `continue` 跳过后，它们的输出没有放回 `state`，后续步骤读取上游输出时就会 `KeyError`（或拿到空值），函数的返回值也缺了前面步骤的结果。

      **修正**：用检查点里存下的输出初始化 `state`：

      ```python
      state = dict(ckpt["done"])
      ```

      这样已完成的步骤直接复用存下的输出，不再调用 LLM，后续步骤看到的上游结果与崩溃前完全一致。
    explanation: |
      检查点存「每步输出」的意义就在于恢复时**复用**这些输出，而不是重算。有人会想去掉 `continue`、重新执行已完成的步骤来「补回」state，这是更糟的修法：LLM 采样不可重放，重算出的提纲可能和崩溃前不同，与已经产生的副作用（例如已发出的邮件）对不上，还要重复付费。

      这段代码其他部分是对的：先写临时文件再 `os.replace`，保证检查点不会只写一半。生产中还要注意：有副作用的步骤（发邮件、扣款）要带「运行 ID + 步骤名」生成的幂等键，因为如果崩溃发生在「副作用已发生、检查点未写入」的窗口里，恢复后这一步会被重跑。

  - id: AGT-MULTI-031
    type: single
    difficulty: 2
    frequency: 3
    points: [幂等步骤]
    question: |
      长任务的最后两步是「发邮件通知老板」和「写检查点」。进程恰好在邮件发出之后、检查点写入之前崩溃。为保证恢复后老板只收到一封邮件，下列做法中**最合适**的是：
    options:
      A: '每次发送前生成一个新的 UUID 作为幂等键，让邮件服务能够区分并追踪每一个请求'
      B: '先写检查点、把这一步标记为「已发送」，再真正发送邮件，保证恢复时不会重复执行这一步'
      C: '用「运行 ID + 步骤名」生成幂等键随请求发送，服务见过该键就直接返回首次回执'
      D: '恢复时从头重跑整个任务，依靠邮件服务按收件人与正文哈希自动识别并丢弃重复邮件'
    answer: C
    explanation: |
      **结论**：幂等键必须在重放时**保持不变**，所以要由「运行 ID + 步骤名」这类确定性信息生成。恢复后这一步会被重跑（至少执行一次），服务端按键去重，效果上就等于恰好执行一次。

      - A 错：新 UUID 每次都不同，服务端会把重试当成新请求，照样发出第二封。
      - B 错：先标记后执行变成了「至多一次」：如果在标记之后、发送之前崩溃，恢复时会跳过这一步，邮件永远发不出去，错误被悄悄吞掉。
      - D 错：从头重跑不仅浪费，前面的 LLM 步骤还会生成不同的内容，正文哈希随之改变；大多数服务也不会按内容去重。

      外部服务不支持幂等键时，可以「先查后做」（执行前查询这封邮件是否已发出），或者自己维护意图表：先记录意图再执行，恢复时对账。

  - id: AGT-MULTI-032
    type: judge
    difficulty: 2
    frequency: 2
    points: [幂等步骤]
    question: |
      外部服务不支持幂等键时，Agent 在崩溃恢复中没有办法确认「创建工单」「发送通知」这类有副作用的步骤是否已经执行过，所以这类步骤不能自动重试，应当转人工处理。
    answer: false
    explanation: |
      **错误**。幂等键只是实现幂等的手段之一。没有幂等键，也有办法确认一个步骤是否已经做过，常用的有两类：

      1. **先查后做**：执行前查询目标状态，例如「这个工单是否已创建（按运行 ID 写入的外部单号或标签检索）」「这条通知是否已发出」，已完成就跳过；
      2. **意图表 + 对账**：自己维护一张表，执行前先记录「准备对 X 做 Y」的意图，执行后记录回执；恢复时对每条只有意图、没有回执的记录去外部系统核实，再决定补做还是跳过。

      此外还要把纯计算（推理、规划）与副作用分开：纯计算的结果存进检查点直接复用，副作用集中在少数步骤里单独保护。只有既无法核实、又不可逆的操作（如付款）才需要升级给人确认。

  - id: AGT-MULTI-033
    type: single
    difficulty: 1
    frequency: 2
    points: [冲突与一致性]
    question: |
      某编码任务中，主 Agent 决定让 3 个子 Agent 并行修改同一个仓库里三个相互独立的模块，最后合并成一个 PR。为避免写冲突，最合适的做法是：
    options:
      A: '每个子 Agent 在独立的 git worktree 或分支上改自己的模块，最后由主 Agent 统一合并'
      B: '三个子 Agent 共用同一个工作目录直接写文件，在提示词里约定互不修改对方的模块'
      C: '给整个仓库加一把全局锁，子 Agent 写文件前先拿锁、写完再释放，保证同一时刻只有一个写者'
      D: '让三个子 Agent 进入同一个群聊、共享改动计划，对每一处改动先协商一致再动手'
    answer: A
    explanation: |
      **结论**：这是「分区所有权」：按模块划分写权限，各写各的，再由一个 Agent 统一集成。独立的 worktree 或分支让改动天然隔离，冲突留到合并时由主 Agent 处理，也方便单独回滚某个子 Agent 的改动。

      - B 错：提示词约定挡不住越界写入；共用工作目录时，一个子 Agent 运行格式化或测试生成的文件也会干扰其他人。并发控制必须在存储层强制执行。
      - C 错：一次推理可能持续几十秒，全局锁让三个子 Agent 基本退化为串行，并行失去意义；持锁者崩溃还可能留下死锁。
      - D 错：群聊协商成本高、上下文膨胀，也不能保证落地时不冲突。

      前提是三个模块确实相互独立。如果它们共享接口或风格约定，应先由主 Agent 定好接口；或者干脆由单 Agent 完成写操作，子 Agent 只做只读调研。

  - id: AGT-MULTI-034
    type: judge
    difficulty: 1
    frequency: 2
    points: [冲突与一致性]
    question: |
      在多 Agent 系统中用悲观锁保护共享资源时，锁必须带超时：Agent 一次推理可能持续几十秒，持锁的 Agent 一旦崩溃，不带超时的锁会让其他 Agent 一直等下去。
    answer: true
    explanation: |
      **正确**。悲观锁的问题在 Agent 场景里被放大了：普通程序持锁几毫秒，Agent 却可能在持锁期间调用模型、运行工具，持锁几十秒甚至更久，其他 Agent 只能干等；持锁者进程崩溃或被限流卡住时，锁就成了死锁。所以锁要带超时（租约），过期自动释放，并配合版本号，防止「超时后旧持有者又写回」。

      多 Agent 系统里更推荐的顺序是：**单写者原则**（每类资源只有一个 Agent 能写，其他 Agent 提修改建议）> **分区所有权**（按文件、模块划分）> **乐观并发**（写入时带上读到的版本号，存储层比较并交换，不一致就拒绝，重新读取、合并后再写）> 带超时的锁。这些机制都要在共享存储层强制执行，不能指望 Agent 自觉遵守提示词里的约定。

  - id: AGT-MULTI-035
    type: single
    difficulty: 2
    frequency: 2
    points: [冲突与一致性]
    question: |
      调研任务中，两个子 Agent 对同一事实给出了矛盾的结论：一个说「某云厂商的某个 API 支持流式输出」，另一个说「不支持」。编排者处理这个冲突时，**首先**应该怎么做？
    options:
      A: '采纳表述更自信、细节更丰富（如给出了参数名和示例响应）的那个子 Agent 的结论'
      B: '先写最小示例实际调用该 API 验证；无法验证时再比较双方来源的权威性与时效性'
      C: '再派 3 个同模型的子 Agent 独立回答同一个问题，按多数票裁决，以减少偶然误差'
      D: '把两种说法连同各自来源写进报告，如实标注存在分歧，交给用户自行判断'
    answer: B
    explanation: |
      **结论**：结果冲突按可靠程度从高到低处理：**可执行验证** > **比证据**（官方文档优于二手转述，新版本优于旧版本）> **独立裁判**（没参与过的 Agent，按事先写好的评分标准判断）> **保留分歧**（证据不足时如实写明两种说法，高风险的交给人）。

      - A 错：LLM 的自信程度与正确率并不可靠地相关，参数名、示例响应也可能是编造的，按「谁更自信、更具体」裁决容易选错。
      - C 错：同模型副本的错误高度相关，投票可能只是放大同一个错误。
      - D 错：「保留分歧」是证据不足时的最后手段；这里可以直接验证，就不该把问题甩给用户。

      预防比裁决更便宜：派活时划清边界、减少重叠，要求每条结论附来源；裁决理由写进 trace，便于复盘。

  - id: AGT-MULTI-036
    type: single
    difficulty: 1
    frequency: 2
    points: [多Agent失败模式]
    tags: [MAST]
    question: |
      某多 Agent 编码系统中，QA Agent 只检查了代码能否编译，就宣布「测试通过、任务完成」，实际功能有明显 bug。按 MAST 多 Agent 失败分类法（Cemri 等, 2025），这一问题最直接属于：
    options:
      A: '规格与系统设计问题中的「违背角色规格」'
      B: 'Agent 间未对齐中的「忽视其他 Agent 的输入」'
      C: '任务验证与终止问题中的「验证缺失或不完整」'
      D: 'Agent 间未对齐中的「推理与行动不一致」'
    answer: C
    explanation: |
      **结论**：MAST 把 14 种失败模式分为三大类：规格与系统设计问题、Agent 间未对齐、任务验证与终止问题。只检查编译就宣布完成，是验证做得不完整（往往还伴随「过早终止」），属于第三类。

      - A 错：违背角色规格指 Agent 越出自己的角色去做别人的事（如审稿人亲自改稿）；QA 做的仍是「检查」，问题在于检查太弱。
      - B 错：题中没有体现 QA 忽视了其他 Agent 提供的信息。
      - D 错：推理与行动不一致指「说要做 X 却做了 Y」，这里的问题是验证本身不充分。

      对应的缓解措施：验收标准在派活时就写清楚（例如必须运行单元测试并核对用例数）；可执行检查优先；验收者独立于实现者，只看产物、不信自述。
    source: 'Why Do Multi-Agent LLM Systems Fail?（Cemri 等, 2025, arXiv:2503.13657）'

  - id: AGT-MULTI-037
    type: multiple
    difficulty: 3
    frequency: 2
    points: [多Agent失败模式]
    tags: [MAST]
    question: |
      关于论文《Why Do Multi-Agent LLM Systems Fail?》（Cemri 等, 2025）提出的 MAST 失败分类，下列说法**正确**的有：
    options:
      A: '作者尝试了改进角色规格、增加高层验证等「战术修补」，失败基本消除，因此无需结构性改进'
      B: '「不知道何时终止」属于任务验证与终止问题'
      C: '「该澄清时不澄清」「隐瞒信息」都属于 Agent 间未对齐'
      D: '失败模式分为规格与系统设计问题、Agent 间未对齐、任务验证与终止问题三大类，共 14 种'
      E: '论文认为多数失败源于底座模型能力不足，换用更强的模型即可基本解决'
    answer: [C, D]
    explanation: |
      - A 错：战术修补的提升有限：在 ChatDev 上改进角色规格、增加高层验证，任务成功率最多提高约 15.6%，失败远未消除，效果也不稳定。作者因此主张更强的验证、标准化的通信协议、状态与记忆管理等结构性改进。
      - B 错：「不知道何时终止」（unaware of termination conditions）属于第一类「规格与系统设计问题」，同类的还有违背任务规格、违背角色规格、步骤重复、丢失对话历史。第三类「任务验证与终止」包括过早终止、验证缺失或不完整、验证出错。
      - C 对：Agent 间未对齐还包括对话重置、任务跑偏、忽视其他 Agent 的输入、推理与行动不一致。
      - D 对：分类来自对 MetaGPT、ChatDev 等多个开源多 Agent 框架运行轨迹的人工标注，标注者间一致性 κ = 0.88。
      - E 错：论文的核心结论恰恰相反：很多失败源于**系统设计**（规格、通信、验证），而不只是底座模型不够强。

      「不知道何时终止」是本题的陷阱：名字里带「终止」，但它反映的是停止条件在系统设计时就没有写清楚。
    source: 'Why Do Multi-Agent LLM Systems Fail?（Cemri 等, 2025, arXiv:2503.13657）'

  - id: AGT-MULTI-038
    type: short
    difficulty: 2
    frequency: 3
    points: [多Agent失败模式]
    question: |
      多 Agent 系统比单 Agent 更容易出现死循环和费用爆炸。请举出至少三种 Agent **之间**特有的循环形式，并给出由内到外的防护措施；触发上限之后应该怎么处理？
    answer: |
      1. **典型循环**：
         - A 转交给 B，B 又转回 A（Handoff 踢皮球）；
         - 审稿人永不满意、写手无限修改（工作者-验收者循环不收敛）；
         - 编排者看到「部分完成」就不停补派；
         - 子 Agent 递归地派生子 Agent；
         - 群聊里的客套循环（「请你确认」「已确认，请你确认」）。
      2. **五道保险（由内到外）**：
         - **步数与轮数上限**：每个 Agent 的最大步数、Handoff 最大次数、验收循环最大轮数；
         - **无进展检测**：对「状态 + 动作」或产物做哈希，重复出现就判定在兜圈子；或看失败用例集合是否缩小、分数是否提升；
         - **分层预算**：任务级预算拆给子 Agent，子 Agent 用完即停并上报部分完成；编排者补派也从同一个池子里扣；
         - **并发与派生深度上限**：限制同时存活的子 Agent 数和派生层数；
         - **熔断与告警**：单任务成本超过历史 P99 的数倍，或单位时间消耗异常，就自动暂停并通知人。
      3. **源头控费**：按任务复杂度决定派几个子 Agent（简单的事实查询只用 1 个 Agent），检索类子任务用便宜模型。
      4. **触发之后**：不能静默失败。先存检查点，再带着已尝试的方案、失败原因和最后一轮反馈升级给人，人处理完后从断点继续。
    rubric:
      - '举出至少三种 Agent 之间特有的循环形式（2 分）'
      - '给出步数 / 轮数 / 转交上限与无进展检测（3 分）'
      - '给出分层预算、并发与深度上限、成本熔断中的至少两项（3 分）'
      - '说明触发后存检查点并带上下文升级给人（2 分）'
    explanation: |
      **常见失分点**：只答「设一个 max_iterations」：多 Agent 的循环常发生在 Agent **之间**，单个 Agent 的步数上限拦不住；只有上限没有无进展检测，钱可能在上限到达前就烧完了；把「停下来」寄希望于模型自己判断，而不是做成系统机制。

  - id: AGT-MULTI-039
    type: short
    difficulty: 2
    frequency: 2
    points: [多Agent失败模式]
    question: |
      什么是多 Agent 系统中的「角色漂移」（role drift）？它有哪些成因？请按「从硬到软」的顺序给出治理手段，并说明它在 MAST 分类中属于哪一类。
    answer: |
      1. **定义**：Agent 在长对话中逐渐偏离设定的角色，例如审稿人开始亲自改稿、批评者变得一味附和、执行者越权做规划。
      2. **成因**：系统提示词在长上下文里被稀释；被其他 Agent 的话术带偏（从众、讨好）；角色边界本来就没写清。
      3. **治理（从硬到软）**：
         - **用权限而不是提示词约束角色**：审稿人只有读工具、没有写工具，想越权也做不到；
         - **结构化输出**：审稿人只能输出「通过 / 不通过 + 问题列表」，没有地方写代码；
         - **短生命周期**：每个任务新起一个干净的实例，而不是让同一个 Agent 跑几百轮；
         - **角色卡复述**：长任务中定期把角色说明重新放到上下文末尾；
         - **漂移检测**：抽样用分类器或 LLM 裁判判断输出是否符合角色职责，超过阈值就告警或重置。
      4. **MAST 归类**：对应「违背角色规格」（disobey role specification），属于规格与系统设计问题。
    rubric:
      - '准确定义角色漂移并举例（2 分）'
      - '说出至少两个成因（2 分）'
      - '给出至少三种治理手段，并体现「权限 > 结构化输出 > 提示词」的硬软顺序（4 分）'
      - '指出在 MAST 中属于违背角色规格（规格与系统设计问题）（2 分）'
    explanation: |
      **常见失分点**：只会说「在提示词里强调角色」：提示词是软约束，长任务里最先失效；没意识到工具权限才是最可靠的角色边界；把角色漂移与「任务跑偏」混为一谈（后者属于 Agent 间未对齐，指整个协作偏离了目标）。

  - id: AGT-MULTI-040
    type: short
    difficulty: 2
    frequency: 3
    points: [多Agent收益与代价, 何时不用多Agent]
    question: |
      你把一个单 Agent 系统改造成了多 Agent，并声称效果更好。面试官追问：「你怎么证明多 Agent 比单 Agent 好？多花的钱值不值？」请给出评测方案。
    answer: |
      1. **同预算基线**：和单 Agent 在相同的 token / 费用预算下比较。单 Agent 给足预算也能达到同样效果，就没必要拆；只和「没给够预算的单 Agent」比不算证明。
      2. **成本-成功率曲线**：在多个预算点上画出两者的成功率，比较整条曲线（帕累托前沿），而不是只比一个点。
      3. **消融**：去掉验收者、改成串行、换拓扑、换子 Agent 的模型，看每个组件各贡献多少。
      4. **评测终态而非路径**：会改变外界状态的任务，检查最终状态是否正确；多 Agent 的执行路径本来就不唯一。
      5. **稳定性**：同一任务多跑几次，看 pass^k，而不只是 pass@k。
      6. **打分方式**：可执行检查优先；开放任务用 LLM 裁判按事实准确、引用准确、完整性、来源质量、工具效率等维度打分，并人工抽检。Anthropic 的经验是先用约 20 条代表真实使用的查询快速迭代，再扩充成回归集。
      7. **算总账**：用「每次成功的成本」加上失败的补救代价比较。例如单 Agent 每单 0.20 美元、成功率 60%，多 Agent 每单 1.50 美元、成功率 75%；若每次失败要 10 美元补救，平均每单分别为 4.2 美元与 4.0 美元，多 Agent 反而更划算。
    rubric:
      - '提出同预算基线或成本-成功率曲线（3 分）'
      - '提出用消融拆分各组件的贡献（2 分）'
      - '提到终态评测、pass^k 稳定性、评测集与打分方式中的至少两项（3 分）'
      - '把失败代价纳入成本比较（2 分）'
    explanation: |
      **常见失分点**：只报成功率不报成本；拿多 Agent 和预算不足的单 Agent 比，提升可能只是多花了 token；只跑一次就下结论；只比单点不画曲线；忘了把失败的补救成本算进总账。

  - id: AGT-MULTI-041
    type: scenario
    difficulty: 3
    frequency: 3
    points: [何时不用多Agent, 多Agent收益与代价, 冲突与一致性]
    question: |
      某团队把原本的单 Agent 编码助手改造成「产品经理 → 架构师 → 前端 → 后端 → QA」五个 Agent 的多 Agent 系统，前端与后端 Agent 并行开发。上线一个月后发现：

      - 单任务 token 成本涨到原来的约 6 倍；
      - 前后端的接口字段、错误码经常对不上，需要反复返工；
      - QA 反复打回同一个问题，有的任务在产品经理、架构师、QA 之间来回转了二十多轮；
      - 端到端成功率反而从 62% 降到 55%。

      请分析原因，并给出改造方案。
    answer: |
      **原因分析**

      1. **按岗位拆分，而不是按耦合度拆分**：编码是写多、强耦合的任务，接口、错误码、命名风格都是隐含决策。前后端并行开发，彼此看不到对方正在做的决定，合并时才暴露冲突（Cognition 所说的「行动隐含决策」）。
      2. **交接丢信息**：角色之间传的是自然语言文档，接口契约没有结构化、没有校验，下游各自理解。
      3. **验收循环不收敛**：QA 的反馈不具体（没有用例名、期望值与实际值），也没有轮数上限和无进展检测，于是来回转了二十多轮。
      4. **成本结构**：每个 Agent 都要重读系统提示词、需求与代码，加上反复返工，token 成倍增长；而拆分本身并不提升模型能力。
      5. **评估缺失**：改造前没有和同预算的单 Agent 做对比就上线了。

      **改造方案**

      1. **回到「单 Agent 写、子 Agent 只读」**：由一个主 Agent 负责全部写操作，保证隐含决策一致；把「查清某模块的调用关系」「调研某个库的用法」这类只读任务派给子 Agent，换取上下文隔离。
      2. **若必须并行写，先定契约再分区**：主 Agent 先产出结构化的接口契约（如 OpenAPI 或类型定义），校验通过后再分给前后端；各自在独立分支或 worktree 上开发，由主 Agent 合并，契约测试作为合并门禁。
      3. **验收可执行化**：QA 运行真实测试，反馈带用例名、期望值与实际值；设验收轮数上限与无进展检测（同一用例连续失败、产物不变就停），超限升级给人。
      4. **交接结构化**：交接单 =「摘要 + 必要字段 + 约束原文」，缺字段不转；设转交次数上限。
      5. **控费与可观测**：分层预算、成本熔断；用 trace 树统计各 Agent 的 token、返工次数、交接次数。
      6. **重新评测**：在同一任务集上与同预算的单 Agent 比较成功率、每次成功的成本与 pass^k，拿不出显著收益就回退为单 Agent。
    rubric:
      - '指出编码任务强耦合、按岗位拆分导致隐含决策冲突（3 分）'
      - '分析验收循环不收敛、交接丢信息、成本倍增等具体原因（2 分）'
      - '给出「单 Agent 写 + 只读子 Agent」或「先定契约再分区」的改造方案（3 分）'
      - '给出循环防护与同预算对比评测等落地措施（2 分）'
    explanation: |
      **常见失分点**：只建议「换更强的模型」或「优化提示词」；没意识到根源是按人类岗位拆分强耦合的写任务；只给方案不给验证手段；忽略「来回转二十多轮」背后缺少的轮数上限与无进展检测。

  - id: AGT-MULTI-042
    type: scenario
    difficulty: 3
    frequency: 2
    points: [检查点与恢复, 幂等步骤]
    question: |
      一个每晚运行约 3 小时的数据报表 Agent，流程是：抓取 20 个数据源 → 清洗与计算 → 让 LLM 写分析报告 → 逐个给 200 位订阅者发邮件 → 在 IM 群里发公告。上周进程在给第 120 位订阅者发邮件时因发版被重启；重跑之后，前 120 人收到了两封邮件，而且两封邮件里的分析结论和部分数字不一致。请分析原因，并设计断点续跑方案。
    answer: |
      **原因分析**

      1. **没有检查点、从头重跑**：重启后从头执行，重新抓取数据源（数据已经更新），又重新调用 LLM（采样不可重放），所以两次的数字与结论不一致。
      2. **副作用没有幂等保护**：发邮件既没有幂等键，也没有发送记录，前 120 封被重复发送。
      3. **发版方式**：发版直接杀掉正在执行的长任务，没有排空，也没有让旧任务在旧版本上跑完。

      **断点续跑方案**

      1. **按步写检查点**：每步完成后原子写入（临时文件 + 原子替换）任务定义、各步**输出**（清洗后的数据快照或其存储路径、报告正文）、版本信息与已用预算。恢复时已完成的步骤直接复用输出，不重抓、不重写。
      2. **数据快照**：抓取结果按运行 ID 落盘，或记下数据版本 / 时间点，保证同一次运行内所有下游使用同一份数据。
      3. **副作用账本 + 幂等键**：发邮件拆成 200 个子步骤，幂等键 = 运行 ID + 步骤名 + 订阅者 ID，每发一封记录回执。邮件服务支持幂等键就随请求发送；不支持时「先查后做」，或用意图表：先记意图、再发送，恢复时对账，只补发没有回执的。
      4. **IM 公告同理**：以运行 ID 作幂等键，发送前检查群里是否已有本次公告。
      5. **发版策略**：长任务排空后再下线旧实例，或采用彩虹部署（新旧版本同时在线，进行中的任务继续用旧版本）；检查点带 schema 版本号，新代码无法兼容时明确拒绝并告警。
      6. **验证**：做失败注入演练，在「邮件发出之后、检查点写入之前」杀进程，确认恢复后邮件不重复、报告与崩溃前一致；监控重复发送数、恢复次数与耗时。
    rubric:
      - '指出「从头重跑导致数据与 LLM 输出变化」与「缺少幂等导致重复发送」两个根因（3 分）'
      - '设计按步检查点、复用每步输出，并固定数据快照（2 分）'
      - '设计逐收件人的幂等键或副作用账本，以及先查后做或意图表（3 分）'
      - '提到发版排空或彩虹部署、失败注入验证中的至少一项（2 分）'
    explanation: |
      **常见失分点**：只说「加重试」：没有幂等保障的重试正是重复发信的根源；只记「做到第几步」不存输出，恢复后仍会重算出不同的报告；把 200 封邮件当成一个原子步骤，崩溃后要么全部重发、要么全部不发；幂等键用随机数或时间戳，重放时键会变。

  - id: AGT-MULTI-043
    type: design
    difficulty: 3
    frequency: 2
    points: [Supervisor模式, 任务分解与依赖图, 冲突与一致性, 检查点与恢复]
    question: |
      公司有 300 个 Python 微服务仓库，需要统一从 Python 3.8 升级到 3.12（替换已弃用的 API、升级不兼容的依赖、修复由此引发的测试失败）。请设计一个多 Agent 系统完成这次迁移：说明为什么这里适合多 Agent（编码通常被认为不适合多 Agent），并给出拓扑、任务分解、并发与资源、验收、一致性、断点续跑、成本与风险控制等关键设计。
    answer: |
      **1. 为什么适合多 Agent**

      - 跨仓库的子任务相互独立：每个仓库的修改只发生在自己的仓库内，写操作天然分区，没有跨仓库的隐含决策冲突；
      - 规模大、可并行：300 个仓库串行处理耗时过长；
      - 可独立验收：每个仓库都有自己的 CI 与测试。
      - 但仓库**内部**仍是强耦合的写任务，所以每个仓库只交给**一个**工作者 Agent，不在仓库内部并行写。

      **2. 拓扑**

      - 两层 Supervisor：总编排者负责全局计划、迁移手册与进度；按业务线分组（如每组 30 个仓库），每组一个小组长负责派发、汇总与重试；工作者各负责一个仓库。
      - 迁移手册（统一的升级规则、依赖版本矩阵、常见报错的修法）作为共享的只读知识。工作者踩到新坑时向编排者提交「建议」，审核后由唯一的写者写入手册，避免各仓库各修各的。

      **3. 任务分解与依赖**

      - 先分析内部共享库的依赖关系：被依赖的公共库先迁移并发布新版本，再迁移下游服务（按拓扑序分批的 DAG 调度）；
      - 每个仓库的任务简报：目标、边界（只改本仓库，不改 CI 配置与测试断言）、约束、输出（PR + 变更摘要 + 测试证据）、预算（步数、token、时长）。

      **4. 并发与资源**

      - 用信号量限制同时运行的工作者数量（受 CI 资源和模型 API 限流约束）；每个工作者在独立的沙箱容器中运行，断网或只放行内部包镜像；
      - 超时按「部分完成」处理，由小组长决定补派还是转人工。

      **5. 验收**

      - 可执行检查优先：在 3.12 环境下全量测试通过、lint 通过、依赖锁文件可解析；修改前后对账测试数量，禁止修改或跳过测试（防假绿灯）；
      - 独立的审查 Agent 只看 diff，检查有没有针对测试的特判、有没有不必要的改动；
      - 最终合并由人审批，按风险分批放量。

      **6. 一致性与冲突**

      - 每个仓库只有一个工作者，在独立分支上提 PR；迁移手册与全局状态表采用单写者 + 版本号；
      - 公共库发布新版本后，依赖它的仓库按新版本重新验证。

      **7. 断点续跑**

      - 全局状态表记录每个仓库所处的阶段（待处理、进行中、PR 已建、已合并、失败）与 PR 链接；
      - 工作者每完成一个可验收的单元就提交到分支，检查点记录分支 commit；创建分支、PR 等副作用先查后做（同名分支或 PR 已存在就复用）。

      **8. 成本与风险**

      - 按仓库复杂度分配预算：简单仓库用便宜模型，复杂的升级到强模型；设成本熔断与告警；
      - 指标：迁移完成率、首个 PR 的 CI 通过率、人工介入率、单仓库成本、合并后的回滚率；
      - 先在 10 个仓库上试点，与「单 Agent 逐个串行」的方案比较成本与成功率，再扩大规模。
    rubric:
      - '说明适合多 Agent 的理由：跨仓库独立、写操作按仓库分区、可独立验收，且仓库内不并行写（2 分）'
      - '给出合理的拓扑（编排者 / 分层）、任务简报与依赖顺序（2 分）'
      - '设计可执行验收、防假绿灯、独立审查与人工合并（2 分）'
      - '设计一致性（单写者、分区）与断点续跑（状态表、幂等的副作用）（2 分）'
      - '给出并发限流、沙箱、成本控制与试点评估（2 分）'
    explanation: |
      **常见失分点**：认为「编码不适合多 Agent，所以只能单 Agent 串行」，而判断标准其实是子任务的耦合度，而不是领域；反过来让多个 Agent 并行改同一个仓库；没有处理公共库与下游服务之间的依赖顺序；验收只看 Agent 的自述；没有全局状态表，中断后不知道哪些仓库已经做完。

  - id: AGT-MULTI-044
    type: single
    difficulty: 1
    frequency: 2
    points: [Agent Teams, 子Agent上下文隔离]
    tags: [Claude Code]
    question: |
      Claude Code 提供了子 Agent（subagents）和 Agent Teams 两种并行工作的方式。二者的主要区别是：
    options:
      A: 'Agent Teams 的成员共享同一个上下文窗口，彼此不需要传话，所以 token 开销通常比子 Agent 更低，也更适合规模较大的任务'
      B: '子 Agent 主要把结果交回主 Agent；Agent Teams 的队友是各自独立的会话，通过共享任务列表认领工作，并能直接互发消息'
      C: 'Agent Teams 的队友必须由用户手动逐个启动并配置，主会话既不能派生队友，也不能给队友创建和分配任务'
      D: 'Agent Teams 只是子 Agent 在终端界面中的另一种展示方式，两者在协作机制、上下文和 token 开销上都没有区别'
    answer: B
    explanation: |
      **结论**：子 Agent 是「派活 → 交回结果」；Agent Teams 是「共享任务板 + 队友之间直接沟通」。

      Claude Code 的文档（截至 2026 年 11 月，Agent Teams 仍是默认关闭的实验特性）这样对比：
      - **上下文**：两者的成员都有各自的上下文窗口；队友是完全独立的 Claude Code 会话，启动时加载项目的 CLAUDE.md、MCP Server 和技能，但不继承主会话（team lead）的对话历史。
      - **通信**：子 Agent 把结果交回调用者；队友之间可以直接互发消息，用户也可以直接与任一队友对话。
      - **协调**：子 Agent 由主 Agent 管理全部工作；队友通过共享任务列表自行认领任务，任务可以声明依赖，依赖未完成时显示为阻塞。
      - **成本**：子 Agent 的结果被概括后交回主上下文，开销较低；每个队友都是一个独立的 Claude 实例，token 开销随队友数量线性增长。

      - A 错：队友各有独立的上下文，开销更高而不是更低。
      - C 错：由主会话（team lead）派生队友、创建并分配任务，用户用自然语言描述想要的团队即可。
      - D 错：协作机制和开销都不同。

      文档的建议是：只关心结果的聚焦任务用子 Agent；需要互相分享发现、彼此质疑、自行协调的复杂工作才用 Agent Teams。
    source: Claude Code 文档 Agent teams：https://code.claude.com/docs/en/agent-teams

  - id: AGT-MULTI-045
    type: short
    difficulty: 2
    frequency: 2
    points: [Agent Teams, 任务分解与依赖图, 何时不用多Agent]
    question: |
      面试官问：「你们为什么用 Agent Teams（多个 Agent 共享任务列表、动态认领任务、彼此直接沟通），而不是事先编排好的 Workflow？」请比较两种方式，说明 Agent Teams 适合与不适合的场景、主要代价，以及落地时的关键约束。
    answer: |
      1. **两种方式的本质区别**：
         - Workflow 编排：任务的拆分方式和执行顺序（DAG 或 SOP）在代码里事先写好，每个节点做固定的事。可预测、成本低、好测试，前提是事先就知道怎么拆；
         - Agent Teams：由主 Agent 在运行时拆分任务，写到共享任务列表上，队友自行认领；执行中发现的新工作可以随时加入列表；队友之间直接交流发现、互相质疑。灵活，适合事先拆不清楚的任务。
      2. **适合的场景**：
         - 调研与评审：几个队友从不同角度（安全、性能、测试覆盖）同时审查同一个改动，再汇总；
         - 带竞争性假设的排障：每个队友验证一种假设，并设法推翻别人的结论，避免「找到一个看似合理的解释就停下」；
         - 可以按模块划分归属的新功能、跨前后端与测试的改动。
      3. **不适合的场景**：步骤严格串行的任务、需要多人同时修改同一个文件的任务、依赖关系很多的任务。这些用单个 Agent、子 Agent 或固定的 Workflow 更有效。流程稳定、需要强可审计的业务流程，也应当用 Workflow。
      4. **主要代价**：
         - token 随队友数线性增长；协调开销随团队规模上升，收益递减；
         - 行为不确定，难以复现与评测；
         - 写冲突：两个队友改同一个文件会互相覆盖；
         - 状态滞后：队友可能忘记把任务标记为完成，阻塞了依赖它的任务。
      5. **落地的关键约束**：
         - 团队规模从 3～5 人起步；任务粒度适中，每个任务都有明确的交付物（一个函数、一个测试文件、一份评审）；
         - 按文件或模块划分归属，避免写冲突；
         - 用钩子在任务创建、任务完成时做质量门禁（例如测试不通过就不允许标记完成）；
         - 主 Agent 负责监控与综合结论，必要时重新分配任务；预算与终止条件要写清楚；
         - 也可以混合使用：整体用 Workflow 搭骨架，在其中「调研」这类开放式阶段内部用 Agent Teams。
    rubric:
      - '说清静态编排与动态分发、直接沟通的本质区别（2 分）'
      - '给出 Agent Teams 适合的场景，并说明理由（2 分）'
      - '给出不适合的场景（2 分）'
      - '分析 token、协调、冲突、不确定性等代价（2 分）'
      - '给出团队规模、任务粒度、文件归属、质量门禁等落地约束（2 分）'
    explanation: |
      **常见失分点**：把 Agent Teams 当成「更高级的 Workflow」，认为什么任务都该用；说不出它真正的收益来自并行探索与相互质疑；忽视写冲突和 token 成本；没有任何质量门禁和终止条件。Claude Code 文档给出的经验是：从不需要写代码的调研、评审类任务开始尝试，再逐步扩展到并行开发。
    source: 'Claude Code 文档 Agent teams：https://code.claude.com/docs/en/agent-teams'

  - id: AGT-MULTI-046
    type: coding
    difficulty: 3
    frequency: 2
    points: [Agent Teams, 任务分解与依赖图, 冲突与一致性]
    tags: [共享任务列表]
    question: |
      Agent Teams 中，队友通过共享任务列表认领工作。实现一个任务板：

      ```python
      class TaskBoard:
          def __init__(self, tasks: dict[str, list[str]]): ...
          def status(self, task: str) -> str: ...
          def claim(self, agent: str) -> str | None: ...
          def complete(self, agent: str, task: str) -> list[str]: ...
      ```

      - `tasks` 把任务 id 映射到它所依赖的任务 id 列表。依赖了不存在的任务，或依赖关系成环（包括自依赖）时，构造函数抛出 `ValueError`。
      - 任务状态为 `pending`、`in_progress`、`completed`。`status` 对依赖尚未全部完成的 pending 任务返回 `"blocked"`，其余情况返回实际状态。
      - `claim(agent)`：该队友手上已有进行中的任务时返回 `None`（一次只做一件事）；否则在所有「pending 且依赖全部完成」的任务中，选 id 字典序最小的一个，标记为 `in_progress` 并记下认领者，返回它的 id；没有可认领的任务时返回 `None`。
      - `complete(agent, task)`：只有认领者能完成自己进行中的任务，否则抛出 `PermissionError`；返回因这次完成而**新变为可认领**的任务 id 列表（升序）。
      - 多个队友可能在不同线程中同时调用 `claim`，同一个任务绝不能被两个队友领到。
    answer: |
      import threading


      class TaskBoard:
          def __init__(self, tasks):
              for t, deps in tasks.items():
                  for d in deps:
                      if d not in tasks:
                          raise ValueError(f"未知依赖 {d}")
              self.deps = {t: set(ds) for t, ds in tasks.items()}
              indeg = {t: len(ds) for t, ds in self.deps.items()}
              ready, seen = [t for t, k in indeg.items() if k == 0], 0
              while ready:                               # Kahn 算法检查依赖是否成环
                  t = ready.pop()
                  seen += 1
                  for u, ds in self.deps.items():
                      if t in ds:
                          indeg[u] -= 1
                          if indeg[u] == 0:
                              ready.append(u)
              if seen != len(tasks):
                  raise ValueError("依赖成环")
              self.state = {t: "pending" for t in tasks}
              self.owner = {}
              self.lock = threading.Lock()

          def _ready(self, t):
              return self.state[t] == "pending" and all(self.state[d] == "completed" for d in self.deps[t])

          def status(self, t):
              return "blocked" if self.state[t] == "pending" and not self._ready(t) else self.state[t]

          def claim(self, agent):
              with self.lock:                            # 认领是「检查 + 修改」，必须原子
                  if any(s == "in_progress" and self.owner[t] == agent for t, s in self.state.items()):
                      return None
                  for t in sorted(self.state):
                      if self._ready(t):
                          self.state[t], self.owner[t] = "in_progress", agent
                          return t
                  return None

          def complete(self, agent, t):
              with self.lock:
                  if self.state[t] != "in_progress" or self.owner[t] != agent:
                      raise PermissionError(f"{agent} 不能完成 {t}")
                  before = {u for u in self.state if self._ready(u)}
                  self.state[t] = "completed"
                  return sorted(u for u in self.state if self._ready(u) and u not in before)
    test: |
      b = TaskBoard({"api": [], "db": [], "ui": ["api"], "e2e": ["ui", "db"]})
      assert [b.status(t) for t in ["api", "db", "ui", "e2e"]] == ["pending", "pending", "blocked", "blocked"]
      assert b.claim("alice") == "api"
      assert b.claim("alice") is None                 # 手上已有进行中的任务
      assert b.claim("bob") == "db"
      assert b.claim("carol") is None                 # ui、e2e 仍被阻塞
      try:
          b.complete("bob", "api")
          raise AssertionError("bob 不应能完成 alice 的任务")
      except PermissionError:
          pass
      assert b.complete("alice", "api") == ["ui"]
      assert b.status("ui") == "pending" and b.status("e2e") == "blocked"
      assert b.claim("carol") == "ui"
      assert b.complete("bob", "db") == []
      assert b.complete("carol", "ui") == ["e2e"]
      assert b.claim("alice") == "e2e" and b.status("e2e") == "in_progress"
      try:
          b.complete("alice", "api")                  # 已完成的任务不能再次完成
          raise AssertionError("不应能重复完成")
      except PermissionError:
          pass
      for bad in [{"a": ["x"]}, {"a": ["b"], "b": ["a"]}, {"a": ["a"]}, {"a": [], "b": ["c"], "c": ["b"]}]:
          try:
              TaskBoard(bad)
              raise AssertionError(f"应当拒绝 {bad}")
          except ValueError:
              pass
      # 并发认领：同一任务不能被两个队友领到
      b = TaskBoard({f"t{i}": [] for i in range(5)})
      got = []
      ths = [threading.Thread(target=lambda n=f"a{i}": got.append(b.claim(n))) for i in range(8)]
      for th in ths:
          th.start()
      for th in ths:
          th.join()
      claimed = [g for g in got if g]
      assert len(claimed) == 5 and len(set(claimed)) == 5 and got.count(None) == 3
    explanation: |
      **实现要点**：

      1. **建图时校验**：未知依赖与环都要在构造时拒绝。成环的任务永远不会解锁，运行时只表现为「大家都在等」，很难排查。这里用 Kahn 算法：反复取出入度为 0 的任务，取出的总数小于任务数就说明有环。
      2. **认领必须原子**：「找到一个可认领的任务」和「把它标记为进行中」之间如果被别的线程插入，两个队友就会领到同一个任务。用锁把检查与修改包成一个临界区；Claude Code 的 Agent Teams 正是用文件锁来防止多个队友同时认领同一任务时的竞态。
      3. **一次只做一件事**：限制每个队友同时只有一个进行中的任务，任务分布更均匀，也避免某个队友囤积任务。
      4. **只有认领者能完成**：防止误操作或越权，把别人的任务标记为完成。
      5. **自动解锁下游**：在完成前后各计算一次可认领集合，差集就是新解锁的任务，可以据此通知空闲的队友。
      6. **确定性**：按字典序选择任务，便于测试与复现。

      **生产中还需要**：任务租约与超时（队友崩溃或忘记更新状态时，任务可以被回收；文档也提到任务状态可能滞后、阻塞下游）、状态持久化，以及在「标记完成」时运行测试之类的质量门禁。
    source: 'Claude Code 文档 Agent teams：https://code.claude.com/docs/en/agent-teams'

  - id: AGT-MULTI-047
    type: short
    difficulty: 2
    frequency: 1
    points: [子Agent上下文隔离, Supervisor模式, 检查点与恢复]
    tags: [结果回收]
    question: |
      主 Agent 把几个调研子任务分派给子 Agent 并行执行。请说明：主 Agent 怎样得知某个子 Agent 已经完成？子 Agent 迟迟不返回、返回失败或者返回的结果不完整时怎么办？多个子 Agent 的结果应当如何回收与汇总？
    answer: |
      1. **完成通知的方式**：
         - **同步调用**：派活本身就是一次阻塞的工具调用，子 Agent 结束时返回值就是结果。实现最简单，但主 Agent 在等待期间不能做别的事；
         - **异步通知**：子 Agent 在后台运行，结束时向主 Agent 发送完成事件（或写入它的收件箱）；主 Agent 无需轮询，可以先处理其他工作；
         - **共享任务存储**：子任务的状态记在任务表里，主 Agent 订阅状态变化或定期查询。任务表同时是故障恢复的依据。
      2. **完成报告的内容**：要结构化，至少包含状态（成功、部分完成、失败）、结论摘要、产物的引用（文件路径或存储地址，而不是把大段原文塞回来）、关键证据与出处、未解决的问题，以及消耗（步数、token）。
      3. **超时与兜底**：
         - 每个子任务设截止时间与预算，子 Agent 定期汇报心跳与进度；超过截止时间先询问状态，再取消；
         - 失败处理：可重试的错误换一种方式重试；不可重试的标记失败，重新分派给其他子 Agent，或者降级为「部分结果 + 说明缺失了什么」；
         - 取消要向下传播，已经产生的副作用依靠幂等保证不会重复；
         - 卡住的情况升级给人，并附上已有的进展。
      4. **结果回收与汇总**：
         - 按约定的格式校验结果，不合格的退回补充；
         - 去重与合并：多个子 Agent 找到的同一事实只保留一份，并合并各自的出处；
         - 冲突处理：结论矛盾时回到原始证据核对，必要时派一个子 Agent 专门核查，而不是简单投票；
         - 迟到的结果：汇总之后才到达的结果，要么忽略并记录，要么触发一次增量更新，事先定好规则；
         - 汇总报告中写明哪些部分缺失或不确定。
      5. **参考实现**：Claude Code 的 Agent Teams 中，队友结束时会自动通知主会话，并在通知中附上最终答复；因为 API 错误而失败时，也会通知主会话并附带错误信息。文档同时提醒，队友有时会忘记把任务标记为完成，主会话需要核实，而不能只看状态。
    rubric:
      - '说明同步返回、异步通知、共享任务存储等完成通知方式及取舍（3 分）'
      - '说明完成报告应当结构化，并且只回传产物引用（2 分）'
      - '给出超时、心跳、重试、重新分派、降级与升级等兜底措施（3 分）'
      - '说明结果的校验、去重、冲突处理与迟到结果的处理（2 分）'
    explanation: |
      **常见失分点**：只想到「等它返回」，没有超时与取消；子 Agent 把全部原始数据塞回主上下文；汇总时遇到冲突就多数投票；失败时静默丢弃，最终报告里不说明缺了什么。异步方式的难点在于「谁来保证每个子任务最终都有结局」，因此任务存储中要记录每个子任务的终态，主 Agent 收尾之前逐一核对。
    source: 'Claude Code 文档 Agent teams：https://code.claude.com/docs/en/agent-teams'
