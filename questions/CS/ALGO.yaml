                  if color[v] == WHITE:
                      cycle = dfs(v)
                      if cycle:
                          return cycle
              path.pop()
              color[u] = ____
              return None

          for u in color:
              if color[u] == WHITE:
                  cycle = dfs(u)
                  if cycle:
                      return cycle
          return None
