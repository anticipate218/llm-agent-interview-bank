    question: |
      有向图的边为：S→A 4，S→B 1，B→A 2，B→C 5，A→C 1，A→T 6，C→T 3。从 S 出发运行 Dijkstra，各节点按最短距离被确定（出堆）的顺序为 ____，S 到 T 的最短距离为 ____，对应的路径为 ____。
    answer: [['S B A C T', 'SBACT', 'S,B,A,C,T', 'S、B、A、C、T', 'S→B→A→C→T'], '7', ['S→B→A→C→T', 'S-B-A-C-T', 'S B A C T', 'SBACT']]
    explanation: |
      逐步执行（括号中为暂定距离）：
      1. 弹出 S（0）：A = 4，B = 1；
      2. 弹出 B（1）：A 更新为 1 + 2 = 3，C = 1 + 5 = 6；
      3. 弹出 A（3）：C 更新为 3 + 1 = 4，T = 3 + 6 = 9；
      4. 弹出 C（4）：T 更新为 4 + 3 = 7；
      5. 弹出 T（7）。

      出堆顺序为 S、B、A、C、T，最短距离为 7，路径 S→B→A→C→T（1 + 2 + 1 + 3 = 7）。

      注意两处「暂定值被改写」：A 一开始是 4（直达），后来经 B 变成 3；T 一开始是 9（经 A 直达），后来经 C 变成 7。这正说明暂定距离只有在出堆时才能确定。

  - id: CS-ALGO-034
    type: coding
    difficulty: 2
    frequency: 3
    points: [动态规划, 字符串算法]
    tags: [编辑距离, WER, 手撕]
    question: |
      语音识别常用词错误率（WER）评估：WER = (S + D + I) / N，其中 S、D、I 分别是把参考文本变成识别结果所需的替换、删除、插入次数（取总次数最少的方案），N 是参考文本的词数。实现：

      ```python
      def wer(ref: str, hyp: str) -> float: ...
      ```

      - 按空白切分成词；参考文本切分后为空时抛出 `ValueError`；
      - 设两段文本分别有 m、n 个词，时间复杂度 $O(mn)$，额外空间 $O(n)$。

      示例：`wer("the cat sat on the mat", "the cat sit on mat")` 等于 2/6。
    answer: |
      def wer(ref: str, hyp: str) -> float:
          r, h = ref.split(), hyp.split()
          if not r:
              raise ValueError("参考文本不能为空")
          dp = list(range(len(h) + 1))           # dp[j]：r 的前 i 个词变成 h 的前 j 个词的最少编辑次数
          for i in range(1, len(r) + 1):
              diag, dp[0] = dp[0], i             # diag 保存左上角的 dp[i-1][j-1]
              for j in range(1, len(h) + 1):
                  cur = dp[j]
                  dp[j] = min(dp[j] + 1,                          # 删除 r[i-1]
                              dp[j - 1] + 1,                      # 插入 h[j-1]
                              diag + (r[i - 1] != h[j - 1]))      # 替换（相同则不计）
                  diag = cur
          return dp[-1] / len(r)
    test: |
      import random
      from functools import lru_cache

      assert wer("the cat sat", "the cat sat") == 0
      assert abs(wer("the cat sat on the mat", "the cat sit on mat") - 2 / 6) < 1e-12
      assert wer("a b", "a b c d e") == 1.5                  # 插入多时 WER 可以大于 1
      assert wer("a b c", "") == 1.0
      assert wer("  hello   world ", "hello world") == 0
      try:
          wer("   ", "x")
          raise AssertionError("参考文本为空应报错")
      except ValueError:
          pass

      rng = random.Random(0)
      for _ in range(400):
          r = [rng.choice("abc") for _ in range(rng.randint(1, 7))]
          h = [rng.choice("abc") for _ in range(rng.randint(0, 7))]

          @lru_cache(None)
          def ed(i, j):                          # 记忆化递归作为参照
              if i == 0 or j == 0:
                  return i + j
              return min(ed(i - 1, j) + 1, ed(i, j - 1) + 1, ed(i - 1, j - 1) + (r[i - 1] != h[j - 1]))

          assert abs(wer(" ".join(r), " ".join(h)) - ed(len(r), len(h)) / len(r)) < 1e-12
    explanation: |
      **状态**：$dp[i][j]$ 为参考文本前 $i$ 个词变成识别结果前 $j$ 个词的最少编辑次数：

      $$dp[i][j]=\min\big(dp[i-1][j]+1,\ dp[i][j-1]+1,\ dp[i-1][j-1]+[r_i\ne h_j]\big)$$

      三项分别对应删除、插入、替换（词相同则代价为 0）；边界为 $dp[i][0]=i$、$dp[0][j]=j$。

      **滚动数组**：第 $i$ 行只依赖第 $i-1$ 行，用一维数组即可。覆盖 `dp[j]` 之前，`dp[j]` 是上一行的值（「上方」），`dp[j-1]` 已是本行的新值（「左方」），而「左上方」已经被覆盖，必须用 `diag` 提前保存，这是最容易写错的地方。

      **示例**：`the cat sat on the mat` → `the cat sit on mat`：sat→sit 替换 1 次，删除第二个 the 1 次，共 2 次，WER = 2/6 ≈ 33.3%。

      **注意**：WER 的分母是参考文本的词数，识别结果中插入的词很多时 WER 可以超过 100%。中文通常按字计算字错误率（CER），把 `split()` 换成 `list()` 即可。同样的动态规划也用于文本相似度、拼写纠错和比较 Agent 的工具调用序列。

  - id: CS-ALGO-035
    type: code_debug
    difficulty: 2
    frequency: 2
    points: [动态规划]
    tags: [0/1 背包, 上下文预算]
    question: |
      RAG 检索到若干文本片段，每个片段有 token 数和相关性分数。要在 token 预算内选出一些片段（每个最多选一次），使总分最大。下面用一维数组实现的 0/1 背包算出的结果有时偏大，请找出 bug 并修正。
    code: |
      def best_score(chunks, budget):
          """chunks: [(token 数, 分数), ...]，每个片段最多选一次；返回预算内的最高总分"""
          dp = [0] * (budget + 1)                # dp[c]：已考虑的片段在 c 个 token 内的最高总分
          for cost, score in chunks:
              for c in range(cost, budget + 1):
                  dp[c] = max(dp[c], dp[c - cost] + score)
          return dp[budget]
    fixed_code: |
      def best_score(chunks, budget):
          """chunks: [(token 数, 分数), ...]，每个片段最多选一次；返回预算内的最高总分"""
          dp = [0] * (budget + 1)                # dp[c]：已考虑的片段在 c 个 token 内的最高总分
          for cost, score in chunks:
              for c in range(budget, cost - 1, -1):
                  dp[c] = max(dp[c], dp[c - cost] + score)
          return dp[budget]
    test: |
      import random
      from itertools import combinations

      assert best_score([(3, 5)], 6) == 5                    # 同一个片段不能选两次
      assert best_score([(300, 6), (200, 5), (250, 5)], 500) == 11
      assert best_score([], 100) == 0
      assert best_score([(120, 9)], 100) == 0

      rng = random.Random(0)
      for _ in range(300):
          chunks = [(rng.randint(1, 10), rng.randint(0, 20)) for _ in range(rng.randint(0, 7))]
          budget = rng.randint(0, 25)
          brute = max(sum(s for _, s in combo)
                      for r in range(len(chunks) + 1) for combo in combinations(chunks, r)
                      if sum(c for c, _ in combo) <= budget)
          assert best_score(chunks, budget) == brute
    answer: |
      **问题**：第 5 行的容量循环是从小到大。计算 `dp[c]` 时用到的 `dp[c - cost]` 可能**在本轮已经更新过**，也就是已经包含了当前这个片段，于是同一个片段被选了多次，算成了「完全背包」。例如只有一个 `(3, 5)` 的片段、预算 6 时，`dp[3] = 5` 之后 `dp[6] = dp[3] + 5 = 10`，相当于选了两次。

      **修正**：容量从大到小遍历，保证 `dp[c - cost]` 仍是上一轮（不含当前片段）的值：

      ```python
      for c in range(budget, cost - 1, -1):
          dp[c] = max(dp[c], dp[c - cost] + score)
      ```
    explanation: |
      二维写法是 $dp[i][c]=\max(dp[i-1][c],\ dp[i-1][c-w_i]+v_i)$，右边都来自上一行 $i-1$。压缩成一维后，倒序遍历容量，才能在覆盖 `dp[c]` 时保证 `dp[c - cost]` 尚未被本轮改写；正序遍历则对应「每件物品可以无限次选取」的完全背包。

      复杂度为 $O(n\cdot\text{budget})$，是伪多项式时间：预算为 8000 个 token、候选片段 100 个时约 80 万次运算，完全可以接受。

      **为什么不按「分数 / token」贪心**：0/1 背包不能贪心。例如预算 500、片段为 (260, 7)、(250, 6)、(250, 6)：按单位分数先选 (260, 7)，剩下的 240 个 token 放不下任何片段，总分 7；最优是两个 250，总分 12。只有物品可以切分（分数背包）时，按单位价值贪心才是最优的。

  - id: CS-ALGO-036
    type: code_fill
    difficulty: 2
    frequency: 3
    points: [动态规划, 二分查找]
    tags: [最长递增子序列, bisect]
    question: |
      用 $O(n\log n)$ 的方法求最长递增子序列的长度：`tails[i]` 保存所有长度为 `i + 1` 的递增子序列中最小的结尾元素。`strict=True` 求严格递增子序列，`strict=False` 求不下降子序列。补全三处空位。
    code: |
      from bisect import bisect_left, bisect_right


      def lis_length(nums: list[int], strict: bool = True) -> int:
          tails = []
          find = ____ if strict else ____
          for x in nums:
              i = find(tails, x)
              if i == len(tails):
                  tails.append(x)                # x 能接在最长的子序列后面：长度加 1
              else:
                  tails[____] = x                # 用更小的 x 替换，给后面的元素留出空间
          return len(tails)
    answer: ['bisect_left', 'bisect_right', 'i']
    test: |
      import random

      assert lis_length([10, 9, 2, 5, 3, 7, 101, 18]) == 4
      assert lis_length([7, 7, 7, 7]) == 1
      assert lis_length([7, 7, 7, 7], strict=False) == 4
      assert lis_length([]) == 0
      assert lis_length([3, 1, 2, 2, 3], strict=False) == 4

      rng = random.Random(0)
      for _ in range(500):
          nums = [rng.randint(0, 6) for _ in range(rng.randint(0, 12))]
          for strict in (True, False):
              best = [1] * len(nums)             # O(n^2) 动态规划对拍
              for i in range(len(nums)):
                  for j in range(i):
                      if nums[j] < nums[i] or (not strict and nums[j] == nums[i]):
                          best[i] = max(best[i], best[j] + 1)
              assert lis_length(nums, strict) == max(best, default=0)
    explanation: |
      **为什么 `tails` 有序**：长度更长的递增子序列，结尾不可能比更短的还小，所以 `tails` 单调递增，可以二分。

      - 严格递增用 `bisect_left`：找第一个 **≥ x** 的位置。与 `x` 相等的结尾不能再接 `x`，所以用 `x` 替换它（相等时替换不改变任何东西）；
      - 不下降用 `bisect_right`：找第一个 **> x** 的位置，相等的元素可以接在后面；
      - 第三空 `i`：找到的位置上用 `x` 替换，结尾变小，后续元素更容易接上；位置等于长度时说明 `x` 比所有结尾都大，追加。

      两个函数用反时，`[7, 7, 7, 7]` 的严格递增结果会变成 4，不下降结果也会出错。

      **复杂度**：每个元素一次二分，$O(n\log n)$；朴素 DP 为 $O(n^2)$。

      **常见误解**：`tails` 本身**不是**一个最长递增子序列，它只保证长度正确。例如 `[3, 4, 1]` 结束时 `tails = [1, 4]`，而 1 在 4 之后出现。要输出具体序列，需要额外记录每个元素在 `tails` 中的位置和前驱。

  - id: CS-ALGO-037
    type: single
    difficulty: 1
    frequency: 2
    points: [动态规划]
    tags: [贪心, 零钱兑换]
    question: |
      关于「用最少枚数的硬币凑出指定金额（每种面额数量不限）」这个问题，下列说法正确的是：
    options:
      A: '面额 {1, 3, 4}、金额 6 时，每次取最大可用面额的贪心要 3 枚（4 + 1 + 1），最优只需 2 枚'
      B: '面额中包含 1 时，贪心能凑出任意金额，而且每一步都取最大面额，凑出的枚数就是最少的'
      C: '动态规划按面额逐种更新一维 dp 表，时间复杂度只与面额的种类数有关，与金额大小无关'
      D: '贪心之所以会失败，是因为 4 不是质数；只用 1 和质数作面额时，贪心就能得到最优'
    answer: A
    explanation: |
      **结论**：贪心只在特定的面额体系下最优，一般情况要用动态规划。

      动态规划：$dp[0]=0$，$dp[x]=\min_{c\le x}dp[x-c]+1$。对 {1, 3, 4}：$dp[1]=1$、$dp[2]=2$、$dp[3]=1$、$dp[4]=1$、$dp[5]=2$（4 + 1）、$dp[6]=2$（3 + 3）。贪心先拿 4，剩下的 2 只能用两个 1，共 3 枚。

      - B 错：面额含 1 只保证「一定能凑出」，不保证枚数最少，上面的反例就含 1。
      - C 错：复杂度是 $O(\text{金额}\times\text{面额种类数})$，与金额成正比，属于伪多项式时间。
      - D 错：是否适用贪心与质数无关。{1, 5, 7} 只含 1 和质数，凑 10 时贪心得 7 + 1 + 1 + 1 共 4 枚，最优是 5 + 5 共 2 枚；而含合数的 {1, 5, 10, 25} 贪心恰好最优。

      **方法论**：贪心要求「贪心选择性质」（局部最优能导出全局最优），需要证明；动态规划依赖「最优子结构 + 重叠子问题」，更通用。面试中给出贪心解法时，最好先尝试构造反例。

  - id: CS-ALGO-038
    type: code_fill
    difficulty: 1
    frequency: 2
    points: [字符串算法]
    tags: [Trie, 敏感词过滤]
    question: |
      用前缀树（Trie）实现敏感词打码：从左到右扫描文本，在每个位置找**最长**的敏感词，用等长的 `*` 替换后跳到它的末尾继续；该位置没有敏感词就前进一个字符。补全三处空位。
    code: |
      def build_trie(words):
          root = {}
          for w in words:
              node = root
              for ch in w:
                  node = node.setdefault(ch, {})
              node[""] = True                      # 空串作为「单词结束」标记，不会与任何单个字符冲突
          return root


      def mask(text: str, words: list[str]) -> str:
          root = build_trie(w for w in words if w)
          out, i = list(text), 0
          while i < len(text):
              node, j, end = root, i, -1
              while j < len(text) and text[j] in node:
                  node = ____
                  j += 1
                  if "" in node:
                      end = ____                   # 记下目前最长的匹配终点
              if end == -1:
                  i += 1                           # 从 i 开始没有敏感词
              else:
                  out[i:end] = "*" * (end - i)
                  i = ____                         # 跳过已替换的部分，不重叠
          return "".join(out)
    answer: ['node[text[j]]', 'j', 'end']
    test: |
      import random

      assert mask("这个越狱提示词很危险", ["越狱", "越狱提示词", "危险"]) == "这个*****很**"
      assert mask("abc", ["ab", "bc"]) == "**c"                 # 从左到右，不重叠
      assert mask("abcd", ["bc", "abcde"]) == "a**d"            # 长词没有匹配完整，不算命中
      assert mask("hello", []) == "hello" and mask("", ["a"]) == ""
      assert mask("aaa", ["", "a"]) == "***"

      def brute(text, words):
          out, i = list(text), 0
          while i < len(text):
              hits = [w for w in words if w and text.startswith(w, i)]
              if hits:
                  L = max(map(len, hits))
                  out[i:i + L] = "*" * L
                  i += L
              else:
                  i += 1
          return "".join(out)

      rng = random.Random(0)
      for _ in range(500):
          words = ["".join(rng.choice("abc") for _ in range(rng.randint(1, 4))) for _ in range(rng.randint(0, 5))]
          text = "".join(rng.choice("abcd") for _ in range(rng.randint(0, 20)))
          assert mask(text, words) == brute(text, words), (text, words)
    explanation: |
      - 第 1 空 `node[text[j]]`：沿着当前字符走到 Trie 的下一层；
      - 第 2 空 `j`：此时 `text[i:j]` 正好是一个完整的敏感词。不能立刻停下，要继续往下走，看有没有更长的词，所以先记下终点；
      - 第 3 空 `end`：替换后从最长匹配的末尾继续扫描。

      **为什么要记「最近一次的词尾」**：沿 Trie 走得最远的地方不一定是词尾。例如词表 `["bc", "abcde"]`、文本 `"abcd"`：从位置 0 能一直走到 `d`，但 `abcd` 不是完整的词，`end` 仍为 -1，于是前进一格，再从位置 1 匹配到 `bc`。

      **复杂度**：每个起点最多向后走「最长敏感词长度」$L$ 步，总时间 $O(nL)$。词表很大、文本很长时，可以用 Aho-Corasick 自动机，在 Trie 上加失配指针，一次扫描找出所有匹配，复杂度约为 $O(n+\text{匹配数})$。

      **工程上**：真实的内容安全系统还要处理全半角、大小写、插入干扰符号（如「越 狱」「越*狱」）等变形，通常先做文本归一化再匹配；同一套 Trie 也用于最长匹配分词和约束解码中「哪些 token 仍然合法」的判断。

  - id: CS-ALGO-039
    type: coding
    difficulty: 3
    frequency: 2
    points: [字符串算法, Agent工程化编程]
    tags: [停止串, 流式输出, 手撕]
    question: |
      实现推理服务的 `stop` 参数：模型输出以文本片段（chunk）的形式陆续到达，一旦出现任一停止串，就截断输出并结束。停止串可能被拆在两个片段之间，所以不能逐片段简单查找；同时又要尽量早地把安全的文本推给用户。

      ```python
      class StopDetector:
          def __init__(self, stops: list[str]): ...
          def feed(self, chunk: str) -> tuple[str, bool]: ...   # 返回（本次可以输出的文本, 是否已停止）
          def flush(self) -> str: ...                           # 流正常结束时调用，返回剩余文本
      ```

      - **截断位置**：设到目前为止收到的全部文本为 T。从左到右逐字符看，在第一个「某个停止串恰好在此结束」的位置停止；若同时有多个停止串在这里结束，取开始位置最早的那个；最终输出为 T 中该停止串开始之前的部分；
      - **尽早输出**：每次 `feed` 后若未停止，已输出的文本必须恰好是 T 去掉「最长的、是某个停止串真前缀的后缀」之后的部分，即只扣住可能成为停止串开头的那一截；
      - 停止之后再调用 `feed` 返回 `("", True)`，`flush` 返回空串；停止串列表中有空串时抛出 `ValueError`；停止串列表可以为空。

      示例：停止串为 `["\nObservation:"]`，依次收到 `"Thought: 先查天气\nObs"` 和 `"ervation: 晴"`，两次 `feed` 分别返回 `("Thought: 先查天气", False)` 和 `("", True)`。
    answer: |
      class StopDetector:
          def __init__(self, stops: list[str]):
              if any(not s for s in stops):
                  raise ValueError("停止串不能为空")
              self.stops = list(stops)
              self.buf = ""                            # 还没有输出的文本
              self.stopped = False

          def feed(self, chunk: str) -> tuple[str, bool]:
              if self.stopped:
                  return "", True
              self.buf += chunk
              best = None                              # (结束位置, 开始位置)：结束最早者优先
              for s in self.stops:
                  i = self.buf.find(s)
                  if i != -1 and (best is None or (i + len(s), i) < best):
                      best = (i + len(s), i)
              if best is not None:
                  out, self.buf, self.stopped = self.buf[:best[1]], "", True
                  return out, True
              keep = 0                                 # 末尾可能是某个停止串开头的最长部分，先扣住
              for s in self.stops:
                  for k in range(min(len(s) - 1, len(self.buf)), keep, -1):
                      if self.buf.endswith(s[:k]):
                          keep = k
                          break
              cut = len(self.buf) - keep
              out, self.buf = self.buf[:cut], self.buf[cut:]
              return out, False

          def flush(self) -> str:
              if self.stopped:
                  return ""
              out, self.buf = self.buf, ""
              return out
    test: |
      import random

      d = StopDetector(["\nObservation:"])
      assert d.feed("Thought: 先查天气\nObs") == ("Thought: 先查天气", False)
      assert d.feed("ervation: 晴") == ("", True)
      assert d.feed("更多文本") == ("", True) and d.flush() == ""

      d = StopDetector(["</answer>"])
      assert d.feed("答案 </ans") == ("答案 ", False)
      assert d.feed("wer 是 3") == ("</answer 是 3", False)          # 虚惊一场，原样放出
      assert d.flush() == ""

      d = StopDetector(["abcd", "c"])
      assert d.feed("xabcd") == ("xab", True)        # "c" 先完整出现
      d = StopDetector(["ab", "b"])
      assert d.feed("zab") == ("z", True)            # 同时结束时取开始更早的
      d = StopDetector([])
      assert d.feed("abc") == ("abc", False) and d.flush() == ""
      try:
          StopDetector(["ok", ""])
          raise AssertionError("空停止串应报错")
      except ValueError:
          pass

      def oracle(text, stops):                       # 逐字符扫描：第一个完整出现的停止串处截断
          for e in range(1, len(text) + 1):
              starts = [e - len(s) for s in stops if e >= len(s) and text[e - len(s):e] == s]
              if starts:
                  return text[:min(starts)], True
          return text, False

      def longest_hold(text, stops):
          return max([k for s in stops for k in range(1, len(s)) if k <= len(text) and text.endswith(s[:k])] or [0])

      rng = random.Random(0)
      for _ in range(2000):                          # 随机文本、随机切片，与逐字符扫描的结果对拍
          stops = ["".join(rng.choice("ab") for _ in range(rng.randint(1, 4))) for _ in range(rng.randint(0, 3))]
          text = "".join(rng.choice("abc") for _ in range(rng.randint(0, 15)))
          d, emitted, fed, stopped, i = StopDetector(stops), "", "", False, 0
          while i < len(text):
              step = rng.randint(1, 4)
              chunk = text[i:i + step]
              i += step
              out, stopped = d.feed(chunk)
              emitted += out
              fed += chunk
              if stopped:
                  break
              assert emitted == fed[:len(fed) - longest_hold(fed, stops)]
          if not stopped:
              emitted += d.flush()
          assert (emitted, stopped) == oracle(text, stops), (text, stops)
    explanation: |
      **思路**：维护一个「尚未输出」的缓冲区 `buf`，每收到一个片段：
      1. 在 `buf` 中查找每个停止串的第一次出现，取结束位置最早的（结束位置相同取开始更早的）。找到就输出它之前的文本，并进入停止状态；
      2. 没找到时，`buf` 的末尾仍可能是某个停止串的开头（比如收到了 `"\nObs"`），这部分要先扣住；扣住的长度取「是某个停止串真前缀的最长后缀」，其余部分立即输出。

      **为什么只需在 `buf` 里找**：任何还没出现完整的停止串，它已经到达的部分一定是 T 的后缀、并且是该停止串的真前缀，所以一定在被扣住的那一截里，不会出现在已输出的文本中。同理可证扣住的长度每次最多增加一个片段的长度。

      **复杂度**：每次 `feed` 的查找与 `buf` 长度成正比，而 `buf` 不会超过「最长停止串长度 + 片段长度」；求扣住长度对每个停止串最多比较 $L^2$ 个字符（$L$ 为停止串长度），停止串通常很短，开销可以忽略。停止串很多时可以用 Aho-Corasick 自动机，扣住的长度就是自动机当前状态的深度。

      **易错点**：只在每个新片段里查找，漏掉跨片段的停止串；为了保险把整个停止串长度的文本都扣住，导致输出不必要地延迟；停止后没有丢弃后续片段。

      **Agent 场景**：ReAct 风格的提示词常把 `"\nObservation:"` 设为停止串，防止模型自己编造工具的返回结果；流式输出时，被扣住的几个字符就是用户看到的「最后一点延迟」。

  - id: CS-ALGO-040
    type: fill
    difficulty: 2
    frequency: 2
    points: [字符串算法]
    tags: [KMP, 前缀函数]
    question: |
      KMP 算法中，模式串 p 的前缀函数 $\pi[i]$ 定义为子串 `p[0..i]` 的「相等的真前缀与真后缀」的最大长度。对模式串 `aabaaab`，前缀函数为 ____（写成列表）；在文本中已经匹配了 `aabaa` 这 5 个字符、下一个字符失配时，文本指针不动，模式串从下标 ____ 继续比较；该模式串在文本 `aabaaabaaab` 中出现的起始下标为 ____。
    answer: [['[0, 1, 0, 1, 2, 2, 3]', '[0,1,0,1,2,2,3]', '0 1 0 1 2 2 3'], '2', ['0, 4', '0 和 4', '0,4', '[0, 4]', '0 4']]
    explanation: |
      **逐位计算**（$k$ 为上一位的 $\pi$ 值，失配时沿 $k=\pi[k-1]$ 回退）：
      - $\pi[0]=0$；
      - i = 1（a）：与 p[0] = a 相等，$\pi=1$；
      - i = 2（b）：p[1] = a ≠ b，回退到 $k=\pi[0]=0$，p[0] = a ≠ b，$\pi=0$；
      - i = 3（a）：p[0] = a，$\pi=1$；
      - i = 4（a）：p[1] = a，$\pi=2$；
      - i = 5（a）：p[2] = b ≠ a，回退到 $k=\pi[1]=1$，p[1] = a 相等，$\pi=2$；
      - i = 6（b）：p[2] = b，$\pi=3$。

      **失配时**：已匹配的 `aabaa` 的最长相等前后缀是 `aa`（$\pi[4]=2$），说明文本中刚匹配过的最后两个字符正好是 `aa`，可以直接从 p[2] 继续比较，文本指针不用回退。这是 KMP 能做到 $O(n+m)$ 的原因。

      **重叠出现**：在 `aabaaabaaab` 中，下标 0 处完整匹配后，模式串跳到 $\pi[6]=3$（已匹配的末尾 `aab` 正是开头的 `aab`）继续，于是在下标 4 处又匹配一次，两次出现共享了中间的 `aab`。

      注意：不少教材使用 next 数组，它与前缀函数相差一位或整体减 1，做题前要先确认定义。

  - id: CS-ALGO-041
    type: multiple
    difficulty: 2
    frequency: 1
    points: [字符串算法]
    tags: [KMP, Rabin-Karp, Aho-Corasick, Trie]
    question: |
      关于字符串匹配算法，下列说法**正确**的有：
    options:
      A: 'Aho-Corasick 自动机一次扫描即可同时查找多个模式串，适合敏感词过滤'
      B: 'KMP 的前缀函数（失配表）同时取决于模式串和文本，每换一段文本都要重新计算'
      C: 'Rabin-Karp 用滚动哈希 O(1) 更新窗口哈希值，哈希相等时仍需逐字符核对，最坏 O(nm)'
      D: 'KMP 匹配时文本指针从不回退，在长为 n 的文本中查找长为 m 的模式串共需 O(n + m)'
      E: 'Trie 前缀树上的一次查询，时间与词典中单词的数量成正比，词典越大查询越慢'
    answer: [A, C, D]
    explanation: |
      **结论**：A、C、D 正确。

      - A 对：Aho-Corasick 在 Trie 上增加失配指针，相当于把 KMP 推广到多模式串，一次扫描即可报告所有命中，总时间约为 O(n + 模式串总长 + 匹配次数)。
      - B 错：前缀函数只与模式串有关，预处理一次即可用于任意文本。
      - C 对：窗口滑动一位时，减去移出字符的贡献、乘以底数、再加上移入字符，O(1) 更新。哈希可能冲突，相等时要逐字符核对；冲突很多（或真实匹配很多）时退化为 O(nm)，平均情况为 O(n + m)。它的优势是方便扩展到多模式串和二维匹配。
      - D 对：失配时模式串按前缀函数回退，文本指针只前进不后退，匹配阶段 O(n)，预处理前缀函数 O(m)。
      - E 错：Trie 查询沿着查询串逐字符往下走，时间与查询串的长度成正比，与词典大小无关，这正是它适合前缀补全和分词的原因。

      Agent 场景下，这些算法分别对应：流式输出中的停止串检测（单模式或少量模式）、敏感词与提示注入关键词过滤（多模式）、约束解码中的合法前缀判断（Trie）。
  - id: CS-ALGO-042
    type: code_output
    difficulty: 1
    frequency: 2
    points: [排序算法]
    tags: [稳定排序, 多关键字排序]
    question: |
      下面的代码对检索结果做两次排序，再用一次元组键排序。输出是什么？（Python 的 `sorted` 是稳定排序。）
    code: |
      docs = [
          ("d1", 0.80, "2024-03"),
          ("d2", 0.95, "2024-01"),
          ("d3", 0.80, "2023-12"),
          ("d4", 0.95, "2024-05"),
          ("d5", 0.80, "2024-03"),
      ]
      by_time = sorted(docs, key=lambda d: d[2], reverse=True)      # 第一次：按时间从新到旧
      ranked = sorted(by_time, key=lambda d: d[1], reverse=True)    # 第二次：按分数从高到低
      print([d[0] for d in ranked])
      once = sorted(docs, key=lambda d: (-d[1], d[2]))
      print([d[0] for d in once])
    answer: |
      ['d4', 'd2', 'd1', 'd5', 'd3']
      ['d2', 'd4', 'd3', 'd1', 'd5']
    explanation: |
      **第一行**：先按时间从新到旧，得到 d4（2024-05）、d1、d5（都是 2024-03，保持原顺序）、d2（2024-01）、d3（2023-12）。再按分数从高到低做**稳定**排序：同分的元素保持上一步的相对顺序，于是 0.95 组是 d4、d2，0.80 组是 d1、d5、d3。效果等价于「分数降序，同分按时间降序」。

      `reverse=True` 不会破坏稳定性：Python 文档明确说明，反向排序时键相等的元素仍保持原来的顺序，并不是先正序排好再整体翻转。

      **第二行**：元组键 `(-分数, 时间)` 表示分数降序、同分按时间**升序**：0.95 组为 d2（2024-01）、d4（2024-05），0.80 组为 d3（2023-12），然后 d1、d5 时间相同，保持原顺序。

      **要点**：多关键字排序有两种写法：一次排序用元组键；或者利用稳定性，**先按次要键、后按主要键**分多次排序。后者在各个键的升降方向不同、又不方便取负（例如字符串降序）时很有用。快速排序、堆排序这类不稳定的算法不能这样用。
    source: 'Python 文档：Sorting Techniques，https://docs.python.org/3/howto/sorting.html'

  - id: CS-ALGO-043
    type: judge
    difficulty: 2
    frequency: 2
    points: [排序算法, 堆与TopK]
    tags: [外部排序, 多路归并]
    question: |
      机器内存只有 1 GB，要把 100 GB 的日志按时间排序。可以先把数据分成约 100 个能放进内存的块，每块读入内存排好序后写回磁盘；再为每个有序块分配一小段读缓冲，用一个大小约为块数的最小堆做多路归并。这样整个过程大约只需把全部数据读、写各两遍。
    answer: true
    explanation: |
      **正确**。这是经典的外部归并排序：
      1. **生成有序段**：每次读入不到 1 GB 的数据，在内存中排序后写回，得到约 100 个有序段。第一遍：读 100 GB、写 100 GB；
      2. **多路归并**：给每个有序段分配约几 MB 的读缓冲，把各段的当前最小元素放进大小约为 100 的最小堆；每次弹出堆顶写入输出缓冲，再从该元素所在的段补充下一个元素。第二遍：读 100 GB、写 100 GB。每个元素出入堆一次，比较开销为 $O(n\log k)$，$k$ 为段数。

      瓶颈通常是磁盘 IO 而不是比较次数，所以要尽量减少遍数：段数超过一次能归并的路数（受缓冲区大小限制）时，就需要多轮归并，多读写几遍。

      同样的「堆 + 多路归并」模式还用于合并多个有序的检索结果列表、MapReduce 中 Reduce 端合并多个已排序的 Map 输出，以及 LSM 树存储引擎的 compaction。

  - id: CS-ALGO-044
    type: multiple
    difficulty: 1
    frequency: 2
    points: [排序算法]
    tags: [稳定性, 复杂度下界]
    question: |
      关于排序算法，下列说法**正确**的有：
    options:
      A: '比较排序最坏至少需要 Ω(n log n) 次比较；计数排序能做到 O(n + k)，因为它不靠比较决定顺序'
      B: '堆排序是稳定排序：建堆和调整时只交换父子节点，相等元素之间不会发生交换'
      C: '快速排序平均 O(n log n)、最坏 O(n²)；改为随机选取枢轴后，最坏时间复杂度也降为 O(n log n)'
      D: '插入排序即使在近乎有序的输入上也需要 O(n²) 次比较，所以 Timsort 等工程实现都弃用了它'
      E: '归并排序是稳定的，最坏时间复杂度为 O(n log n)，但通常需要 O(n) 的额外空间'
    answer: [A, E]
    explanation: |
      **结论**：A、E 正确。

      - A 对：比较排序可以看成一棵判定树，叶子要覆盖 $n!$ 种排列，树高至少 $\log_2 n!=\Theta(n\log n)$。计数排序直接用键值作下标，适用于取值范围 $k$ 不大的整数，例如按 token id 统计排序。
      - B 错：堆排序会把堆顶与末尾元素交换，跨越很远的距离，相等元素的相对顺序会被打乱，不稳定。
      - C 错：随机化只是让「每次都选到最差枢轴」的概率变得极小，对任何输入的**期望**复杂度都是 O(n log n)，但运气极差时仍是 O(n²)，最坏情况的上界没有改变。要保证最坏 O(n log n)，可以用「中位数的中位数」选枢轴，或像 introsort 那样在递归过深时改用堆排序。大量重复元素时还应使用三路划分，否则也会退化。
      - D 错：插入排序在近乎有序的数据上接近 O(n)，常数也很小。CPython 的排序（Timsort）对较短的片段使用二分插入排序，常见的 `std::sort` 实现（introsort）在区间很小时也会切换到插入排序。
      - E 对：合并时遇到相等元素先取左半边的，就能保持稳定；数组上的归并需要辅助数组。
  - id: CS-ALGO-045
    type: coding
    difficulty: 2
    frequency: 2
    points: [随机采样算法, 二分查找]
    tags: [加权采样, 前缀和, 手撕]
    question: |
      预训练数据按配比混合，例如网页、代码、书籍、论文的权重为 0.6、0.2、0.1、0.1。实现按权重随机选取数据源的采样器：

      ```python
      class WeightedSampler:
          def __init__(self, weights: list[float]): ...
          def sample(self, rng) -> int: ...
      ```

      - 权重非负、至少有一个为正，否则抛出 `ValueError`（空列表也算非法）；
      - 预处理 O(n)，每次采样 O(log n)；
      - 采样规则：设 `prefix` 为权重的前缀和、`total` 为总和，每次调用恰好一次 `rng.random()` 得到 u，返回满足 `u * total < prefix[i]` 的最小下标 i。这样下标 i 被选中的概率为 `weights[i] / total`，权重为 0 的下标永远不会被选中。
    answer: |
      import bisect
      import itertools


      class WeightedSampler:
          def __init__(self, weights):
              if not weights or any(w < 0 for w in weights) or sum(weights) <= 0:
                  raise ValueError("权重必须非负，且至少有一个为正")
              self.prefix = list(itertools.accumulate(weights))   # 前缀和，单调不减
              self.total = self.prefix[-1]

          def sample(self, rng):
              x = rng.random() * self.total                       # x 落在 [0, total) 上
              return bisect.bisect_right(self.prefix, x)          # 第一个满足 x < prefix[i] 的 i
    test: |
      import random
      from collections import Counter

      class FakeRng:
          def __init__(self, us):
              self.us = iter(us)

          def random(self):
              return next(self.us)

      s = WeightedSampler([2, 0, 1, 1])                 # 前缀和 [2, 2, 3, 4]
      us = [0.0, 0.49, 0.5, 0.74, 0.75, 0.999]
      assert [s.sample(FakeRng([u])) for u in us] == [0, 0, 2, 2, 3, 3]

      mix = WeightedSampler([0.6, 0.2, 0.1, 0.1])
      rng = random.Random(0)
      cnt = Counter(mix.sample(rng) for _ in range(40000))
      for i, p in enumerate([0.6, 0.2, 0.1, 0.1]):
          assert abs(cnt[i] / 40000 - p) < 0.01
      z = WeightedSampler([0, 0, 5, 0])
      assert {z.sample(rng) for _ in range(1000)} == {2}
      for bad in ([], [0, 0], [1, -1, 2]):
          try:
              WeightedSampler(bad)
              raise AssertionError("应抛出 ValueError")
          except ValueError:
              pass
      big = WeightedSampler([rng.random() for _ in range(100000)])
      assert all(0 <= big.sample(rng) < 100000 for _ in range(100000))
    explanation: |
      **思路**：把每个下标看成数轴上一段长度为 $w_i$ 的区间，首尾相接铺满 $[0,\text{total})$；在这条线段上均匀撒一个点，落在哪一段就选哪个下标，概率恰好与段长成正比。前缀和给出各段的右端点，二分查找「第一个右端点大于该点」的段即可。

      **边界**：要用 `bisect_right`（找第一个**大于** x 的前缀和），每个下标对应左闭右开区间 $[\text{prefix}[i-1],\ \text{prefix}[i])$。权重为 0 的段长度为 0，它的前缀和与前一段相同，`bisect_right` 会越过它，所以永远不会被选中。若改用 `bisect_left`，区间变成左开右闭：x 恰好等于某个前缀和时结果与规定不符（上例中 u = 0.5 会返回 0 而不是 2）；更糟的是，权重为 0 的首个下标会在 u = 0 时被选中（例如权重 `[0, 1]`）。

      **复杂度**：预处理 O(n)，每次采样 O(log n)。需要海量采样时可以用别名法（alias method），预处理 O(n) 后每次 O(1)；权重会动态变化时可以用树状数组维护前缀和，更新与采样都是 O(log n)。

      **相关场景**：加权轮询负载均衡、按配比混合训练数据、按优先级回放经验等，都会用到这个模板。

  - id: CS-ALGO-046
    type: code_debug
    difficulty: 2
    frequency: 2
    points: [随机采样算法]
    tags: [Fisher-Yates, 洗牌]
    question: |
      下面的洗牌函数被用来打乱评测题目中选项的顺序，以消除位置偏差。统计发现某些排列出现得比其他排列更频繁。请指出 bug 并修正。（`randrange(k)` 返回 [0, k) 内均匀分布的随机整数。）
    code: |
      def shuffle(a, randrange):
          """原地打乱列表 a"""
          n = len(a)
          for i in range(n):
              j = randrange(n)
              a[i], a[j] = a[j], a[i]
    fixed_code: |
      def shuffle(a, randrange):
          """原地打乱列表 a"""
          n = len(a)
          for i in range(n - 1, 0, -1):
              j = randrange(i + 1)                 # 只在 [0, i] 中选
              a[i], a[j] = a[j], a[i]
    test: |
      from collections import Counter
      from fractions import Fraction
      from math import factorial

      def distribution(n):
          """枚举 randrange 所有可能的返回序列（按概率加权），统计每种排列出现的精确概率"""
          dist, choices = Counter(), []            # choices：本次运行中各次调用的 [取值, 上界]
          while True:
              pos = [0]

              def randrange(k):
                  i = pos[0]
                  if i == len(choices):
                      choices.append([0, k])
                  pos[0] += 1
                  return choices[i][0]

              a = list(range(n))
              shuffle(a, randrange)
              p = Fraction(1)
              for _, k in choices:
                  p /= k
              dist[tuple(a)] += p
              while choices and choices[-1][0] + 1 == choices[-1][1]:   # 像里程表一样进位
                  choices.pop()
              if not choices:
                  return dist
              choices[-1][0] += 1

      for n in range(1, 6):
          dist = distribution(n)
          assert len(dist) == factorial(n), n
          assert all(p == Fraction(1, factorial(n)) for p in dist.values()), n
    answer: |
      **问题**：第 5 行每一步都在整个 `[0, n)` 中选交换对象。$n$ 步共有 $n^n$ 种等可能的随机序列，而排列有 $n!$ 种。$n\ge3$ 时 $n!$ 不能整除 $n^n$（如 $3^3=27$ 不是 6 的倍数），所以各排列不可能等概率。$n=3$ 时，各排列的概率是 4/27 或 5/27，而不是 1/6。

      **修正**：Fisher-Yates 洗牌，第 $i$ 步只在尚未确定的位置 `[0, i]` 中选：

      ```python
      for i in range(n - 1, 0, -1):
          j = randrange(i + 1)
          a[i], a[j] = a[j], a[i]
      ```
    explanation: |
      **为什么 Fisher-Yates 是均匀的**：从后往前，第一步从 $n$ 个元素中等概率选一个放在最后一位，第二步从剩下的 $n-1$ 个中选一个放在倒数第二位……随机选择的序列共有 $n\cdot(n-1)\cdots2=n!$ 种，与排列一一对应，所以每种排列的概率恰为 $1/n!$。时间 O(n)，原地完成。

      测试没有用统计检验，而是把 `randrange` 的所有返回序列都枚举一遍，精确计算每种排列的概率：修正后的版本对 $n\le5$ 都恰好均匀，原版本在 $n=3$ 时就不均匀。

      **工程提示**：Python 的 `random.shuffle` 就是 Fisher-Yates 实现。打乱训练数据、few-shot 示例或选项顺序时，直接用标准库并固定种子即可复现。Python 文档还提醒：序列很长时，排列总数会超过伪随机数生成器的周期，绝大多数排列根本不可能生成，但这一般不影响统计用途。

  - id: CS-ALGO-047
    type: multiple
    difficulty: 3
    frequency: 1
    points: [随机采样算法]
    tags: [Gumbel-Max, 加权蓄水池, 蓄水池抽样]
    question: |
      关于随机采样技巧，下列说法**正确**的有：
    options:
      A: '对加噪后的 logits 取前 k 大（Gumbel-Top-k），等价于按 softmax 概率依次做 k 次**不放回**抽样'
      B: 'Gumbel-Max：给每个 logit 加上独立的标准 Gumbel 噪声后取 argmax，得到的下标恰好服从 softmax(logits)'
      C: 'Gumbel-Max 也适用于温度采样：把 logits 除以 T 后再加 Gumbel 噪声取 argmax，结果服从 softmax(logits / T)'
      D: 'Efraimidis–Spirakis：取 $u_i\sim U(0,1)$，以 $u_i^{1/w_i}$ 为键保留最大的 k 个，一次扫描即可完成加权不放回抽样'
      E: '标准蓄水池抽样（k = 1）中，第 i 个元素到来时以固定的 1/2 概率替换池中元素，最终每个元素被选中的概率相同，都是 1/n'
    answer: [A, B, C, D]
    explanation: |
      **结论**：A、B、C、D 正确。

      - A 对：Kool 等（2019）证明了 Gumbel-Top-k 等价于不放回的依次抽样，并据此提出了随机束搜索（Stochastic Beam Search）。
      - B 对：标准 Gumbel 噪声可写成 $g_i=-\log(-\log U_i)$（$U_i$ 在 (0,1) 上均匀分布）。可以证明 $P(\arg\max_i(x_i+g_i)=j)=e^{x_j}/\sum_ie^{x_i}$。好处是把「采样」变成「加噪声后取最大」，便于并行，也是 Gumbel-Softmax 等可微松弛的基础。
      - C 对：Gumbel-Max 对任意一组 logits 都成立，把 logits 换成 logits / T 即得 softmax(logits / T) 分布。顺序不能颠倒：温度要在加噪之前作用于 logits；若先加噪再除以 T，argmax 不受 T 影响；若先取 argmax 再除以 T，就只是确定性的贪心解码。
      - D 对：这是 A-Res 算法：维护一个大小为 k 的小顶堆保存键最大的元素，一次扫描完成，内存只需 O(k)，适合数据流。对键取对数得 $\log u_i/w_i$，与 Gumbel-Top-k 本质上是同一件事。
      - E 错：第 $i$ 个元素应以 $1/i$ 的概率替换。这样它最终留下的概率为 $\frac1i\cdot\frac{i}{i+1}\cdots\frac{n-1}{n}=\frac1n$。固定 1/2 会让越靠后的元素越容易被选中，最后一个元素有 1/2 的概率。
    source: 'Kool, van Hoof & Welling, Stochastic Beams and Where to Find Them: The Gumbel-Top-k Trick for Sampling Sequences Without Replacement, arXiv:1903.06059；Efraimidis & Spirakis, Weighted random sampling with a reservoir (Information Processing Letters, 2006)'

  - id: CS-ALGO-048
    type: coding
    difficulty: 2
    frequency: 3
    points: [LRU缓存, 链表, 哈希表]
    tags: [LRU, 双向链表, 手撕]
    question: |
      Embedding 和工具结果缓存通常按占用的字节数限制容量，而不是按条目数。实现按大小计容量的 LRU 缓存（**不得**使用 `OrderedDict`，用哈希表 + 双向链表）：

      ```python
      class SizedLRU:
          def __init__(self, capacity: int): ...
          def get(self, key): ...                       # 命中返回值，并标记为最近使用；未命中返回 None
          def put(self, key, value, size: int) -> None: ...
          def keys(self) -> list: ...                   # 按「最久未使用 → 最近使用」的顺序返回所有 key
      ```

      - 用属性 `total` 表示当前所有条目的大小之和，任何时候都不超过 `capacity`；
      - `put`：写入或更新条目并标记为最近使用；超出容量时从最久未使用的一端依次淘汰（不会淘汰刚写入的条目）；
      - 单个条目的 `size` 大于 `capacity` 时不缓存它；若该 key 原本在缓存中，旧条目也一并删除，避免之后读到过期的旧值；
      - `capacity <= 0` 或 `size < 0` 时抛出 `ValueError`；`get` 为 O(1)，`put` 除淘汰外为 O(1)。
    answer: |
      class _Node:
          __slots__ = ("key", "val", "size", "prev", "next")

          def __init__(self, key=None, val=None, size=0):
              self.key, self.val, self.size = key, val, size
              self.prev = self.next = None


      class SizedLRU:
          def __init__(self, capacity: int):
              if capacity <= 0:
                  raise ValueError("capacity 必须为正")
              self.capacity, self.total, self.map = capacity, 0, {}
              self.head, self.tail = _Node(), _Node()      # 哨兵：head 之后最旧，tail 之前最新
              self.head.next, self.tail.prev = self.tail, self.head

          def _unlink(self, node):
              node.prev.next, node.next.prev = node.next, node.prev

          def _append(self, node):                         # 挂到最新的一端
              node.prev, node.next = self.tail.prev, self.tail
              self.tail.prev.next = node
              self.tail.prev = node

          def _remove(self, node):
              self._unlink(node)
              del self.map[node.key]                       # 节点里存 key，淘汰时才能删哈希表项
              self.total -= node.size

          def get(self, key):
              node = self.map.get(key)
              if node is None:
                  return None
              self._unlink(node)
              self._append(node)
              return node.val

          def put(self, key, value, size: int) -> None:
              if size < 0:
                  raise ValueError("size 不能为负")
              if key in self.map:
                  self._remove(self.map[key])              # 先删旧条目，再按新大小放入
              if size > self.capacity:
                  return                                   # 单条就超过容量：不缓存
              node = _Node(key, value, size)
              self.map[key] = node
              self._append(node)
              self.total += size
              while self.total > self.capacity:            # 从最旧的一端淘汰
                  self._remove(self.head.next)

          def keys(self) -> list:
              out, node = [], self.head.next
              while node is not self.tail:
                  out.append(node.key)
                  node = node.next
              return out
    test: |
      import random

      c = SizedLRU(100)
      c.put("emb:a", "va", 40)
      c.put("emb:b", "vb", 40)
      assert c.get("emb:a") == "va"                    # a 变成最近使用
      c.put("emb:c", "vc", 30)                         # 110 > 100：淘汰最久未使用的 b
      assert c.keys() == ["emb:a", "emb:c"] and c.total == 70 and c.get("emb:b") is None
      c.put("emb:a", "va2", 90)                        # 更新 a 并变大：淘汰 c
      assert c.keys() == ["emb:a"] and c.total == 90 and c.get("emb:a") == "va2"
      c.put("emb:a", "huge", 101)                      # 单条超过容量：不缓存，旧值也删除
      assert c.get("emb:a") is None and c.keys() == [] and c.total == 0
      c.put("z", 0, 0)
      assert c.keys() == ["z"]
      for bad in (lambda: SizedLRU(0), lambda: c.put("x", 1, -1)):
          try:
              bad()
              raise AssertionError("应抛出 ValueError")
          except ValueError:
              pass

      rng = random.Random(0)
      for _ in range(200):                             # 与「用列表维护顺序」的朴素实现对拍
          cap = rng.randint(1, 30)
          c, ref = SizedLRU(cap), []                   # ref：[(key, val, size)]，从旧到新
          for _ in range(200):
              k = rng.randrange(8)
              if rng.random() < 0.5:
                  hit = [e for e in ref if e[0] == k]
                  if hit:
                      ref.remove(hit[0])
                      ref.append(hit[0])
                  assert c.get(k) == (hit[0][1] if hit else None)
              else:
                  v, s = rng.randrange(100), rng.randint(0, 12)
                  ref = [e for e in ref if e[0] != k]
                  if s <= cap:
                      ref.append((k, v, s))
                      while sum(e[2] for e in ref) > cap:
                          ref.pop(0)
                  c.put(k, v, s)
              assert c.keys() == [e[0] for e in ref] and c.total == sum(e[2] for e in ref)
    explanation: |
      **结构**：哈希表负责 O(1) 地从 key 找到链表节点；双向链表按使用时间排列，`head` 之后最旧、`tail` 之前最新，负责 O(1) 地摘除与插入。两个哨兵节点省去了空链表、头尾节点的边界判断。

      **与按条数计容量的区别**：一次 `put` 可能要淘汰多个旧条目，用 `while` 循环从最旧的一端淘汰，直到总大小不超过容量。每个条目只会被淘汰一次，所以淘汰的总代价摊到每次 `put` 仍是 O(1)。新条目挂在最新的一端，且自身大小不超过容量，所以循环不会把它淘汰掉。

      **易错点**：
      - 节点里不存 key，淘汰时就无法删除对应的哈希表项；
      - 更新已有 key 时忘了先扣除旧的大小，`total` 越算越大；
      - 新值放不下时只是「不写入」，却保留了旧值，之后会读到过期数据；
      - `get` 也会修改链表，多线程使用时读操作同样要加锁。

      Python 中可以先写 `OrderedDict` 版本（它内部就是哈希表 + 双向链表），面试官通常会追问手写链表的版本。

  - id: CS-ALGO-049
    type: coding
    difficulty: 3
    frequency: 2
    points: [LRU缓存]
    tags: [LFU, 手撕]
    question: |
      实现 O(1) 的 LFU（最不经常使用）缓存：

      ```python
      class LFUCache:
          def __init__(self, capacity: int): ...
          def get(self, key): ...            # 命中返回值；未命中返回 None
          def put(self, key, value) -> None: ...
      ```

      - 每个 key 记录使用次数：新写入的 key 次数为 1；`get` 命中或 `put` 更新已有 key 时，次数加 1；
      - 缓存已满又要写入**新** key 时，先淘汰使用次数最少的 key；次数相同时，淘汰其中最久未被使用（`get` 或 `put`）的那个；
      - `capacity` 为 0 时不缓存任何内容，为负数时抛出 `ValueError`；`get`、`put` 的平均时间复杂度为 O(1)；
      - 可以使用 `collections` 中的数据结构。
    answer: |
      from collections import OrderedDict, defaultdict


      class LFUCache:
          def __init__(self, capacity: int):
              if capacity < 0:
                  raise ValueError("capacity 不能为负")
              self.cap = capacity
              self.vals, self.freq = {}, {}                # key -> 值；key -> 使用次数
              self.buckets = defaultdict(OrderedDict)     # 次数 -> 这些 key，最久未使用的在前
              self.min_freq = 0

          def _touch(self, key):                          # 使用次数加 1，挪到新桶的最新端
              f = self.freq[key]
              del self.buckets[f][key]
              if not self.buckets[f]:
                  del self.buckets[f]
                  if self.min_freq == f:
                      self.min_freq = f + 1
              self.freq[key] = f + 1
              self.buckets[f + 1][key] = None

          def get(self, key):
              if key not in self.vals:
                  return None
              self._touch(key)
              return self.vals[key]

          def put(self, key, value) -> None:
              if self.cap == 0:
                  return
              if key in self.vals:
                  self.vals[key] = value
                  self._touch(key)
                  return
              if len(self.vals) == self.cap:              # 淘汰：次数最少的桶里最久未使用的 key
                  old, _ = self.buckets[self.min_freq].popitem(last=False)
                  if not self.buckets[self.min_freq]:
                      del self.buckets[self.min_freq]
                  del self.vals[old], self.freq[old]
              self.vals[key], self.freq[key] = value, 1
              self.buckets[1][key] = None
              self.min_freq = 1                           # 新 key 的次数是 1，一定是最小的
    test: |
      import random

      c = LFUCache(2)
      c.put("a", 1)
      c.put("b", 2)
      assert c.get("a") == 1                          # a 用了 2 次，b 用了 1 次
      c.put("c", 3)                                   # 淘汰次数最少的 b
      assert c.get("b") is None and c.get("c") == 3   # 现在 a、c 各用了 2 次
      c.put("d", 4)                                   # 次数相同，淘汰最久未使用的 a
      assert c.get("a") is None and c.get("c") == 3 and c.get("d") == 4
      c.put("c", 30)                                  # 更新也算一次使用
      assert c.get("c") == 30
      z = LFUCache(0)
      z.put("x", 1)
      assert z.get("x") is None
      try:
          LFUCache(-1)
          raise AssertionError("应抛出 ValueError")
      except ValueError:
          pass

      rng = random.Random(0)
      for _ in range(300):                            # 与朴素实现对拍：淘汰 (次数, 最近使用时刻) 最小者
          cap = rng.randint(1, 5)
          c, ref, tick = LFUCache(cap), {}, 0          # ref: key -> [值, 次数, 最近使用时刻]
          for _ in range(200):
              tick += 1
              k = rng.randrange(8)
              if rng.random() < 0.5:
                  e = ref.get(k)
                  if e:
                      e[1] += 1
                      e[2] = tick
                  assert c.get(k) == (e[0] if e else None)
              else:
                  v = rng.randrange(100)
                  if k in ref:
                      ref[k][0] = v
                      ref[k][1] += 1
                      ref[k][2] = tick
                  else:
                      if len(ref) == cap:
                          victim = min(ref, key=lambda x: (ref[x][1], ref[x][2]))
                          del ref[victim]
                      ref[k] = [v, 1, tick]
                  c.put(k, v)
              assert set(c.vals) == set(ref)
    explanation: |
      **数据结构**：
      - `vals`、`freq` 两个哈希表：key → 值、key → 使用次数；
      - `buckets`：使用次数 → 有序字典，同一次数的 key 按最近使用排列（最久未使用的在前），负责「同次数时淘汰最久未使用的」；
      - `min_freq`：当前最小的使用次数，淘汰时直接定位到对应的桶。

      **关键在于 `min_freq` 的维护**：
      - 某个 key 的次数从 f 变成 f + 1，若 f 桶因此变空且 f 恰好是最小次数，则最小次数变为 f + 1（这个 key 自己就在 f + 1 桶里）；
      - 插入新 key 后，最小次数一定是 1。

      这样不需要扫描就能找到淘汰对象，所有操作都是平均 O(1)。若用堆按 (次数, 时间) 排序，则每次操作是 O(log n)。

      **LFU 的弱点**：历史上很热、现在已经不再访问的 key 次数很高，很难被淘汰（缓存「老化」问题）。实践中常配合次数衰减或窗口统计，例如 Caffeine 使用的 W-TinyLFU，用一个小的 LRU 窗口加上近似频率统计来决定新条目能否进入主缓存。

  - id: CS-ALGO-050
    type: short
    difficulty: 2
    frequency: 3
    points: [LRU缓存]
    tags: [TTL, 并发, 分布式缓存]
    question: |
      你已经写好了一个 LRU 缓存（哈希表 + 双向链表）。面试官要求把它用来缓存 Agent 的工具调用结果，并继续追问：(1) 怎样支持每个条目的过期时间（TTL）？(2) 怎样支持多线程高并发访问？(3) 服务部署成多个进程、多台机器后怎么办？请说明设计思路与取舍。
    answer: |
      **(1) TTL**
      - 节点里增加过期时刻 `expire_at`，用单调时钟（如 `time.monotonic()`）计算，不受系统改时间的影响；
      - 惰性删除：`get` 时发现已过期，就删除并按未命中处理；
      - 只靠惰性删除，过期但再没被访问的条目会一直占着容量，所以还要定期清理：按过期时间建最小堆或时间轮，或者像 Redis 那样定期抽样检查带过期时间的 key；淘汰时优先淘汰已过期的条目；
      - 给 TTL 加随机抖动，避免大量条目在同一时刻集中过期，回源请求被瞬间放大。

      **(2) 高并发**
      - `get` 也要移动链表节点，所以读操作同样必须加锁；GIL 不能保证「查哈希表 + 移动节点」这种复合操作的原子性；
      - 一把全局锁会成为瓶颈：按 `hash(key) % N` 分成 N 个分段，每段一把锁、一个独立的 LRU，结果是近似的全局 LRU；
      - 缩短持锁时间：未命中时不要在锁内调用工具或模型；对同一个 key 合并并发的回源请求（single flight），避免缓存击穿时同时发出大量相同的昂贵调用；
      - 进一步优化：命中时只把访问记录写入缓冲区、批量更新链表（Caffeine 的做法），或改用近似 LRU（如 CLOCK），避免每次命中都改链表。

      **(3) 多进程、多机**
      - 每个进程各自缓存，命中率低、彼此还可能不一致；改为共享缓存（如 Redis），设置 TTL 和淘汰策略（Redis 的 LRU 是基于采样的近似 LRU）；
      - 常见做法是两级缓存：进程内的小 L1（TTL 很短）+ 共享的 L2；数据更新时通过消息通知失效，或者只依赖短 TTL；
      - 多个缓存节点之间用一致性哈希分片，扩缩容时只迁移少量 key；
      - 缓存键要包含工具名、规范化后的参数和工具版本；有副作用的工具（下单、发邮件）绝不能缓存；结果与用户权限相关时，键里要带上用户或租户，防止越权读到别人的数据。
    rubric:
      - '讲清 TTL 的实现：过期时间戳、惰性删除，并补充定期清理或优先淘汰过期条目（3 分）'
      - '指出 get 也要加锁，并给出分段锁、缩短持锁时间、合并并发回源等至少两项并发优化（4 分）'
      - '给出多进程或多机的方案（共享缓存、两级缓存、一致性哈希、失效通知等）（2 分）'
      - '提到缓存键设计、副作用工具不能缓存或权限隔离等工程细节（1 分）'
    explanation: |
      **常见失分点**：认为「读操作不改数据，不用加锁」，忽略了 LRU 的 `get` 会移动链表节点；用系统时间而不是单调时钟计算过期；只做惰性删除，让过期条目长期占用容量；没有考虑缓存击穿时大量相同请求同时回源；把有副作用、或依赖用户权限的工具结果也放进共享缓存。回答时最好先说单机、再说并发、最后说分布式，层层递进。

  - id: CS-ALGO-051
    type: single
    difficulty: 2
    frequency: 1
    points: [LRU缓存]
    tags: [缓存污染, W-TinyLFU]
    question: |
      某检索服务用 LRU 缓存热门查询的 Embedding，平时命中率约 80%。每天凌晨有一个离线任务，把全量历史文档（数量远大于缓存容量，每条只访问一次）各查询一遍。之后的一小时里，在线流量的命中率跌到 20% 左右。最合理的解释与对策是：
    options:
      A: 'LRU 每次访问都要在链表里线性查找节点，离线任务把链表撑长后操作退化为 O(n)，大量请求超时未命中；应换成纯哈希表实现'
      B: '离线任务写入的 key 太多，哈希冲突让桶链变长、查找超时而被当作未命中；应把哈希表的初始容量调大几倍'
      C: '一次性扫描把只访问一次的冷数据挤进缓存、淘汰了热点（缓存污染）；可让离线任务绕过缓存，或改用 2Q、W-TinyLFU 等抗扫描策略'
      D: '缓存容量相对全量文档太小，热点被正常淘汰；只有把容量扩大到能放下全部历史文档的 Embedding，命中率才能恢复'
    answer: C
    explanation: |
      **结论**：这是 LRU 的经典弱点：它只看「最近有没有用过」，一次性的顺序扫描会让大量冷数据都变成「最近使用」，把热点全部挤出去。扫描结束后热点要重新回源加载，命中率需要一段时间才能恢复。

      **对策**：
      - 最直接：离线任务不读写在线缓存（或者用单独的缓存）；
      - 换用抗扫描的策略：2Q、LRU-K 要求条目被访问两次才进入主缓存；W-TinyLFU（Caffeine 使用）用近似频率统计做准入判断，新条目只有比将被淘汰的条目更「常用」才能进入；MySQL InnoDB 的缓冲池也把新读入的页先放在 LRU 链表的「旧区」中段，而不是直接放到头部，以抵抗全表扫描的冲击。

      - A 错：LRU 用哈希表加双向链表实现，get、put 都是 O(1)，不需要在链表里查找；问题不在速度，而在淘汰决策。
      - B 错：哈希表会自动扩容，冲突不会让命中率下降；命中率取决于缓存里装的是哪些数据。
      - D 错：扩容成本高，也不是唯一办法；只要不让扫描污染缓存，原来的容量就足以达到 80% 的命中率。

  - id: CS-ALGO-052
    type: coding
    difficulty: 2
    frequency: 2
    points: [Agent工程化编程]
    tags: [JSON Merge Patch, 嵌套 JSON, 手撕]
    question: |
      Agent 平台的配置由「默认配置 + 租户覆盖」合并而成，覆盖部分采用 JSON Merge Patch（RFC 7396）的语义。实现：

      ```python
      def merge_patch(target, patch) -> tuple[object, list[str]]: ...
      ```

      合并规则（target、patch 都是由 dict、list、str、数字、bool、None 组成的 JSON 值）：
      - patch 不是 dict 时，结果就是 patch 本身（数组也整体替换，不逐元素合并）；
      - patch 是 dict 时：若 target 不是 dict，先把 target 当作空 dict；然后对 patch 的每个键值对：值为 None 表示删除 target 中的该键（不存在则忽略），否则对该键递归合并；
      - **类型冲突**：合并过程中，某个位置的原值与补丁值都存在（都不是 None）且恰好一个是 dict 时，按上面的规则处理，同时把该位置的路径记入冲突列表。根路径为 `"$"`，子路径为 `"$.键1.键2"`，按遍历补丁的顺序记录；
      - 返回 `(合并结果, 冲突路径列表)`；不得修改输入，结果也不能与输入共享可变对象。
    answer: |
      import copy


      def merge_patch(target, patch):
          conflicts = []

          def merge(t, p, path):
              if not isinstance(p, dict):                  # 补丁不是对象：整体替换
                  if isinstance(t, dict) and p is not None:
                      conflicts.append(path)
                  return copy.deepcopy(p)
              if not isinstance(t, dict):                  # 补丁是对象、原值不是：原值作废
                  if t is not None:
                      conflicts.append(path)
                  t = {}
              for k, v in p.items():
                  if v is None:
                      t.pop(k, None)                       # None 表示删除该键
                  else:
                      t[k] = merge(t.get(k), v, f"{path}.{k}")
              return t

          return merge(copy.deepcopy(target), patch, "$"), conflicts
    test: |
      import copy
      import json

      cases = [                                        # RFC 7396 附录 A 中的部分用例
          ('{"a":"b"}', '{"a":"c"}', '{"a":"c"}'),
          ('{"a":"b"}', '{"b":"c"}', '{"a":"b","b":"c"}'),
          ('{"a":"b"}', '{"a":null}', '{}'),
          ('{"a":["b"]}', '{"a":"c"}', '{"a":"c"}'),
          ('{"a":{"b":"c"}}', '{"a":{"b":"d","c":null}}', '{"a":{"b":"d"}}'),
          ('{"a":[{"b":"c"}]}', '{"a":[1]}', '{"a":[1]}'),
          ('["a","b"]', '["c","d"]', '["c","d"]'),
          ('{"a":"b"}', '["c"]', '["c"]'),
          ('{"a":"foo"}', 'null', 'null'),
          ('{"e":null}', '{"a":1}', '{"e":null,"a":1}'),
          ('[1,2]', '{"a":"b","c":null}', '{"a":"b"}'),
          ('{}', '{"a":{"bb":{"ccc":null}}}', '{"a":{"bb":{}}}'),
      ]
      for t, p, want in cases:
          assert merge_patch(json.loads(t), json.loads(p))[0] == json.loads(want), (t, p)

      base = {"model": "m1", "tools": {"search": {"top_k": 5, "sites": ["a.com"]}, "code": True},
              "retry": {"max": 3}, "stop": ["\n"]}
      over = {"tools": {"search": {"top_k": 8, "sites": None}, "code": {"timeout": 30}},
              "retry": 2, "stop": {"strings": ["END"]}, "temperature": 0.2}
      snap_b, snap_o = copy.deepcopy(base), copy.deepcopy(over)
      merged, conflicts = merge_patch(base, over)
      assert merged == {"model": "m1", "tools": {"search": {"top_k": 8}, "code": {"timeout": 30}},
                        "retry": 2, "stop": {"strings": ["END"]}, "temperature": 0.2}
      assert conflicts == ["$.tools.code", "$.retry", "$.stop"]
      assert base == snap_b and over == snap_o                 # 输入没有被修改
      merged["stop"]["strings"].append("X")
      merged["model"] = "changed"
      assert over == snap_o and base == snap_b                 # 结果不与输入共享可变对象
      assert merge_patch({"a": [1]}, {"a": [2]}) == ({"a": [2]}, [])      # 数组之间替换，不算冲突
      assert merge_patch({"a": {"x": 1}}, {"a": None}) == ({}, [])        # 删除不算冲突
      assert merge_patch(None, {"a": 1}) == ({"a": 1}, [])
      assert merge_patch(5, {"a": 1}) == ({"a": 1}, ["$"])
    explanation: |
      **思路**：先深拷贝 target，在副本上递归地应用补丁，补丁中的值写入前也深拷贝一份，保证结果与输入互不影响。递归函数按补丁的类型分两种情况：
      1. 补丁不是 dict：直接替换。数组也是整体替换，所以 RFC 7396 无法只修改数组中的某个元素；
      2. 补丁是 dict：原值不是 dict 就丢弃，从空 dict 开始；再逐键处理，None 删除，其他值递归合并。

      **为什么要报告类型冲突**：dict 与非 dict 相遇时，合并语义从「递归合并」悄悄变成了「整体替换」。例如默认配置里 `"retry": {"max": 3}`，租户写成 `"retry": 2`，整个 retry 对象就被一个数字替换了，下游读取 `retry.max` 时会出错。把这些路径记下来报警或审计，比静默覆盖安全得多。

      **局限**：Merge Patch 用 null 表示删除，所以无法把某个字段显式设为 null；也不能对数组做增删改。需要精确操作时用 JSON Patch（RFC 6902），它由 add、remove、replace 等操作序列组成。

      **易错点**：直接修改传入的 target（调用方的默认配置被悄悄改掉）；浅拷贝导致结果和输入共享内层列表；把 None 当作普通值写进结果；对数组做逐元素合并（不符合 RFC 7396）。
    source: 'RFC 7396 JSON Merge Patch, https://www.rfc-editor.org/rfc/rfc7396'

  - id: CS-ALGO-053
    type: coding
    difficulty: 3
    frequency: 2
    points: [Agent工程化编程]
    tags: [上下文截断, 工具调用, 手撕]
    question: |
      多轮 Agent 对话超出上下文窗口时，需要按 token 预算截断历史。实现：

      ```python
      def fit_history(messages: list[dict], budget: int) -> list[dict]: ...
      ```

      - 每条消息形如 `{"role": ..., "tokens": 整数, ...}`，role 为 `system`、`user`、`assistant`、`tool` 之一；system 消息只出现在开头，并且总是保留；
      - 带非空 `tool_calls` 字段的 assistant 消息，与紧随其后的连续 tool 消息组成一个**单元**；其余每条非 system 消息各自是一个单元。单元要么整体保留、要么整体丢弃，否则会出现「有调用无结果」或「有结果无调用」的非法消息序列；
      - 在所有满足以下条件的单元后缀中，选**最长**的一个：以 user 消息开头，并且加上全部 system 消息后 token 总数不超过 `budget`；
      - 返回 system 消息加上选中的后缀（保持原顺序、原 dict 对象），不修改输入；不存在满足条件的后缀时抛出 `ValueError`；时间复杂度 O(n)。
    answer: |
      def fit_history(messages: list[dict], budget: int) -> list[dict]:
          n_sys = 0
          while n_sys < len(messages) and messages[n_sys]["role"] == "system":
              n_sys += 1
          system, rest = messages[:n_sys], messages[n_sys:]
          units, i = [], 0
          while i < len(rest):                         # 切分成不可拆的单元
              j = i + 1
              if rest[i]["role"] == "assistant" and rest[i].get("tool_calls"):
                  while j < len(rest) and rest[j]["role"] == "tool":
                      j += 1                           # 工具调用与它的结果绑在一起
              units.append(rest[i:j])
              i = j
          used = sum(m["tokens"] for m in system)
          start = len(units)
          while start > 0:                             # 从最新的单元往前装，装不下就停
              cost = sum(m["tokens"] for m in units[start - 1])
              if used + cost > budget:
                  break
              used += cost
              start -= 1
          while start < len(units) and units[start][0]["role"] != "user":
              start += 1                               # 保留部分必须以 user 消息开头
          if start == len(units):
              raise ValueError("预算不足以保留任何对话")
          return system + [m for unit in units[start:] for m in unit]
    test: |
      import random

      def sys_(t): return {"role": "system", "tokens": t}
      def user(t): return {"role": "user", "tokens": t}
      def asst(t, calls=None):
          m = {"role": "assistant", "tokens": t}
          if calls:
              m["tool_calls"] = calls
          return m
      def tool(cid, t): return {"role": "tool", "tool_call_id": cid, "tokens": t}

      msgs = [sys_(50),
              user(20), asst(15, ["c1"]), tool("c1", 200), asst(30),
              user(10), asst(15, ["c2", "c3"]), tool("c2", 180), tool("c3", 160), asst(25),
              user(8)]
      snapshot = list(msgs)
      assert fit_history(msgs, 713) == msgs                          # 总共 713，全部放得下
      got = fit_history(msgs, 450)
      assert got == [msgs[0]] + msgs[5:] and all(a is b for a, b in zip(got, [msgs[0]] + msgs[5:]))
      assert fit_history(msgs, 440) == [msgs[0], msgs[10]]           # 第二轮的 user 放不下，这一轮整体丢弃
      for b in (57, 49):
          try:
              fit_history(msgs, b)
              raise AssertionError("预算不足应报错")
          except ValueError:
              pass
      assert msgs == snapshot                                        # 不修改输入
      assert fit_history([user(5)], 5) == [{"role": "user", "tokens": 5}]

      def units_of(rest):
          units, i = [], 0
          while i < len(rest):
              j = i + 1
              if rest[i]["role"] == "assistant" and rest[i].get("tool_calls"):
                  while j < len(rest) and rest[j]["role"] == "tool":
                      j += 1
              units.append(rest[i:j])
              i = j
          return units

      rng = random.Random(0)
      for _ in range(500):                            # 对拍：枚举所有合法后缀，取最长的
          msgs = [sys_(rng.randint(0, 20)) for _ in range(rng.randint(0, 2))]
          n_sys = len(msgs)
          for _ in range(rng.randint(1, 6)):
              msgs.append(user(rng.randint(1, 30)))
              for _ in range(rng.randint(0, 2)):
                  if rng.random() < 0.5:
                      k = rng.randint(1, 2)
                      msgs.append(asst(rng.randint(1, 20), [f"c{x}" for x in range(k)]))
                      msgs += [tool(f"c{x}", rng.randint(1, 50)) for x in range(k)]
                  else:
                      msgs.append(asst(rng.randint(1, 30)))
          budget = rng.randint(0, 300)
          units = units_of(msgs[n_sys:])
          base = sum(m["tokens"] for m in msgs[:n_sys])
          ok = [s for s in range(len(units)) if units[s][0]["role"] == "user"
                and base + sum(m["tokens"] for u in units[s:] for m in u) <= budget]
          try:
              got = fit_history(msgs, budget)
              assert ok and got == msgs[:n_sys] + [m for u in units[min(ok):] for m in u]
          except ValueError:
              assert not ok
    explanation: |
      **思路**：
      1. 分离开头的 system 消息，再把其余消息切成单元：遇到带 `tool_calls` 的 assistant 消息，就把后面紧跟的 tool 消息都并进来；
      2. 从最新的单元往前累加，直到再加一个就超出预算为止，得到「放得下的最长后缀」；
      3. 后缀的开头若不是 user，就继续往后丢单元，直到以 user 开头。

      **为什么这样就是最长的合法后缀**：比第 2 步结果更长的后缀一定放不下；在放得下的后缀中，越靠前开始的越长，所以第一个以 user 开头的单元就是答案。每个单元只被访问常数次，总复杂度 O(n)。

      **为什么不跳过放不下的单元去装更早的消息**：那样会在历史中间挖洞，模型看到的对话不连贯，可能把后一轮的回答和前一轮的问题错配。

      **示例**：预算 440 时，最新的三个单元（第二轮的工具调用 355 + 回答 25 + 最后的 user 8，加上 system 50 共 438）放得下，但再加第二轮的 user（10）就超了。于是第二轮的工具调用和回答因为缺少对应的提问而被整体丢弃，只剩 system 和最后一句。这说明单纯截断的代价很大，实践中常配合摘要：把被丢弃的部分压缩成一段摘要放在 system 之后，或者把很长的工具结果替换成简短的引用。

      **易错点**：只按消息逐条截断，留下孤立的 tool 消息，调用模型 API 时会因消息序列不合法而报错；忘了把 system 的 token 计入预算；修改了调用方传入的列表。

  - id: CS-ALGO-054
    type: design
    difficulty: 3
    frequency: 2
    points: [Agent工程化编程, 拓扑排序]
    tags: [DAG 调度, 工作流引擎]
    question: |
      请设计一个 Agent 工作流的 DAG 执行引擎：规划器（大模型）输出一组带依赖关系的工具调用，由引擎负责执行。要求：
      1. 依赖满足后尽快并发执行，全局并发上限可配置，部分工具还有各自的限流；
      2. 能处理失败：可重试的错误要重试，不可恢复时按策略跳过下游或取消整个计划；
      3. 进程崩溃后能从断点继续，不重复执行已经成功的步骤；
      4. 执行过程中，规划器可以追加新任务；
      5. 便于排查问题。

      请给出核心数据结构、调度算法和关键设计。
    answer: |
      **1. 计划校验（执行前）**
      - 检查每个依赖引用的任务都存在、工具名存在、参数通过 Schema 校验；
      - 用 Kahn 算法或 DFS 三色标记检测环，有环时把具体的环（如 a → b → c → a）反馈给规划器修正；
      - 限制节点数与扇出，防止模型生成规模失控的计划。

      **2. 核心数据结构**
      - 任务表：id → {工具、参数、状态（PENDING / READY / RUNNING / SUCCEEDED / FAILED / SKIPPED / CANCELLED）、尝试次数、结果引用}；
      - 邻接表 `children` 与剩余入度 `indeg`（只统计尚未完成的前置任务）；
      - 就绪队列：优先级堆，键为「剩余关键路径长度」，让长链上的任务先跑，缩短总耗时；
      - 运行集合，以及全局信号量、按工具划分的并发上限或令牌桶。

      **3. 调度循环（事件驱动）**
      - 初始时把入度为 0 的任务放进就绪队列；
      - 循环：在全局并发和该工具的限流都允许时，从就绪队列取任务提交执行（如 asyncio 任务）；然后等待任一任务结束（`asyncio.wait(..., return_when=FIRST_COMPLETED)`）；
      - 成功：先持久化结果，再把每个后继的入度减 1，减到 0 就放进就绪队列；
      - 失败：超时、限流、5xx 等可重试错误按指数退避加抖动重试；参数错误等确定性错误不重试，按策略处理：fail-fast 取消全部运行中的任务，或者沿后继做 BFS 把下游标记为 SKIPPED，也可以把错误交给规划器重新规划；
      - 复杂度：每个任务、每条边处理常数次，加上堆操作，为 $O((V+E)\log V)$。

      **4. 持久化与恢复**
      - 每次状态变化写入事件日志或数据库（任务状态、结果或结果的对象存储地址）；
      - 恢复时根据已成功的任务重建 `indeg`，已成功的直接跳过；崩溃时处于 RUNNING 的任务可能已经执行过，所以有副作用的工具必须带幂等键（工作流 ID + 任务 ID），或在重试前先查询下游的执行状态。

      **5. 动态追加**
      - 新任务加入时，检查依赖是否存在、加入后是否成环；已经成功的依赖不计入入度；
      - 计划带版本号，追加与取消都记录在事件日志里，保证恢复时可以重放。

      **6. 数据传递与超时取消**
      - 下游参数通过引用上游结果（如 `"$t3.output"`）在执行时解析；大结果放对象存储，只传引用，避免撑爆模型上下文；
      - 每个任务有超时，整个计划有总截止时间；取消时向运行中的任务传播取消信号并做清理。

      **7. 可观测性**
      - 一个计划对应一条 trace，每个任务是一个 span，记录排队时长、执行时长、重试次数、token 与成本；
      - 提供 DAG 可视化，标出关键路径与失败节点，便于定位「慢在哪里、错在哪里」。

      **8. 风险**：模型生成不存在的工具或依赖、计划成环、扇出爆炸、热点工具限流导致排队、高危工具（支付、删除）需要插入人工审批节点。
    rubric:
      - '执行前校验依赖与参数，并检测环、把环反馈给规划器（2 分）'
      - '给出入度表、就绪队列（可带优先级）、并发与限流控制的事件驱动调度算法（3 分）'
      - '区分可重试与不可重试错误，并给出跳过下游、取消或重新规划等策略（2 分）'
      - '通过持久化状态与幂等键实现断点续跑且不重复执行副作用（2 分）'
      - '涉及动态追加任务、结果传递或可观测性中的至少一项（1 分）'
    explanation: |
      **常见失分点**：只写一个拓扑排序就结束，没有并发控制和失败处理；执行前不检测环，导致引擎永远等待；任务成功后先更新内存状态、后持久化，崩溃时丢失进度；忽略「运行中崩溃」的任务可能已经产生副作用；把所有错误都无差别地重试。高分回答通常先校验、再调度、再容错与恢复，最后补上可观测性，每一部分都说清对应的数据结构。

  - id: CS-ALGO-055
    type: scenario
    difficulty: 2
    frequency: 3
    points: [堆与TopK, 哈希表]
    tags: [海量数据, Top-K, 分治]
    question: |
      搜索日志中有约 100 亿条用户查询（约 1 TB），需要找出出现次数最多的 100 个查询。只有一台机器：内存 16 GB，磁盘空间充足。请给出方案，并估算主要开销。如果查询是实时流入的，需要每分钟更新一次最近一小时的 Top-100，方案要怎样调整？
    answer: |
      **1. 分析**：100 亿条查询中不同查询的数量可能有数亿（长尾很长），每个都放进哈希表计数，加上键本身和哈希表的开销，内存需求远超 16 GB，不能一次性全量计数。

      **2. 单机方案：哈希分片 + 局部计数 + 堆**
      - 第一遍扫描：按 `hash(query) % 1000` 把每条查询追加写入 1000 个分片文件。同一个查询一定落在同一个分片，每个分片平均约 1 GB；
      - 逐个处理分片：用哈希表计数，再用大小为 100 的小顶堆取出该分片的 Top-100；
      - 合并：因为同一个查询只出现在一个分片里，分片内的计数就是全局计数，把 1000 个分片的 Top-100（共 10 万个候选）再取一次 Top-100 即为答案；
      - 倾斜处理：某个分片因为热门查询特别集中而放不下时，换一个哈希函数把它再拆分；
      - 开销估算：读 1 TB、写 1 TB、再读 1 TB，约 3 TB 的磁盘 IO；按 500 MB/s 估算约 6000 秒，即 1.5～2 小时。计数阶段的 CPU 开销是线性的，堆操作为 $O(m\log100)$。可以在第一遍时先在内存中做局部预聚合（类似 Combiner），减少写盘量。

      **3. 多台机器**：就是 MapReduce 版的 WordCount 加 Top-K：Map 输出（查询, 1），Combiner 局部求和，按查询分区到 Reducer 计数，每个 Reducer 输出局部 Top-100，最后汇总。

      **4. 实时流：最近一小时、每分钟更新**
      - **精确方案**：按查询哈希把流量分到多个计数节点；每个节点按分钟分桶计数，滑动窗口每前进一分钟，就加上新桶、减去最老的一个桶；每个节点维护局部 Top-K，汇总节点合并；
      - **近似方案**（内存固定）：Count-Min Sketch 估计频次（只会高估），再配合小顶堆维护候选；或者用 Space-Saving 算法，用 k 个计数器保证出现次数超过 n/k 的查询一定被保留。适合监控、热搜这类允许少量误差的场景；
      - 还要注意乱序到达、时间窗口边界、少数超热查询造成的分区倾斜。

      **5. 数据清洗**：先对查询做规范化（大小写、首尾空白、全半角），并过滤爬虫和压测流量，否则统计结果没有意义。
    rubric:
      - '指出全量计数内存放不下，必须分治或近似（2 分）'
      - '用哈希分片保证同一查询落在同一分片，再做局部计数和大小为 K 的堆（3 分）'
      - '说明合并的正确性，并给出 IO 或时间估算（2 分）'
      - '给出流式方案：滑动窗口分桶计数，或 Count-Min Sketch / Space-Saving 等近似算法（2 分）'
      - '提到数据倾斜、规范化或过滤异常流量等工程细节（1 分）'
    explanation: |
      **常见失分点**：直接说「用哈希表计数再排序」，忽略内存约束；按行号或文件顺序随意切分，导致同一个查询分散在多个分片，局部 Top-K 合并后结果错误；只取每个分片的局部 Top-K 却没有保证同一查询只在一个分片里；流式场景只说「实时计数」，没有处理窗口过期，或说不出近似算法的误差性质。
