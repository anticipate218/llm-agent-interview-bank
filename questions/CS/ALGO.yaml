domain: CS
subcategory: ALGO
questions:

  - id: CS-ALGO-001
    type: single
    difficulty: 2
    frequency: 2
    points: [复杂度分析]
    tags: [等比级数]
    question: |
      下面的函数中，外层循环让 `i` 依次取 1、2、4、8……，内层循环执行 `i` 次。它的时间复杂度（紧确界）是：

      ```python
      def f(n):
          total, i = 0, 1
          while i < n:
              for _ in range(i):
                  total += 1
              i *= 2
          return total
      ```
    options:
      A: '$\Theta(\log n)$'
      B: '$\Theta(n\log n)$'
      C: '$\Theta(n)$'
      D: '$\Theta(n^2)$'
    answer: C
    explanation: |
      **结论**：内层的总工作量是一个等比数列的和，被 $2n$ 封顶，所以是 $\Theta(n)$。

      设外层循环执行 $k$ 次，`i` 依次为 $1,2,4,\dots,2^{k-1}$，其中 $2^{k-1}<n\le2^k$（$n\ge2$）。内层总次数为 $1+2+\dots+2^{k-1}=2^k-1$，介于 $n-1$ 与 $2n-1$ 之间。例如 $n=10$ 时 `i` 取 1、2、4、8，共 15 次。

      - A 错：只数了外层循环的次数，忽略了内层的工作量。
      - B 错：「外层 $\log n$ 次 × 内层最多 $n$ 次」只是一个上界，并不紧：内层只有最后一轮接近 $n$，前面各轮依次减半。
      - D 错：把它当成了两层都跑 $n$ 次的普通嵌套循环。

      延伸：同样的「等比级数求和」论证，正是动态数组倍增扩容均摊 $O(1)$ 的原因。对比 `for i in range(n)` 里套一个 `j *= 2` 的 while 循环：外层每轮都要跑满 $\log n$ 次，那才是 $\Theta(n\log n)$。

  - id: CS-ALGO-002
    type: calc
    difficulty: 2
    frequency: 2
    points: [复杂度分析]
    source: 'CPython 源码 Objects/listobject.c（列表扩容的过度分配公式 newsize + (newsize >> 3) + 6，再向下取整到 4 的倍数），https://github.com/python/cpython/blob/main/Objects/listobject.c；OpenJDK 源码 java.util.ArrayList#grow（首选增量 oldCapacity >> 1，即扩为 1.5 倍），https://github.com/openjdk/jdk/blob/master/src/java.base/share/classes/java/util/ArrayList.java'
    tags: [均摊分析, 动态数组]
    question: |
      某动态数组初始容量为 1；存满后再追加元素时，先申请一块容量为原来 2 倍的新空间，把旧元素逐个复制过去，再写入新元素。从空数组开始连续 `append` 1000 个元素：

      (1) 一共扩容几次？一共复制了多少次元素？
      (2) 把「写入」和「复制」都算作 1 次操作，平均每次 `append` 是多少次操作？
      (3) 若改为初始容量 100、每次只多扩 100 个位置，复制总次数是多少？元素个数 $n$ 很大时，两种扩容策略的均摊复杂度各是多少？
    answer: '(1) 扩容 10 次，复制 1023 次；(2) 约 2.02 次；(3) 复制 4500 次；倍增扩容均摊 O(1)，固定增量扩容均摊 O(n)'
    explanation: |
      **(1)** 容量依次为 1→2→4→…→1024。扩容发生在追加第 2、3、5、9、…、513 个元素时，共 10 次；每次复制的元素数等于扩容前的容量：$1+2+4+\dots+512=1023$。

      **(2)** 写入 1000 次 + 复制 1023 次 = 2023 次，平均 $2023/1000\approx2.02$ 次。一般地，$n$ 次追加的复制总数小于 $2n$，总代价小于 $3n$，均摊 $O(1)$。

      **(3)** 追加第 101、201、…、901 个元素时扩容，共 9 次，复制 $100+200+\dots+900=4500$ 次，平均每次 5.5 次操作。一般地，复制总数约为 $100\times(1+2+\dots+n/100)\approx n^2/200$，总代价 $O(n^2)$，均摊 $O(n)$。

      **要点**：按比例扩容（任何大于 1 的倍数），复制总量是等比级数，均摊 $O(1)$；按固定增量扩容，复制总量是等差级数，均摊 $O(n)$。CPython 的 list 每次约多分配 1/8（再加一个小常数），Java 的 ArrayList 扩为 1.5 倍，都是按比例增长。倍数越大，复制越少，但闲置空间越多，这是时间与空间的权衡。

  - id: CS-ALGO-003
    type: judge
    difficulty: 1
    frequency: 2
    points: [复杂度分析]
    tags: [均摊分析]
    question: |
      Python 的 `list.append` 均摊时间复杂度是 O(1)，这意味着每一次 `append` 调用的耗时都不会超过某个与列表长度无关的常数。
    answer: false
    explanation: |
      **错误**。均摊（amortized）复杂度描述的是「一串操作的总代价 ÷ 操作次数」的上界，不保证单次操作的上界。触发扩容的那一次 `append` 要复制全部 $n$ 个元素，是 $O(n)$；只是这样的操作很少，摊到每次只有常数。

      还要区分两个概念：均摊分析针对**最坏情况下的操作序列**，不涉及概率；「平均情况」复杂度则是对随机输入取期望，例如快速排序平均 $O(n\log n)$。

      工程含义：对时延敏感的系统，均摊 O(1) 的结构也会出现偶发的长停顿。例如哈希表一次性扩容（rehash）会卡住所有请求，Redis 的字典因此采用渐进式 rehash：同时保留新旧两张表，每次增删查改时顺带搬迁一小部分，把一次大停顿拆成许多小步。

  - id: CS-ALGO-004
    type: code_fill
    difficulty: 2
    frequency: 3
    points: [哈希表]
    tags: [前缀和]
    question: |
      给定整数数组 `nums`（元素可正、可负、可为 0）和整数 `k`，统计和恰好等于 `k` 的**连续**子数组个数。下面是 O(n) 的「前缀和 + 哈希表」解法，请补全两处空位。
    code: |
      from collections import defaultdict

      def count_subarrays(nums: list[int], k: int) -> int:
          seen = defaultdict(int)          # 前缀和 -> 出现次数
          seen[____] = 1
          prefix = ans = 0
          for x in nums:
              prefix += x
              ans += seen[____]
              seen[prefix] += 1
          return ans
    answer: ['0', 'prefix - k']
    test: |
      import random
      assert count_subarrays([1, 1, 1], 2) == 2
      assert count_subarrays([1, -1, 0], 0) == 3
      assert count_subarrays([3], 3) == 1
      assert count_subarrays([], 0) == 0
      rng = random.Random(0)
      for _ in range(300):
          nums = [rng.randint(-3, 3) for _ in range(rng.randint(0, 15))]
          k = rng.randint(-4, 4)
          brute = sum(sum(nums[i:j]) == k for i in range(len(nums)) for j in range(i + 1, len(nums) + 1))
          assert count_subarrays(nums, k) == brute
    explanation: |
      **思路**：记 $P_j$ 为前 $j$ 个元素之和，子数组 `nums[i:j]` 的和为 $P_j-P_i$。遍历到第 $j$ 个前缀时，以当前元素结尾、和为 $k$ 的子数组个数，就是此前出现过多少个 $P_i=P_j-k$。用哈希表给前缀和计数，时间、空间都是 $O(n)$。

      - 第 1 空 `0`：空前缀 $P_0=0$ 要预先计入一次，否则会漏掉从下标 0 开始的子数组，例如 `nums=[3]`、`k=3`。
      - 第 2 空 `prefix - k`：查询必须放在 `seen[prefix] += 1` **之前**。若先登记再查询，`k = 0` 时每个位置都会和自己配对，多数出一个「空子数组」。

      **为什么不用滑动窗口**：滑动窗口依赖「右扩和变大、左缩和变小」的单调性，只适用于非负数组；有负数时要用前缀和。

      **延伸**：同一思路可以求「和为 k 的最长子数组」（哈希表记录每个前缀和**最早**出现的位置），或「和能被 m 整除的子数组个数」（以 $P\bmod m$ 为键）。

  - id: CS-ALGO-005
    type: calc
    difficulty: 2
    frequency: 2
    points: [哈希表]
    tags: [Bloom 过滤器, 海量数据]
    question: |
      预训练数据抓取要对约 $10^8$ 个 URL 判重，计划用 Bloom 过滤器：位数组共 $m$ 位，使用 $k$ 个独立的哈希函数，插入 $n$ 个元素后误判率近似为 $p\approx(1-e^{-kn/m})^k$。

      (1) 目标误判率 1%，最省内存的 $m$ 约为多少 MiB？$k$ 应取多少？
      (2) 若只有 64 MiB 内存，取最合适的整数 $k$，误判率约为多少？
      (3) 这里的「误判」会造成什么后果？
    answer: '(1) 约 114 MiB，k = 7；(2) k = 4，误判率约 7.6%；(3) 少量从未抓取过的 URL 被误判为已抓取而漏抓，不会导致重复抓取'
    explanation: |
      **公式**：给定 $m/n$ 时，使误判率最小的 $k=\frac{m}{n}\ln2$，此时 $p=(1/2)^k$；反过来，给定目标 $p$，所需位数 $m=-\dfrac{n\ln p}{(\ln2)^2}$。

      **(1)** $m=\dfrac{10^8\times\ln100}{(\ln2)^2}=\dfrac{10^8\times4.605}{0.4805}\approx9.59\times10^8$ 位，即每个元素约 9.6 位；换算为 $9.59\times10^8/8/2^{20}\approx114$ MiB。$k=9.59\times0.693\approx6.6$，取 7，代回公式得 $p\approx1.0\%$。

      **(2)** $m=64\times2^{20}\times8\approx5.37\times10^8$ 位，$m/n\approx5.37$，最优 $k\approx3.7$。取 $k=4$：$p=(1-e^{-4/5.37})^4=(1-0.475)^4\approx0.076$，约 7.6%（取 3 时约 7.8%）。

      **(3)** Bloom 过滤器只会把「不存在」误判为「存在」，不会反过来：判为「不存在」的一定没出现过。所以后果是少量新 URL 被当成已抓取而漏掉，不会重复抓取。

      **对比**：用哈希集合直接存 $10^8$ 个 URL 字符串，通常需要 10 GB 量级的内存；Bloom 过滤器用 1% 的漏抓换来约 114 MiB。代价是不能删除元素（需要删除时用计数 Bloom 过滤器），也无法列出已有的元素。
    source: 'Broder & Mitzenmacher, Network Applications of Bloom Filters: A Survey (Internet Mathematics, 2004)'

  - id: CS-ALGO-006
    type: single
    difficulty: 2
    frequency: 1
    points: [哈希表]
    tags: [哈希洪水, SipHash]
    question: |
      某 Agent 网关会把请求 JSON 中**用户可控**的字段名放进哈希表做统计。安全评审提出要防范「哈希洪水（hash flooding）」攻击。下列说法正确的是：
    options:
      A: '把负载因子控制在 0.75 以下并及时扩容，就能保证每个桶里的键数有常数上界，每次查找都是 O(1)'
      B: '攻击者能构造大量哈希值相同的键时，链地址法和开放寻址的 n 次插入总代价都可能退化到 $O(n^2)$'
      C: '改用开放寻址法即可避免退化：冲突的键会被分散到后续的空槽里，不会在同一个桶上越积越长'
      D: '对字符串使用固定、公开的哈希函数（如 FNV-1a）更安全：结果可复现，便于审计和跨进程分片'
    answer: B
    explanation: |
      **结论**：哈希表的 O(1) 是**平均**意义上的，前提是键的哈希值分布均匀。攻击者既能控制键、又能算出哈希值时，就能让大量键落进同一个桶。

      此时第 $i$ 次插入要和桶里（或探测序列上）已有的约 $i$ 个键逐个比较，总代价 $1+2+\dots+n=O(n^2)$，几万个键就能把 CPU 打满。

      - A 错：负载因子只控制「平均每个桶有几个键」；扩容后，攻击者构造的键哈希值仍然相同，照样挤在一起，挡不住故意制造的冲突。
      - C 错：冲突的键被放到后续槽位后，查找要沿探测序列逐个比较，探测序列同样越来越长，退化方式与链地址法相同。
      - D 错：可复现对跨进程分片确实有用（见下文「副作用」），但安全上正好相反：固定、公开的哈希函数（如 FNV-1a）可以被攻击者离线算出大量碰撞。防御的关键是让攻击者**算不出**哈希值：CPython 从 3.3 起默认对 str 和 bytes 的哈希加随机盐（可用 `PYTHONHASHSEED` 控制），3.4 起改用带密钥的 SipHash（PEP 456）。

      **其他防线**：限制单个请求的字段数与请求体大小；Java 8 起 HashMap 在某个桶已有至少 8 个节点、又要加入新键时（且表容量不小于 64），把链表转成红黑树，单桶最坏情况降到 $O(\log n)$。

      **副作用**：由于随机盐，同一字符串在不同进程里的 `hash()` 不同，所以不能用内置 `hash()` 做跨进程的分片或一致性哈希，要用 MD5、xxHash 这类稳定的哈希函数。
    source: 'PEP 456 – Secure and interchangeable hash algorithm, https://peps.python.org/pep-0456/'

  - id: CS-ALGO-007
    type: code_debug
    difficulty: 1
    frequency: 3
    points: [双指针与滑动窗口, 哈希表]
    tags: [最长无重复子串]
    question: |
      下面的函数求字符串中不含重复字符的最长子串长度。它在 `"abcabcbb"`、`"pwwkew"` 上都返回了正确结果，但在某些输入上结果偏大。请找出 bug 并修正。
    code: |
      def longest_unique(s: str) -> int:
          last = {}                  # 字符 -> 最近一次出现的下标
          left = best = 0
          for right, ch in enumerate(s):
              if ch in last:
                  left = last[ch] + 1
              last[ch] = right
              best = max(best, right - left + 1)
          return best
    fixed_code: |
      def longest_unique(s: str) -> int:
          last = {}                  # 字符 -> 最近一次出现的下标
          left = best = 0
          for right, ch in enumerate(s):
              if ch in last and last[ch] >= left:
                  left = last[ch] + 1
              last[ch] = right
              best = max(best, right - left + 1)
          return best
    test: |
      import random
      assert longest_unique("") == 0
      assert longest_unique("abcabcbb") == 3
      assert longest_unique("bbbb") == 1
      assert longest_unique("abba") == 2
      assert longest_unique("tmmzuxt") == 5
      rng = random.Random(0)
      for _ in range(300):
          s = "".join(rng.choice("abcd") for _ in range(rng.randint(0, 12)))
          brute = max([j - i for i in range(len(s)) for j in range(i + 1, len(s) + 1)
                       if len(set(s[i:j])) == j - i] or [0])
          assert longest_unique(s) == brute, s
    answer: |
      **问题**：第 5～6 行只要字符出现过，就把 `left` 移到 `last[ch] + 1`。如果该字符上次出现的位置已经在窗口左边界**之前**，这一步会让 `left` 向左回退，窗口重新包含了早已排除的重复字符。

      例如 `"abba"`：读到最后的 `a` 时，窗口本是 `"b"`（`left = 2`），却被改成 `left = 1`，窗口变成 `"bba"`，返回 3，正确答案是 2。`"tmmzuxt"` 同理会返回 6（正确答案 5）。

      **修正**：只有上次出现的位置仍在窗口内时才移动左端，保证 `left` 单调不减：

      ```python
      if ch in last and last[ch] >= left:
          left = last[ch] + 1
      ```

      也可以写成 `left = max(left, last[ch] + 1)`。
    explanation: |
      滑动窗口的不变量是「`s[left:right+1]` 中没有重复字符」，并且两个指针都只向右移动，总时间才是 $O(n)$。哈希表 `last` 记的是字符**全局**最近一次出现的位置，它可能早已滑出窗口，用它更新左端之前必须和当前的 `left` 比较。

      测试这类代码时，除了常规用例，一定要构造「重复字符一个在窗口内、一个在窗口外」的输入，如 `"abba"`、`"tmmzuxt"`，再用 $O(n^2)$ 的暴力枚举做随机对拍。

  - id: CS-ALGO-008
    type: single
    difficulty: 2
    frequency: 2
    points: [双指针与滑动窗口]
    tags: [单调性, 前缀和]
    question: |
      求「和至少为 K 的最短连续子数组」。数组元素全为正数时，可以用双指针滑动窗口在 O(n) 内求解；数组含负数时，直接套用这个做法会出错（例如 `[5, -4, 3, 3]`、K = 6）。根本原因是：
    options:
      A: '负数破坏了单调性：窗口缩短时和可能反而变大，「缩到不满足就停」会漏掉更短的解'
      B: '正负数交替累加时窗口和容易溢出，需要改用 64 位整数或大整数累加，算法本身不用改'
      C: '有负数时最优解可能是空数组（和为 0），而双指针要求窗口至少含一个元素，无法表示它'
      D: '滑动窗口要求数组有序：含负数时应先排序，让窗口和随右端扩张单调递增，再用双指针'
    answer: A
    explanation: |
      **结论**：滑动窗口正确的前提是单调性。元素非负时，窗口变长和只增不减、变短和只减不增，所以「一旦缩到不满足就停」不会错过答案；有负数时这个前提不成立。

      以 `[5, -4, 3, 3]`、K = 6 为例：右端扫到最后时窗口和为 7，记录长度 4；收缩时去掉 5，和变成 2，不再满足，于是停止，最终答案 4。但若继续去掉 -4，和会回到 6，真正的最短解是 `[3, 3]`，长度 2。

      **正确做法**：前缀和加单调队列。对每个右端点 $j$，在队列中找满足 $P_j-P_i\ge K$ 的最靠右的 $i$；队列里只保留前缀和递增的下标（后来的前缀和更小、位置又更靠右，前面更大的就没用了）。每个下标进出队列各一次，总复杂度 O(n)。

      - B 错：问题与数值范围无关（Python 整数也不会溢出），换成大整数后算法照样会漏解。
      - C 错：K 为正数时空数组的和为 0，不可能满足条件；问题出在收缩判断上。
      - D 错：子数组要求连续，排序会破坏原有的相邻关系，题目就变了。

  - id: CS-ALGO-009
    type: coding
    difficulty: 2
    frequency: 2
    points: [双指针与滑动窗口, Agent工程化编程]
    tags: [限流, TPM, 手撕]
    question: |
      大模型 API 常按「每分钟 token 数（TPM）」限流。实现一个基于**滑动日志**的 token 限流器：

      ```python
      class TokenRateLimiter:
          def __init__(self, limit: int, window: float = 60.0): ...
          def try_acquire(self, tokens: int, now: float) -> bool: ...
          def used(self, now: float) -> int: ...
      ```

      - 时刻 `now` 的窗口是左开右闭区间 `(now - window, now]`：放行时间 `t` 满足 `t > now - window` 的请求才计入；
      - `try_acquire`：若窗口内已用的 token 数加上 `tokens` 不超过 `limit`，就放行、记录并返回 `True`；否则返回 `False`，被拒绝的请求不占额度；
      - `used(now)` 返回窗口内已放行的 token 总数；
      - `limit`、`window`、`tokens` 不为正时抛出 `ValueError`；调用方保证 `now` 单调不减；
      - 每次调用的均摊时间复杂度为 O(1)。
    answer: |
      from collections import deque


      class TokenRateLimiter:
          def __init__(self, limit, window=60.0):
              if limit <= 0 or window <= 0:
                  raise ValueError("limit 与 window 必须为正")
              self.limit, self.window = limit, window
              self.q = deque()               # (放行时间, token 数)，时间单调不减
              self.total = 0                 # 窗口内的 token 总数

          def _evict(self, now):
              while self.q and self.q[0][0] <= now - self.window:
                  self.total -= self.q.popleft()[1]

          def used(self, now):
              self._evict(now)
              return self.total

          def try_acquire(self, tokens, now):
              if tokens <= 0:
                  raise ValueError("tokens 必须为正")
              self._evict(now)
              if self.total + tokens > self.limit:
                  return False               # 拒绝的请求不占额度
              self.q.append((now, tokens))
              self.total += tokens
              return True
    test: |
      import random

      lim = TokenRateLimiter(limit=100, window=60)
      assert lim.try_acquire(60, now=0)
      assert not lim.try_acquire(50, now=10)     # 60 + 50 > 100
      assert lim.try_acquire(40, now=10)         # 恰好用满 100
      assert lim.used(59.5) == 100
      assert lim.used(60) == 40                  # t=0 的记录在 now=60 时滑出窗口
      assert lim.try_acquire(60, now=60)
      assert not lim.try_acquire(1, now=69.5)    # 窗口 (9.5, 69.5] 内已有 40 + 60
      assert lim.try_acquire(1, now=70)          # t=10 的 40 个 token 滑出
      assert not lim.try_acquire(101, now=10**6)
      for bad in (lambda: TokenRateLimiter(0), lambda: TokenRateLimiter(10, window=0),
                  lambda: lim.try_acquire(0, now=10**6)):
          try:
              bad()
              raise AssertionError("应抛出 ValueError")
          except ValueError:
              pass

      rng = random.Random(0)
      for _ in range(200):                       # 与「保存全部记录、每次重新求和」的暴力实现对拍
          limit, window = rng.randint(1, 50), rng.randint(1, 20)
          lim, acc, t = TokenRateLimiter(limit, window), [], 0
          for _ in range(100):
              t += rng.randint(0, 5)
              tok = rng.randint(1, 20)
              ok = sum(x for ts, x in acc if ts > t - window) + tok <= limit
              if ok:
                  acc.append((t, tok))
              assert lim.try_acquire(tok, now=t) == ok
              assert lim.used(t) == sum(x for ts, x in acc if ts > t - window)
    explanation: |
      **思路**：用双端队列按时间顺序保存放行记录 `(t, tokens)`，同时维护窗口内的 token 总数 `total`。
      1. 每次调用先从队头弹出 `t <= now - window` 的过期记录，并从 `total` 中扣掉；
      2. 判断 `total + tokens <= limit`：放行就入队并累加，否则直接返回 `False`。

      **复杂度**：每条记录最多入队一次、出队一次，n 次调用的总代价是 O(n)，均摊 O(1)；空间与窗口内的请求数成正比。若每次都对整个队列重新求和，单次调用就是 O(窗口内请求数)。

      **与令牌桶对比**：滑动日志精确统计「最近 60 秒」，不会像固定窗口计数那样在窗口交界处放行近 2 倍的流量；代价是要存下窗口内的每一条记录。令牌桶只需保存两个数，并允许一定的突发。

      **工程扩展**：多租户时用 `dict[租户, 限流器]`；多实例部署时，常把记录放进 Redis 有序集合（以时间为分值），用 Lua 脚本把「删除过期记录、求和、写入」做成一次原子操作。大模型请求的输出长度事先未知，可以先按「输入 token 数 + max_tokens」预占额度，请求结束后再按实际用量修正。

  - id: CS-ALGO-010
    type: coding
    difficulty: 3
    frequency: 2
    points: [二分查找]
    tags: [二分答案, 流水线并行, 手撕]
    question: |
      流水线并行要把模型的各层**按顺序**切成若干个连续的阶段，每个阶段放在一张卡上，流水线的节拍由最慢的阶段决定。已知每层的耗时，实现：

      ```python
      def min_max_stage(costs: list[int], p: int) -> int: ...
      ```

      - 把 `costs` 切成**至多** `p` 段连续、非空的子数组，返回「各段耗时之和的最大值」的最小可能值；
      - `1 <= len(costs) <= 10**5`，`1 <= costs[i] <= 10**9`，`p >= 1`（`p` 可以大于层数）；
      - 时间复杂度要求 $O(n\log S)$，$S$ 为总耗时。

      示例：`min_max_stage([4, 2, 3, 5, 1, 6], 3) == 8`，切法为 `[4, 2] | [3, 5] | [1, 6]`。
    answer: |
      def min_max_stage(costs, p):
          def stages_needed(cap):            # 每段之和不超过 cap 时，贪心最少要切成几段
              cnt, cur = 1, 0
              for c in costs:
                  if cur + c > cap:
                      cnt, cur = cnt + 1, 0
                  cur += c
              return cnt

          lo, hi = max(costs), sum(costs)    # 答案一定落在 [最大单层耗时, 总耗时] 之间
          while lo < hi:
              mid = (lo + hi) // 2
              if stages_needed(mid) <= p:    # mid 可行：答案 <= mid
                  hi = mid
              else:                          # mid 不可行：答案 > mid
                  lo = mid + 1
          return lo
    test: |
      import random
      from functools import lru_cache

      def brute(costs, p):
          n = len(costs)

          @lru_cache(None)
          def f(i, parts):                   # costs[i:] 切成至多 parts 段的最优值
              if i == n:
                  return 0
              if parts == 0:
                  return float("inf")
              best, s = float("inf"), 0
              for j in range(i, n):
                  s += costs[j]
                  best = min(best, max(s, f(j + 1, parts - 1)))
              return best
          return f(0, p)

      assert min_max_stage([4, 2, 3, 5, 1, 6], 3) == 8
      assert min_max_stage([4, 2, 3, 5, 1, 6], 1) == 21
      assert min_max_stage([4, 2, 3, 5, 1, 6], 10) == 6
      assert min_max_stage([7], 3) == 7
      rng = random.Random(0)
      for _ in range(300):
          costs = [rng.randint(1, 20) for _ in range(rng.randint(1, 9))]
          p = rng.randint(1, 10)
          assert min_max_stage(costs, p) == brute(tuple(costs), p), (costs, p)
      big = [rng.randint(1, 10**9) for _ in range(20000)]
      r = min_max_stage(big, 8)
      assert max(big) <= r <= sum(big)
    explanation: |
      **思路：在答案上二分**。
      1. **单调性**：如果「每段之和不超过 $x$」时能切成不超过 $p$ 段，那么上限更大时也一定能，所以可行性关于 $x$ 单调，可以二分最小的可行 $x$；
      2. **判定**：给定上限 $x$，从左到右贪心，当前段装不下就另起一段，得到的就是最少段数（任何可行切分的第一段都不会比贪心的第一段更长，归纳可证）；
      3. **边界**：答案至少是最大的单层耗时，否则那一层放不进任何阶段；至多是总耗时，即全部放在一段。

      **复杂度**：二分 $O(\log S)$ 次，每次判定 $O(n)$，共 $O(n\log S)$；$S\le10^{14}$ 时约 47 次判定。动态规划解法是 $O(n^2p)$，层数多时太慢。

      **易错点**：
      - `lo` 不能从 0 开始：上限小于某一层的耗时时，判定函数会多数出一个空段，可能把不可行误判为可行。例如 `costs=[10]`、`p=2` 会得到 0；
      - `mid` 可行时应收缩到 `hi = mid`，而不是 `mid - 1`，否则会丢掉答案。

      真实的流水线切分还要考虑每段的显存与阶段间的通信量，但核心仍是这种「最小化最大值」的模型。

  - id: CS-ALGO-011
    type: code_debug
    difficulty: 2
    frequency: 2
    points: [二分查找]
    tags: [二分答案, 死循环]
    question: |
      显存为 80 GB 的卡上，模型权重占 14 GB，每条序列的 KV Cache 占 1.25 GB。要用二分查找求最多能同时放下多少条序列。`fits(b)` 判断 `b` 条序列能否放下，它关于 `b` 单调（`b` 可行则 `b - 1` 也可行），并且 `fits(0)` 恒为真。下面的实现在某些输入下永远不返回，请指出原因并修正。
    code: |
      def max_batch(fits, hi):
          """返回 [0, hi] 内最大的可行 b"""
          lo = 0
          while lo < hi:
              mid = (lo + hi) // 2
              if fits(mid):
                  lo = mid
              else:
                  hi = mid - 1
          return lo
    fixed_code: |
      def max_batch(fits, hi):
          """返回 [0, hi] 内最大的可行 b"""
          lo = 0
          while lo < hi:
              mid = (lo + hi + 1) // 2
              if fits(mid):
                  lo = mid
              else:
                  hi = mid - 1
          return lo
    test: |
      def make_fits(ok):
          calls = [0]

          def fits(b):
              calls[0] += 1
              if calls[0] > 100:
                  raise RuntimeError("fits 被调用超过 100 次，疑似死循环")
              return ok(b)
          return fits

      assert max_batch(make_fits(lambda b: 14 + 1.25 * b <= 80), 1024) == 52
      for limit in range(0, 40):
          for hi in range(0, 40):
              assert max_batch(make_fits(lambda b: b <= limit), hi) == min(limit, hi)
    answer: |
      **问题**：第 5 行 `mid = (lo + hi) // 2` 向下取整。区间缩到 `hi = lo + 1` 时，`mid == lo`；若 `fits(mid)` 为真，执行 `lo = mid` 后区间没有任何变化，循环永远不会结束。例如 `fits = lambda b: b <= 0`、`hi = 1` 时会立刻卡死。

      **修正**：「找最大可行值」时 `mid` 要**向上取整**，保证 `mid > lo`，每一轮区间至少缩小 1：

      ```python
      mid = (lo + hi + 1) // 2
      ```
    explanation: |
      **不变量**：`lo` 始终可行，答案在闭区间 `[lo, hi]` 内，`lo == hi` 时结束。两个分支都必须让区间严格变小：可行时 `lo = mid`，要求 `mid > lo`；不可行时 `hi = mid - 1`，要求 `mid >= lo`。向上取整同时满足这两点。

      **配套规则**：
      - 找最小可行值（`hi = mid`、`lo = mid + 1`）配向下取整；
      - 找最大可行值（`lo = mid`、`hi = mid - 1`）配向上取整。

      测试时给 `fits` 加一个调用计数，超过合理次数就报错，可以把「死循环」变成能断言的失败。本题由 $14+1.25b\le80$ 得 $b\le52.8$，答案为 52。

  - id: CS-ALGO-012
    type: judge
    difficulty: 1
    frequency: 2
    points: [二分查找]
    tags: [二分答案]
    question: |
      「二分答案」只要求答案落在一个有界的整数区间内；即使可行性判定 `check(x)` 关于 `x` 不单调，也能用 $O(\log(\text{区间长度}))$ 次判定找到最小的可行 `x`。
    answer: false
    explanation: |
      **错误**。二分答案的前提是判定函数**单调**：存在分界点 $x^*$，$x<x^*$ 时全不可行，$x\ge x^*$ 时全可行（F…FT…T）。只有这样，判定一次 `mid` 之后才能放心地丢掉一半区间。

      反例：在 `[1, 20]` 上找最小的可行值，`check(x)` 只在 $x=3$ 和 $10\le x\le20$ 时为真。二分先测 `mid = 10`（真），区间收缩到 `[1, 10]`；再依次测 5、8、9（都为假），最后返回 10，漏掉了更小的 3。

      所以用二分答案之前，先确认单调性：「batch 越大越放不下」「每段上限越大越容易切分」「给的时间越长越能完成」都是单调的；「恰好等于某个值」「模型在某个温度下答对」之类的条件通常不单调，只能逐个检查或换别的方法。

  - id: CS-ALGO-013
    type: coding
    difficulty: 3
    frequency: 2
    points: [栈与单调栈, Agent工程化编程]
    tags: [流式 JSON, 工具调用, 手撕]
    question: |
      模型以流式方式输出工具调用的 JSON 参数，前端希望在生成过程中就能解析、展示「到目前为止的内容」。实现：

      ```python
      def close_json(prefix: str) -> str: ...
      ```

      返回最短的后缀 `suffix`，使 `prefix + suffix` 成为合法 JSON。输入保证：`prefix` 是某个合法 JSON 文本的前缀，并且**只需**补上未闭合的字符串引号和括号就能变成合法 JSON（不会停在 `{"a":` 这类还缺值的位置，也不会停在 `tru` 这类字面量中间或转义序列中间）。字符串里可能出现括号与转义字符。

      | `prefix`（JSON 原文） | 返回值 |
      |---|---|
      | `{"a": [1, 2` | `]}` |
      | `{"msg": "he said \"hi` | `"}` |
      | `["}{", {"k": [` | `]}]` |
      | `[1, {"t": true}]` | 空串 |
    answer: |
      def close_json(prefix):
          stack = []                     # 尚未闭合的容器，存放对应的右括号
          in_str = esc = False
          for ch in prefix:
              if in_str:
                  if esc:
                      esc = False        # 转义序列的第二个字符，原样跳过
                  elif ch == "\\":
                      esc = True
                  elif ch == '"':
                      in_str = False
              elif ch == '"':
                  in_str = True
              elif ch in "[{":
                  stack.append("]" if ch == "[" else "}")
              elif ch in "]}":
                  stack.pop()
          return ('"' if in_str else "") + "".join(reversed(stack))
    test: |
      import json
      import random
      from itertools import product

      assert close_json('{"a": [1, 2') == "]}"
      assert close_json('{"msg": "he said \\"hi') == '"}'
      assert close_json('["}{", {"k": [') == "]}]"
      assert close_json('[{"k": "x\\\\"}, [') == "]]"
      assert close_json('[1, {"t": true}]') == ""
      assert close_json('"ab') == '"'

      def oracle(prefix, max_depth=8):
          """暴力：在「可选的引号 + 若干右括号」中找能让 json.loads 成功的最短后缀"""
          for n in range(max_depth + 1):
              for q in ("", '"'):
                  for tail in product("]}", repeat=n):
                      s = q + "".join(tail)
                      try:
                          json.loads(prefix + s)
                          return s
                      except ValueError:
                          pass
          return None

      rng = random.Random(0)

      def rand_value(d=0):
          r = rng.random()
          if d < 3 and r < 0.3:
              return [rand_value(d + 1) for _ in range(rng.randint(0, 3))]
          if d < 3 and r < 0.6:
              return {rng.choice(["a", "b", "c{", "d]"]): rand_value(d + 1) for _ in range(rng.randint(0, 3))}
          return rng.choice([1, -2.5, True, None, "x", 'q"uote', "back\\slash", "[{", "中文"])

      for _ in range(100):                   # 随机 JSON 的每个前缀：凡是能补全的，都与暴力结果对拍
          doc = json.dumps(rand_value(), ensure_ascii=False)
          for i in range(len(doc) + 1):
              want = oracle(doc[:i])
              if want is not None:
                  assert close_json(doc[:i]) == want, doc[:i]
    explanation: |
      **思路**：从左到右扫描一遍，用栈记录尚未闭合的 `[`、`{`，再用两个布尔量记录「是否在字符串内」「上一个字符是否是转义符 `\`」。
      1. 字符串外：遇到 `"` 进入字符串；遇到 `[`、`{` 把对应的右括号入栈；遇到 `]`、`}` 出栈；
      2. 字符串内：遇到 `\` 就跳过下一个字符（它可能是 `"`，也可能是另一个 `\`）；遇到未被转义的 `"` 才离开字符串；括号一律忽略；
      3. 扫描结束：若仍在字符串内，先补一个 `"`，再把栈里的右括号从栈顶到栈底依次输出。

      **复杂度**：$O(n)$ 时间，$O(\text{嵌套深度})$ 空间。流式场景下可以把状态（栈和两个布尔量）保存下来，新 token 到达时只扫描增量部分，总代价仍是线性的。

      **易错点**：
      - 不处理转义：`"he said \"hi` 中的 `\"` 会被误当成字符串结束；
      - 把 `\\` 理解成「转义了后面的引号」：在 `"x\\"` 里，第二个反斜杠被第一个转义，后面的 `"` 才是真正的结束引号；
      - 不区分字符串内外：字符串里的 `}`、`[` 会打乱括号栈。

      **工程上**：真实的流式 JSON 解析器还要处理停在键名、冒号、逗号或字面量中间的情况（例如回退到上一个完整的值）。如果要求输出严格符合 JSON Schema，应在解码阶段用约束解码来保证。

  - id: CS-ALGO-014
    type: code_output
    difficulty: 2
    frequency: 2
    points: [栈与单调栈]
    tags: [下一个更大元素]
    question: |
      下面用单调栈计算：对每一天，还要再等几天 P99 时延才会出现**更高**的值（之后不再出现更高值则为 0）。输出是什么？
    code: |
      def days_until_higher(xs):
          ans, stack = [0] * len(xs), []        # 栈中存下标，对应的值自底向上单调不增
          for i, x in enumerate(xs):
              while stack and xs[stack[-1]] < x:
                  j = stack.pop()
                  ans[j] = i - j
              stack.append(i)
          return ans, stack

      p99 = [120, 90, 95, 90, 130, 80, 80, 100]
      ans, rest = days_until_higher(p99)
      print(ans)
      print(rest)
    answer: |
      [4, 1, 2, 1, 0, 2, 1, 0]
      [4, 7]
    explanation: |
      栈中保存「还没找到更高值」的下标，对应的值自底向上单调不增。新元素到来时，把栈顶所有**严格小于**它的下标弹出，这些下标的答案就是两个下标之差。

      逐步执行：
      - i = 2（95）弹出 1（90），ans[1] = 1；
      - i = 4（130）依次弹出 3（90）、2（95）、0（120），ans[3] = 1，ans[2] = 2，ans[0] = 4；
      - i = 6（80）遇到栈顶 5（80），二者相等，不弹出；
      - i = 7（100）弹出 6、5，ans[6] = 1，ans[5] = 2。第 6 天的 80 与第 5 天相等，不算「更高」，所以第 5 天要等到第 7 天。

      最后栈里剩下 `[4, 7]`：130 和 100 之后再没有更高的值，答案保持 0。

      **易错点**：比较用 `<` 还是 `<=` 决定了「相等算不算更高」。若写成 `<=`，ans[5] 会变成 1。每个下标最多入栈、出栈各一次，总复杂度为 $O(n)$。

  - id: CS-ALGO-015
    type: single
    difficulty: 1
    frequency: 2
    points: [栈与单调栈, 复杂度分析]
    tags: [均摊分析]
    question: |
      用单调栈求每个元素右侧第一个更大的元素时，代码是外层 `for` 循环套内层 `while` 循环（内层不断弹出比当前元素小的栈顶），但总时间复杂度仍是 O(n)。最准确的理由是：
    options:
      A: '栈内元素保持单调，内层 while 每次最多只会弹出常数个元素'
      B: '栈中元素单调递减，栈的大小始终是常数级，每次 while 的代价因而有常数上界'
      C: '弹出时可以用二分查找定位截断位置，每个元素的处理只需 $O(\log n)$ 而不是 $O(n)$'
      D: '每个下标最多入栈、出栈各一次，全部 while 迭代合计不超过 n 次'
    answer: D
    explanation: |
      **结论**：这是聚合分析（aggregate analysis）：不看单次循环，而看整个过程的总操作数。每次 while 迭代都会弹出一个下标，而每个下标只会入栈一次，所以全部 while 迭代合计不超过 $n$ 次，加上 $n$ 次入栈，总共 $O(n)$。

      - A 错：单次 while 可能弹出很多元素。例如 `[5, 4, 3, 2, 1, 6]`，处理 6 时一次弹出 5 个。
      - B 错：输入严格递减时，所有下标都留在栈里，栈的大小是 $n$，并非常数级。
      - C 错：单调栈只从栈顶逐个弹出，不做二分查找；即使每个元素都花 $O(\log n)$，合计也是 $O(n\log n)$，解释不了 $O(n)$。

      延伸：同样的论证适用于滑动窗口（左右指针各自最多移动 $n$ 步）和单调队列。用势能法表述：令势能为栈的大小，入栈让势能加 1，每次弹出让势能减 1，均摊代价为常数。

  - id: CS-ALGO-016
    type: coding
    difficulty: 2
    frequency: 3
    points: [堆与TopK, 哈希表]
    tags: [Top-K, 手撕]
    question: |
      统计 Agent 日志中被调用得最多的工具名。实现：

      ```python
      def top_k_frequent(words: list[str], k: int) -> list[str]: ...
      ```

      - 返回出现次数最多的 `k` 个词，按次数从高到低排列，次数相同时按字典序升序；不同的词少于 `k` 个时全部返回；`k <= 0` 时返回空列表；
      - 设共有 $n$ 个词、$m$ 个不同的词，要求时间复杂度为 $O(n+m\log k)$：维护大小不超过 `k` 的堆，不要对全部 $m$ 个词排序，也不要直接调用 `heapq.nlargest` / `heapq.nsmallest`。

      示例：`top_k_frequent(["rag", "agent", "rag", "llm", "agent", "rag", "tool"], 2) == ["rag", "agent"]`。
    answer: |
      import heapq
      from collections import Counter


      class _Entry:
          __slots__ = ("cnt", "word")

          def __init__(self, cnt, word):
              self.cnt, self.word = cnt, word

          def __lt__(self, other):           # 「更差」的更小：次数少；次数相同则字典序大
              if self.cnt != other.cnt:
                  return self.cnt < other.cnt
              return self.word > other.word


      def top_k_frequent(words, k):
          if k <= 0:
              return []
          heap = []                          # 小顶堆，堆顶是当前入选者中最差的一个
          for word, cnt in Counter(words).items():
              e = _Entry(cnt, word)
              if len(heap) < k:
                  heapq.heappush(heap, e)
              elif heap[0] < e:              # 新词比堆顶好，替换堆顶
                  heapq.heapreplace(heap, e)
          out = []
          while heap:
              out.append(heapq.heappop(heap).word)
          return out[::-1]                   # 弹出顺序是从差到好，反转
    test: |
      import random
      from collections import Counter

      assert top_k_frequent(["rag", "agent", "rag", "llm", "agent", "rag", "tool"], 2) == ["rag", "agent"]
      assert top_k_frequent(["b", "a", "c", "a", "b", "c"], 2) == ["a", "b"]
      assert top_k_frequent(["x", "y"], 5) == ["x", "y"]
      assert top_k_frequent([], 3) == [] and top_k_frequent(["a"], 0) == []
      rng = random.Random(0)
      for _ in range(500):
          words = [rng.choice("abcdefgh") * rng.randint(1, 2) for _ in range(rng.randint(0, 40))]
          k = rng.randint(1, 12)
          cnt = Counter(words)
          assert top_k_frequent(words, k) == sorted(cnt, key=lambda w: (-cnt[w], w))[:k]
    explanation: |
      **思路**：先用 `Counter` 计数（$O(n)$），再维护大小为 $k$ 的**小顶堆**，堆顶是当前入选者中「最差」的一个：新词比堆顶好才替换堆顶。最后依次弹出（从差到好），反转即可。

      **关键是比较规则**：「好」的定义是次数多，次数相同时字典序小。堆顶要放最差的，所以 `__lt__` 写成：次数少的更小；次数相同时**字典序大**的更小。如果直接把 `(次数, 词)` 元组放进小顶堆，次数相同时会把字典序小的词当成更差的先淘汰，结果正好反了：`["b", "a", "c", "a", "b", "c"]`、`k = 2` 会得到 `["c", "b"]`，正确答案是 `["a", "b"]`。

      **复杂度**：计数 $O(n)$，堆操作 $O(m\log k)$，空间 $O(m)$。另一种 $O(n)$ 的做法是按次数分桶（桶的下标就是次数），再从高到低收集。

      **工程上**：直接写 `heapq.nsmallest(k, cnt.items(), key=lambda kv: (-kv[1], kv[0]))` 即可，它内部同样维护大小为 $k$ 的堆。数据大到单机放不下时，先按词的哈希分片计数，每片求局部 Top-K，再归并。

  - id: CS-ALGO-017
    type: code_debug
    difficulty: 2
    frequency: 2
    points: [堆与TopK]
    tags: [heapq, 平手裁决]
    question: |
      下面的函数从检索结果中取得分最高的 `k` 篇文档。上线后偶发崩溃，报错 `TypeError: '<' not supported between instances of 'dict' and 'dict'`。请找出原因并修正，要求得分相同时保留先出现的文档。
    code: |
      import heapq

      def top_docs(docs, k):
          """docs 中每项形如 {"id": ..., "score": ...}；返回得分最高的 k 篇，按得分降序"""
          heap = []
          for d in docs:
              heapq.heappush(heap, (d["score"], d))
              if len(heap) > k:
                  heapq.heappop(heap)
          heap.sort(key=lambda t: t[0], reverse=True)
          return [d for _, d in heap]
    fixed_code: |
      import heapq

      def top_docs(docs, k):
          """docs 中每项形如 {"id": ..., "score": ...}；返回得分最高的 k 篇，按得分降序"""
          heap = []
          for i, d in enumerate(docs):
              heapq.heappush(heap, (d["score"], -i, d))   # -i：同分时先弹出后出现的
              if len(heap) > k:
                  heapq.heappop(heap)
          heap.sort(key=lambda t: (-t[0], -t[1]))         # 得分降序，同分按出现顺序
          return [d for _, _, d in heap]
    test: |
      docs = [{"id": "a", "score": 0.9}, {"id": "b", "score": 0.7},
              {"id": "c", "score": 0.9}, {"id": "d", "score": 0.8}]
      assert [d["id"] for d in top_docs(docs, 2)] == ["a", "c"]
      assert [d["id"] for d in top_docs(docs, 3)] == ["a", "c", "d"]
      same = [{"id": i, "score": 1.0} for i in range(6)]
      assert [d["id"] for d in top_docs(same, 3)] == [0, 1, 2]
      assert top_docs([], 3) == []
    answer: |
      **原因**：堆里存的是元组 `(score, d)`，元组按元素逐个比较：得分不同时只比较第一项；一旦两篇文档**得分相同**，就会接着比较第二项，也就是两个 dict，而 dict 之间不支持 `<`，于是抛出 TypeError。检索结果里同分并不罕见（重复文档、离散的打分特征等），所以表现为「偶发」。

      **修正**：在得分后面插入一个一定不会相同的序号作为平手裁决（tie-breaker），dict 就永远不会被比较。用 `-i` 可以在同分时先淘汰后出现的文档：

      ```python
      for i, d in enumerate(docs):
          heapq.heappush(heap, (d["score"], -i, d))
          if len(heap) > k:
              heapq.heappop(heap)
      heap.sort(key=lambda t: (-t[0], -t[1]))
      return [d for _, _, d in heap]
      ```
    explanation: |
      堆（以及 `sorted`）对元素的唯一要求是能比较大小。凡是把「(优先级, 负载)」放进堆的写法，都要想到优先级相同时会不会比较到负载：负载是 dict、自定义对象或 numpy 数组时会直接报错；即使能比较（如字符串），也会引入意料之外的顺序。Python 文档在 heapq 的「优先队列实现说明」中推荐的就是「优先级、递增计数、任务」三元组。

      更省事的写法是 `heapq.nlargest(k, docs, key=lambda d: d["score"])`：它只比较 key，并且与 `sorted(docs, key=..., reverse=True)[:k]` 等价，同分时保持原有顺序。
    source: 'Python 文档：heapq，https://docs.python.org/3/library/heapq.html'

  - id: CS-ALGO-018
    type: single
    difficulty: 1
    frequency: 3
    points: [堆与TopK]
    tags: [Top-K, 海量数据]
    question: |
      日志里有 10 亿个请求耗时，机器内存只放得下几百万个数。要找出耗时最大的 1000 个，最合适的做法是：
    options:
      A: '把 10 亿个数全部读入内存，排序后取前 1000 个'
      B: '维护一个大小为 1000 的小顶堆，新数比堆顶大就替换堆顶，扫描一遍即可'
      C: '维护一个大小为 1000 的大顶堆，新数比堆顶小就替换堆顶，扫描一遍即可'
      D: '把 10 亿个数全部建成一个小顶堆，再弹出 1000 次'
    answer: B
    explanation: |
      **结论**：小顶堆的堆顶是「当前入选的 1000 个数里最小的那个」，也就是入选门槛。新数大于门槛才有资格入选，替换堆顶后门槛随之更新。只需扫描一遍，时间 $O(n\log k)$，内存 $O(k)$。

      - A 错：要把 10 亿个数全部读入内存，超出限制（仅 8 字节整数就要 8 GB，Python 对象还要大得多）。
      - C 错：大顶堆的堆顶是堆里最大的数，「比堆顶小就替换」会不断留下更小的数，最后得到的是最小的 1000 个。
      - D 错：把 10 亿个数全部建成堆，同样要把它们都放进内存，超出限制。

      **延伸**：数据分布在多台机器上时，每台各自求 Top-1000，再把这些候选合并求一次；快速选择平均 $O(n)$，但要求数据整体放在内存里，适合一次性的离线计算，不适合数据流。

  - id: CS-ALGO-019
    type: coding
    difficulty: 3
    frequency: 3
    points: [链表]
    tags: [K 个一组反转, 手撕]
    question: |
      实现链表的「K 个一组反转」：

      ```python
      class ListNode:
          def __init__(self, val=0, next=None):
              self.val, self.next = val, next

      def reverse_k_group(head: ListNode | None, k: int) -> ListNode | None: ...
      ```

      - 从头开始每 `k` 个节点反转一次，最后不足 `k` 个的节点保持原顺序；`k >= 1`；
      - 必须通过修改指针完成，不能只交换节点的值（测试会检查节点对象本身的顺序）；
      - 时间复杂度 O(n)，额外空间 O(1)。

      示例：`1→2→3→4→5`，`k = 2` 得到 `2→1→4→3→5`；`k = 3` 得到 `3→2→1→4→5`。
    answer: |
      class ListNode:
          def __init__(self, val=0, next=None):
              self.val, self.next = val, next


      def reverse_k_group(head, k):
          dummy = ListNode(0, head)
          tail = dummy                           # 已处理部分的尾节点
          while True:
              node = tail                        # 先确认后面还有 k 个节点
              for _ in range(k):
                  node = node.next
                  if node is None:
                      return dummy.next          # 不足 k 个：保持原样
              first, nxt = tail.next, node.next  # 本组首节点、下一组首节点
              prev, cur = nxt, first             # 组内原地反转，反转后的尾直接接上下一组
              while cur is not nxt:
                  cur.next, prev, cur = prev, cur, cur.next
              tail.next = prev                   # prev 是本组反转后的头
              tail = first                       # 原来的首节点成了本组的尾
    test: |
      import random

      def build(vals):
          nodes = [ListNode(v) for v in vals]
          for a, b in zip(nodes, nodes[1:]):
              a.next = b
          return (nodes[0] if nodes else None), nodes

      def collect(head):
          out = []
          while head is not None:
              out.append(head)
              head = head.next
              assert len(out) <= 10**4, "链表出现了环"
          return out

      def expect_order(n, k):
          order = []
          for s in range(0, n - n % k, k):
              order += list(range(s + k - 1, s - 1, -1))
          return order + list(range(n - n % k, n))

      assert reverse_k_group(None, 3) is None
      head, nodes = build([1, 2, 3, 4, 5])
      assert [x.val for x in collect(reverse_k_group(head, 2))] == [2, 1, 4, 3, 5]
      head, nodes = build([1, 2, 3, 4, 5])
      assert [x.val for x in collect(reverse_k_group(head, 3))] == [3, 2, 1, 4, 5]
      rng = random.Random(0)
      for _ in range(300):
          n, k = rng.randint(0, 12), rng.randint(1, 6)
          head, nodes = build([rng.randint(0, 3) for _ in range(n)])   # 值可以重复
          got = collect(reverse_k_group(head, k))
          assert got == [nodes[i] for i in expect_order(n, k)]          # 检查的是节点对象的顺序
    explanation: |
      **思路**：用哑节点 `dummy` 统一处理头节点；`tail` 指向已处理部分的尾节点。每一轮：
      1. 从 `tail` 往后数 `k` 步，不够 `k` 个就直接返回，剩余部分保持原样；
      2. 记下本组首节点 `first` 和下一组首节点 `nxt`，在组内做标准的原地反转。把 `prev` 初始化为 `nxt`，反转完成时本组的新尾（原来的 `first`）就自动接上了下一组；
      3. 让 `tail.next` 指向本组的新头 `prev`，再把 `tail` 移到 `first`，进入下一轮。

      **复杂度**：每个节点被「数」一次、反转一次，O(n) 时间，O(1) 额外空间。

      **易错点**：
      - 反转前没先确认够 `k` 个，导致最后一组被错误反转；
      - 反转后忘了把上一组的尾接到本组的新头，或者本组的尾没接上下一组，链表断开或成环；
      - `cur.next, prev, cur = prev, cur, cur.next` 这种多重赋值依赖「右边先全部求值」，拆成多行时一定要先保存 `cur.next`。

      面试中常见的追问是递归写法（空间 O(n/k)）以及「从尾部开始分组」的变体（先求长度，跳过开头 `n % k` 个节点即可）。

  - id: CS-ALGO-020
    type: fill
    difficulty: 2
    frequency: 2
    points: [链表]
    tags: [Floyd 判圈, 快慢指针]
    question: |
      单链表依次为 A→B→C→D→E→F→G→H→I，且 I 的 next 指回 F（A～E 不在环上，F、G、H、I 构成长度为 4 的环）。用 Floyd 判圈：慢指针每次走 1 步、快指针每次走 2 步，同时从 A 出发。两者第一次相遇时，慢指针走了 ____ 步，相遇点是节点 ____；然后把其中一个指针放回 A，两个指针都改为每次走 1 步，再各走 ____ 步后相遇于节点 ____。
    answer: ['8', 'I', '5', 'F']
    explanation: |
      **第一次相遇**：设环外部分长 $a=5$，环长 $L=4$。慢指针走 $t$ 步、快指针走 $2t$ 步，二者都在环上（$t\ge a$）且位置相同，要求 $2t-t=t$ 是 $L$ 的倍数。满足 $t\ge5$ 的最小的 4 的倍数是 8。慢指针走 8 步：A→B→C→D→E→F→G→H→I，停在 **I**；快指针走 16 步，进环后又绕了整数圈，也在 I。

      **找入口**：相遇时慢指针在环上距入口 $(t-a)\bmod L=3$ 步的位置。从这里再走 $a$ 步，到达距入口 $(t-a+a)\bmod L=t\bmod L=0$ 步处，即入口。而另一个从 A 出发的指针走 $a$ 步也恰好到达入口，所以两者再各走 **5** 步，在入口 **F** 相遇（之前一个在环外、一个在环上，不可能提前相遇）。

      **结论**：Floyd 算法用 O(1) 空间判断是否有环并求出入口；若用哈希集合记录访问过的节点则需要 O(n) 空间。求环长只需在相遇点让一个指针绕一圈计数。

  - id: CS-ALGO-021
    type: single
    difficulty: 1
    frequency: 2
    points: [链表, 双指针与滑动窗口]
    tags: [相交链表]
    question: |
      两个单链表在某个节点之后合并成同一段（Y 字形）。经典解法：指针 `pa` 从链表 A 的头出发、`pb` 从链表 B 的头出发，每次各走一步；某个指针走到末尾（`None`）后，下一步转到另一个链表的头继续走，直到 `pa is pb` 为止，返回 `pa`。关于这个算法，下列说法正确的是：
    options:
      A: '只有两个链表长度相同时才能找到交点；长度不同时两个指针始终错开，会一直循环下去'
      B: '若两个链表不相交，两个指针会在两条链表之间无限交替地走下去，所以必须先比较两条链表的尾节点'
      C: '切换链表抵消了长度差：两个指针走过相同的步数后同时到达交点；不相交时会同时变成 None，循环结束'
      D: '该算法需要用哈希集合记录其中一条链表的全部节点，额外空间与这条链表的长度成正比'
    answer: C
    explanation: |
      **结论**：「走完自己的再走对方的」让两个指针走过的总路程相同，从而消除了长度差。

      `pa` 走过 A 独有的 $a$ 个节点、公共的 $c$ 个节点，再走 B 独有的 $b$ 个节点，到达交点；`pb` 走 $b+c+a$ 个节点也到达交点，两者同时到达。若不相交（$c=0$），两者都在走完 $a+b$ 个节点后同时变成 `None`，`pa is pb` 成立，返回 `None`。

      - A 错：长度不同恰恰是这个技巧要解决的问题，切换链表后长度差被抵消。
      - B 错：不相交时两个指针都在走完 $a+b$ 个节点后同时到达 `None`，`pa is pb` 成立，循环自然结束，不必先比较尾节点。
      - D 错：只用两个指针，额外空间 O(1)；用哈希集合记录 A 的所有节点的做法才需要 O(a + c) 的空间。

      另一种常见解法是先分别求出两个链表的长度，让长链表的指针先走「长度差」步，再同步前进。

  - id: CS-ALGO-022
    type: coding
    difficulty: 2
    frequency: 3
    points: [树与遍历]
    tags: [最近公共祖先, 手撕]
    question: |
      实现二叉树中两个节点的最近公共祖先（LCA）：

      ```python
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val, self.left, self.right = val, left, right

      def lowest_common_ancestor(root: TreeNode, p: TreeNode, q: TreeNode) -> TreeNode: ...
      ```

      - 普通二叉树（不是二叉搜索树），节点值**可能重复**，所以要按节点对象本身判断；
      - `p`、`q` 保证在树中，可以是同一个节点；一个节点也算作它自己的祖先；
      - 树高不超过 500，时间复杂度 O(n)。
    answer: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val, self.left, self.right = val, left, right


      def lowest_common_ancestor(root, p, q):
          if root is None or root is p or root is q:
              return root                        # 找到 p 或 q（或走到空）就向上报告
          left = lowest_common_ancestor(root.left, p, q)
          right = lowest_common_ancestor(root.right, p, q)
          if left is not None and right is not None:
              return root                        # p、q 分居两侧：root 就是分叉点
          return left if left is not None else right
    test: |
      import random

      def random_tree(n, rng):
          nodes = [TreeNode(rng.randint(0, 2)) for _ in range(n)]   # 值可以重复
          parent = {}
          for i in range(1, n):
              while True:
                  p = rng.randrange(i)
                  side = rng.choice(["left", "right"])
                  if getattr(nodes[p], side) is None:
                      setattr(nodes[p], side, nodes[i])
                      parent[nodes[i]] = nodes[p]
                      break
          return nodes, parent

      def brute(parent, p, q):                   # 暴力：p 的祖先集合，再从 q 往上找
          anc = set()
          while p is not None:
              anc.add(p)
              p = parent.get(p)
          while q not in anc:
              q = parent[q]
          return q

      a, b, c, d, e = (TreeNode(v) for v in (3, 5, 1, 6, 2))
      a.left, a.right, b.left, b.right = b, c, d, e
      assert lowest_common_ancestor(a, d, e) is b
      assert lowest_common_ancestor(a, d, c) is a
      assert lowest_common_ancestor(a, b, e) is b
      assert lowest_common_ancestor(a, e, e) is e
      rng = random.Random(0)
      for _ in range(300):
          nodes, parent = random_tree(rng.randint(1, 30), rng)
          p, q = rng.choice(nodes), rng.choice(nodes)
          assert lowest_common_ancestor(nodes[0], p, q) is brute(parent, p, q)
    explanation: |
      **思路**：后序遍历，让每棵子树向上报告「我这里找到了什么」：
      - 当前节点是空、`p` 或 `q` 时，直接返回它自己；
      - 否则分别问左右子树：两边都有返回值，说明 `p`、`q` 分居两侧，当前节点就是最近的分叉点；只有一边有，就把那一边的结果继续往上传。

      为什么遇到 `p` 就可以直接返回、不再往下找 `q`？如果 `q` 在 `p` 的子树里，答案就是 `p`；如果不在，`q` 一定在别的分支，会由上层的某个节点把两边汇合。

      **复杂度**：每个节点访问一次，O(n) 时间，O(h) 递归栈空间。

      **易错点**：用 `==` 比较节点值而不是 `is` 比较节点对象，值重复时会出错；树很深（比如退化成链）时递归会超过 Python 默认约 1000 层的限制，可以改用迭代：先用栈遍历记录每个节点的父节点，再把 `p` 的祖先放进集合，从 `q` 往上找第一个在集合里的节点。若是二叉搜索树，则可以利用大小关系，从根往下走一条路径即可。

  - id: CS-ALGO-023
    type: code_debug
    difficulty: 1
    frequency: 3
    points: [树与遍历]
    tags: [二叉搜索树]
    question: |
      下面的函数判断一棵二叉树是否是二叉搜索树（左子树所有节点都小于根，右子树所有节点都大于根，不允许重复值）。它对某些不合法的树也返回 `True`，请找出 bug 并修正。
    code: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val, self.left, self.right = val, left, right


      def is_bst(node):
          if node is None:
              return True
          if node.left is not None and node.left.val >= node.val:
              return False
          if node.right is not None and node.right.val <= node.val:
              return False
          return is_bst(node.left) and is_bst(node.right)
    fixed_code: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val, self.left, self.right = val, left, right


      def is_bst(node, lo=float("-inf"), hi=float("inf")):
          if node is None:
              return True
          if not lo < node.val < hi:
              return False
          return is_bst(node.left, lo, node.val) and is_bst(node.right, node.val, hi)
    test: |
      import random

      T = TreeNode
      assert is_bst(None)
      assert is_bst(T(5, T(3, T(1), T(4)), T(8, None, T(9))))
      assert not is_bst(T(5, T(3, None, T(6)), T(8)))       # 6 在 5 的左子树里
      assert not is_bst(T(5, T(3), T(8, T(4))))             # 4 在 5 的右子树里
      assert not is_bst(T(5, T(5)))                          # 不允许重复值

      def inorder(node, out):
          if node:
              inorder(node.left, out)
              out.append(node.val)
              inorder(node.right, out)
          return out

      rng = random.Random(0)
      for _ in range(500):
          nodes = [T(rng.randint(0, 9)) for _ in range(rng.randint(1, 8))]
          for i in range(1, len(nodes)):
              while True:
                  p = rng.randrange(i)
                  side = rng.choice(["left", "right"])
                  if getattr(nodes[p], side) is None:
                      setattr(nodes[p], side, nodes[i])
                      break
          vals = inorder(nodes[0], [])
          assert is_bst(nodes[0]) == all(x < y for x, y in zip(vals, vals[1:]))
    answer: |
      **问题**：第 9～12 行只比较了节点与它的**直接孩子**。二叉搜索树的约束是对整棵子树的：左子树中所有节点都要小于根。例如根为 5、左孩子为 3、3 的右孩子为 6：每对父子关系都合法，但 6 出现在 5 的左子树里，原函数却返回 `True`。

      **修正**：向下递归时传递取值范围 `(lo, hi)`，每个节点都必须严格落在祖先们给出的上下界之内：

      ```python
      def is_bst(node, lo=float("-inf"), hi=float("inf")):
          if node is None:
              return True
          if not lo < node.val < hi:
              return False
          return is_bst(node.left, lo, node.val) and is_bst(node.right, node.val, hi)
      ```
    explanation: |
      进入左子树时，上界收紧为当前节点的值；进入右子树时，下界收紧为当前节点的值。这样每个节点都同时受到所有祖先的约束。

      等价的做法是中序遍历：二叉搜索树的中序遍历结果严格递增，只要记住上一个访问的值并逐个比较即可，测试中的对拍正是用了这条性质。

      这是面试中非常常见的错误：局部条件（父子关系）成立，不等于全局条件（子树关系）成立。树很深时，两种写法都可以改成用显式栈的迭代版本。

  - id: CS-ALGO-024
    type: fill
    difficulty: 2
    frequency: 2
    points: [树与遍历]
    tags: [遍历序列, 重建二叉树]
    question: |
      一棵二叉树的节点值互不相同，前序遍历为 `G B A F E C`，中序遍历为 `B F A G E C`。它的后序遍历为 ____，层序遍历为 ____。
    answer: [['F A B C E G', 'FABCEG', 'F,A,B,C,E,G', 'F、A、B、C、E、G'], ['G B E A C F', 'GBEACF', 'G,B,E,A,C,F', 'G、B、E、A、C、F']]
    explanation: |
      **重建**：前序的第一个是根 G；在中序中找到 G，左边 `B F A` 是左子树，右边 `E C` 是右子树。
      - 左子树的前序为 `B A F`：根是 B；中序 `B F A` 中 B 左边为空，右边 `F A` 是 B 的右子树；其前序 `A F` 说明根是 A，中序 `F A` 说明 F 是 A 的左孩子；
      - 右子树的前序为 `E C`：根是 E；中序 `E C` 说明 C 是 E 的右孩子。

      ```text
              G
             / \
            B   E
             \   \
              A   C
             /
            F
      ```

      **后序**（左、右、根）：`F A B C E G`；**层序**（按层从左到右）：`G B E A C F`。

      **延伸**：节点值互不相同时，「前序 + 中序」或「后序 + 中序」都能唯一确定一棵二叉树；但「前序 + 后序」不能，因为只有一个孩子的节点无法判断孩子在左还是在右（例如根 1 只有一个孩子 2，前序都是 `1 2`、后序都是 `2 1`）。

  - id: CS-ALGO-025
    type: coding
    difficulty: 2
    frequency: 3
    points: [图搜索]
    tags: [岛屿数量, BFS, 手撕]
    question: |
      实现网格中的「岛屿数量」：

      ```python
      def num_islands(grid: list[str]) -> int: ...
      ```

      - `grid` 是若干等长字符串，`'1'` 表示陆地、`'0'` 表示水；上下左右相邻的陆地属于同一个岛屿（斜对角不算）；
      - 网格最大为 300 × 300，可能整片都是陆地。注意 Python 默认的递归深度约为 1000，**递归版 DFS 在这种输入上会栈溢出**，请写不依赖递归的实现；
      - `grid` 为空列表时返回 0，不要修改输入。
    answer: |
      from collections import deque


      def num_islands(grid):
          if not grid:
              return 0
          m, n = len(grid), len(grid[0])
          seen = [[False] * n for _ in range(m)]
          count = 0
          for i in range(m):
              for j in range(n):
                  if grid[i][j] != "1" or seen[i][j]:
                      continue
                  count += 1                     # 发现一个新岛屿，用 BFS 把它整个标记掉
                  seen[i][j] = True
                  queue = deque([(i, j)])
                  while queue:
                      x, y = queue.popleft()
                      for nx, ny in ((x + 1, y), (x - 1, y), (x, y + 1), (x, y - 1)):
                          if 0 <= nx < m and 0 <= ny < n and grid[nx][ny] == "1" and not seen[nx][ny]:
                              seen[nx][ny] = True        # 入队时就标记，避免重复入队
                              queue.append((nx, ny))
          return count
    test: |
      import random

      assert num_islands([]) == 0
      assert num_islands(["11000", "11000", "00100", "00011"]) == 3
      assert num_islands(["111", "010", "111"]) == 1
      assert num_islands(["101", "010", "101"]) == 5           # 斜对角不算相邻
      assert num_islands(["1" * 300] * 300) == 1               # 9 万个格子连成一片
      assert num_islands(["".join("10"[(i + j) % 2] for j in range(300)) for i in range(300)]) == 45000

      def brute(grid):                                         # 并查集对拍
          m, n = len(grid), len(grid[0])
          parent = list(range(m * n))

          def find(x):
              while parent[x] != x:
                  x = parent[x]
              return x
          for i in range(m):
              for j in range(n):
                  if grid[i][j] == "1":
                      for x, y in ((i + 1, j), (i, j + 1)):
                          if x < m and y < n and grid[x][y] == "1":
                              parent[find(i * n + j)] = find(x * n + y)
          return len({find(i * n + j) for i in range(m) for j in range(n) if grid[i][j] == "1"})

      rng = random.Random(0)
      for _ in range(200):
          m, n = rng.randint(1, 8), rng.randint(1, 8)
          grid = ["".join(rng.choice("01") for _ in range(n)) for _ in range(m)]
          assert num_islands(grid) == brute(grid)
    explanation: |
      **思路**：逐格扫描，遇到一个尚未访问的陆地，岛屿数加 1，再用 BFS（或显式栈的 DFS）把与它连通的整片陆地都标记为已访问。每个格子只会入队一次，时间和空间都是 $O(mn)$。

      **为什么不用递归**：递归 DFS 的深度等于搜索路径的长度，整片陆地时可达 $mn$ 量级。300 × 300 的全陆地网格会触发 `RecursionError`；调大 `sys.setrecursionlimit` 也可能让解释器的 C 栈溢出而直接崩溃。线上代码遇到「深度由数据决定」的递归，都应改写成显式栈或队列。

      **易错点**：
      - 出队时才标记已访问，同一个格子会被多个邻居重复入队；
      - 用修改输入的方式（把 `'1'` 改成 `'0'`）做标记，会破坏调用方的数据，这里的字符串本身也不可修改；
      - 把斜对角也算作相邻。

      **扩展**：动态加入陆地、实时询问岛屿数量时，用并查集更合适（每次加入只需合并相邻的陆地）。

  - id: CS-ALGO-026
    type: single
    difficulty: 2
    frequency: 2
    points: [图搜索]
    tags: [BFS]
    question: |
      用 BFS 求无权图中从起点到各点的最短距离。标准写法是在**入队时**把节点标记为已访问。有人改成在**出队时**标记：队列里存 `(节点, 距离)`，出队后若该节点已访问就跳过，否则标记、记录距离，并把所有邻居入队。关于这一改动，下列说法正确的是：
    options:
      A: '距离结果会出错：同一个点可能先经由一条更长的路径出队并被标记，之后更短的路径会被跳过'
      B: '会陷入死循环：出队前没有标记，图中的环会让同一批节点被反复入队，队列永远不空'
      C: '两种写法完全等价：每个节点仍只会入队一次，只是把标记操作挪到了出队的位置'
      D: '距离仍然正确，但同一个点可能被多次入队，入队总次数从 O(V) 增加到 O(E)'
    answer: D
    explanation: |
      **结论**：结果正确，但效率变差。

      BFS 的队列按距离单调不减的顺序出队，所以一个节点**第一次出队**时携带的距离一定是最短的，后面再出队的副本都会被「已访问」跳过，距离不会出错。

      代价在于：一个节点在第一次出队之前，可能已经被它的多个邻居分别放进队列。每个节点只会被展开一次，展开时把所有邻居入队，所以入队总次数最多是所有节点的度数之和，即 $O(E)$；而入队时标记的写法每个节点只入队一次，是 $O(V)$。稠密图中 $E$ 可达 $V^2$ 量级，差别很明显。

      - A 错：出队顺序按距离单调不减，一个点第一次出队时携带的就是最短距离，不会先被更长的路径标记。
      - B 错：每个节点只会被展开一次，入队总次数有上界 $O(E)$，不会无限循环。
      - C 错：出队时才标记，同一个点在第一次出队前可能已被多个邻居分别放入队列；结果相同，但空间和时间的上界不同。

      **对比**：Dijkstra 恰好相反，必须在**出队时**才确认最短距离，入堆时的距离只是暂定值，因为带权图中先被发现不等于路径更短。

  - id: CS-ALGO-027
    type: code_fill
    difficulty: 2
    frequency: 2
    points: [图搜索]
    tags: [并查集, 连通分量, 实体对齐]
    question: |
      知识库中同一个实体常有多个别名。给定若干「同义」对，凡是能通过同义关系传递连通的名字都属于同一个实体，用组内字典序最小的名字作为规范名。补全下面的并查集（路径压缩 + 按大小合并）中的四处空位。
    code: |
      def canonical_names(pairs: list[tuple[str, str]]) -> dict[str, str]:
          parent, size = {}, {}

          def find(x):
              if x not in parent:
                  parent[x], size[x] = x, 1
              root = x
              while parent[root] != root:
                  root = ____
              while parent[x] != root:            # 路径压缩：沿途节点直接挂到根上
                  parent[x], x = ____, parent[x]
              return root

          def union(a, b):
              ra, rb = find(a), find(b)
              if ra == rb:
                  return
              if size[ra] < size[rb]:             # 按大小合并：小树挂到大树下
                  ra, rb = rb, ra
              parent[____] = ra
              size[ra] += ____

          for a, b in pairs:
              union(a, b)
          groups = {}
          for x in parent:
              groups.setdefault(find(x), []).append(x)
          result = {}
          for g in groups.values():
              name = min(g)                       # 每组只求一次最小值
              for x in g:
                  result[x] = name
          return result
    answer: ['parent[root]', 'root', 'rb', 'size[rb]']
    test: |
      import random

      got = canonical_names([("GPT-4o", "4o"), ("gpt4o", "4o"), ("Claude", "claude-3"), ("x", "x")])
      assert got == {"GPT-4o": "4o", "4o": "4o", "gpt4o": "4o", "Claude": "Claude", "claude-3": "Claude", "x": "x"}
      assert canonical_names([]) == {}

      rng = random.Random(0)
      for _ in range(300):
          names = [f"n{i}" for i in range(rng.randint(1, 12))]
          pairs = [(rng.choice(names), rng.choice(names)) for _ in range(rng.randint(0, 10))]
          adj = {}
          for a, b in pairs:
              adj.setdefault(a, set()).add(b)
              adj.setdefault(b, set()).add(a)
          expect = {}
          for s in adj:                          # 暴力：DFS 求连通分量
              if s in expect:
                  continue
              comp, stack = {s}, [s]
              while stack:
                  for v in adj[stack.pop()]:
                      if v not in comp:
                          comp.add(v)
                          stack.append(v)
              for x in comp:
                  expect[x] = min(comp)
          assert canonical_names(pairs) == expect

      chain = [(f"v{i}", f"v{i + 1}") for i in range(100000)]   # 10 万次合并，要求接近线性
      res = canonical_names(chain)
      assert len(res) == 100001 and res["v99999"] == "v0"
    explanation: |
      - 第 1 空 `parent[root]`：沿父指针一直走到根（父节点是自己的节点）。
      - 第 2 空 `root`：路径压缩，把沿途每个节点的父指针直接改成根。多重赋值右边先求值，`parent[x]` 取到的是旧的父节点，所以 `x` 能继续沿原路径前进。
      - 第 3、4 空 `rb`、`size[rb]`：交换后 `ra` 是较大的树，把小树的根 `rb` 挂到 `ra` 下，并累加大小。

      **为什么要两个优化**：只按大小合并，树高不超过 $O(\log n)$；再加上路径压缩，单次操作的均摊复杂度是 $O(\alpha(n))$（反阿克曼函数，实际中不超过 4 或 5），10 万次合并的链式输入也能很快完成。不做任何优化时，链式输入会让树退化成长链，`find` 变成 $O(n)$。

      **注意**：并查集求的是传递闭包，「A 像 B、B 像 C」就会把 A、C 归入一组。别名合并、文档近似去重等场景要警惕这种链式传递把本不相同的实体连在一起，必要时对组的大小或组内相似度做二次校验。

