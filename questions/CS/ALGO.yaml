      import random
      from collections import deque

      def has_cycle(graph):                      # Kahn 算法判环，用来对拍
          nodes = set(graph) | {v for vs in graph.values() for v in vs}
          indeg = {u: 0 for u in nodes}
          for vs in graph.values():
              for v in vs:
                  indeg[v] += 1
          q = deque(u for u in nodes if indeg[u] == 0)
          seen = 0
          while q:
              u = q.popleft()
              seen += 1
              for v in graph.get(u, []):
                  indeg[v] -= 1
                  if indeg[v] == 0:
                      q.append(v)
          return seen < len(nodes)

      def valid_cycle(graph, cyc):
          return (len(cyc) >= 2 and cyc[0] == cyc[-1] and len(set(cyc[:-1])) == len(cyc) - 1
                  and all(b in graph.get(a, []) for a, b in zip(cyc, cyc[1:])))

      assert find_cycle({"plan": ["search", "code"], "search": ["write"], "code": ["write"]}) is None
      assert find_cycle({}) is None
      g = {"a": ["b"], "b": ["c"], "c": ["a"], "d": ["a"]}
      c = find_cycle(g)
      assert valid_cycle(g, c) and len(c) == 4
      assert find_cycle({"x": ["x"]}) == ["x", "x"]
      g = {"a": ["b", "c"], "b": ["d"], "c": ["d"], "d": [], "e": ["f"], "f": ["g"], "g": ["e"]}
      assert valid_cycle(g, find_cycle(g))       # 菱形 a→b→d、a→c→d 不是环
      rng = random.Random(0)
      for _ in range(500):
          n = rng.randint(1, 8)
          graph = {f"t{i}": [f"t{j}" for j in range(n) if rng.random() < 0.2] for i in range(n)}
          cyc = find_cycle(graph)
          assert (cyc is not None) == has_cycle(graph)
          if cyc is not None:
              assert valid_cycle(graph, cyc), (graph, cyc)
    explanation: |
      **三种颜色**：白色是还没访问；灰色是「已进入、尚未完成」，即位于当前 DFS 路径上；黑色是它的所有后继都已探索完毕。

      - 第 1 空 `GRAY`：沿边走到一个灰色节点，说明从它出发又绕回了它自己（回边），环就是路径上从它开始的那一段；
      - 第 2 空 `path.index(v)`：从环的起点截取当前路径，再补上 `v` 让首尾相同；
      - 第 3 空 `BLACK`：节点的后继全部处理完、离开路径时，标记为已完成。

      **为什么不能「遇到访问过的点就报环」**：菱形依赖 `a→b→d`、`a→c→d` 中，从 `c` 走到 `d` 时 `d` 已经是黑色，但这并不是环。只有指向**灰色**节点的边才意味着环。

      **与 Kahn 算法对比**：Kahn 算法通过「处理过的节点数少于总数」能判断有环，但不能直接给出环本身；DFS 三色法能给出具体的环，便于生成「任务 a → b → c → a 形成循环依赖」这样可操作的错误信息。DFS 的总复杂度为 $O(V+E)$；图很大时应改写为显式栈，避免递归过深。

  - id: CS-ALGO-029
    type: coding
    difficulty: 3
    frequency: 2
    points: [拓扑排序, 动态规划, Agent工程化编程]
    tags: [关键路径, 任务调度, 手撕]
    question: |
      Agent 规划出一组带依赖的工具调用，执行器的并发数不受限制：一个任务的所有前置任务都完成后立即开始。估计整个计划最少需要多长时间，并找出决定总时长的关键路径。实现：

      ```python
      def earliest_finish(tasks: dict[str, tuple[int, list[str]]]) -> tuple[int, list[str]]: ...
      ```

      - `tasks[name] = (耗时, 前置任务列表)`，耗时为非负整数；前置任务都在 `tasks` 中，列表里可能有重复；
      - 返回 `(总时长, 关键路径)`：关键路径是一条依赖链，链上相邻两项之间确有依赖关系，且耗时之和等于总时长，按执行顺序列出；若有多条，返回任意一条；
      - 有循环依赖时抛出 `ValueError`；`tasks` 为空时返回 `(0, [])`；时间复杂度 $O(V+E)$。
    answer: |
      from collections import deque


      def earliest_finish(tasks):
          indeg = {t: 0 for t in tasks}
          children = {t: [] for t in tasks}
          for t, (_, deps) in tasks.items():
              for d in set(deps):                # 重复的依赖只算一次
                  indeg[t] += 1
                  children[d].append(t)
          start = {t: 0 for t in tasks}          # 最早开始时间
          prev = {t: None for t in tasks}        # 决定最早开始时间的那个前置任务
          finish = {}
          queue = deque(t for t in tasks if indeg[t] == 0)
          while queue:                           # 按拓扑序推进
              t = queue.popleft()
              finish[t] = start[t] + tasks[t][0]
              for c in children[t]:
                  if prev[c] is None or finish[t] > start[c]:
                      start[c], prev[c] = finish[t], t
                  indeg[c] -= 1
                  if indeg[c] == 0:
                      queue.append(c)
          if len(finish) < len(tasks):
              raise ValueError("存在循环依赖")
          if not tasks:
              return 0, []
          end = max(finish, key=finish.get)      # 最晚完成的任务是关键路径的终点
          path = []
          while end is not None:                 # 沿 prev 回溯出关键路径
              path.append(end)
              end = prev[end]
          return finish[path[0]], path[::-1]
    test: |
      import random
      from functools import lru_cache

      tasks = {
          "plan": (2, []),
          "search_a": (6, ["plan"]),
          "search_b": (4, ["plan"]),
          "read_db": (3, []),
          "merge": (4, ["search_a", "search_b"]),
          "write": (3, ["merge", "read_db"]),
          "review": (2, ["write"]),
      }
      assert earliest_finish(tasks) == (17, ["plan", "search_a", "merge", "write", "review"])
      assert earliest_finish({}) == (0, [])
      assert earliest_finish({"a": (5, []), "b": (3, [])}) == (5, ["a"])
      assert earliest_finish({"a": (1, []), "b": (2, ["a", "a"])}) == (3, ["a", "b"])
      for bad in ({"a": (1, ["b"]), "b": (1, ["a"])}, {"a": (1, ["a"])}):
          try:
              earliest_finish(bad)
              raise AssertionError("应检测出循环依赖")
          except ValueError:
              pass

      rng = random.Random(0)
      for _ in range(300):
          n = rng.randint(1, 9)
          tasks = {f"t{i}": (rng.randint(0, 9), [f"t{j}" for j in range(i) if rng.random() < 0.35])
                   for i in range(n)}

          @lru_cache(None)
          def fin(t):
              dur, deps = tasks[t]
              return dur + max((fin(d) for d in deps), default=0)

          total, path = earliest_finish(tasks)
          assert total == max(fin(t) for t in tasks)
          assert sum(tasks[t][0] for t in path) == total
          assert all(a in tasks[b][1] for a, b in zip(path, path[1:]))
    explanation: |
      **思路**：并发不受限时，任务 $t$ 的最早开始时间等于它所有前置任务完成时间的最大值，最早完成时间 = 最早开始 + 耗时。这是 DAG 上的最长路径问题，按拓扑序做一遍动态规划即可：
      1. Kahn 算法：入度为 0 的任务先处理；处理一个任务时计算它的完成时间，并用它更新每个后继的最早开始时间；
      2. 更新时记下「是哪个前置任务决定了最早开始时间」（`prev`），这就是关键路径上的前一项；
      3. 处理完的任务数少于总数，说明有环；
      4. 总时长是所有任务完成时间的最大值，从那个任务沿 `prev` 回溯即得关键路径。

      **复杂度**：每个任务、每条依赖各处理一次，$O(V+E)$。

      **为什么关心关键路径**：总时长只由关键路径决定。想让整个计划更快，就要缩短关键路径上的任务（换更快的工具、拆分、缓存），优化非关键任务对总时长没有帮助。示例中关键路径是 `plan → search_a → merge → write → review`（2 + 6 + 4 + 3 + 2 = 17），`search_b` 和 `read_db` 都有空闲余量。

      **局限**：真实执行器有并发上限、工具有限流，这时最优调度一般是 NP 难问题，工程上常用「就绪任务中优先执行关键路径更长的」这类启发式规则。

  - id: CS-ALGO-030
    type: multiple
    difficulty: 2
    frequency: 2
    points: [拓扑排序]
    tags: [Kahn 算法, DFS]
    question: |
      关于有向图的拓扑排序，下列说法**正确**的有：
    options:
      A: 'DAG 在忽略边的方向后若是连通的，它的拓扑序就唯一确定，不存在多种合法排列'
      B: 'Kahn 算法结束时，若输出的节点数少于图中节点总数，说明图中存在环'
      C: '用 DFS 求拓扑序时，只要沿边走到一个已经访问过的节点，就说明图中有环'
      D: '对 DAG 做 DFS，按节点「首次被访问」的先后顺序（即前序）记录下来，这个序列本身就是一个拓扑序'
      E: 'Kahn 算法用最小堆代替队列存放入度为 0 的节点，可得到字典序最小的拓扑序，复杂度 $O(V\log V+E)$'
    answer: [B, E]
    explanation: |
      **结论**：B、E 正确。

      - A 错：连通不等于唯一，例如 a→b、a→c 是连通的，但 b 与 c 的先后可以互换。只有当拓扑序中每一对相邻节点之间都有边（图中存在一条经过所有节点的路径）时，拓扑序才唯一。像「检索」与「读文件」互不依赖时，二者谁先谁后都可以。
      - B 对：环上的节点入度永远减不到 0，不会被输出，所以输出数量不足就说明有环。
      - C 错：只有走到**仍在当前 DFS 路径上**（灰色）的节点才说明有环；走到已经完成（黑色）的节点很正常，例如菱形依赖 `a→b→d`、`a→c→d` 中第二次到达 `d`。
      - D 错：前序不是拓扑序。反例：边 a→c、b→c，从 a 开始 DFS，前序为 a、c、b，而 b 必须排在 c 之前。正确做法是按节点「完成」（所有后继都已访问完）的先后顺序记录，再整体逆序：若有边 $u\to v$，则 $v$ 一定先于 $u$ 完成，逆序后每条边都从前指向后。
      - E 对：每一步都从当前可选的节点中取最小的，得到字典序最小的拓扑序。每个节点进出堆各一次，共 $O(V\log V)$，再加上处理每条边的 $O(E)$。

      Agent 场景下，拓扑序用于决定工具调用的执行顺序，同一「层」（同时变为就绪）的任务可以并发执行；规划结果由模型生成，执行前必须检查是否有环。
  - id: CS-ALGO-031
    type: coding
    difficulty: 2
    frequency: 3
    points: [最短路径]
    tags: [Dijkstra, 手撕]
    question: |
      模型网关要在多个机房之间转发请求，边权为链路时延（ms）。实现带路径还原的 Dijkstra：

      ```python
      def shortest_path(graph: dict[str, list[tuple[str, float]]], src: str, dst: str) -> tuple[float, list[str]]: ...
      ```

      - `graph[u]` 是 `(v, w)` 列表，表示一条 `u → v`、权重为 `w` 的有向边，`w >= 0`；同一对节点之间可能有多条边；有的节点只作为终点出现，不在 `graph` 的键中；
      - 返回 `(最短距离, 路径)`，路径包含起点和终点；不可达时返回 `(math.inf, [])`；`src == dst` 时返回 `(0, [src])`；
      - 使用二叉堆，时间复杂度 $O((V+E)\log V)$。
    answer: |
      import heapq
      import math


      def shortest_path(graph, src, dst):
          dist, prev = {src: 0}, {}
          heap = [(0, src)]
          while heap:
              d, u = heapq.heappop(heap)
              if d > dist[u]:
                  continue                       # 过期条目：u 已以更短的距离出过堆
              if u == dst:
                  break                          # 终点出堆时，它的距离已经确定
              for v, w in graph.get(u, []):
                  nd = d + w
                  if nd < dist.get(v, math.inf):
                      dist[v], prev[v] = nd, u
                      heapq.heappush(heap, (nd, v))
          if dst not in dist:
              return math.inf, []
          path = [dst]
          while path[-1] != src:                 # 沿前驱指针回溯
              path.append(prev[path[-1]])
          return dist[dst], path[::-1]
    test: |
      import math
      import random

      g = {"bj": [("sh", 30), ("gz", 70)], "sh": [("gz", 25), ("sz", 60)], "gz": [("sz", 8)]}
      assert shortest_path(g, "bj", "sz") == (63, ["bj", "sh", "gz", "sz"])
      assert shortest_path(g, "bj", "bj") == (0, ["bj"])
      assert shortest_path(g, "sz", "bj") == (math.inf, [])
      assert shortest_path({"a": [("b", 0), ("b", 5)], "b": [("c", 0)]}, "a", "c") == (0, ["a", "b", "c"])

      rng = random.Random(0)
      for _ in range(300):
          n = rng.randint(1, 7)
          edges = [(f"v{rng.randrange(n)}", f"v{rng.randrange(n)}", rng.randint(0, 9))
                   for _ in range(rng.randint(0, 15))]
          graph = {}
          for u, v, w in edges:
              graph.setdefault(u, []).append((v, w))
          src, dst = f"v{rng.randrange(n)}", f"v{rng.randrange(n)}"
          bf = {src: 0}                          # Bellman-Ford 对拍
          for _ in range(n):
              for u, v, w in edges:
                  if u in bf and bf[u] + w < bf.get(v, math.inf):
                      bf[v] = bf[u] + w
          cost, path = shortest_path(graph, src, dst)
          assert cost == bf.get(dst, math.inf)
          if path:
              assert path[0] == src and path[-1] == dst
              assert sum(min(w for x, w in graph[a] if x == b) for a, b in zip(path, path[1:])) == cost
          else:
              assert dst not in bf
    explanation: |
      **思路**：堆中存 `(暂定距离, 节点)`，每次弹出距离最小的节点。边权非负时，弹出的那一刻它的距离就是最终的最短距离，再用它去松弛邻居；松弛成功时记录前驱 `prev[v] = u`，最后从终点沿前驱回溯得到路径。

      **两个细节**：
      - **懒删除**：Python 的 `heapq` 不支持「降低某个元素的键值」，于是每次松弛都压入新条目，旧条目留在堆里。弹出时若 `d > dist[u]` 说明是过期条目，直接跳过；
      - **提前结束**：只求单个终点时，终点出堆即可停止。

      **复杂度**：每条边最多压入一个条目，堆中元素为 $O(E)$，总复杂度 $O(E\log E)=O(E\log V)$，加上节点遍历即 $O((V+E)\log V)$。

      **易错点**：在**入堆时**就把节点标记为「已确定」是错误的，带权图中先被发现的路径不一定最短；有负权边时 Dijkstra 不再适用，要用 Bellman-Ford（$O(VE)$）；路径可能有并列最短的多条，测试时应校验路径的合法性与总长度，而不是比对某一条具体路径。

  - id: CS-ALGO-032
    type: code_output
    difficulty: 2
    frequency: 2
    points: [最短路径]
    tags: [Dijkstra, Bellman-Ford, 负权边]
    question: |
      下面的代码分别用「出堆即确定」的 Dijkstra 和 Bellman-Ford 计算一张含负权边的图的最短距离。输出是什么？
    code: |
      import heapq

      def dijkstra(graph, src):
          dist, done = {src: 0}, set()
          heap = [(0, src)]
          while heap:
              d, u = heapq.heappop(heap)
              if u in done:
                  continue
              done.add(u)                        # 出堆即认定 u 的最短距离已确定
              for v, w in graph.get(u, []):
                  if v not in done and d + w < dist.get(v, float("inf")):
                      dist[v] = d + w
                      heapq.heappush(heap, (d + w, v))
          return dist

      def bellman_ford(edges, src, n):
          dist = {src: 0}
          for _ in range(n - 1):                 # 松弛 n-1 轮
              for u, v, w in edges:
                  if u in dist and dist[u] + w < dist.get(v, float("inf")):
                      dist[v] = dist[u] + w
          return dist

      edges = [("S", "A", 2), ("S", "B", 5), ("B", "A", -4), ("A", "T", 3)]
      graph = {}
      for u, v, w in edges:
          graph.setdefault(u, []).append((v, w))
      print(sorted(dijkstra(graph, "S").items()))
      print(sorted(bellman_ford(edges, "S", 4).items()))
    answer: |
      [('A', 2), ('B', 5), ('S', 0), ('T', 5)]
      [('A', 1), ('B', 5), ('S', 0), ('T', 4)]
    explanation: |
      **Dijkstra 的执行过程**：
      1. 弹出 S（0），松弛得 A = 2、B = 5；
      2. 弹出 A（2），A 被认定为已确定，松弛得 T = 5；
      3. 弹出 B（5）（与 T 同为 5，按节点名 `'B' < 'T'` 先弹出 B）。沿 `B→A` 可以得到 5 − 4 = 1 < 2，但 A 已在 `done` 中，不再更新；
      4. 弹出 T（5）。结果 A = 2、T = 5，都是错的。

      **Bellman-Ford**：第一轮按边的顺序松弛，依次得到 A = 2、B = 5、A = 1（经 B）、T = 4，之后几轮不再变化。真实最短距离是 A = 1（S→B→A）、T = 4（S→B→A→T）。

      **原因**：Dijkstra 的贪心依据是「其他路径都要经过距离更大的节点，而边权非负，绕路只会更长」。负权边让「先绕远再走负边」的路径反而更短，这个依据不再成立。

      **结论**：有负权边（且无负环）时用 Bellman-Ford，复杂度 $O(VE)$，还能检测负环（第 $V$ 轮仍能松弛就说明有负环）。去掉 `done` 集合、允许节点重复出堆的写法在本例中能得到正确结果，但最坏情况下需要指数级时间，不能作为处理负权边的通用方案。
    source: 'Sedgewick & Wayne, Algorithms 4th ed., 4.4 Shortest Paths, https://algs4.cs.princeton.edu/44sp/'

