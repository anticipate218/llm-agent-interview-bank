      def find_cycle(graph: dict[str, list[str]]) -> list[str] | None:
          """graph[u] 是 u 的后继列表（u 完成后才能开始的任务）。返回一个环，如 ['a', 'b', 'a']；无环返回 None"""
          WHITE, GRAY, BLACK = 0, 1, 2           # 未访问 / 在当前 DFS 路径上 / 已完成
          color = {u: WHITE for u in graph}
