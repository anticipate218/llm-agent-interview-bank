        points: [量化基本原理, 对称与非对称量化, 量化粒度, PTQ与QAT, LLM.int8与离群值, SmoothQuant, GPTQ, AWQ, FP8格式, INT4权重量化, KV Cache量化, 量化效果评估, 剪枝与稀疏化]
      - code: SPEC
