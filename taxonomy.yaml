# 题库分类体系：大类（domain）→ 小类（subcategory）→ 考点（points）
# - code：用于题目 ID，形如 LLM-ATTN-001
# - target：该小类的目标题量（规划值）
# - points：考点清单；每道题的 points 字段应取自这里，便于统计覆盖度

version: 1
domains:

  - code: FND
    name: 机器学习与深度学习基础
    description: 大模型岗面试的底层功底：数学、经典机器学习、深度学习、优化方法与 NLP 基础。
    subcategories:
      - code: MATH
        name: 数学基础
        target: 30
        description: 线性代数、概率统计与信息论中面试常考的部分。
        points: [向量与矩阵运算, 矩阵的秩与分解, 特征值与SVD, 梯度与链式法则, 雅可比与海森矩阵, 常见概率分布, 贝叶斯公式, 期望方差与协方差, 最大似然与最大后验, 熵与交叉熵, KL散度, 互信息, 数值稳定性]
      - code: ML
        name: 机器学习基础
        target: 40
        description: 经典机器学习的核心概念、模型与评估方法。
        points: [监督与无监督学习, 偏差方差权衡, 过拟合与欠拟合, L1与L2正则化, 交叉验证, 分类评估指标, ROC与AUC, 类别不平衡, 线性回归与逻辑回归, 决策树与集成学习, 支持向量机, 聚类算法, 降维与PCA, 特征工程]
      - code: DL
        name: 深度学习基础
        target: 40
        description: 神经网络的结构、训练机制与常用组件。
        points: [多层感知机, 反向传播, 激活函数, 权重初始化, 梯度消失与爆炸, 残差连接, BatchNorm与LayerNorm, Dropout, 卷积神经网络, 循环神经网络, 损失函数, 计算图与自动微分, 泛化与模型容量]
      - code: OPT
        name: 优化与训练技巧
        target: 33
        description: 优化器、学习率策略与训练过程中的常见问题。
        points: [梯度下降与SGD, 动量, Adagrad与RMSprop, Adam与AdamW, 学习率调度与warmup, 批大小与学习率, 梯度裁剪, 权重衰减, 早停, 梯度累积, 二阶方法直觉, 训练不稳定诊断, 新型优化器]
      - code: NLP
        name: NLP 基础
        target: 40
        description: 从词向量到预训练语言模型的发展脉络与经典任务。
        points: [分词与文本预处理, 词袋与TF-IDF, Word2Vec与GloVe, 语言模型与困惑度, RNN/LSTM/GRU, Seq2Seq与注意力起源, 上下文词表示, BERT预训练目标, GPT与自回归建模, 编码器-解码器模型, 生成评估指标, 经典NLP任务]

  - code: LLM
    name: 大模型原理
    description: Transformer 架构、注意力、位置编码、Tokenizer、MoE、解码、模型演进与多模态。
    subcategories:
      - code: ARCH
        name: Transformer 整体架构
        target: 45
        description: Transformer 的整体结构、各组件作用以及参数量与计算量估算。
        points: [Encoder-Decoder结构, Decoder-only为何主流, 残差流, Post-Norm与Pre-Norm, LayerNorm与RMSNorm, FFN与SwiGLU, 参数量估算, 计算量估算, Embedding与LM Head, 权重共享, 激活值显存, 架构变体对比]
      - code: ATTN
        name: 注意力机制
        target: 50
        description: 注意力的计算、掩码、多头及其省显存变体、复杂度与 KV Cache。
        points: [缩放点积注意力, 缩放因子, 注意力掩码, 多头注意力, MQA, GQA, MLA, 注意力复杂度, KV Cache原理与大小, 稀疏与滑动窗口注意力, 线性注意力, 交叉注意力, Attention Sink, 数值稳定]
      - code: POS
        name: 位置编码与长上下文
        target: 43
        description: 位置信息如何注入模型，以及长度外推与长上下文技术。
        points: [绝对位置编码, 可学习位置编码, 相对位置编码, RoPE原理, RoPE实现与基频, ALiBi, 长度外推, 位置插值, NTK-aware缩放, YaRN, 长上下文训练, 长上下文评测, Lost in the Middle, 多模态位置编码]
      - code: TOK
        name: Tokenizer 与 Embedding
        target: 35
        description: 子词切分算法、词表设计与特殊 token。
        points: [BPE, Byte-level BPE, WordPiece, Unigram与SentencePiece, 词表大小权衡, 中文与多语言压缩率, 特殊token与对话模板, 未登录词, 数字与代码的切分, 词嵌入矩阵, 扩词表]
      - code: MOE
        name: 混合专家 MoE
        target: 35
        description: 稀疏专家模型的结构、路由、负载均衡与工程特点。
        points: [MoE基本结构, 门控路由与top-k, 负载均衡辅助损失, 容量因子与token丢弃, 共享专家, 细粒度专家, 无辅助损失负载均衡, 专家并行与All-to-All, MoE推理特点, Dense与MoE对比, 代表模型]
      - code: DEC
        name: 解码与生成
        target: 35
        description: 从 logits 到文本：解码策略、采样参数与约束生成。
        points: [贪心解码, 束搜索, 温度, Top-k采样, Top-p采样, Min-p采样, 重复惩罚, 停止条件与EOS, 约束解码与结构化输出, 解码与幻觉, 确定性与随机种子, logits处理]
      - code: MODEL
        name: 主流模型与演进
        target: 35
        description: 主流模型家族的发展脉络与关键架构选择。
        points: [GPT系列演进, BERT与GPT路线, T5与统一框架, Llama系列, Qwen系列, DeepSeek系列, Mistral与Mixtral, Gemma系列, 开源与闭源生态, 开放权重与许可证, 规模与涌现能力, 上下文长度演进]
      - code: MM
        name: 多模态大模型
        target: 41
        description: 视觉、语音等模态与语言模型的融合方式。
        points: [ViT与图像分块, CLIP对比学习, 视觉编码器, 模态连接器, LLaVA架构, 视觉token数量与压缩, 多图与视频理解, 多模态预训练与指令微调, 文档与OCR理解, 语音大模型, 理解与生成统一, 多模态幻觉, 扩散生成, VLA与具身]
      - code: NEW
        name: 新架构与前沿
        target: 25
        description: Transformer 之外的架构探索与近年的前沿方向。
        points: [状态空间模型, Mamba选择性机制, 线性注意力与RNN, 混合架构, 多token预测, 稀疏注意力新进展, 扩散语言模型, 小模型与端侧部署]

  - code: TRN
    name: 预训练与微调
    description: 预训练、数据工程、分布式训练、显存与精度、SFT、参数高效微调与领域适配。
    subcategories:
      - code: PT
        name: 预训练与 Scaling Law
        target: 40
        description: 预训练目标、缩放律与预训练过程中的关键决策。
        points: [自回归预训练目标, 交叉熵与困惑度, Kaplan缩放律, Chinchilla缩放律, 过训练小模型, 训练算力估算, 涌现能力, 学习率与批大小, 学习率调度与退火, 预训练阶段划分, 训练稳定性, 基座模型评估]
      - code: DATA
        name: 数据工程
        target: 40
        description: 预训练与微调数据的采集、清洗、去重、过滤、配比与合成。
        points: [数据来源, 文本清洗, 精确去重, MinHash近似去重, 质量过滤, 毒性与PII过滤, 数据配比, 课程学习, 合成数据, 数据污染, 代码与数学数据, 多语言数据]
      - code: DIST
        name: 分布式训练
        target: 45
        description: 数据、张量、流水线、序列与专家并行，以及通信与容错。
        points: [数据并行, 集合通信原语, ZeRO, FSDP, 张量并行, 流水线并行与气泡, 序列与上下文并行, 专家并行, 3D并行, 通信计算重叠, 梯度检查点, 大规模训练容错]
      - code: MEM
        name: 显存与混合精度
        target: 35
        description: 训练显存的构成与估算、数值精度格式与混合精度训练。
        points: [训练显存账本, 优化器状态, 激活显存, 激活重计算, FP16与BF16, FP8训练, Loss Scaling, 主权重, 显存估算, 卸载技术, 显存碎片]
      - code: SFT
        name: 指令微调 SFT
        target: 40
        description: 指令数据、对话模板、损失掩码与 SFT 实践。
        points: [SFT目标, 指令数据构建, 数据质量与多样性, 对话模板, Loss Mask, 多轮对话训练, Packing, 工具调用数据, 灾难性遗忘, SFT超参数, SFT评估, 拒绝采样微调]
      - code: PEFT
        name: 参数高效微调
        target: 40
        description: LoRA 系列与其他参数高效微调方法。
        points: [LoRA原理, 秩与alpha, LoRA作用层, LoRA合并, QLoRA与NF4, 双重量化与分页优化器, DoRA, Adapter, Prefix与Prompt Tuning, 多LoRA服务, 全参与PEFT选型, PEFT显存估算]
      - code: ADAPT
        name: 领域适配与蒸馏
        target: 33
        description: 继续预训练、领域适配、知识蒸馏与模型合并。
        points: [继续预训练, 数据回放, 灾难性遗忘, 扩词表, 知识蒸馏, 推理能力蒸馏, 模型合并, 领域知识注入选型, 在线策略蒸馏]

  - code: ALN
    name: 对齐与强化学习
    description: 强化学习基础、RLHF、偏好优化、GRPO 系列、奖励设计与推理模型。
    subcategories:
      - code: RL
        name: 强化学习基础
        target: 40
        description: LLM 对齐所需的强化学习核心概念与算法。
        points: [MDP基本概念, 回报与折扣, 价值函数, 贝尔曼方程, 策略梯度定理, REINFORCE与基线, 优势函数, Actor-Critic, GAE, 重要性采样, On-policy与Off-policy, 探索与利用, PPO裁剪, 熵正则]
      - code: RLHF
        name: RLHF 与 PPO
        target: 40
        description: 基于人类反馈的强化学习流程与 PPO 在 LLM 中的实现。
        points: [RLHF三阶段, 偏好数据, Bradley-Terry模型, 奖励模型训练, PPO目标函数, KL惩罚与参考模型, 价值头与GAE, 四模型显存开销, PPO训练不稳定, 奖励归一化, RLHF训练框架]
      - code: PO
        name: 偏好优化 DPO 系列
        target: 40
        description: 不训练奖励模型的离线偏好优化方法。
        points: [DPO推导, DPO损失, β的作用, 隐式奖励, DPO失效模式, IPO, KTO, ORPO, SimPO, 在线与迭代DPO, 偏好数据质量, DPO与PPO对比]
      - code: GRPO
        name: GRPO 与可验证奖励
        target: 46
        description: 组相对策略优化及其改进，基于可验证奖励的强化学习。
        points: [GRPO组内优势, 去掉价值模型, KL估计器, RLVR, DAPO改进, Clip-Higher与熵坍塌, 动态采样, Token级损失, GSPO, Dr.GRPO, 组大小与采样, 规则奖励设计, 训推不一致与修正, 异步RL与陈旧度]
      - code: RWD
        name: 奖励设计与奖励黑客
        target: 33
        description: 奖励信号的来源与设计、奖励黑客及缓解。
        points: [奖励模型与规则奖励, ORM与PRM, 过程监督, 奖励黑客, 长度偏置, 奖励过优化, RM集成与正则, RLAIF, Constitutional AI, 评审模型奖励风险, 生成式奖励模型]
      - code: REASON
        name: 推理模型与测试时计算
        target: 38
        description: o1/R1 一类推理模型的训练方法与测试时计算扩展。
        points: [推理模型特点, 长思维链, R1-Zero与R1, 冷启动数据, 多阶段训练, 推理蒸馏, 测试时计算扩展, Best-of-N与多数投票, 过度思考与长度控制, 思考预算, 推理模型局限, 混合思考模式]

  - code: INF
    name: 推理与部署
    description: 推理性能分析、KV Cache、调度、算子、量化、投机解码与推理服务。
    subcategories:
      - code: BASE
        name: 推理流程与性能指标
        target: 40
        description: 一次推理请求的生命周期、性能指标与瓶颈分析。
        points: [请求生命周期, Prefill与Decode, TTFT与TPOT, 吞吐与goodput, 算术强度与Roofline, 带宽瓶颈与批处理, 延迟估算, 流式输出, 负载特征, 性能分析方法]
      - code: KV
        name: KV Cache 与显存管理
        target: 40
        description: KV Cache 的大小、管理、复用与压缩。
        points: [KV Cache原理, KV Cache大小计算, 显存碎片, PagedAttention, 块表, 写时复制, 前缀缓存, RadixAttention, KV量化, KV压缩与淘汰, KV卸载, 长上下文KV优化]
